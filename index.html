<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050403">
<meta name="description" content="Tilt-driven sand: thousands of simulated grains that pour, pile and splash as you tip your phone.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Silt — tilt sand</title>
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<canvas id="stage"></canvas>

<div id="ui">
  <div id="vignette"></div>
  <div id="material-picker">
    <button id="material" type="button" aria-haspopup="listbox" aria-expanded="false"
            aria-label="Material">Sand</button>
    <div id="material-menu" role="listbox" aria-label="Choose material" hidden></div>
  </div>
  <div id="stats"></div>

  <!-- The actions have no permanent home: the box should read as an empty
       container with two small controls on its rim. Collapsed by default, and
       each row carries its key, so opening it once teaches the shortcuts and
       you never need to open it again. The dev-only tuning keys ([ ] for count,
       , . for grain size) stay keyboard-only on purpose. -->
  <div id="menu-panel">
    <button id="menu" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div id="menu-list" role="menu" aria-label="Actions" hidden>
      <button class="menu-item" type="button" role="menuitem" data-act="splash">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4c3.4 4.4 5 6.8 5 8.9a5 5 0 0 1-10 0C7 10.8 8.6 8.4 12 4z"/><path d="M4.5 14.5 3 13M19.5 14.5 21 13M12 21v-1.5"/></svg>
        <span>Splash</span><kbd>space</kbd>
      </button>
      <button class="menu-item" type="button" role="menuitem" data-act="flip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16M8 20l-3-3M8 20l3-3M16 20V4M16 4l-3 3M16 4l3 3"/></svg>
        <span>Flip gravity</span><kbd>F</kbd>
      </button>
      <button class="menu-item" type="button" role="menuitem" data-act="reset">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.4-5.3"/><path d="M19.5 4v4h-4"/></svg>
        <span>Reset</span><kbd>R</kbd>
      </button>
      <button class="menu-item" type="button" role="menuitem" data-act="stats" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-5"/></svg>
        <span>Readout</span><kbd>`</kbd>
      </button>
    </div>
  </div>

  <div id="gate">
    <button id="gate-button" type="button">Enable tilt</button>
    <p id="gate-note"></p>
  </div>

  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <div id="fatal"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
