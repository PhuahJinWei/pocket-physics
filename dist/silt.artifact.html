<title>Silt — tilt sand</title>
<style>
/* Full-bleed dark stage. The canvas is position:fixed so mobile browser chrome
   showing and hiding never triggers a layout fight over 100vh. */

:root {
  --ink: #e8e0d0;
  --dim: rgba(226, 213, 189, 0.55);
  --panel: rgba(24, 20, 15, 0.78);
  --edge: rgba(214, 190, 150, 0.16);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #050403;
  color: var(--ink);
  font: 500 13px/1.45 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

/* Sells the "inside a device" look and hides the hard canvas edge. */
#vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(125% 85% at 50% 45%, transparent 62%, rgba(0, 0, 0, 0.38) 100%),
    linear-gradient(to bottom, rgba(255, 226, 170, 0.04), transparent 22%);
  mix-blend-mode: multiply;
}
#vignette::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 1px rgba(230, 205, 160, 0.2);
  mix-blend-mode: screen;
}

#hint {
  position: absolute;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  max-width: min(92vw, 520px);
  padding: 7px 14px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 900ms ease;
}
#hint.faded { opacity: 0; }

/* Material picker. Sits opposite the stats panel and stays put — this is the
   one control that has to be reachable on a phone, where there is no key to
   press. #ui ignores pointers, so it has to opt back in.

   The menu is built from the registry in materials.js, so it grows on its own
   as materials are added; nothing here is per-material. */
#material-picker {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  right: calc(12px + env(safe-area-inset-right));
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
  min-width: 132px;
}

#material {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 14px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  color: var(--dim);
  font: inherit;
  font-size: 12px;
  letter-spacing: 0.04em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color 180ms ease, border-color 180ms ease;
}
/* Caret, so the pill reads as something that opens rather than a label. */
#material::after {
  content: "";
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid currentColor;
  opacity: 0.7;
  transition: transform 180ms ease;
}
#material[aria-expanded="true"]::after { transform: rotate(180deg); }
#material:hover,
#material:focus-visible,
#material[aria-expanded="true"] {
  color: var(--ink);
  border-color: rgba(230, 205, 160, 0.36);
  outline: none;
}
#material:active { transform: scale(0.98); }

#material-menu {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 5px;
  border: 1px solid var(--edge);
  border-radius: 14px;
  background: var(--panel);
  backdrop-filter: blur(8px);
}
#material-menu[hidden] { display: none; }

.material-option {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 7px 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--dim);
  font: inherit;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 140ms ease, color 140ms ease;
}
.material-option:hover,
.material-option:focus-visible {
  background: rgba(226, 213, 189, 0.09);
  color: var(--ink);
  outline: none;
}
.material-option[aria-selected="true"] { color: var(--ink); }

.material-swatch {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
}
/* Tick only on the current one, and it holds its column either way so the
   labels do not shuffle sideways as the selection moves. */
.material-option::after {
  content: "";
  margin-left: auto;
  width: 5px;
  height: 9px;
  border: solid currentColor;
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg) translate(-1px, -1px);
  opacity: 0;
}
.material-option[aria-selected="true"]::after { opacity: 0.85; }

#stats {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  left: 12px;
  display: none;
  grid-template-columns: auto auto;
  gap: 1px 12px;
  padding: 10px 12px;
  border: 1px solid var(--edge);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  font-size: 11px;
  line-height: 1.5;
}
#stats.visible { display: grid; }
#stats .k { color: var(--dim); }
#stats .v { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }

#gate {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: rgba(5, 4, 3, 0.72);
  backdrop-filter: blur(3px);
  pointer-events: auto;
}
#gate.visible { display: flex; }

#gate-button {
  padding: 14px 26px;
  border: 1px solid rgba(224, 194, 140, 0.4);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(160, 120, 60, 0.55), rgba(80, 58, 28, 0.55));
  color: #f6eedd;
  font: inherit;
  font-size: 15px;
  letter-spacing: 0.03em;
  cursor: pointer;
  box-shadow: 0 0 32px rgba(220, 170, 90, 0.22);
}
#gate-button:disabled { opacity: 0.5; }
#gate-note {
  margin: 0;
  max-width: 70vw;
  color: var(--dim);
  font-size: 12px;
  text-align: center;
}

/* Virtual tilt pad, shown when the device has no usable motion sensors. */
#stick {
  position: absolute;
  left: 50%;
  bottom: calc(62px + env(safe-area-inset-bottom));
  width: 108px;
  height: 108px;
  margin-left: -54px;
  display: none;
  border: 1px solid var(--edge);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(66, 52, 32, 0.5), rgba(20, 16, 10, 0.35));
  pointer-events: auto;
  touch-action: none;
}
#stick.visible { display: block; }
#knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42px;
  height: 42px;
  margin: -21px 0 0 -21px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f2e3c2, #b98a45 60%, #5e421e);
  box-shadow: 0 0 18px rgba(230, 180, 100, 0.45);
  transition: transform 80ms ease-out;
}

#fatal {
  position: absolute;
  inset: auto 16px 50% 16px;
  display: none;
  padding: 16px;
  border: 1px solid rgba(255, 120, 120, 0.4);
  border-radius: 10px;
  background: rgba(40, 10, 14, 0.85);
  color: #ffd8d8;
  font-size: 13px;
  text-align: center;
}
#fatal.visible { display: block; }

@media (prefers-reduced-motion: reduce) {
  #knob, #hint { transition: none; }
}

</style>
<canvas id="stage"></canvas>

<div id="ui">
  <div id="vignette"></div>
  <div id="material-picker">
    <button id="material" type="button" aria-haspopup="listbox" aria-expanded="false"
            aria-label="Material">Sand</button>
    <div id="material-menu" role="listbox" aria-label="Choose material" hidden></div>
  </div>
  <div id="hint"></div>
  <div id="stats"></div>

  <div id="gate">
    <button id="gate-button" type="button">Enable tilt</button>
    <p id="gate-note"></p>
  </div>

  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <div id="fatal"></div>
</div>
<script>
(function () {
'use strict';

// ---- src/config.js ----
// Every tunable in one place. Values are in CSS pixels and seconds; the sim is
// resolution independent and the renderer scales by devicePixelRatio.

const CONFIG = {
  bed: {
    // Fraction of the screen height the settled bed should fill (front view).
    // Grain count is derived from this so the look is constant across devices.
    // Keep it shallow: pile depth is what the contact solver has to hold up,
    // and a bed much deeper than this starts sinking into itself no matter how
    // many iterations it gets. It also matches the reference hardware, whose
    // bed is only a shallow layer.
    fill: 0.22,
    // Depth of the box behind the glass, in grain diameters. This is the Z the
    // screen is a window into; deeper looks better but costs grains cubically.
    depthLayers: 5.0,
    // 3D random-close-packing density, converts bed volume -> grain count.
    packing: 0.64,
    minGrains: 400,
    maxGrains: 60000,
  },

  grain: {
    // radius = min(viewport) / divisor, clamped. 3D needs chunkier grains than
    // 2D did (count scales steeply with 1/r), but the default should look like
    // sand, not marbles — slow devices are the tuner's problem, not a tax the
    // designed look pays up front.
    divisor: 76,
    minRadius: 2.8,
    maxRadius: 9.5,
    // Ceiling for the tuner only. maxRadius caps the size the app *chooses*;
    // this caps how far a struggling device may coarsen past it. Since sand is
    // drawn as a mass, a bigger grain is nearly invisible while fewer grains
    // is visibly less sand — so coarsening is the right lever and it needs
    // somewhere to go. See Grains.preferredRadius.
    coarseRadius: 16,
    // Radius spread around the mean. Identical spheres crystallise into a
    // regular lattice as they settle — visible as a woven grid across the bed —
    // and real sand never does exactly because its grains all differ.
    polydispersity: 0.18,
  },

  // Velocity-level sequential impulses. See src/grains.js for the reasoning
  // behind the velocity/position split — it is the whole basis of the solver.
  sim: {
    // Gravity magnitude = gravityScale * viewport diagonal (px/s^2). A phone
    // screen is ~50 px/cm, so true gravity would be ~50000 px/s^2; well below
    // that still reads as "falling through honey". This is the main knob for
    // how brisk and alive the sand feels.
    gravityScale: 7.0,
    // The solver runs on a fixed timestep so the feel never depends on frame
    // rate. Keep maxSubsteps tight: catch-up is a feedback loop, because a slow
    // frame hands the next step a bigger dt, which buys *more* substeps and
    // makes it slower again. Capped, a struggling device runs the sim slightly
    // slow-motion instead of spiralling — measured 37fps -> 60fps here.
    // 120Hz x 3 substeps = 25ms of simulated time available per frame, so the
    // sim stays real-time on anything holding 40fps. At 150Hz the budget was
    // 20ms, and a wide window (which maximises grain count AND gravity) dropped
    // below that mid-splash — the sim then runs in slow motion, and a splash
    // that rains out in half a second becomes seconds of drifting mist.
    fixedHz: 120,
    maxSubsteps: 3,
    // Contacts are found this far apart (fraction of a diameter) and the solver
    // then limits approach speed to the remaining gap. Detecting only actual
    // overlap leaves a grain resting exactly on a surface with no contact at
    // all — the floor stops holding the bed up and it sinks straight through.
    contactMargin: 0.05,
    // Extra reach (fraction of a diameter) baked into the contact list so it
    // survives several substeps. Finding pairs costs far more than solving
    // them, so the list is rebuilt at most once a frame — and only when some
    // grain has moved half the skin.
    skin: 0.35,
    // Grid cell size as a multiple of grain diameter; must exceed the largest
    // pair's list radius (1 + polydispersity + skin) so the 3x3x3 scan cannot
    // truncate the speculative band for the biggest grains.
    cellMul: 1.6,
    // Gauss-Seidel sweeps. Velocity iterations buy stacking stiffness (a deep
    // pile needs more); position iterations only clean up leftover overlap.
    velocityIterations: 6,
    // Bottom-up sweeps treating the supported side as ground. One is usually
    // enough and it is what lets a deep bed stand up at all.
    shockIterations: 1,
    // Approach speed (grain diameters per second) above which a contact is an
    // impact rather than a resting stack, and is left to the momentum-
    // conserving solver so it can spray instead of being absorbed.
    shockMaxApproach: 5,
    positionIterations: 3,
    // Fraction of excess penetration removed per position iteration.
    positionBeta: 0.15,
    // Overlap left uncorrected, as a fraction of a diameter. A little slack
    // here is what lets a settled bed stop fidgeting entirely.
    slop: 0.02,
    // Ceiling on one position correction, so a deep overlap unwinds over a few
    // steps instead of teleporting.
    maxCorrection: 0.08,
    // Coulomb friction. Grain-on-grain sets the angle of repose, which lands
    // well above atan(mu) because spheres have to climb out of each other's
    // pockets to move: 0.28 gives ~34°, which is real sand. Only meaningful
    // because friction is warm started — without that the solver never builds
    // enough of it to hold a slope, and the value barely matters.
    friction: 0.28,
    // Wall friction has to stay LOW and is the single most surprising knob in
    // here. The box is only a few grains deep, so roughly half of them touch
    // the glass or the back wall at any moment — at sand-on-sand values the
    // walls grip the entire bed and it rides out a 50° tilt as one rigid slab,
    // no matter what grain friction says.
    wallFriction: 0.12,
    // Bounce on impact, and the approach speed (grain diameters per second)
    // below which a contact counts as resting and does not bounce at all.
    // Sand grains barely bounce individually, but with none whatsoever a slosh
    // hits the far wall and dies instead of washing back.
    restitution: 0.3,
    restitutionCut: 6,
    // Per-second velocity decay. Keep it genuinely small: at 0.4 a slosh had
    // lost a third of its speed within a second, which flattened the rebound.
    // Warm starting is what quiets the bed now, so this does not have to.
    airDrag: 0.1,
    // Hard speed ceiling, in grain diameters travelled per substep.
    maxTravel: 1.0,
    // Normalised speed above which a grain touching nothing counts as being
    // in flight rather than simply lying somewhere by itself, and the width of
    // that ramp. Low, because speed01 saturates after a couple of pixels of
    // fall — this only has to exclude grains that are genuinely at rest.
    flightSpeed: 0.008,
    flightSpeedBand: 0.035,
    // Neighbour search radius for shading, as a multiple of grain diameter.
    shadeRadius: 1.15,
    // Divisor for the "how buried am I" term (sum of upward contact dots).
    coverNorm: 2.4,
    // Fraction of a grain's brightness that reaches the grain beneath it.
    lightTransmit: 0.93,
    lightSmoothing: 18,
    // A shake is modelled as the box being jerked: a body acceleration added
    // to gravity for a moment, in multiples of gravity, rather than a velocity
    // handed to each grain. See Grains.splash — writing velocities is what
    // turns a splash into a dust cloud, because per-grain velocity is relative
    // velocity, and relative velocity is what pulls a packed bed apart.
    // The floor matters more than it looks: a pulse too weak to lift the bed
    // clear of the ground leaves part of it supported while the rest rises, so
    // the bed shears against itself and goes loose. Measured at strength 1,
    // 2.6g left 5.7% of grains isolated and 3.4g left 0.5%. Once airborne
    // every grain shares the same gravity, so the mass travels rigid — the
    // dispersion only ever happens during a half-hearted launch.
    splashAccel: 3.4,
    // Added per unit of shake strength above 1. Deliberately shallow: a hard
    // shake should hit harder, but the strong end is already well clear of the
    // threshold and a linear scaling just throws sand into the ceiling.
    splashGain: 0.8,
    // Seconds the pulse lasts. Long enough to launch the bed, short enough to
    // read as a jerk rather than a change in gravity.
    splashDuration: 0.09,
    // How far the jerk tips off the gravity axis, so shakes differ and the
    // sand heaves sideways rather than hopping straight up.
    splashLean: 0.45,
  },

  render: {
    maxDpr: 2,
    // Perspective: focal length as a multiple of min(viewport w, h). Smaller =
    // more dramatic depth. Parallax shifts the eye against tilt, in px.
    // Shorter focal = more aggressive convergence toward the back. Parallax is
    // how far the eye slides against the tilt; it is the strongest depth cue
    // available on a phone because it is coupled to the hand.
    focal: 1.0,
    // How far the back of the box falls into shadow: sand and specks fade
    // this fraction of the way toward `fog` at full depth. A colour, never a
    // coverage — sand deep in the box is opaque sand, just further away.
    depthDim: 0.5,
    // Depth at which that fade begins. The per-pixel depth is an average along
    // the view ray, so the front face of the bed already reads as mid-depth
    // once the grains behind it are summed in; fogging from zero greyed the
    // whole mass by a fifth. Only what is genuinely toward the back pays.
    fogStart: 0.45,
    // What they fade toward: the box's own darkness, a shade warmer than the
    // back wall so deep sand still reads as sand in shadow rather than as a
    // hole.
    fog: [0.10, 0.075, 0.05],
    parallax: 65,
    // Box interior. Shaded by facing under the same light as the sand: the
    // floor catches it, the ceiling is in shadow. Back vertices are multiplied
    // by wallBackFalloff so every wall recedes into darkness.
    // Kept deliberately dim. The box only has to be *implied* — measured
    // against a background of 5/255, the old values put the floor at 67 and
    // the right wall at 57, so the empty half of the box read as a lit brown
    // panel competing with the sand. Halved, the walls sit at 2-7x the
    // background: enough to place the corners, not enough to look at.
    wallColor: [0.15, 0.125, 0.095],
    // Right was nearly as bright as the floor, which is what made the far wall
    // pop. Pulled closer to the left face, keeping some asymmetry so the box
    // still reads as lit from one side.
    wallShade: { floor: 1.0, ceiling: 0.42, left: 0.5, right: 0.58, back: 0.55 },
    wallBackFalloff: 0.55,
    background: [0.02, 0.017, 0.014],
    // Dry quartz: shadowed brown for buried sand, warm tan through the body,
    // pale cream where the surface catches the light. Buried sand is only a
    // little darker than the surface — against the glass, real sand is nearly
    // one tone — so the deep end stays well up from black. Measured against
    // real dry sand (beach sand #C2B280 is 45 deg / 35% sat / 63% light), the
    // rendered mass wants to land near 40 deg / 35% / 62%; greyer than that
    // reads as damp sand or concrete.
    deep: [0.34, 0.25, 0.15],
    mid: [0.70, 0.56, 0.37],
    lit: [0.96, 0.87, 0.66],
  },

  // The sand look. See src/shaders.js for the idea: the pile is drawn as one
  // continuous mass from a coverage field, and the grain texture comes from
  // tiny independent specks on top. Physics grains are never drawn as such.
  sand: {
    // Fraction of the canvas the coverage field is rendered at. Half res is
    // cheaper and doubles as the blur that turns blobs into a mass.
    fieldScale: 0.5,
    // Blob radius as a multiple of the grain radius. This is what smooths the
    // silhouette: at 1.6 every surface grain stood out of the pile as its own
    // rounded lump — a metaball outline at physics-grain scale, which is
    // exactly the scale sand must not have. Wide blobs low-pass the surface
    // over a couple of grains, so it reads as a slope with fuzz on it.
    blob: 2.3,
    // Where a PACKED grain's silhouette lands, as a multiple of its own
    // radius. A little over 1 on purpose: a physics grain stands in for a
    // clump of real sand, and that sand fills its neighbourhood rather than
    // an inscribed sphere, so a jammed single layer should read as continuous
    // sand — which is what you get when the phone is laid flat and the whole
    // bed collapses into a sheet one grain thick.
    bulkSize: 1.25,
    // Where a grain resting BY ITSELF draws — its own true size. Not spray:
    // a grain lying alone in a bare patch is a grain of sand lying there, and
    // shrinking it is what left those patches as clean empty holes with
    // nothing scattered in them.
    aloneSize: 1.0,
    // A grain touching nothing draws its blob this much NARROWER (graded by
    // how few contacts it has). This is a width, not a brightness: a narrow
    // blob cannot bridge to the mass and hang off it as a drip. Its peak is
    // solved for separately — see uSoloSize and the field vertex shader.
    looseShrink: 0.35,
    // Where a lone grain's silhouette lands, as a fraction of its true radius.
    // The physics grain is many real grains' worth of sand, so drawing a
    // flying one slightly under size reads as spray rather than as a boulder —
    // but only slightly: drawn at a quarter size, thousands of them are a dust
    // cloud even while the simulation is perfectly sane. It also sets how hard
    // a lone grain has to shout to clear the threshold, and therefore how many
    // may overlap before the 8-bit field clips, so it is cheap to keep modest.
    // Where a grain with NOTHING to touch draws instead, in its own radii —
    // and the bed slides between the two by contact count. Deliberately well
    // inside the grain: sand in flight is drawn by its SPECKS (which spread to
    // speckAirSpread) with the field only putting a soft core underneath them.
    // Drawn full size a flying grain is a smooth 20px disc — a bead — because
    // a lone blob's level set is a clean circle that nothing breaks up, and
    // sparse grains drawn generously merge into rounded lobes that turn a
    // splash into batter.
    soloSize: 0.5,
    // Blob profile exponent for a lone grain (the mass uses 2). Lower is a
    // gentler falloff, so the composite's fixed soft band spans more pixels
    // and that core fades out instead of ending on a hard rim.
    airPow: 0.7,
    // Ceiling on the colour ramp for sand in flight. The top of the ramp is
    // the pale cream of a sunlit surface, which a lone grain has not earned —
    // left there, a splash is a scatter of glowing beads.
    airLight: 0.45,
    // Coverage at which sand starts. This no longer decides how big anything
    // looks — bulkSize and soloSize do, and the field pass solves each grain's
    // peak to match — so it is purely the scale the field works in. Lower
    // leaves more 8-bit headroom before a deep bed clips; too low and the
    // field quantises. Nothing visual should move if you change it.
    surface: 0.042,
    soft: 0.006,
    // The threshold wanders by this much at grain scale, so the silhouette
    // breaks into fuzz instead of a smooth contour. Proportional to `surface`
    // — as an absolute offset it would swamp a low threshold and re-open the
    // holes it exists to roughen.
    dither: 0.009,
    ditherPx: 3.0,
    // Form shading from the field gradient: how strongly the gradient tilts
    // the normal, how much of the result the colour sees, and — the load
    // bearing one — how far apart the gradient is sampled, **in grain
    // diameters**. Sampled within a grain this is blob noise and it embosses
    // every grain, curdling the mass into clumps; sampled several grains apart
    // it is the shape of the pile, which is the shading that makes a bed look
    // like a heap of sand instead of a slab. It has to be a grain-relative
    // distance: as a pixel count it lands on a different physical scale on
    // every viewport and device ratio.
    relief: 2.2,
    form: 0.45,
    formGrains: 2.5,
    // Silhouette low-pass, also in grain diameters, and how much of it the
    // mask takes. The raw contour is the level set of a sum of blobs, so it
    // carries lumps at physics-grain scale; averaging across about a grain
    // removes them and the fine dither above puts the fuzz back.
    edgeGrains: 0.7,
    edgeSmooth: 0.75,
    // Fast sand pales a little toward dust.
    pale: 0.15,
    // Spatial patchiness: real sand varies in correlated patches (minerals,
    // moisture), not grain by grain. Scale is the patch size in CSS px.
    patchScale: 52,
    patchAmp: 0.09,

    // Specks: the visible grain. Diameter on screen in CSS px, held constant
    // across devices; how far each grain scatters its specks (multiple of
    // its radius); and how much of a grain's projected disc its own specks
    // cover — the per-grain count follows from that and the grain size.
    speckPx: 2.4,
    // Specks reach the full grain rather than huddling near its centre. Kept
    // short, they bunch into a little rosette per grain with smooth gaps
    // between — grouping at speck scale, which is the same tell the field
    // render exists to avoid, just an order of magnitude smaller.
    speckSpread: 1.0,
    // Spread for a grain in flight, which is drawn by its specks rather than
    // by the field. The clump has to cover the sand the grain stands for, or
    // a splash reads as dust however many specks it has.
    speckAirSpread: 1.15,
    // Fraction of a grain's disc its own specks cover. High, because the
    // specks ARE the sand: the field under them is smooth, and at a third
    // covered they read as scattered dots on a smooth surface — speckled
    // paint rather than grains. This was hidden on a desktop, where a grain
    // is twice the size and carries four times the specks for the same
    // fraction; on a phone it left the sand looking washed out and flat.
    speckCoverage: 0.75,
    // Headroom for coarsened grains: the per-grain count scales with the
    // grain's area so the sand keeps the same fineness on screen, and the
    // tuner's lever is now grain size, so this has to reach.
    speckMax: 64,
    // Floor on how far adaptive quality may thin the specks out. Below about
    // this the sand stops reading as grains at all, and a smooth bed is worse
    // than a slightly slow one.
    speckMinQuality: 0.45,
    speckAlpha: 0.85,
    // Per-speck relief: each speck gets a lit crest and a shadowed far side
    // under one global light. This is where the fine realism lives, and it is
    // here rather than in the composite because a speck rides the simulation —
    // so the relief travels with the sand instead of standing still while the
    // sand pours through it. `round` is how domed a speck is; higher is
    // flatter, and below about 0.3 the shadowed sides go black.
    speckRelief: 0.42,
    speckRound: 0.55,
    // Sand in flight gets this many times the bed's specks, at this size:
    // more and finer, so a splash reads as spray rather than as a puff.
    speckAirMul: 2.2,
    speckAirSize: 0.8,
    // Mineral mix. Fractions of specks that are dark grains and bright quartz,
    // their tones relative to the body, and the spread of everything else.
    speckDark: 0.10,
    speckDarkTone: 0.6,
    speckBright: 0.10,
    speckBrightTone: 1.16,
    speckVary: 0.16,
    // Specks toward the back of the box thin out a little. Only a little:
    // they are the texture, and sand seen deeper in the box is still sand.
    // Fading them out entirely left the back reading as smooth mud.
    speckDepthFade: 0.3,
    // Sand glints as facets catch the light: brief, sparse, on the bright
    // specks only, more readily when moving. Restrained on purpose — now that
    // every speck carries its own lit crest, the bed already sparkles a
    // little on its own, and at 0.35 on top of that it read as sugar.
    glintStrength: 0.18,
    glintRate: 1.6,
  },

  input: {
    // Gravity direction smoothing, per second. Motion gets a much lighter hand
    // than orientation: smoothing heavy enough to hide accelerometer noise also
    // hides the flick that makes the sand slosh.
    tiltSmoothing: 14,
    motionSmoothing: 45,
    keySmoothing: 8,
    // How long an accelerometer reading stays trusted before falling back to
    // orientation, and the ceiling on how many g a shake may apply.
    accelTimeout: 0.4,
    maxG: 4.0,
    // Fixed into-screen gravity bias for keyboard/stick/demo input, so the bed
    // leans against the back wall and the box reads as 3D on desktop too.
    zBias: 0.45,
    // m/s^2 of gravity-excluded acceleration that counts as a shake, and how
    // long after load before shakes are armed (picking the phone up spikes the
    // accelerometer hard enough to read as several shakes otherwise).
    shakeThreshold: 13,
    shakeCooldown: 0.35,
    shakeArmDelay: 1.5,
    // Finger/mouse push. The radius is a fraction of the shorter screen edge,
    // not a pixel count: fixed at 46px it reached about a hundred grains on a
    // desktop and read as a pinprick.
    pokeRadiusFrac: 0.22,
    pokeRadiusMin: 54,
    // Push strength in gravities. A packed bed absorbs a weak push completely
    // — the solver removes it as fast as it goes in, so velocity never
    // accumulates — and the old fixed 2600 (a fifth of a g on a large screen)
    // moved the sand by a *seventh of one grain* however wide the touch area
    // was. It has to be gravity-relative for the same reason the radius has to
    // be screen-relative: gravityScale follows the screen diagonal, so a fixed
    // number lands differently on every device. Past roughly 5g the travel
    // clamp caps grain speed anyway, so more strength only widens the crater.
    pokeAccel: 4.5,
    pokeDrag: 0.85,
  },

  tuner: {
    // Downscale-only safety net, not an optimiser. Grain size is chosen from
    // the screen alone, and that is the ceiling: the tuner may coarsen grains
    // on a device that cannot keep up, and never refines past the designed
    // look. Refining was the wrong idea twice over — it made the app look
    // different depending on the GPU, and "more detail" means spawning grains,
    // which is visible as sand appearing out of nowhere seconds after load.
    //
    // Consequence: it never adds grains, so it can no longer disturb a settled
    // bed. A device that coarsens stays coarse until reload, which is a fair
    // trade for a look that never changes on its own.
    enabled: true,
    // Only sustained trouble counts — comfortably past a 60fps budget so a
    // stray spike or a background tab never triggers it.
    hiMs: 19,
    sampleFrames: 60,
    cooldown: 2.5,
    // Ignore the first seconds entirely. Every load opens with the bed
    // avalanching into place with nothing asleep yet — the most expensive
    // moment the app ever has, and an atypical one. Judging on it coarsened
    // the look on hardware that then ran the actual scene at a steady 60fps.
    warmup: 4.5,
    step: 0.18,
    // Coarsest allowed, as a fraction of the designed grain count.
    minScale: 0.22,
  },

  // --------------------------------------------------------------- water
  // Position Based Fluids. See fluid.js for why this is a separate solver
  // rather than the granular one with friction set to zero.
  fluid: {
    // Water particles are far coarser than sand grains, and deliberately so:
    // sand needs a high count because every grain is visible, while water is
    // drawn as a surface and hides its particles entirely. Coarser particles
    // mean the same volume of liquid for a quarter of the work.
    divisor: 62,
    minRadius: 5,
    maxRadius: 15,
    depthLayers: 4,
    fill: 0.24,
    minParticles: 200,
    maxParticles: 6000,

    // Kernel support as a multiple of rest spacing. 2.0 gives ~30 neighbours,
    // which is the usual working point: fewer and the density estimate is too
    // noisy to hold a flat surface, more and the cost climbs as the cube.
    smoothingRatio: 2.0,
    // Poly6 for density, Spiky for its gradient, both normalised to W(0)=1.
    // Their ratio is the only constant that has to survive that normalisation:
    // (45/pi h^4) / (315/64 pi h^3) = 2880/315/h, which is GRAD_K in fluid.js.
    solverIterations: 4,
    // Constraint force mixing. Stops lambda blowing up where a particle has
    // almost no neighbours (a lone drop of spray) and the denominator vanishes.
    relaxation: 0.0008,
    // Artificial pressure: strength, and the distance it peaks at as a
    // fraction of the smoothing radius. Counteracts the tensile instability
    // that otherwise pulls surface particles into beads and strands.
    surfacePressure: 0.0004,
    surfaceDistance: 0.2,
    // Ceilings, both as fractions of rest spacing. A single solver iteration
    // may not shove a particle further than maxCorrection, and a substep may
    // not move one further than maxTravel — past a cell width the neighbour
    // list it was solved against is no longer the one it lands in.
    maxCorrection: 0.35,
    maxTravel: 0.9,
    // Room above the measured mean of ~30. Overflowing silently would drop
    // real neighbours and read as a density hole.
    maxNeighbours: 64,
    // How much of the missing-half-space density to hand back at a wall (see
    // Fluid.solveDensity). Full strength is what the geometry says, and once
    // the terms are combined as a union rather than summed it is also what
    // behaves: measured across 0 to 1 the bulk settles at 1.08x rest either
    // way, so there is nothing to buy by weakening it, and weakening it only
    // presses more particles flat against the glass.
    wallDensity: 1.0,
    // Closest two particles may sit, as a fraction of rest spacing, and how
    // much of any overlap is resolved per substep. Well below rest, so normal
    // compression never touches it — this exists only to break up the welded
    // beads described in Fluid.separate, which the density constraint cannot.
    minSeparation: 0.62,
    separationStiffness: 0.8,

    // XSPH velocity smoothing. This is the whole of the viscosity model, and
    // it is what makes water pour rather than shatter.
    viscosity: 0.12,
    drag: 0.05,
    // Tangential drag at the walls — no-slip — and the width of the band it
    // acts over as a multiple of rest spacing. `adhesionGlass` is the front and
    // back panes, and in a box this shallow it is the one that decides how
    // thick the liquid behaves. Water barely wets glass at this scale; honey
    // emphatically does. See Fluid.adhesion.
    adhesion: 0,
    adhesionGlass: 0,
    adhesionBand: 1.0,
    fixedHz: 60,
    maxSubsteps: 2,
    foamSmoothing: 9,
  },

  water: {
    // Sprite size as a multiple of particle diameter. Generous on purpose: the
    // blobs have to overlap heavily or the field is lumpy and the surface
    // inherits the lumps.
    // Well above the 2.0 that would merely make blobs touch. Particles at rest
    // sit on a lattice, and a kernel only as wide as the spacing leaves a
    // ripple at exactly that frequency — the body came out visibly striped.
    // Wide blobs average the lattice away.
    blobSize: 3.6,
    // Per-particle peak contribution to the thickness field. Moves inversely
    // with blobSize (wider blobs overlap more), and tuned so a full body sits
    // below saturation — once the field clips at 1.0 its gradient goes flat and
    // the surface loses every ripple.
    gain: 0.058,
    // Fraction of the canvas the field is rendered at. Half res is cheaper and
    // doubles as the blur that turns blobs into a surface.
    fieldScale: 0.5,
    // Thickness at which water starts, and the width of the soft edge. Low on
    // purpose: a higher threshold pulls the level set inward from the glass and
    // rounds off the corners, which reads as a block of gel rather than a tank
    // of water. Low, and the water meets the wall square.
    surface: 0.055,
    soft: 0.055,
    // Beer-Lambert absorption: how fast colour deepens with thickness.
    absorb: 4.2,
    // How strongly the thickness gradient tilts the surface normal.
    relief: 7.0,
    // Fraction of that relief a *calm* body keeps, and how fast agitation
    // restores the rest. The particle lattice leaves a permanent fine ripple
    // in the field; shaded at full relief it reads as wrinkled plastic, so a
    // still surface is held nearly glassy and only moving water ripples.
    calmRipple: 0.1,
    rippleGain: 2.5,
    // Wall images are scaled by the neighbour count of the particle they
    // mirror (see Renderer.packWater). Measured against this box: a thin film
    // draining down the glass sits near 14 neighbours, bulk water against the
    // same wall near 26, so the ramp runs between them. Below the floor the
    // image never vanishes entirely, so the body still meets the glass instead
    // of fraying away from it.
    imageBuriedLo: 10,
    imageBuriedHi: 24,
    imageFloor: 0.2,
    // Coverage: alpha at the silhouette edge, and the Beer-Lambert rate at
    // which thickness turns opaque. Opacity is the strongest "gel" signal —
    // real water lets the tank show through wherever it runs thin, and it is
    // also most of what separates water from a thick liquid, so water is kept
    // deliberately see-through and honey deliberately not.
    alphaMin: 0.24,
    opacify: 4.0,
    specular: 0.9,
    // Tight. A rippled surface throws many small hard glints, which is what
    // water looks like; see the composite.
    specPower: 90.0,
    fresnel: 0.10,
    // Foam wants to be rare. Keyed on speed, it fired across the whole crest of
    // every wave and turned the water white; it should only catch the fastest
    // thin edges, so the bias sits well up the speed range.
    foamAmount: 1.4,
    foamBias: 0.42,
    shallow: [0.32, 0.62, 0.68],
    deep: [0.03, 0.16, 0.30],
    foam: [0.90, 0.95, 0.97],
  },
};

// --------------------------------------------------------------------- honey
//
// The same solver and the same two passes as water — a liquid is a liquid — so
// honey is written as the handful of numbers that differ, layered over water's.
// Built with Object.assign rather than spread into a literal so both objects
// stay live on CONFIG and can be poked from a console like everything else.
//
// What actually separates the two, in order of how much it matters:
//
//   adhesionGlass  The whole of it, and not where you would look first. The
//               box is a slab a few particles deep, so the front and back
//               panes are nearly all of the wetted area, and holding the
//               liquid against them is what creates a shear profile for the
//               viscosity to act on. Measured under a sustained 20-degree
//               tilt: water answers at 215 px/s and rings (its mean speed
//               climbs again at 2s as it sloshes back), honey at 56 and
//               creeps monotonically to the same place over about three
//               seconds. Turned off, honey is water.
//   viscosity   XSPH, which drags each particle toward its neighbours' average
//               velocity. On its own it does *nothing* to a body sliding as a
//               plug — there is no shear to resist — which is why it needs the
//               wall term. What it does own is the absence of slosh: it
//               carries the walls' grip into the body and the surface settles
//               without ringing. Past ~0.9 the fluid locks solid.
//   adhesion    The same grip on the four lateral walls, so it also coats the
//               sides it has flowed away from rather than draining clean.
//   drag        Barely above water's. Bulk drag is the obvious knob for "slow"
//               and the wrong one: gravity re-accelerates every substep, so it
//               only sets a terminal velocity, and cranked hard enough to be
//               visibly slow it deadens the shake response as well.
//   surface*    Artificial pressure exists to stop water tearing into beads;
//               honey may hold a rounder, lumpier surface, so it is eased.
//
// Honey also falls slowly, and that is a deliberate choice rather than a
// leftover. A body in flight is unavoidably touching both panes in a box this
// shallow, so no-slip decelerates a ballistic arc to roughly 40% of gravity.
// Fading the grip out above a speed does fix the fall, but the two regimes sit
// only about 1.5x apart — a gripped tilt settles near 350 px/s, a shake
// averages 540 — so no threshold separates them, and every setting that made
// the fall look right also released the grip during ordinary tilting and left
// honey behaving like water. Given the choice, thickness wins: it is the
// entire point of the material, and a slow fall reads as heavy rather than as
// wrong. See Fluid.adhesion.
CONFIG.honey = Object.assign({}, CONFIG.fluid, {
  viscosity: 0.72,
  adhesion: 6.0,
  adhesionGlass: 25.0,
  adhesionBand: 1.3,
  drag: 0.15,
  surfacePressure: 0.0002,
  // Slightly less of it, so the body reads as a heavier, shallower pool.
  fill: 0.20,
});

CONFIG.honeyLook = Object.assign({}, CONFIG.water, {
  // Amber. Honey absorbs far harder than water, but not so hard that the ramp
  // is spent inside the first few particles: at 7.5 the whole body sat at the
  // deep end of it and came out as one flat orange slab, which reads as clay.
  // Half that, and the thickness gradient is visible across the pool — thin
  // edges glowing gold, the middle going to dark amber — which is most of what
  // makes honey look lit from inside rather than painted.
  // Both ends have to sit at honey's hue, not just the bright one. A body this
  // thick spends nearly all of the Beer-Lambert ramp at the deep end, so the
  // deep colour is what you actually see: a red-brown there (hue 21) rendered
  // the whole pool at hue 24, which is past orange and nowhere near honey.
  // Real honey runs 40-45 — clover #FFC30B is 45, amber #E8A317 is 40 — so
  // both ends are set on that line and the deep end is lifted out of the mud.
  shallow: [1.00, 0.82, 0.30],
  deep: [0.55, 0.38, 0.05],
  foam: [0.99, 0.88, 0.62],
  absorb: 3.2,
  // Solid, but not a cut-out. Water is a tinted window onto the box behind it
  // and honey is a body you cannot see into, so these stay well apart — but
  // pushed to 0.88/16 the edge went opaque within a pixel of the silhouette
  // and every shape ended up a flat slab with a hard rim. The thinnest honey
  // is still translucent; it is the *body* that is not.
  alphaMin: 0.50,
  opacify: 8.0,
  // Tight, and *tighter* than water — the second time this one caught me out.
  // Broad highlights come from a rough surface, and honey is optically smooth:
  // it is a mirror with few highlights, not a diffuse one with soft ones. At
  // 22 the lobe was so wide that a flat, viewer-facing surface sat near its
  // peak, so the entire body took a uniform white lift and came out as flat
  // pale-yellow paper. Measured, that one number moved the mean from
  // (215,175,82) to (168,124,30) — from highlighter to amber.
  specular: 1.1,
  specPower: 70.0,
  fresnel: 0.20,
  // SMOOTHER than water, which is the correction that mattered most. A still
  // honey surface is a mirror; still water is not, because water is never
  // quite still. Set the other way round — honey wrinklier than water, on the
  // reasoning that a viscous surface holds whatever shape it is given — the
  // two came out with the same fine texture in the same places, and honey read
  // as water in a different colour. Measured, honey carried nearly twice
  // water's surface contrast (44 against 25) when it should carry less. What a
  // viscous surface actually holds is *large* shape, and that comes from the
  // solver refusing to level, not from the shader.
  // A slab of liquid filling the box has the same thickness along every view
  // ray, so its interior is genuinely uniform and no palette can shade it —
  // measured, thickness runs 0.65 to 0.70 across the whole body. All of the
  // form therefore has to come from the silhouette and the curved edges, which
  // is what relief shades, so it needs to be *up*, not down. What keeps honey
  // from reading as water is calmRipple: still honey is a mirror, still water
  // never is, and that is a property of the resting surface rather than of how
  // strongly the surface is lit.
  relief: 7.0,
  calmRipple: 0.06,
  rippleGain: 1.0,
  // No foam. Honey does not aerate on a shake; it heaves and folds.
  foamAmount: 0.0,
});

// ---- src/grid.js ----
// Uniform 3D spatial hash, built with a counting sort. Allocation-free after
// warm-up. Purely a lookup structure — it knows nothing about the physics.
//
// Cells are x-major then y then z: index (cz * rows + cy) * cols + cx.

class Grid {
  constructor(capacity) {
    this.cols = 0;
    this.rows = 0;
    this.slabs = 0;
    this.cellCount = 0;
    this.cellSize = 1;
    this.cellStart = new Int32Array(1);
    this.cursor = new Int32Array(1);
    this.order = new Int32Array(capacity);
    this.cellOf = new Int32Array(capacity);
    this.grainOrder = new Int32Array(capacity);
  }

  ensureCapacity(n) {
    if (this.order.length >= n) return;
    this.order = new Int32Array(n);
    this.cellOf = new Int32Array(n);
    this.grainOrder = new Int32Array(n);
  }

  configure(width, height, depth, cellSize) {
    this.cellSize = cellSize;
    this.cols = Math.max(1, Math.ceil(width / cellSize));
    this.rows = Math.max(1, Math.ceil(height / cellSize));
    this.slabs = Math.max(1, Math.ceil(depth / cellSize));
    this.cellCount = this.cols * this.rows * this.slabs;
    if (this.cellStart.length < this.cellCount + 1) {
      this.cellStart = new Int32Array(this.cellCount + 1);
      this.cursor = new Int32Array(this.cellCount + 1);
    }
  }

  build(x, y, z, n) {
    const cols = this.cols;
    const rows = this.rows;
    const slabs = this.slabs;
    const layer = cols * rows;
    const cells = this.cellCount;
    const start = this.cellStart;
    const cursor = this.cursor;
    const cellOf = this.cellOf;
    const order = this.order;
    const inv = 1 / this.cellSize;

    start.fill(0, 0, cells + 1);

    for (let i = 0; i < n; i++) {
      let cx = (x[i] * inv) | 0;
      let cy = (y[i] * inv) | 0;
      let cz = (z[i] * inv) | 0;
      if (cx < 0) cx = 0; else if (cx >= cols) cx = cols - 1;
      if (cy < 0) cy = 0; else if (cy >= rows) cy = rows - 1;
      if (cz < 0) cz = 0; else if (cz >= slabs) cz = slabs - 1;
      const c = cz * layer + cy * cols + cx;
      cellOf[i] = c;
      start[c + 1]++;
    }
    for (let c = 0; c < cells; c++) start[c + 1] += start[c];

    cursor.set(start.subarray(0, cells + 1));
    for (let i = 0; i < n; i++) order[cursor[cellOf[i]]++] = i;
  }

  /**
   * Grain indices ordered deepest-first along a direction. Solving contacts in
   * this order lets a single Gauss-Seidel sweep carry support all the way up
   * through a pile, instead of one layer per iteration.
   */
  orderByGravity(gx, gy, gz, n) {
    const axes = [
      { len: this.cols, stride: 1, g: gx },
      { len: this.rows, stride: this.cols, g: gy },
      { len: this.slabs, stride: this.cols * this.rows, g: gz },
    ];
    axes.sort((a, b) => Math.abs(b.g) - Math.abs(a.g));
    for (const a of axes) {
      a.start = a.g >= 0 ? a.len - 1 : 0;
      a.step = a.g >= 0 ? -1 : 1;
    }

    const [a0, a1, a2] = axes;
    const start = this.cellStart;
    const order = this.order;
    const out = this.grainOrder;
    let k = 0;
    for (let i0 = 0; i0 < a0.len; i0++) {
      const o0 = (a0.start + i0 * a0.step) * a0.stride;
      for (let i1 = 0; i1 < a1.len; i1++) {
        const o1 = o0 + (a1.start + i1 * a1.step) * a1.stride;
        for (let i2 = 0; i2 < a2.len; i2++) {
          const c = o1 + (a2.start + i2 * a2.step) * a2.stride;
          const e = start[c + 1];
          for (let s = start[c]; s < e; s++) out[k++] = order[s];
        }
      }
    }
    return out;
  }
}

// ---- src/util.js ----
// Small shared helpers. Kept dependency-free so it can sit at the root of the
// module graph (the bundler relies on that ordering).

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

/** Frame-rate independent exponential approach: rate is "per second". */
function approach(current, target, rate, dt) {
  return current + (target - current) * (1 - Math.exp(-rate * dt));
}

/** Deterministic 32-bit PRNG so a given seed always lays out the same bed. */
function makeRandom(seed) {
  let s = seed >>> 0 || 1;
  return function random() {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

function isTouchDevice() {
  return (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
}

/** iOS (including iPadOS, which reports itself as a Mac with touch). */
function isIOS() {
  const ua = navigator.userAgent;
  return /iPad|iPhone|iPod/.test(ua) ||
    (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
}

// ---- src/grains.js ----
// Granular solver: velocity-level sequential impulses in a shallow 3D box.
//
// The screen is the front glass; the box extends a few grain diameters in Z.
// Grains are equal-mass spheres with no rotational degree of freedom, so
// friction is pure sliding friction. Radii are **polydisperse** (a spread
// around the mean): identical spheres crystallise into a regular lattice the
// moment they settle — visible as a woven grid across the whole bed — and no
// amount of jitter keeps them from finding it again. Real sand never
// crystallises for exactly this reason.
//
// Each fixed substep:
//   1. gravity and drag into velocity
//   2. find contacts (grain-grain and box walls)
//   3. VELOCITY pass — Gauss-Seidel impulses: non-penetration, then Coulomb
//      friction capped by the normal impulse accumulated so far
//   4. clamp speed, integrate positions
//   5. POSITION pass — push apart whatever is still overlapping
//
// The split between 3 and 5 is the load-bearing design decision. An impulse can
// only ever remove kinetic energy, so contacts cannot manufacture motion; and
// the position pass repairs penetration WITHOUT writing back into velocity, so
// geometry never becomes energy either. Resolving overlap by moving grains and
// then re-deriving velocity from that movement — the obvious approach — pumps
// energy into every contact and boils the bed, which no amount of damping,
// sleeping or clamping can fully hide.
//
// Because nothing injects energy, the bed comes to rest on its own. There is no
// sleep system: every grain integrates every step, so tilt response is
// immediate and flow is continuous.
//
// Contacts are solved deepest-first along gravity, so one sweep propagates
// support from the floor up through the whole pile.


class Grains {
  constructor(capacity) {
    this.kind = 'sand';
    this.label = 'Sand';
    // Which pass in the renderer draws this.
    this.render = 'grains';
    // Lean the bed against the back wall: a granular pile holds whatever slope
    // it is given, and the lean is a strong 3D cue on a desktop with no sensor.
    this.zBias = CONFIG.input.zBias;
    this.capacity = capacity;
    this.n = 0;

    const f32 = () => new Float32Array(capacity);
    this.x = f32();
    this.y = f32();
    this.z = f32();
    this.vx = f32();
    this.vy = f32();
    this.vz = f32();

    // Shading inputs, all harvested from the contact search.
    this.light = f32();
    this.speed01 = f32();
    this.sizeJitter = f32();
    this.hueJitter = f32();
    this.contacts = new Uint8Array(capacity);
    // 1 when a grain is touching nothing at all, and a graded version of the
    // same: how far short of a full set of contacts it is. Both smoothed. The
    // renderer draws loosely held grains a little smaller than packed ones —
    // keyed on contact, not speed, because a *speed* threshold fires on any
    // grain that has fallen a few tens of pixels and would shrink an entire
    // moving bed.
    this.airborne = f32();
    this.loose = f32();
    this.cover = f32();
    this.litAbove = f32();

    this.rank = new Int32Array(capacity);
    // Per-grain radius (px). this.radius stays the mean, and most solver
    // scales (skin, slop, travel caps) stay keyed to it.
    this.rad = f32();
    // Positions when the contact list was last rebuilt, for the skin test.
    this.refX = f32();
    this.refY = f32();
    this.refZ = f32();
    this.grid = new Grid(capacity);
    this.random = makeRandom(0x5117);

    // Contact arrays, grown on demand. cj < 0 marks a static wall contact.
    this.contactCapacity = 0;
    this.ci = new Int32Array(0);
    this.cj = new Int32Array(0);
    this.cnx = new Float32Array(0);
    this.cny = new Float32Array(0);
    this.cnz = new Float32Array(0);
    this.cgap = new Float32Array(0);
    this.cjn = new Float32Array(0);
    // Accumulated friction impulse per contact, as a vector.
    this.cfx = new Float32Array(0);
    this.cfy = new Float32Array(0);
    this.cfz = new Float32Array(0);
    // Separation speed each contact should end the step with — restitution,
    // computed from the approach speed before the solve touches anything.
    this.cbounce = new Float32Array(0);
    // Rest distance per contact: rad[i] + rad[j] for the pair it belongs to.
    this.crest = new Float32Array(0);
    this.active = new Int32Array(0);
    this.contactCount = 0;
    this.activeCount = 0;
    this.hashSize = 0;
    this.hashMask = 0;
    this.hKeyI = new Int32Array(0);
    this.hKeyJ = new Int32Array(0);
    this.hJn = new Float32Array(0);
    this.hFx = new Float32Array(0);
    this.hFy = new Float32Array(0);
    this.hFz = new Float32Array(0);
    this.warmHits = 0;

    this.radius = 4;
    this.diameter = 8;
    this.cellSize = 8;
    this.depth = 32;
    this.bounds = { x0: 0, y0: 0, x1: 1, y1: 1 };
    this.inner = { x0: 0, y0: 0, z0: 0, x1: 1, y1: 1, z1: 1 };
    this.gravityMagnitude = 4000;
    this.speedNorm = 600;
    // Unit gravity from the last step, kept so a splash can throw the bed away
    // from whichever wall it is currently resting on.
    this.gdx = 0;
    this.gdy = 1;
    this.gdz = 0;
    // Live shake pulse: an extra body acceleration, and how long it has left.
    this.kickX = 0;
    this.kickY = 0;
    this.kickZ = 0;
    this.kickTime = 0;
    this.substeps = 1;
    this.iterations = CONFIG.sim.velocityIterations;
    this._carry = 0;
  }

  /** Set the box size and grain size; keeps existing grains in place. */
  configure(width, height, radius) {
    if (this.n > 0 && this.radius > 0 && radius !== this.radius) {
      // Quality/layout changed the mean: rescale every grain so each keeps its
      // place in the size distribution.
      const k = radius / this.radius;
      for (let i = 0; i < this.n; i++) this.rad[i] *= k;
    }
    this.radius = radius;
    this.diameter = radius * 2;
    // Must cover the speculative contact radius, or the 3x3x3 scan misses pairs
    // that are about to collide.
    this.cellSize = this.diameter * CONFIG.sim.cellMul;
    this.depth = Math.max(
      this.diameter * 2,
      Math.min(CONFIG.bed.depthLayers * this.diameter, Math.min(width, height) * 0.22),
    );
    this.bounds = { x0: 0, y0: 0, x1: width, y1: height };
    this.inner = {
      x0: radius,
      y0: radius,
      z0: radius,
      x1: Math.max(radius, width - radius),
      y1: Math.max(radius, height - radius),
      z1: Math.max(radius, this.depth - radius),
    };
    this.grid.configure(width, height, this.depth, this.cellSize);

    this.gravityMagnitude = CONFIG.sim.gravityScale * Math.hypot(width, height);
    this.speedNorm = 0.35 * Math.sqrt(2 * this.gravityMagnitude * height);
    // A finger covers a fraction of the screen, not a fixed pixel count: as a
    // constant it ends up a dot on a big display and reaches barely a hundred
    // grains. Scaled, the touch keeps the same footprint everywhere.
    this.pokeRadius = Math.max(
      CONFIG.input.pokeRadiusMin,
      Math.min(width, height) * CONFIG.input.pokeRadiusFrac,
    );
  }

  ensureContactCapacity(need) {
    if (this.contactCapacity >= need) return;
    const cap = Math.max(need, Math.ceil(this.contactCapacity * 1.5) + 1024);
    this.ci = new Int32Array(cap);
    this.cj = new Int32Array(cap);
    this.cnx = new Float32Array(cap);
    this.cny = new Float32Array(cap);
    this.cnz = new Float32Array(cap);
    this.cgap = new Float32Array(cap);
    this.cjn = new Float32Array(cap);
    this.cfx = new Float32Array(cap);
    this.cfy = new Float32Array(cap);
    this.cfz = new Float32Array(cap);
    this.cbounce = new Float32Array(cap);
    this.crest = new Float32Array(cap);
    this.active = new Int32Array(cap);
    this.contactCapacity = cap;
    this.ensureHash(cap);
  }

  /**
   * Grain size is chosen from the screen, and the tuner coarsens from there.
   *
   * `maxRadius` caps the *designed* size only — the tuner may push past it,
   * and it is the one lever that should be used. Sand is drawn as a mass now
   * (see src/shaders.js), so the physics grain size is no longer the look:
   * doubling it is nearly invisible. Grain *count*, on the other hand, is the
   * volume of sand in the box, and taking that away is the most visible change
   * the app can make — measured, a short play session on a wide screen used to
   * lose a third of the bed, permanently, because the tuner never adds back.
   * Count is derived from the bed volume, so coarsening keeps the box just as
   * full; it is only made of fewer, larger grains.
   */
  preferredRadius(width, height, qualityScale = 1) {
    const g = CONFIG.grain;
    const base = clamp(Math.min(width, height) / g.divisor, g.minRadius, g.maxRadius);
    return clamp(base / Math.cbrt(qualityScale), g.minRadius, g.coarseRadius);
  }

  /** Always fill the bed. Quality is spent on grain size, never on volume. */
  targetCount() {
    return this.idealCount();
  }

  /** Grain count that fills `CONFIG.bed.fill` of the front view when settled. */
  idealCount(fill = CONFIG.bed.fill) {
    const { x1, y1 } = this.bounds;
    const v = CONFIG.grain.polydispersity;
    const grainVol = (4 / 3) * Math.PI * this.radius ** 3 * (1 + 3 * v * v);
    const volume = x1 * (fill * y1) * this.depth;
    const ideal = (volume * CONFIG.bed.packing) / grainVol;
    const ceiling = Math.min(
      CONFIG.bed.maxGrains,
      this.capacity,
      (x1 * (0.6 * y1) * this.depth * CONFIG.bed.packing) / grainVol,
    );
    return Math.round(clamp(ideal, CONFIG.bed.minGrains, ceiling));
  }

  _spawnAt(i, x, y, z) {
    const rand = this.random;
    this.x[i] = x;
    this.y[i] = y;
    this.z[i] = z;
    this.vx[i] = 0;
    this.vy[i] = 0;
    this.vz[i] = 0;
    this.light[i] = 0.5;
    this.speed01[i] = 0;
    const v = CONFIG.grain.polydispersity;
    this.rad[i] = this.radius * (1 - v + 2 * v * rand());
    // The renderer reads this as the sprite size ratio (and as the cluster
    // seed — any per-grain float works for hashing).
    this.sizeJitter[i] = this.rad[i] / this.radius;
    this.hueJitter[i] = rand();
    this.contacts[i] = 0;
    this.cover[i] = 0;
    this.litAbove[i] = 0;
    this.airborne[i] = 0;
    this.loose[i] = 0;
  }

  /**
   * Lay out the starting bed as a staggered lattice: alternate layers offset by
   * half a pitch in x and z, so each grain sits in a pocket of the layer below.
   *
   * Both properties matter. Nothing may overlap, or the solver is handed a
   * bed's worth of stored energy on frame one and detonates. And the layout has
   * to be near settled *density*, because a naive loose lattice stands several
   * times too tall for its grain count — and a pile that deep outweighs what
   * the solver can support in its iteration budget, so it crushes itself into a
   * thin overlapping slab on the way down.
   */
  fill(count) {
    const n = Math.min(count, this.capacity);
    this.n = n;
    this.grid.ensureCapacity(n);
    this.kickTime = 0; // a fresh bed must not inherit a shake in progress

    const rand = this.random;
    const b = this.inner;
    // Spacing must clear the largest possible pair, not the mean, or the
    // biggest grains spawn overlapped and hand the solver stored energy.
    const d = this.diameter * (1 + CONFIG.grain.polydispersity);
    const pitch = d * 1.05;
    // With a half-pitch offset in both x and z, the nearest grain in the layer
    // below sits at sqrt((p/2)^2 + yp^2 + (p/2)^2); 0.78d keeps that over d.
    const yPitch = d * 0.78;
    const spanX = Math.max(pitch, b.x1 - b.x0);
    const spanZ = Math.max(0, b.z1 - b.z0);
    const perX = Math.max(1, Math.floor(spanX / pitch) + 1);
    const perZ = Math.max(1, Math.floor(spanZ / pitch) + 1);
    const perLayer = perX * perZ;
    const jitter = this.radius * 0.06;

    for (let i = 0; i < n; i++) {
      const layer = Math.floor(i / perLayer);
      const rem = i % perLayer;
      const off = layer % 2 ? pitch * 0.5 : 0;
      const zi = Math.floor(rem / perX);
      const xi = rem % perX;
      this._spawnAt(
        i,
        clamp(b.x0 + off + xi * pitch + (rand() - 0.5) * jitter, b.x0, b.x1),
        clamp(b.y1 - layer * yPitch + (rand() - 0.5) * jitter, b.y0, b.y1),
        clamp(b.z0 + (perZ > 1 ? off : 0) + zi * pitch + (rand() - 0.5) * jitter, b.z0, b.z1),
      );
    }
  }

  /** Grow/shrink the bed. New grains appear just above the current surface. */
  setCount(count) {
    const target = Math.min(Math.max(count, 0), this.capacity);
    if (target === this.n) return;
    if (target < this.n) {
      this.n = target;
      return;
    }

    let bedTop = this.inner.y1;
    for (let i = 0; i < this.n; i++) if (this.y[i] < bedTop) bedTop = this.y[i];

    const rand = this.random;
    const b = this.inner;
    const pitch = this.diameter * (1 + CONFIG.grain.polydispersity) * 1.1;
    const perX = Math.max(1, Math.floor((b.x1 - b.x0) / pitch) + 1);
    const perZ = Math.max(1, Math.floor((b.z1 - b.z0) / pitch) + 1);
    const perLayer = perX * perZ;
    for (let k = 0, i = this.n; i < target; k++, i++) {
      const row = Math.floor(k / perLayer);
      const rem = k % perLayer;
      this._spawnAt(
        i,
        clamp(b.x0 + (rem % perX) * pitch, b.x0, b.x1),
        clamp(bedTop - pitch * (1 + row), b.y0, b.y1),
        clamp(b.z0 + Math.floor(rem / perX) * pitch, b.z0, b.z1),
      );
    }
    this.n = target;
    this.grid.ensureCapacity(target);
  }

  /** Nudge every grain back inside after a viewport change. */
  clampToBounds() {
    const b = this.inner;
    for (let i = 0; i < this.n; i++) {
      this.x[i] = clamp(this.x[i], b.x0, b.x1);
      this.y[i] = clamp(this.y[i], b.y0, b.y1);
      this.z[i] = clamp(this.z[i], b.z0, b.z1);
    }
  }

  /**
   * Shake response: jerk the box, and let the sand work out the rest.
   *
   * The obvious implementation — hand every grain a velocity — cannot help
   * making a dust cloud, whatever distribution it draws from. Any per-grain
   * velocity is *relative* velocity between neighbours, so the bed aerates
   * everywhere at once: measured over a splash, mean contacts per grain fell
   * from 7.6 to about 4, i.e. the whole mass went loose and grainy rather than
   * moving as sand. Randomising the direction is the worst case (the solver
   * may only remove energy, so most of the kick is annihilated in two frames
   * and all that is left is the boil), but even a perfectly coherent throw
   * decompacts the bed if it is written into velocities.
   *
   * A hand shaking a box never does that. It accelerates the container, and
   * the sand feels a pseudo-force — a *body* force, identical for every grain,
   * which produces no relative velocity at the contacts at all. The bed stays
   * packed while it is driven, leaves the floor as one mass, and only opens up
   * where real sand opens up: at the free surface, and on landing.
   *
   * So this records a short acceleration pulse and lets `step` add it to
   * gravity. No velocities are touched.
   */
  splash(strength) {
    const rand = this.random;
    const cfg = CONFIG.sim;

    // Drive against gravity, not up the screen: on a tilted phone the sand
    // rests on a wall, and that wall is what throws it.
    let ux = -this.gdx;
    let uy = -this.gdy;
    let uz = -this.gdz;
    // Lean off-axis so repeated shakes differ and the bed heaves sideways
    // rather than hopping straight up.
    const lean = (rand() - 0.5) * 2 * cfg.splashLean;
    const tx = -uy * lean;
    const ty = ux * lean;
    ux += tx;
    uy += ty;
    const inv = 1 / (Math.hypot(ux, uy, uz) || 1);
    ux *= inv; uy *= inv; uz *= inv;

    const a =
      this.gravityMagnitude * (cfg.splashAccel + cfg.splashGain * Math.max(0, strength - 1));
    this.kickX = ux * a;
    this.kickY = uy * a;
    this.kickZ = uz * a;
    this.kickTime = cfg.splashDuration;
  }

  /** Push grains away from a screen point (a cylinder through the depth). */
  poke(cx, cy, dragX, dragY, dt) {
    const r = this.pokeRadius;
    const r2 = r * r;
    const push = this.gravityMagnitude * CONFIG.input.pokeAccel * dt;
    const dragScale = CONFIG.input.pokeDrag;
    const { x, y, vx, vy } = this;
    for (let i = 0; i < this.n; i++) {
      const ox = x[i] - cx;
      const oy = y[i] - cy;
      const d2 = ox * ox + oy * oy;
      if (d2 > r2) continue;
      const d = Math.sqrt(d2) || 1e-4;
      const falloff = 1 - d / r;
      const k = (push * falloff) / d;
      vx[i] += ox * k + dragX * dragScale * falloff;
      vy[i] += oy * k + dragY * dragScale * falloff;
    }
  }

  // ------------------------------------------------------------------ stepping

  step(dtFrame, gx, gy, gz) {
    const n = this.n;
    if (n === 0) return;
    const cfg = CONFIG.sim;

    // Fixed timestep with a carry, so the feel never depends on frame rate.
    const h = 1 / cfg.fixedHz;
    this._carry += dtFrame;
    let steps = Math.floor(this._carry / h);
    if (steps > cfg.maxSubsteps) steps = cfg.maxSubsteps;
    if (steps < 1) {
      // Very high refresh rate: keep accumulating rather than stepping tiny.
      if (this._carry < h) return;
      steps = 1;
    }
    this._carry -= steps * h;
    if (this._carry > h * cfg.maxSubsteps) this._carry = 0; // shed a long stall
    this.substeps = steps;
    this.iterations = cfg.velocityIterations;

    const gmag = Math.hypot(gx, gy, gz) || 1;
    const gdx = gx / gmag;
    const gdy = gy / gmag;
    const gdz = gz / gmag;
    this.gdx = gdx;
    this.gdy = gdy;
    this.gdz = gdz;

    for (let s = 0; s < steps; s++) {
      // A live shake pulse rides on top of gravity as a pseudo-force. Note the
      // ordering direction above stays the *true* gravity: the pulse comes
      // from the floor, so contacts should still be solved bottom-up, and the
      // shading must not flip over for the tenth of a second it lasts.
      let ax = gx;
      let ay = gy;
      let az = gz;
      if (this.kickTime > 0) {
        ax += this.kickX;
        ay += this.kickY;
        az += this.kickZ;
        this.kickTime -= h;
      }
      this.applyGravity(h, ax, ay, az);
      if (s === 0 || this.listStale()) this.findContacts(gdx, gdy, gdz);
      else this.refreshGaps();
      this.solveVelocity(h);
      this.shockPass(h);
      this.integrate(h);
      this.solvePosition();
    }
    this.updateShading(dtFrame);
  }

  applyGravity(h, gx, gy, gz) {
    const n = this.n;
    const { vx, vy, vz } = this;
    const damp = Math.exp(-CONFIG.sim.airDrag * h);
    const dvx = gx * h;
    const dvy = gy * h;
    const dvz = gz * h;
    for (let i = 0; i < n; i++) {
      vx[i] = (vx[i] + dvx) * damp;
      vy[i] = (vy[i] + dvy) * damp;
      vz[i] = (vz[i] + dvz) * damp;
    }
  }

  /**
   * Impulse memory for warm starting, as an open-addressed hash keyed by the
   * contact pair. Rebuilding the contact list shuffles indices, so carrying
   * impulses forward needs identity, not position in an array.
   */
  ensureHash(cap) {
    let size = 1024;
    while (size < cap * 2) size <<= 1;
    if (this.hashSize >= size) return;
    this.hashSize = size;
    this.hashMask = size - 1;
    this.hKeyI = new Int32Array(size);
    this.hKeyJ = new Int32Array(size);
    this.hJn = new Float32Array(size);
    this.hFx = new Float32Array(size);
    this.hFy = new Float32Array(size);
    this.hFz = new Float32Array(size);
    this.hKeyI.fill(-1);
  }

  /** Slot for this pair: either its existing entry or the first free one. */
  hashSlot(i, j) {
    const mask = this.hashMask;
    const keyI = this.hKeyI;
    const keyJ = this.hKeyJ;
    let h = (Math.imul(i, 73856093) ^ Math.imul(j + 8, 19349663)) & mask;
    for (let probe = 0; probe < 24; probe++) {
      const k = keyI[h];
      if (k === -1 || (k === i && keyJ[h] === j)) return h;
      h = (h + 1) & mask;
    }
    return -1; // crowded: this contact just starts cold, which is harmless
  }

  /** Park the current frame's impulses before the contact list is rebuilt. */
  stashImpulses() {
    const cnt = this.contactCount;
    if (cnt === 0) return;
    const { ci, cj, cjn, cfx, cfy, cfz, hKeyI, hKeyJ, hJn, hFx, hFy, hFz } = this;
    hKeyI.fill(-1);
    for (let c = 0; c < cnt; c++) {
      const jn = cjn[c];
      if (jn <= 0) continue; // nothing worth remembering
      const i = ci[c];
      const j = cj[c];
      const slot = this.hashSlot(i, j);
      if (slot < 0) continue;
      hKeyI[slot] = i;
      hKeyJ[slot] = j;
      hJn[slot] = jn;
      hFx[slot] = cfx[c];
      hFy[slot] = cfy[c];
      hFz[slot] = cfz[c];
    }
  }

  /** Give each contact in the fresh list whatever it was carrying before. */
  restoreImpulses() {
    const cnt = this.contactCount;
    const { ci, cj, cjn, cfx, cfy, cfz, hKeyI, hKeyJ, hJn, hFx, hFy, hFz } = this;
    let hits = 0;
    for (let c = 0; c < cnt; c++) {
      const i = ci[c];
      const j = cj[c];
      const slot = this.hashSlot(i, j);
      if (slot >= 0 && hKeyI[slot] === i && hKeyJ[slot] === j) {
        cjn[c] = hJn[slot];
        cfx[c] = hFx[slot];
        cfy[c] = hFy[slot];
        cfz[c] = hFz[slot];
        hits++;
      } else {
        cjn[c] = 0;
        cfx[c] = 0;
        cfy[c] = 0;
        cfz[c] = 0;
      }
    }
    this.warmHits = hits;
  }

  /**
   * Collect contacts, deepest-first along gravity, and harvest the shading
   * terms from the same neighbour scan (they are free here: the distances are
   * already computed).
   */
  findContacts(gdx, gdy, gdz) {
    const n = this.n;
    const grid = this.grid;
    grid.build(this.x, this.y, this.z, n);
    const order = grid.orderByGravity(gdx, gdy, gdz, n);
    const rank = this.rank;
    for (let k = 0; k < n; k++) rank[order[k]] = k;

    this.stashImpulses();
    this.ensureContactCapacity(n * 10);

    const { x, y, z, rad, contacts, cover, light, litAbove } = this;
    const { ci, cj, cnx, cny, cnz, cgap, crest } = this;
    const cols = grid.cols, rows = grid.rows, slabs = grid.slabs;
    const layer = cols * rows;
    const start = grid.cellStart;
    const cellOrder = grid.order;
    const cellOf = grid.cellOf;
    const D = this.diameter;
    const skinD = CONFIG.sim.skin * D;
    // The list is built with a skin so it outlives several substeps; whether a
    // pair is actually active is decided per substep in refreshGaps(). Scan
    // radius covers the largest possible pair plus skin, and the shading reach.
    const RS = Math.max(D * (1 + CONFIG.grain.polydispersity) + skinD, D * CONFIG.sim.shadeRadius);
    const RS2 = RS * RS;
    const DS2 = (D * CONFIG.sim.shadeRadius) ** 2;
    const B = this.bounds;
    const cap = this.contactCapacity;

    contacts.fill(0, 0, n);
    cover.fill(0, 0, n);
    litAbove.fill(0, 0, n);

    let c = 0;
    for (let k = 0; k < n; k++) {
      const i = order[k];
      const xi = x[i], yi = y[i], zi = z[i];
      const ri = rad[i];

      // Walls first: they are the ultimate support, so solving them ahead of
      // this grain's neighbours is what a deepest-first sweep wants. Gaps are
      // measured against the outer box minus this grain's own radius.
      // Speculative: a grain resting exactly ON a wall has zero penetration, so
      // a strict "is it past the plane" test finds nothing and the floor
      // silently stops supporting the bed. Catch them a margin early instead
      // and let the solver limit approach speed to the remaining gap.
      if (c + 6 <= cap) {
        let gap = xi - B.x0 - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -1; cnx[c] = -1; cny[c] = 0; cnz[c] = 0; cgap[c] = gap; crest[c] = ri; c++; }
        gap = B.x1 - xi - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -2; cnx[c] = 1; cny[c] = 0; cnz[c] = 0; cgap[c] = gap; crest[c] = ri; c++; }
        gap = yi - B.y0 - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -3; cnx[c] = 0; cny[c] = -1; cnz[c] = 0; cgap[c] = gap; crest[c] = ri; c++; }
        gap = B.y1 - yi - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -4; cnx[c] = 0; cny[c] = 1; cnz[c] = 0; cgap[c] = gap; crest[c] = ri; c++; }
        gap = zi - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -5; cnx[c] = 0; cny[c] = 0; cnz[c] = -1; cgap[c] = gap; crest[c] = ri; c++; }
        gap = this.depth - zi - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -6; cnx[c] = 0; cny[c] = 0; cnz[c] = 1; cgap[c] = gap; crest[c] = ri; c++; }
      }

      const cell = cellOf[i];
      const cz = (cell / layer) | 0;
      const rest = cell - cz * layer;
      const cy = (rest / cols) | 0;
      const cx = rest - cy * cols;
      const x0 = cx > 0 ? cx - 1 : 0, x1 = cx < cols - 1 ? cx + 1 : cols - 1;
      const y0 = cy > 0 ? cy - 1 : 0, y1 = cy < rows - 1 ? cy + 1 : rows - 1;
      const z0 = cz > 0 ? cz - 1 : 0, z1 = cz < slabs - 1 ? cz + 1 : slabs - 1;

      for (let rz = z0; rz <= z1; rz++) {
        const zb = rz * layer;
        for (let ry = y0; ry <= y1; ry++) {
          const yb = zb + ry * cols;
          for (let rx = x0; rx <= x1; rx++) {
            const cc = yb + rx;
            const e = start[cc + 1];
            for (let s = start[cc]; s < e; s++) {
              const j = cellOrder[s];
              // Each pair once, owned by whichever grain is deeper.
              if (rank[j] <= k) continue;
              const dx = x[j] - xi;
              const dy = y[j] - yi;
              const dz = z[j] - zi;
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 >= RS2) continue;

              const dist = Math.sqrt(d2);
              let nx, ny, nz;
              if (dist > 1e-6) {
                const inv = 1 / dist;
                nx = dx * inv; ny = dy * inv; nz = dz * inv;
              } else {
                // Exactly coincident: pick a deterministic direction rather
                // than skipping, which would weld the pair together forever.
                const a = i * 2.3999632;
                nx = Math.cos(a) * 0.94; ny = Math.sin(a) * 0.94; nz = 0.34;
              }

              // Shading: neighbour count, how much of the load sits on the
              // anti-gravity side, and the brightest neighbour up there.
              if (d2 < DS2) {
                contacts[i]++;
                contacts[j]++;
                const w = nx * gdx + ny * gdy + nz * gdz;
                if (w < 0) {
                  cover[i] -= w;
                  const lj = light[j];
                  if (lj > litAbove[i]) litAbove[i] = lj;
                } else {
                  cover[j] += w;
                  const li = light[i];
                  if (li > litAbove[j]) litAbove[j] = li;
                }
              }

              const sumR = ri + rad[j];
              if (dist >= sumR + skinD || c >= cap) continue;
              ci[c] = i;
              cj[c] = j;
              cnx[c] = nx; cny[c] = ny; cnz[c] = nz;
              cgap[c] = dist - sumR;
              crest[c] = sumR;
              c++;
            }
          }
        }
      }
    }
    this.contactCount = c;
    this.restoreImpulses();
    this.refX.set(this.x.subarray(0, n));
    this.refY.set(this.y.subarray(0, n));
    this.refZ.set(this.z.subarray(0, n));
    this.refreshGaps();
  }

  /**
   * Has anything moved far enough that the list might have missed a new pair?
   * The list is built with a skin, so it stays valid until some grain has
   * travelled half of it.
   */
  listStale() {
    const n = this.n;
    const { x, y, z, refX, refY, refZ } = this;
    const limit = CONFIG.sim.skin * this.diameter * 0.5;
    const limit2 = limit * limit;
    for (let i = 0; i < n; i++) {
      const dx = x[i] - refX[i], dy = y[i] - refY[i], dz = z[i] - refZ[i];
      if (dx * dx + dy * dy + dz * dz > limit2) return true;
    }
    return false;
  }

  /**
   * Re-measure every listed pair against current positions and collect the ones
   * close enough to matter. The list itself is built at most once per frame —
   * finding pairs costs far more than solving them, so re-using it across
   * substeps is the difference between a bed that runs and one that does not.
   */
  refreshGaps() {
    const cnt = this.contactCount;
    const { ci, cj, cnx, cny, cnz, cgap, crest, cjn, cfx, cfy, cfz, active, x, y, z, rad } = this;
    const B = this.bounds;
    const depth = this.depth;
    const margin = CONFIG.sim.contactMargin * this.diameter;
    let a = 0;
    for (let c = 0; c < cnt; c++) {
      const i = ci[c];
      const j = cj[c];
      if (j >= 0) {
        const dx = x[j] - x[i], dy = y[j] - y[i], dz = z[j] - z[i];
        const d2 = dx * dx + dy * dy + dz * dz;
        const rc = crest[c] + margin;
        if (d2 >= rc * rc) { cjn[c] = 0; cfx[c] = 0; cfy[c] = 0; cfz[c] = 0; continue; }
        const dist = Math.sqrt(d2);
        if (dist > 1e-6) {
          const inv = 1 / dist;
          cnx[c] = dx * inv; cny[c] = dy * inv; cnz[c] = dz * inv;
        }
        cgap[c] = dist - crest[c];
      } else {
        const nx = cnx[c], ny = cny[c], nz = cnz[c];
        const ri = rad[i];
        let gap;
        if (nx < 0) gap = x[i] - B.x0 - ri;
        else if (nx > 0) gap = B.x1 - x[i] - ri;
        else if (ny < 0) gap = y[i] - B.y0 - ri;
        else if (ny > 0) gap = B.y1 - y[i] - ri;
        else if (nz < 0) gap = z[i] - ri;
        else gap = depth - z[i] - ri;
        if (gap >= margin) { cjn[c] = 0; cfx[c] = 0; cfy[c] = 0; cfz[c] = 0; continue; }
        cgap[c] = gap;
      }
      active[a++] = c;
    }
    this.activeCount = a;
  }

  /**
   * Velocity pass: Gauss-Seidel impulses. Non-penetration first, then Coulomb
   * friction capped by mu times the normal impulse on that contact.
   *
   * Both are **warm started** — each contact begins the step by re-applying the
   * impulse it settled on last time, and iterates from there. This is what makes
   * a deep bed genuinely quiet. Starting every step from zero, the solver has to
   * rediscover the entire weight of the pile within its iteration budget, always
   * falls a little short, and the bed sinks a fraction, gets pushed back out,
   * and sinks again — a permanent low simmer no amount of damping removes.
   * Beginning from the previous answer means it starts converged and stays there.
   *
   * Friction accumulates as a vector and is clamped as a whole (rather than
   * clamping each increment), which is what gives true static friction: inside
