  float alpha = mask * mix(uAlphaMin, 1.0, body);
  alpha = clamp(alpha + spec + foam * 0.6, 0.0, 1.0);

  gl_FragColor = vec4(color, alpha);
}
`;

// ---- src/renderer.js ----
// WebGL renderer. Prefers a WebGL2 context but every shader is ES 1.00, so a
// WebGL1 fallback is identical in output.
//
// Both materials are drawn as a *field* rather than as particles: each pass
// accumulates soft blobs into an offscreen buffer and a full-screen composite
// turns that field into a surface. Water needs it because a liquid has no
// visible particles; sand needs it because the physics grain is ten times the
// size of a grain of sand, and drawing it as anything at all makes gravel. Sand
// then adds a pass of tiny speck particles on top for the grain texture. See
// src/shaders.js for the reasoning.

// One line: tools/bundle.py resolves imports by matching single-line statements.

const FLOATS_PER_GRAIN = 8; // x,y,z | light, speed, loose | sizeJitter, airborne
const STRIDE = FLOATS_PER_GRAIN * 4;
const FLOATS_PER_SPECK = 9; // x,y,z | light, tone, size, phase | speed, airborne
const SPECK_STRIDE = FLOATS_PER_SPECK * 4;
const FLOATS_PER_DROP = 5; // x, y, z, speed, weight
const DROP_STRIDE = FLOATS_PER_DROP * 4;

// Speck layouts are drawn from a fixed table rather than hashed per frame:
// SPECK_SEEDS layouts of speckMax specks each, indexed by a per-grain random.
// Plenty of variety, and the pack loop stays a handful of multiplies per speck.
const SPECK_SEEDS = 256;
const SPECK_FIELDS = 5; // ox, oy, tone, size, phase

class Renderer {
  /**
   * @param {boolean} preserve Keep the drawing buffer after presentation. Off
   *   by default (it costs a copy on some drivers); on it makes screenshots and
   *   canvas.toDataURL() reliable instead of returning whatever survived the
   *   last buffer swap.
   */
  constructor(canvas, capacity, preserve = false) {
    this.canvas = canvas;
    this.capacity = capacity;
    this.cpu = new Float32Array(capacity * FLOATS_PER_GRAIN);
    this.width = 1;
    this.height = 1;
    this.dpr = 1;
    // Parallax offset for the projection eye, in CSS px; set from the tilt.
    this.eyeX = 0;
    this.eyeY = 0;
    // Adaptive quality, mirrored from the tuner each frame. Only the speck
    // pass reads it — see speckCountFor.
    this.quality = 1;
    this.t0 = performance.now();
    // 5 quads (four interior walls + back plane), 6 vertices each, xyz + shade.
    this.wallData = new Float32Array(5 * 6 * 4);
    this.wallKey = '';
    this.contextLost = false;

    // Speck buffer grows on demand: count depends on grain size.
    this.speckCpu = new Float32Array(0);
    this.speckTable = buildSpeckTable();
    this.specksPerGrain = 0;
    this.speckCount = 0;

    // Offscreen field shared by both materials, at reduced size.
    this.fieldTex = null;
    this.fieldFbo = null;
    this.fieldW = 0;
    this.fieldH = 0;

    // Water pass: its own interleaved buffer. Sized at 3x the particle count
    // to leave room for the wall images packWater adds; a particle in a corner
    // can contribute three of them.
    this.waterCpu = new Float32Array(CONFIG.fluid.maxParticles * 3 * FLOATS_PER_DROP);
    this.waterGhosts = 0;

    const opts = {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      premultipliedAlpha: true,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: preserve,
    };
    this.gl = canvas.getContext('webgl2', opts);
    this.isWebGL2 = !!this.gl;
    if (!this.gl) this.gl = canvas.getContext('webgl', opts);
    if (!this.gl) throw new Error('WebGL is not available in this browser.');

    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      this.contextLost = true;
    });
    canvas.addEventListener('webglcontextrestored', () => {
      this.initGL();
      this.contextLost = false;
    });

    this.initGL();
  }

  get backend() {
    return this.isWebGL2 ? 'webgl2' : 'webgl1';
  }

  initGL() {
    const gl = this.gl;

    // Wall program: its own tiny pipeline, sharing the projection maths.
    this.wallProgram = buildProgram(gl, WALL_VERTEX_SHADER, WALL_FRAGMENT_SHADER);
    this.wallAttrib = {
      pos: gl.getAttribLocation(this.wallProgram, 'aPos'),
      shade: gl.getAttribLocation(this.wallProgram, 'aShade'),
    };
    this.wallUniform = {
      viewport: gl.getUniformLocation(this.wallProgram, 'uViewport'),
      focal: gl.getUniformLocation(this.wallProgram, 'uFocal'),
      eye: gl.getUniformLocation(this.wallProgram, 'uEye'),
      color: gl.getUniformLocation(this.wallProgram, 'uWallColor'),
    };
    this.wallBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.wallBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.wallData.byteLength, gl.DYNAMIC_DRAW);
    this.wallKey = '';

    // One oversized triangle rather than a quad for the composites: same
    // coverage, no seam down the diagonal, one fewer vertex.
    this.quadBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quadBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

    const bg = CONFIG.render.background;
    gl.clearColor(bg[0], bg[1], bg[2], 1);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);

    this.fieldTex = null;
    this.fieldFbo = null;
    this.fieldW = 0;
    this.fieldH = 0;

    this.setupSandPrograms();
    this.setupWaterPrograms();
  }

  setupSandPrograms() {
    const gl = this.gl;

    this.buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.cpu.byteLength, gl.DYNAMIC_DRAW);

    this.sandFieldProgram = buildProgram(gl, SAND_FIELD_VERTEX, SAND_FIELD_FRAGMENT);
    this.sandFieldAttrib = {
      pos: gl.getAttribLocation(this.sandFieldProgram, 'aPos'),
      shade: gl.getAttribLocation(this.sandFieldProgram, 'aShade'),
      jitter: gl.getAttribLocation(this.sandFieldProgram, 'aJitter'),
    };
    this.sandFieldUniform = uniforms(gl, this.sandFieldProgram, [
      'uViewport', 'uFocal', 'uEye', 'uPointSize', 'uDepthRange',
      'uLooseShrink', 'uBlob', 'uThreshold', 'uBulkSize', 'uAloneSize', 'uSoloSize',
      'uAirPow', 'uAirLight',
    ]);

    this.sandCompositeProgram = buildProgram(gl, SAND_COMPOSITE_VERTEX, SAND_COMPOSITE_FRAGMENT);
    this.sandCompositeAttrib = { corner: gl.getAttribLocation(this.sandCompositeProgram, 'aCorner') };
    this.sandCompositeUniform = uniforms(gl, this.sandCompositeProgram, [
      'uField', 'uTexel', 'uDpr', 'uDeep', 'uMid', 'uLit', 'uSurface', 'uSoft', 'uDither', 'uDitherPx',
      'uRelief', 'uForm', 'uFormRadius', 'uEdgeRadius', 'uEdgeSmooth',
      'uPale', 'uPatchScale', 'uPatchAmp', 'uFog', 'uDepthDim', 'uFogStart',
    ]);

    this.speckBuffer = gl.createBuffer();
    this.speckBufferBytes = 0;
    this.speckProgram = buildProgram(gl, SPECK_VERTEX, SPECK_FRAGMENT);
    this.speckAttrib = {
      pos: gl.getAttribLocation(this.speckProgram, 'aPos'),
      data: gl.getAttribLocation(this.speckProgram, 'aData'),
      motion: gl.getAttribLocation(this.speckProgram, 'aMotion'),
    };
    this.speckUniform = uniforms(gl, this.speckProgram, [
      'uViewport', 'uFocal', 'uEye', 'uPointSize', 'uDepthRange',
      'uDeep', 'uMid', 'uLit', 'uAlpha', 'uDepthFade', 'uFog', 'uDepthDim', 'uFogStart',
      'uSpeckRelief', 'uSpeckRound', 'uGlint', 'uGlintRate', 'uTime',
      'uField', 'uInvCanvas', 'uSurface', 'uAirLight',
    ]);
  }

  setupWaterPrograms() {
    const gl = this.gl;

    this.fieldProgram = buildProgram(gl, WATER_FIELD_VERTEX, WATER_FIELD_FRAGMENT);
    this.fieldAttrib = {
      pos: gl.getAttribLocation(this.fieldProgram, 'aPos'),
      speed: gl.getAttribLocation(this.fieldProgram, 'aSpeed'),
      weight: gl.getAttribLocation(this.fieldProgram, 'aWeight'),
    };
    this.fieldUniform = {
      viewport: gl.getUniformLocation(this.fieldProgram, 'uViewport'),
      focal: gl.getUniformLocation(this.fieldProgram, 'uFocal'),
      eye: gl.getUniformLocation(this.fieldProgram, 'uEye'),
      pointSize: gl.getUniformLocation(this.fieldProgram, 'uPointSize'),
      depthRange: gl.getUniformLocation(this.fieldProgram, 'uDepthRange'),
      gain: gl.getUniformLocation(this.fieldProgram, 'uGain'),
    };
    this.waterBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.waterBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.waterCpu.byteLength, gl.DYNAMIC_DRAW);

    this.compositeProgram = buildProgram(gl, WATER_COMPOSITE_VERTEX, WATER_COMPOSITE_FRAGMENT);
    this.compositeAttrib = { corner: gl.getAttribLocation(this.compositeProgram, 'aCorner') };
    this.compositeUniform = {
      field: gl.getUniformLocation(this.compositeProgram, 'uField'),
      texel: gl.getUniformLocation(this.compositeProgram, 'uTexel'),
      shallow: gl.getUniformLocation(this.compositeProgram, 'uShallow'),
      deep: gl.getUniformLocation(this.compositeProgram, 'uDeep'),
      foamColor: gl.getUniformLocation(this.compositeProgram, 'uFoamColor'),
      surface: gl.getUniformLocation(this.compositeProgram, 'uSurface'),
      soft: gl.getUniformLocation(this.compositeProgram, 'uSoft'),
      absorb: gl.getUniformLocation(this.compositeProgram, 'uAbsorb'),
      relief: gl.getUniformLocation(this.compositeProgram, 'uRelief'),
      specular: gl.getUniformLocation(this.compositeProgram, 'uSpecular'),
      specPower: gl.getUniformLocation(this.compositeProgram, 'uSpecPower'),
      fresnel: gl.getUniformLocation(this.compositeProgram, 'uFresnel'),
      foamAmount: gl.getUniformLocation(this.compositeProgram, 'uFoamAmount'),
      foamBias: gl.getUniformLocation(this.compositeProgram, 'uFoamBias'),
      alphaMin: gl.getUniformLocation(this.compositeProgram, 'uAlphaMin'),
      opacify: gl.getUniformLocation(this.compositeProgram, 'uOpacify'),
      calmRipple: gl.getUniformLocation(this.compositeProgram, 'uCalmRipple'),
      rippleGain: gl.getUniformLocation(this.compositeProgram, 'uRippleGain'),
    };
  }

  /** Offscreen buffer the fields accumulate into, at reduced size. */
  ensureField(deviceW, deviceH, scale) {
    const w = Math.max(1, Math.round(deviceW * scale));
    const h = Math.max(1, Math.round(deviceH * scale));
    if (w === this.fieldW && h === this.fieldH && this.fieldTex) return;
    const gl = this.gl;

    if (this.fieldTex) gl.deleteTexture(this.fieldTex);
    if (this.fieldFbo) gl.deleteFramebuffer(this.fieldFbo);

    this.fieldW = w;
    this.fieldH = h;
    this.fieldTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.fieldTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    // Linear sampling is doing real work here: it is the second half of the
    // blur that turns discrete blobs into a continuous surface.
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    this.fieldFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fieldFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.fieldTex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  /**
   * Box interior: four walls running from the viewport edge (z=0) back to an
   * inset rectangle (z=depth), plus the back plane. Shaded by facing — the
   * floor catches the light, the ceiling is in shadow — and darkened toward the
   * back so each wall carries a recession gradient of its own.
   */
  buildWalls(w, h, depth) {
    const key = `${w}|${h}|${depth}`;
    if (key === this.wallKey) return;
    this.wallKey = key;

    const L = CONFIG.render.wallShade;
    const back = CONFIG.render.wallBackFalloff;
    const d = this.wallData;
    let o = 0;
    // Each quad: front-left, front-right, back-right, back-left (in its plane).
    const quad = (ax, ay, bx, by, shade) => {
      const f = shade;
      const b = shade * back;
      const v = [
        ax, ay, 0, f,
        bx, by, 0, f,
        bx, by, depth, b,
        ax, ay, 0, f,
        bx, by, depth, b,
        ax, ay, depth, b,
      ];
      for (let i = 0; i < v.length; i++) d[o++] = v[i];
    };

    quad(0, 0, w, 0, L.ceiling);   // top
    quad(w, 0, w, h, L.right);     // right
    quad(w, h, 0, h, L.floor);     // bottom
    quad(0, h, 0, 0, L.left);      // left
    // Back plane, flat at z = depth.
    const bp = L.back * back;
    const v = [
      0, 0, depth, bp,
      w, 0, depth, bp,
      w, h, depth, bp,
      0, 0, depth, bp,
      w, h, depth, bp,
      0, h, depth, bp,
    ];
    for (let i = 0; i < v.length; i++) d[o++] = v[i];

    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.wallBuffer);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, d);
  }

  drawWalls(depth, focal, eyeX, eyeY) {
    const gl = this.gl;
    this.buildWalls(this.width, this.height, depth);

    gl.useProgram(this.wallProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.wallBuffer);
    gl.enableVertexAttribArray(this.wallAttrib.pos);
    gl.enableVertexAttribArray(this.wallAttrib.shade);
    gl.vertexAttribPointer(this.wallAttrib.pos, 3, gl.FLOAT, false, 16, 0);
    gl.vertexAttribPointer(this.wallAttrib.shade, 1, gl.FLOAT, false, 16, 12);

    gl.uniform2f(this.wallUniform.viewport, this.width, this.height);
    gl.uniform1f(this.wallUniform.focal, focal);
    gl.uniform2f(this.wallUniform.eye, this.width * 0.5 + eyeX, this.height * 0.5 + eyeY);
    gl.uniform3fv(this.wallUniform.color, CONFIG.render.wallColor);
    gl.drawArrays(gl.TRIANGLES, 0, 30);

    // Leave nothing enabled behind us. Attribute arrays are global state in
    // WebGL1, so a location left on from one program points a later program's
    // draw at a stale buffer.
    gl.disableVertexAttribArray(this.wallAttrib.pos);
    gl.disableVertexAttribArray(this.wallAttrib.shade);
  }

  /** Returns true when the backing store changed size. */
  resize(cssWidth, cssHeight) {
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.render.maxDpr);
    const w = Math.max(1, Math.round(cssWidth * dpr));
    const h = Math.max(1, Math.round(cssHeight * dpr));
    this.width = cssWidth;
    this.height = cssHeight;
    this.dpr = dpr;
    if (this.canvas.width === w && this.canvas.height === h) return false;
    this.canvas.width = w;
    this.canvas.height = h;
    this.gl.viewport(0, 0, w, h);
    return true;
  }

  /**
   * One entry point for every material. The box is shared; what fills it is
   * not, so each material owns its own passes from here down.
   */
  draw(material) {
    const gl = this.gl;
    if (this.contextLost) return;

    gl.clear(gl.COLOR_BUFFER_BIT);
    const focal = CONFIG.render.focal * Math.min(this.width, this.height);
    // Box first: the contents always live inside it, so no depth test is needed.
    this.drawWalls(material.depth, focal, this.eyeX, this.eyeY);

    if (material.n === 0) return;
    // Switch on the pass a material asks for, not on which material it is:
    // every liquid takes the same one and differs only in its `look`.
    if (material.render === 'fluid') this.drawFluid(material, focal);
    else this.drawSand(material, focal);
  }

  // ------------------------------------------------------------------ sand

  /**
   * Grain data for the field pass, in sim order — the sum does not care.
   *
   * `loose` and `airborne` are both here and mean different things to the
   * shader: looseness narrows the blob (so a barely attached grain cannot be
   * bridged into a drip), while only a genuinely isolated grain gets the peak
   * that lets it clear the threshold alone. hueJitter never reaches the GPU —
   * the speck pass reads it straight from the sim.
   */
  packGrains(sand) {
    const cpu = this.cpu;
    const n = Math.min(sand.n, this.capacity);
    const { x, y, z, light, speed01, loose, airborne, sizeJitter } = sand;
    for (let i = 0; i < n; i++) {
      const o = i * FLOATS_PER_GRAIN;
      cpu[o] = x[i];
      cpu[o + 1] = y[i];
      cpu[o + 2] = z[i];
      cpu[o + 3] = light[i];
      cpu[o + 4] = speed01[i];
      cpu[o + 5] = loose[i];
      cpu[o + 6] = sizeJitter[i];
      cpu[o + 7] = airborne[i];
    }
    return n;
  }

  /**
   * Specks per grain follows from grain size: each grain's own specks should
   * cover a fixed fraction of its projected disc, so a coarse grain (big
   * screen, or a coarsened tuner) carries more of them and the sand keeps the
   * same fineness on screen.
   *
   * That leaves the *total* independent of grain size — it works out at
   * screen area over speck area, which is the right answer for something that
   * tiles a surface, but it also means the tuner's usual lever does nothing
   * here: coarsening grains cuts their count and raises the specks per grain
   * by exactly as much. So quality scales the coverage directly. It is the
   * one part of the look that thins out on a struggling device, and it is the
   * right one to give up — fewer specks read as slightly smoother sand, where
   * fewer grains read as less sand.
   */
  speckCountFor(radius) {
    const s = CONFIG.sand;
    const speckArea = (s.speckPx * 0.5) ** 2;
    const coverage = s.speckCoverage * Math.min(1, Math.max(s.speckMinQuality, this.quality));
    const want = coverage * (radius * radius) / Math.max(speckArea, 1e-3);
    return Math.max(1, Math.min(s.speckMax, Math.round(want)));
  }

  /**
   * Scatter each grain's specks around it. Offsets live in sim space (CSS px,
   * pre-projection) so perspective carries them with the grain exactly; the
   * layout for a grain comes from the table row picked by its own random.
   */
  packSpecks(sand) {
    const s = CONFIG.sand;
    const n = Math.min(sand.n, this.capacity);
    const per = this.speckCountFor(sand.radius);
    this.specksPerGrain = per;
    // Sand in flight is drawn by its specks alone, so it gets more of them —
    // a splash wants to read as spray, and a handful of specks spread over a
    // whole grain is a puff rather than a scatter of grains. Only genuinely
    // airborne grains pay for it, and there are a few dozen of those against
    // thousands in the bed, so the extra costs nothing measurable.
    const perAir = Math.min(s.speckMax, Math.round(per * s.speckAirMul));
    const cap = n * per + Math.min(n, 512) * (perAir - per);
    if (this.speckCpu.length < cap * FLOATS_PER_SPECK) {
      this.speckCpu = new Float32Array(Math.ceil(cap * FLOATS_PER_SPECK * 1.5));
    }
    const limit = (this.speckCpu.length / FLOATS_PER_SPECK) | 0;
    const cpu = this.speckCpu;
    const table = this.speckTable;
    const spread = s.speckSpread;
    const airSpread = s.speckAirSpread;
    const airSize = s.speckAirSize;
    const { x, y, z, light, speed01, airborne, rad, hueJitter } = sand;
    let o = 0;
    let count = 0;
    for (let i = 0; i < n; i++) {
      const xi = x[i];
      const yi = y[i];
      const zi = z[i];
      const li = light[i];
      const si = speed01[i];
      const ai = airborne[i];
      // Inside the mass the specks only have to texture a surface, so they sit
      // well within the grain. A grain in flight is drawn BY its specks, so
      // they spread to its true size — the clump has to be as big as the sand
      // it stands for or a splash turns into dust.
      const reach = rad[i] * (spread + (airSpread - spread) * ai);
      const size = 1 + (airSize - 1) * ai;
      const flying = ai > 0.02;
      const cnt = flying ? perAir : per;
      if (count + cnt > limit) break;
      let t = ((hueJitter[i] * SPECK_SEEDS) | 0) * (s.speckMax * SPECK_FIELDS);
      for (let k = 0; k < cnt; k++) {
        // The specks past the bed's own count fade in with `airborne` instead
        // of appearing the instant a grain loses its last contact — a jump in
        // COUNT cannot be blended, but a size of zero draws nothing.
        const extra = k < per ? 1 : Math.min(1, ai * 4);
        cpu[o] = xi + table[t] * reach;
        cpu[o + 1] = yi + table[t + 1] * reach;
        cpu[o + 2] = zi;
        cpu[o + 3] = li;
        cpu[o + 4] = table[t + 2];
        cpu[o + 5] = table[t + 3] * size * extra;
        cpu[o + 6] = table[t + 4];
        cpu[o + 7] = si;
        cpu[o + 8] = ai;
        o += FLOATS_PER_SPECK;
        t += SPECK_FIELDS;
        count++;
      }
    }
    this.speckCount = count;
    return count;
  }

  drawSand(sand, focal) {
    const gl = this.gl;
    const s = CONFIG.sand;
    const r = CONFIG.render;
    const deviceW = this.canvas.width;
    const deviceH = this.canvas.height;
    const eyeX = this.width * 0.5 + this.eyeX;
    const eyeY = this.height * 0.5 + this.eyeY;
    this.ensureField(deviceW, deviceH, s.fieldScale);

    // ---- pass 1: coverage field, offscreen, additive
    const n = this.packGrains(sand);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fieldFbo);
    gl.viewport(0, 0, this.fieldW, this.fieldH);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.blendFunc(gl.ONE, gl.ONE);

    gl.useProgram(this.sandFieldProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
    const floats = n * FLOATS_PER_GRAIN;
    if (this.isWebGL2) {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.cpu, 0, floats);
    } else {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.cpu.subarray(0, floats));
    }
    const fa = this.sandFieldAttrib;
    gl.enableVertexAttribArray(fa.pos);
    gl.enableVertexAttribArray(fa.shade);
    gl.enableVertexAttribArray(fa.jitter);
    gl.vertexAttribPointer(fa.pos, 3, gl.FLOAT, false, STRIDE, 0);
    gl.vertexAttribPointer(fa.shade, 3, gl.FLOAT, false, STRIDE, 12);
    gl.vertexAttribPointer(fa.jitter, 2, gl.FLOAT, false, STRIDE, 24);

    const fu = this.sandFieldUniform;
    gl.uniform2f(fu.uViewport, this.width, this.height);
    gl.uniform1f(fu.uFocal, focal);
    gl.uniform2f(fu.uEye, eyeX, eyeY);
    // Blob diameter in field pixels: carries the device ratio and the field's
    // own downscale.
    gl.uniform1f(fu.uPointSize, sand.diameter * s.blob * this.dpr * s.fieldScale);
    gl.uniform1f(fu.uDepthRange, sand.depth);
    gl.uniform1f(fu.uLooseShrink, s.looseShrink);
    gl.uniform1f(fu.uBlob, s.blob);
    // Worst case of the dithered threshold, so a grain clears it wherever the
    // noise happens to land rather than flickering along with it.
    gl.uniform1f(fu.uThreshold, s.surface + s.dither * 0.5);
    gl.uniform1f(fu.uBulkSize, s.bulkSize);
    gl.uniform1f(fu.uAloneSize, s.aloneSize);
    gl.uniform1f(fu.uSoloSize, s.soloSize);
    gl.uniform1f(fu.uAirPow, s.airPow);
    gl.uniform1f(fu.uAirLight, s.airLight);
    gl.drawArrays(gl.POINTS, 0, n);
    gl.disableVertexAttribArray(fa.pos);
    gl.disableVertexAttribArray(fa.shade);
    gl.disableVertexAttribArray(fa.jitter);

    // ---- pass 2: the mass, composited over the box
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, deviceW, deviceH);
    const bg = r.background;
    gl.clearColor(bg[0], bg[1], bg[2], 1);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.useProgram(this.sandCompositeProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quadBuffer);
    gl.enableVertexAttribArray(this.sandCompositeAttrib.corner);
    gl.vertexAttribPointer(this.sandCompositeAttrib.corner, 2, gl.FLOAT, false, 0, 0);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.fieldTex);
    const cu = this.sandCompositeUniform;
    gl.uniform1i(cu.uField, 0);
    gl.uniform2f(cu.uTexel, 1 / this.fieldW, 1 / this.fieldH);
    gl.uniform1f(cu.uDpr, this.dpr);
    gl.uniform3fv(cu.uDeep, r.deep);
    gl.uniform3fv(cu.uMid, r.mid);
    gl.uniform3fv(cu.uLit, r.lit);
    gl.uniform1f(cu.uSurface, s.surface);
    gl.uniform1f(cu.uSoft, s.soft);
    gl.uniform1f(cu.uDither, s.dither);
    gl.uniform1f(cu.uDitherPx, s.ditherPx);
    gl.uniform1f(cu.uRelief, s.relief);
    gl.uniform1f(cu.uForm, s.form);
    gl.uniform1f(cu.uPale, s.pale);
    gl.uniform1f(cu.uPatchScale, s.patchScale);
    gl.uniform1f(cu.uPatchAmp, s.patchAmp);
    // Both of these are distances, and the distance that matters is measured
    // in GRAINS, not in pixels. Set in field texels they came out at 0.7 and
    // 0.3 grain diameters — the form gradient was sampling *within* a grain,
    // so it embossed individual grains into the mass as clumps, which is the
    // opposite of what it is for, and the silhouette low-pass was too narrow
    // to touch the grain-scale lumps it exists to remove. Both were wrong by a
    // different factor on every viewport and device ratio, which is exactly
    // what a screen-space unit buys you here.
    const grainInField = sand.diameter * this.dpr * s.fieldScale;
    gl.uniform1f(cu.uFormRadius, s.formGrains * grainInField);
    gl.uniform1f(cu.uEdgeRadius, s.edgeGrains * grainInField);
    gl.uniform1f(cu.uEdgeSmooth, s.edgeSmooth);
    gl.uniform3fv(cu.uFog, r.fog);
    gl.uniform1f(cu.uDepthDim, r.depthDim);
    gl.uniform1f(cu.uFogStart, r.fogStart);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disableVertexAttribArray(this.sandCompositeAttrib.corner);

    // ---- pass 3: specks — the grain of the sand
    const total = this.packSpecks(sand);
    if (total === 0) return;
    gl.useProgram(this.speckProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.speckBuffer);
    const bytes = total * SPECK_STRIDE;
    if (bytes > this.speckBufferBytes) {
      this.speckBufferBytes = Math.ceil(bytes * 1.5);
      gl.bufferData(gl.ARRAY_BUFFER, this.speckBufferBytes, gl.DYNAMIC_DRAW);
    }
    const sfloats = total * FLOATS_PER_SPECK;
    if (this.isWebGL2) {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.speckCpu, 0, sfloats);
    } else {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.speckCpu.subarray(0, sfloats));
    }
    const sa = this.speckAttrib;
    gl.enableVertexAttribArray(sa.pos);
    gl.enableVertexAttribArray(sa.data);
    gl.enableVertexAttribArray(sa.motion);
    gl.vertexAttribPointer(sa.pos, 3, gl.FLOAT, false, SPECK_STRIDE, 0);
    gl.vertexAttribPointer(sa.data, 4, gl.FLOAT, false, SPECK_STRIDE, 12);
    gl.vertexAttribPointer(sa.motion, 2, gl.FLOAT, false, SPECK_STRIDE, 28);

    const su = this.speckUniform;
    gl.uniform2f(su.uViewport, this.width, this.height);
    gl.uniform1f(su.uFocal, focal);
    gl.uniform2f(su.uEye, eyeX, eyeY);
    gl.uniform1f(su.uPointSize, s.speckPx * this.dpr);
    gl.uniform1f(su.uDepthRange, sand.depth);
    gl.uniform3fv(su.uDeep, r.deep);
    gl.uniform3fv(su.uMid, r.mid);
    gl.uniform3fv(su.uLit, r.lit);
    gl.uniform1f(su.uAlpha, s.speckAlpha);
    gl.uniform1f(su.uDepthFade, s.speckDepthFade);
    gl.uniform3fv(su.uFog, r.fog);
    gl.uniform1f(su.uDepthDim, r.depthDim);
    gl.uniform1f(su.uFogStart, r.fogStart);
    gl.uniform1f(su.uSpeckRelief, s.speckRelief);
    gl.uniform1f(su.uSpeckRound, s.speckRound);
    gl.uniform1f(su.uGlint, s.glintStrength);
    gl.uniform1f(su.uGlintRate, s.glintRate);
    gl.uniform1f(su.uTime, (performance.now() - this.t0) * 0.001);
    // The field is still bound to unit 0 from the composite.
    gl.uniform1i(su.uField, 0);
    gl.uniform2f(su.uInvCanvas, 1 / deviceW, 1 / deviceH);
    gl.uniform1f(su.uSurface, s.surface);
    gl.uniform1f(su.uAirLight, s.airLight);
    gl.drawArrays(gl.POINTS, 0, total);
    gl.disableVertexAttribArray(sa.pos);
    gl.disableVertexAttribArray(sa.data);
    gl.disableVertexAttribArray(sa.motion);
  }

  // ----------------------------------------------------------------- water

  /**
   * Pack the water into the field buffer, mirroring anything close to the
   * glass back across it.
   *
   * Without this the water visibly shrinks away from its container: a blob
   * reaching past the wall spends half its mass outside the box, so the
   * thickness field sags to roughly half strength within one blob radius of
   * every wall, drops under the surface threshold, and the level set retreats.
   * The result reads as a slab of jelly sitting in the middle of the tank
   * rather than water filling it — pale margins down both sides and rounded-off
   * corners.
   *
   * It is the same half-space truncation the solver hits (see Fluid.solveDensity),
   * on a different field, and it takes the same answer: method of images. A
   * mirrored particle contributes exactly what the water on the far side would
   * have, so the gradient across the wall goes to zero and the field stays flat
   * right up to the glass. Reflecting in *sim* space rather than screen space
   * means perspective carries the ghosts to the right place on its own — which
   * matters here, because the box walls converge with depth and are not a fixed
   * line on screen.
   *
   * Only the four lateral walls get ghosts. Depth needs none: thickness is the
   * count of particles along a view ray, and that ray genuinely does end at the
   * front and back glass — nothing is missing to add back.
   *
   * Each image is weighted by how buried the particle it mirrors is, which is
   * what stops the correction overreaching. An image asserts "there is matching
   * water on the far side of this wall" — true for bulk filling the tank, false
   * for the thin film left clinging to the glass after a wave drains down it.
   * Applied flat it thickened near-wall water by 1.8x and drew those films as
   * solid rounded pillars standing against the glass, which is not something
   * water does.
   *
   * The weight is raw neighbour count, deliberately not density. Density cannot
   * tell the two apart and never will: an incompressible solver drives it to
   * rest density *everywhere* it can, and measured, film and bulk-at-wall both
   * sit at about 1.1. Neighbour count is geometry rather than a solved
   * quantity, and it separates them cleanly — median 14 in a film against 26
   * for bulk against the same wall.
   */
  packWater(fluid, w) {
    const cpu = this.waterCpu;
    const limit = (cpu.length / FLOATS_PER_DROP) | 0;
    const n = Math.min(fluid.n, fluid.capacity);
    const { x, y, z, speed01, nbrCount } = fluid;
    const wallX = fluid.bounds.x1;
    const wallY = fluid.bounds.y1;
    // A ghost only matters while its blob still overlaps the box.
    const reach = fluid.diameter * w.blobSize * 0.5;
    const floor = w.imageFloor;
    const lo = w.imageBuriedLo;
    const span = Math.max(1, w.imageBuriedHi - lo);

    let count = 0;
    const put = (px, py, pz, sp, weight) => {
      if (count >= limit) return;
      const o = count * FLOATS_PER_DROP;
      cpu[o] = px;
      cpu[o + 1] = py;
      cpu[o + 2] = pz;
      cpu[o + 3] = sp;
      cpu[o + 4] = weight;
      count++;
    };

    for (let i = 0; i < n; i++) {
      const xi = x[i];
      const yi = y[i];
      const zi = z[i];
      const si = speed01[i];
      put(xi, yi, zi, si, 1);

      const left = xi < reach;
      const right = wallX - xi < reach;
      const above = yi < reach;
      const below = wallY - yi < reach;
      if (!left && !right && !above && !below) continue;

      // How much of an image this particle has earned.
      let solid = nbrCount ? (nbrCount[i] - lo) / span : 1;
      if (solid > 1) solid = 1;
      else if (solid < floor) solid = floor;

      const mx = left ? -xi : 2 * wallX - xi;
      const my = above ? -yi : 2 * wallY - yi;
      if (left || right) put(mx, yi, zi, si, solid);
      if (above || below) put(xi, my, zi, si, solid);
      // Corners lose a quadrant, not just a half-space, so they need the
      // diagonal image too or they stay pinched.
      if ((left || right) && (above || below)) put(mx, my, zi, si, solid);
    }
    this.waterGhosts = count - n;
    return count;
  }

  drawFluid(fluid, focal) {
    const gl = this.gl;
    // The liquid's own palette, not water's — this pass draws honey too.
    const w = fluid.look;
    const deviceW = this.canvas.width;
    const deviceH = this.canvas.height;
    this.ensureField(deviceW, deviceH, w.fieldScale);

    const n = this.packWater(fluid, w);
    const cpu = this.waterCpu;

    // ---- pass 1: accumulate thickness offscreen
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fieldFbo);
    gl.viewport(0, 0, this.fieldW, this.fieldH);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.blendFunc(gl.ONE, gl.ONE);

    gl.useProgram(this.fieldProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.waterBuffer);
    const floats = n * FLOATS_PER_DROP;
    if (this.isWebGL2) {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, cpu, 0, floats);
    } else {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, cpu.subarray(0, floats));
    }
    gl.enableVertexAttribArray(this.fieldAttrib.pos);
    gl.enableVertexAttribArray(this.fieldAttrib.speed);
    gl.enableVertexAttribArray(this.fieldAttrib.weight);
    gl.vertexAttribPointer(this.fieldAttrib.pos, 3, gl.FLOAT, false, DROP_STRIDE, 0);
    gl.vertexAttribPointer(this.fieldAttrib.speed, 1, gl.FLOAT, false, DROP_STRIDE, 12);
    gl.vertexAttribPointer(this.fieldAttrib.weight, 1, gl.FLOAT, false, DROP_STRIDE, 16);

    gl.uniform2f(this.fieldUniform.viewport, this.width, this.height);
    gl.uniform1f(this.fieldUniform.focal, focal);
    gl.uniform2f(this.fieldUniform.eye, this.width * 0.5 + this.eyeX, this.height * 0.5 + this.eyeY);
    gl.uniform1f(this.fieldUniform.depthRange, fluid.depth);
    gl.uniform1f(this.fieldUniform.gain, w.gain);
    // Sprite size is in field pixels, so it carries both the device ratio and
    // the field's own downscale.
    gl.uniform1f(
      this.fieldUniform.pointSize,
      fluid.diameter * w.blobSize * this.dpr * w.fieldScale,
    );
    // The field is shared with the sand pass and sized on whoever drew last.
    gl.drawArrays(gl.POINTS, 0, n);
    gl.disableVertexAttribArray(this.fieldAttrib.pos);
    gl.disableVertexAttribArray(this.fieldAttrib.speed);
    gl.disableVertexAttribArray(this.fieldAttrib.weight);

    // ---- pass 2: shade the field as a surface, over the box
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, deviceW, deviceH);
    const bg = CONFIG.render.background;
    gl.clearColor(bg[0], bg[1], bg[2], 1);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    gl.useProgram(this.compositeProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quadBuffer);
    gl.enableVertexAttribArray(this.compositeAttrib.corner);
    gl.vertexAttribPointer(this.compositeAttrib.corner, 2, gl.FLOAT, false, 0, 0);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.fieldTex);
    gl.uniform1i(this.compositeUniform.field, 0);
    gl.uniform2f(this.compositeUniform.texel, 1 / this.fieldW, 1 / this.fieldH);
    gl.uniform3fv(this.compositeUniform.shallow, w.shallow);
    gl.uniform3fv(this.compositeUniform.deep, w.deep);
    gl.uniform3fv(this.compositeUniform.foamColor, w.foam);
    gl.uniform1f(this.compositeUniform.surface, w.surface);
    gl.uniform1f(this.compositeUniform.soft, w.soft);
    gl.uniform1f(this.compositeUniform.absorb, w.absorb);
    gl.uniform1f(this.compositeUniform.relief, w.relief);
    gl.uniform1f(this.compositeUniform.specular, w.specular);
    gl.uniform1f(this.compositeUniform.specPower, w.specPower);
    gl.uniform1f(this.compositeUniform.fresnel, w.fresnel);
    gl.uniform1f(this.compositeUniform.foamAmount, w.foamAmount);
    gl.uniform1f(this.compositeUniform.foamBias, w.foamBias);
    gl.uniform1f(this.compositeUniform.alphaMin, w.alphaMin);
    gl.uniform1f(this.compositeUniform.opacify, w.opacify);
    gl.uniform1f(this.compositeUniform.calmRipple, w.calmRipple);
    gl.uniform1f(this.compositeUniform.rippleGain, w.rippleGain);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disableVertexAttribArray(this.compositeAttrib.corner);
  }
}

/**
 * The speck layout table: SPECK_SEEDS rows of speckMax specks, each with an
 * offset inside the unit disc, a tone (mineral class), a size ratio and a
 * glint phase. Deterministic, so a reload lays the same specks on the same
 * grains.
 */
function buildSpeckTable() {
  const s = CONFIG.sand;
  const rand = makeRandom(0x5eed);
  const table = new Float32Array(SPECK_SEEDS * s.speckMax * SPECK_FIELDS);
  let o = 0;
  for (let row = 0; row < SPECK_SEEDS; row++) {
    for (let k = 0; k < s.speckMax; k++) {
      // Uniform over the disc.
      const a = rand() * Math.PI * 2;
      const rr = Math.sqrt(rand());
      table[o] = Math.cos(a) * rr;
      table[o + 1] = Math.sin(a) * rr;
      const h = rand();
      let tone;
      if (h < s.speckDark) tone = s.speckDarkTone;
      else if (h > 1 - s.speckBright) tone = s.speckBrightTone;
      else tone = 1 - s.speckVary + 2 * s.speckVary * rand();
      table[o + 2] = tone;
      table[o + 3] = 0.75 + 0.5 * rand();
      table[o + 4] = rand();
      o += SPECK_FIELDS;
    }
  }
  return table;
}

function uniforms(gl, program, names) {
  const out = {};
  for (const name of names) out[name] = gl.getUniformLocation(program, name);
  return out;
}

function buildProgram(gl, vsSource, fsSource) {
  const vs = compile(gl, gl.VERTEX_SHADER, vsSource);
  const fs = compile(gl, gl.FRAGMENT_SHADER, fsSource);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error('Shader link failed: ' + gl.getProgramInfoLog(program));
  }
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  return program;
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error('Shader compile failed: ' + gl.getShaderInfoLog(shader));
  }
  return shader;
}

// ---- src/gravity.js ----
// Where "down" is — a 3D vector, since the box has depth, and one whose
// magnitude matters as much as its direction.
//
// Phone: the accelerometer's whole vector, because a box being carried is a
// non-inertial frame. Its contents feel gravity *plus* a pseudo-force opposing
// however the box is being accelerated, which is precisely what
// accelerationIncludingGravity reads. Orientation alone would give only the
// direction of down, so a flick would rotate gravity smoothly and the sand
// would slide over and stop dead — no slosh. deviceorientation is still read,
// as the fallback and to calibrate the accelerometer's sign (iOS and Android
// disagree about it, and guessing wrong inverts every push).
//
// Desktop / no sensors: arrow keys, WASD, or the on-screen stick, with a fixed
// into-screen bias so the bed leans against the back wall and reads as 3D.
//
// Deriving gravity from beta/gamma: the device->earth rotation is
// Rz(alpha)Rx(beta)Ry(gamma), so earth-down expressed in device axes is
//   d = (sin g cos b, -sin b, -cos g cos b)
// Device +y points up the screen while CSS +y points down, and device +z points
// out of the screen while box +z points into it, so in box space
//   gx = sin(gamma) * cos(beta)
//   gy = sin(beta)
//   gz = cos(beta) * cos(gamma)
// Held upright in portrait (beta 90) that is (0,1,0): straight down the screen.
// Flat on a table it is (0,0,1): into the screen, so the sand settles against
// the back wall and spreads out — which is exactly what a real box would do.


const DEG = Math.PI / 180;

class GravityInput {
  constructor() {
    // Smoothed unit-ish vector in box space, consumed by the sim.
    this.gx = 0;
    this.gy = 1;
    // How hard gravity leans into the screen when there is no live sensor.
    // Owned by the material, not by this class: sand wants to pile against the
    // back wall because that is what makes the box read as 3D, but the same
    // lean tips a *liquid* surface, and a tilted water line is exactly the
    // thing water is not allowed to do. Set from the current material.
    this.zBias = CONFIG.input.zBias;
    this.gz = this.zBias;
    // Raw sensor readings, surfaced in the stats panel for on-device debugging.
    this.beta = 0;
    this.gamma = 0;
    this.screenAngle = 0;
    this.shakeMagnitude = 0;
    // Raw accelerometer vector (device axes) and how stale it is. This is the
    // *specific force*: gravity plus whatever the hand is doing to the box.
    this.ax = 0; this.ay = 0; this.az = 0;
    this.accelAge = 99;
    // Platform sign for accelerationIncludingGravity, worked out by comparing
    // it against the orientation-derived gravity while the device is still.
    // iOS and Android disagree, and guessing wrong inverts every push.
    this.accelSign = 0;
    this._signVotes = 0;
    this.gForce = 1;
    this.mode = 'keys';
    this.sensorActive = false;
    this.flipped = false;
    this.lastError = '';

    this.onShake = null;
    this.keys = new Set();
    this.stick = { x: 0, y: 0, active: false };
    this.demo = false;
    this.demoPhase = 0;

    this._age = 0;
    this._shakeCooldown = 0;
    this._hasOrientation = false;
    this._boundOrientation = (e) => this.handleOrientation(e);
    this._boundMotion = (e) => this.handleMotion(e);
  }

  /**
   * iOS needs requestPermission() from inside a user gesture; everyone else can
   * just subscribe. Returns true when sensor events are flowing.
   */
  async enableSensors() {
    const MotionEvent = window.DeviceMotionEvent;
    const OrientationEvent = window.DeviceOrientationEvent;
    if (!OrientationEvent && !MotionEvent) {
      this.lastError = 'No motion sensors on this device.';
      return false;
    }
    try {
      if (OrientationEvent && typeof OrientationEvent.requestPermission === 'function') {
        const state = await OrientationEvent.requestPermission();
        if (state !== 'granted') {
          this.lastError = 'Motion access denied.';
          return false;
        }
      }
      if (MotionEvent && typeof MotionEvent.requestPermission === 'function') {
        await MotionEvent.requestPermission().catch(() => {});
      }
    } catch (err) {
      // Thrown when not called from a gesture, or on a non-secure origin.
      this.lastError = String(err && err.message ? err.message : err);
      return false;
    }
    this.attach();
    return true;
  }

  attach() {
    window.addEventListener('deviceorientation', this._boundOrientation, { passive: true });
    window.addEventListener('devicemotion', this._boundMotion, { passive: true });
  }

  detach() {
    window.removeEventListener('deviceorientation', this._boundOrientation);
    window.removeEventListener('devicemotion', this._boundMotion);
  }

  /** Sensors need a secure context; plain http over LAN silently never fires. */
  static get secureContext() {
    return window.isSecureContext !== false;
  }

  get supportsSensors() {
    return !!(window.DeviceOrientationEvent || window.DeviceMotionEvent);
  }

  get requiresGesture() {
    const E = window.DeviceOrientationEvent;
    return !!(E && typeof E.requestPermission === 'function') || isIOS();
  }

  handleOrientation(event) {
    if (event.beta === null && event.gamma === null) return;
    this.beta = event.beta || 0;
    this.gamma = event.gamma || 0;
    this._hasOrientation = true;
    this.sensorActive = true;
    this.mode = 'tilt';
  }

  handleMotion(event) {
    // Gravity-excluded acceleration is the cleanest shake signal. Some
    // browsers leave it null, in which case fall back to the total vector
    // minus 1g, which is close enough for a threshold test.
    const total = event.accelerationIncludingGravity;
    if (total && (total.x !== null || total.y !== null || total.z !== null)) {
      this.ax = total.x || 0;
      this.ay = total.y || 0;
      this.az = total.z || 0;
      this.accelAge = 0;
      this.calibrateAccelSign();
    }

    const a = event.acceleration;
    let mag;
    if (a && (a.x !== null || a.y !== null || a.z !== null)) {
      mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    } else {
      if (!total) return;
      mag = Math.abs(Math.hypot(this.ax, this.ay, this.az) - 9.81);
    }
    this.shakeMagnitude = mag;

    // If deviceorientation never arrives (rare, but some Android builds only
    // ship devicemotion) treat motion as proof the sensors are alive.
    if (!this._hasOrientation && event.accelerationIncludingGravity) {
      this.sensorActive = true;
      if (this.mode === 'keys') this.mode = 'motion';
    }

    // Picking the phone up and putting it down spikes the accelerometer well
    // past the shake threshold, so shakes stay disarmed for the first moments.
    if (this._age < CONFIG.input.shakeArmDelay) return;

    if (mag > CONFIG.input.shakeThreshold && this._shakeCooldown <= 0) {
      this._shakeCooldown = CONFIG.input.shakeCooldown;
      const strength = clamp(mag / CONFIG.input.shakeThreshold, 1, 3);
      if (this.onShake) this.onShake(strength);
    }
  }

  /**
   * Decide which way round accelerationIncludingGravity points on this device,
   * by comparing it with the orientation-derived gravity while the phone is
   * near enough to still that the reading *is* gravity. Needs a few agreeing
   * samples so one noisy frame cannot flip it.
   */
  calibrateAccelSign() {
    if (this.accelSign !== 0 || !this._hasOrientation) return;
    const mag = Math.hypot(this.ax, this.ay, this.az);
    if (mag < 8.6 || mag > 11.0) return; // moving: this is not pure gravity
    const b = this.beta * DEG;
    const g = this.gamma * DEG;
    const cb = Math.cos(b);
    // Earth-down in device axes.
    const dx = Math.sin(g) * cb;
    const dy = -Math.sin(b);
    const dz = -Math.cos(g) * cb;
    const dot = (this.ax * dx + this.ay * dy + this.az * dz) / mag;
    if (Math.abs(dot) < 0.75) return; // too oblique to be sure
    this._signVotes += dot > 0 ? 1 : -1;
    if (this._signVotes >= 4) this.accelSign = 1;
    else if (this._signVotes <= -4) this.accelSign = -1;
  }

  /**
   * Effective gravity in box space, in g units, from the accelerometer.
   *
   * A box being carried is a non-inertial frame: its contents feel gravity plus
   * a pseudo-force opposing however the box is being accelerated — which is
   * exactly what an accelerometer reads. Driving the sim from orientation alone
   * gives only the direction of down, so flicking the device just rotates
   * gravity smoothly and the sand slides over and stops. Feeding the whole
   * vector in is what makes it slosh: the flick throws the sand, and stopping
   * the flick throws it back.
   */
  accelVector() {
    const sign = this.accelSign || -1; // spec convention until proven otherwise
    let dx = sign * this.ax;
    let dy = sign * this.ay;
    let dz = sign * this.az;
    // Device axes -> box axes: screen y runs down, box z runs into the screen.
    let gx = dx / 9.81;
    let gy = -dy / 9.81;
    const gz = -dz / 9.81;

    const angle = this.screenAngle * DEG;
    if (angle) {
      const c = Math.cos(angle);
      const sn = Math.sin(angle);
      const rx = gx * c + gy * sn;
      const ry = -gx * sn + gy * c;
      gx = rx;
      gy = ry;
    }
    if (this.flipped) {
      gx = -gx;
      gy = -gy;
    }

    // A hard shake can read several g; allow it, but not unboundedly.
    const m = Math.hypot(gx, gy, gz);
    const cap = CONFIG.input.maxG;
    if (m > cap) {
      const k = cap / m;
      gx *= k; gy *= k;
      return { x: gx, y: gy, z: gz * k, mag: cap };
    }
    return { x: gx, y: gy, z: gz, mag: m };
  }

  setKey(code, down) {
    if (down) this.keys.add(code); else this.keys.delete(code);
  }

  /** Screen rotation, normalised to degrees clockwise from natural. */
  readScreenAngle() {
    const so = screen.orientation;
    if (so && typeof so.angle === 'number') return ((so.angle % 360) + 360) % 360;
    if (typeof window.orientation === 'number') {
      return ((window.orientation % 360) + 360) % 360;
    }
    return 0;
  }

  /** Target direction from tilt, keys, stick, or the demo sway. */
  targetVector() {
    const zBias = this.zBias;

    if (this.demo) {
      // Roughly what a hand does: a lazy roll, never fully on its side.
      return normalise(
        Math.sin(this.demoPhase) * 0.6,
        Math.cos(this.demoPhase * 0.63) * 0.35 + 0.65,
        zBias,
        true,
      );
    }

    let kx = 0;
    let ky = 0;
    const k = this.keys;
    if (k.has('ArrowLeft') || k.has('KeyA')) kx -= 1;
    if (k.has('ArrowRight') || k.has('KeyD')) kx += 1;
    if (k.has('ArrowUp') || k.has('KeyW')) ky -= 1;
    if (k.has('ArrowDown') || k.has('KeyS')) ky += 1;
    if (kx || ky) return normalise(kx, ky, zBias, true);

    if (this.stick.active) return normalise(this.stick.x, this.stick.y, zBias, true);

    // Live accelerometer: use the whole vector, motion included.
    if (this.sensorActive && this.accelAge < CONFIG.input.accelTimeout) {
      const v = this.accelVector();
      this.gForce = +v.mag.toFixed(2);
      return { x: v.x, y: v.y, z: v.z, motion: true };
    }

    if (this.sensorActive && this._hasOrientation) {
      const b = this.beta * DEG;
      const g = this.gamma * DEG;
      const cb = Math.cos(b);
      let dx = Math.sin(g) * cb;
      let dy = Math.sin(b);
      const dz = cb * Math.cos(g); // into the screen; unaffected by rotation

      // Rotate device x/y into CSS axes when the screen is not upright.
      const angle = this.screenAngle * DEG;
      if (angle) {
        const c = Math.cos(angle);
        const s = Math.sin(angle);
        const rx = dx * c + dy * s;
        const ry = -dx * s + dy * c;
        dx = rx;
        dy = ry;
      }
      if (this.flipped) {
        dx = -dx;
        dy = -dy;
      }
      return { x: dx, y: dy, z: dz };
    }

    // No input at all: rest against the bottom and back wall.
    return normalise(0, 1, zBias, true);
  }

  update(dt) {
    this._age += dt;
    this.accelAge += dt;
    if (this._shakeCooldown > 0) this._shakeCooldown -= dt;
    this.screenAngle = this.readScreenAngle();
    if (this.demo) this.demoPhase += dt * 0.9;

    const target = this.targetVector();
    // Motion needs a light hand: smoothing that hides accelerometer noise also
    // hides the flick that makes the sand slosh.
    const rate = target.keys
      ? CONFIG.input.keySmoothing
      : target.motion ? CONFIG.input.motionSmoothing : CONFIG.input.tiltSmoothing;
    this.gx = approach(this.gx, target.x, rate, dt);
    this.gy = approach(this.gy, target.y, rate, dt);
    this.gz = approach(this.gz, target.z, rate, dt);
  }

  describe() {
    if (this.demo) return 'demo sway';
    if (this.stick.active) return 'stick';
    if (this.keys.size) return 'keys';
    if (this.sensorActive) {
      if (this.accelAge < CONFIG.input.accelTimeout) return 'accel ' + this.gForce.toFixed(1) + 'g';
      return this._hasOrientation ? 'tilt' : 'motion';
    }
    return 'idle';
  }
}

function normalise(x, y, z, keys) {
  const m = Math.hypot(x, y, z) || 1;
  return { x: x / m, y: y / m, z: z / m, keys };
}

// ---- src/poke.js ----
// Multi-touch / mouse pushing. Tracks live pointers in CSS sim coordinates and
// hands the sim one poke per pointer per frame, including the pointer's own
// velocity so dragging sweeps grains along.
//
// Presses are captured on the canvas but moves and releases are tracked on the
// window: a release that lands outside the canvas (or gets swallowed by a system
// gesture on a phone) would otherwise leave a phantom finger shoving the bed
// forever.

class PokeInput {
  constructor(canvas) {
    this.canvas = canvas;
    this.pointers = new Map();
    this.onFirstTouch = null;

    canvas.addEventListener('pointerdown', (e) => this.down(e));
    window.addEventListener('pointermove', (e) => this.move(e));
    window.addEventListener('pointerup', (e) => this.up(e));
    window.addEventListener('pointercancel', (e) => this.up(e));
    // A drag interrupted mid-flight still has to release the pointer.
    window.addEventListener('blur', () => this.pointers.clear());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.pointers.clear();
    });
    // Belt and braces alongside touch-action:none in CSS.
    canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  locate(event) {
    const rect = this.canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  down(event) {
    const p = this.locate(event);
    this.pointers.set(event.pointerId, { x: p.x, y: p.y, dx: 0, dy: 0 });
    if (this.onFirstTouch) this.onFirstTouch();
  }

  move(event) {
    const entry = this.pointers.get(event.pointerId);
    if (!entry) return;
    const p = this.locate(event);
    entry.dx = p.x - entry.x;
    entry.dy = p.y - entry.y;
    entry.x = p.x;
    entry.y = p.y;
  }

  up(event) {
    this.pointers.delete(event.pointerId);
  }

  get active() {
    return this.pointers.size > 0;
  }

  apply(sand, dt) {
    if (this.pointers.size === 0) return;
    const invDt = 1 / Math.max(dt, 1e-3);
    for (const entry of this.pointers.values()) {
      // dx/dy are this frame's displacement; hand the sim a velocity.
      sand.poke(entry.x, entry.y, entry.dx * invDt, entry.dy * invDt, dt);
      // Decay so a held-still finger keeps pushing but stops dragging.
      entry.dx *= 0.6;
      entry.dy *= 0.6;
    }
  }
}

// ---- src/tuner.js ----
// Adaptive quality — a floor, not a target.
//
// Grain size comes from the screen size alone, and that is the look. This only
// steps in when a device demonstrably cannot sustain it, coarsening grains
// until it can. It never refines: the designed look is the ceiling, so the app
// looks the same on every load and on every device that can afford it, and no
// grain is ever spawned into a bed the user is already looking at.


class Tuner {
  constructor() {
    // 1 = the designed grain size. Only ever decreases.
    this.scale = 1;
    this.frameMs = 16.7;
    this.fps = 60;
    this.enabled = CONFIG.tuner.enabled;
    this._accum = 0;
    this._frames = 0;
    this._cooldown = CONFIG.tuner.warmup;
    this._fpsAccum = 0;
    this._fpsFrames = 0;
  }

  /**
   * Called once per frame with the measured work time and the real delta.
   * `eligible` marks frames where the sim actually did work — a dormant bed
   * costs almost nothing, and letting those frames into the average would hide
   * the expensive sloshing frames this is meant to catch.
   *
   * Returns true when the caller should re-apply quality.
   */
  sample(workMs, dt, eligible = true) {
    this.frameMs += (workMs - this.frameMs) * 0.1;
    this._fpsAccum += dt;
    this._fpsFrames++;
    if (this._fpsAccum >= 0.5) {
      this.fps = this._fpsFrames / this._fpsAccum;
      this._fpsAccum = 0;
      this._fpsFrames = 0;
    }

    if (this._cooldown > 0) this._cooldown -= dt;
    if (!eligible) {
      this._accum = 0;
      this._frames = 0;
      return false;
    }
    this._accum += workMs;
    this._frames++;

    const cfg = CONFIG.tuner;
    if (this._frames < cfg.sampleFrames) return false;
    const avg = this._accum / this._frames;
    this._accum = 0;
    this._frames = 0;
    if (!this.enabled || this._cooldown > 0) return false;
    if (avg <= cfg.hiMs) return false;

    const next = clamp(this.scale * (1 - cfg.step), cfg.minScale, 1);
    if (Math.abs(next - this.scale) < 1e-4) return false;

    this.scale = next;
    this._cooldown = cfg.cooldown;
    return true;
  }
}

// ---- src/hud.js ----
// DOM overlay: the hint line, the stats panel, the tilt-permission prompt, and
// the virtual tilt stick shown when no sensors are available.

class Hud {
  constructor(root) {
    this.root = root;
    this.hint = root.querySelector('#hint');
    this.stats = root.querySelector('#stats');
    this.gate = root.querySelector('#gate');
    this.gateButton = root.querySelector('#gate-button');
    this.gateNote = root.querySelector('#gate-note');
    this.stick = root.querySelector('#stick');
    this.knob = root.querySelector('#knob');
    this.fatal = root.querySelector('#fatal');
    this.material = root.querySelector('#material');
    this.materialPicker = root.querySelector('#material-picker');
    this.materialMenu = root.querySelector('#material-menu');

    this.statsVisible = false;
    this.onStick = null;
    this.onMaterial = null;
    // True while the material list is open. The frame loop reads this so the
    // movement keys do not tilt the box out from under someone who is choosing.
    this.materialOpen = false;
    this._materialButtons = new Map();
    this._hintTimer = 0;
    this._statsTimer = 0;
    this.bindStick();
    this.bindMaterial();
  }

  bindMaterial() {
    if (!this.material) return;
    this.material.addEventListener('click', (e) => {
      e.stopPropagation();
      this.toggleMaterialMenu();
    });
    // The picker sits in an overlay, so a tap on it never reaches the canvas —
    // but a stray pointerdown would still start a drag, so stop it here.
    this.materialPicker.addEventListener('pointerdown', (e) => e.stopPropagation());
    // Anywhere else dismisses, which is what every menu everywhere does.
    window.addEventListener('pointerdown', (e) => {
      if (this.materialOpen && !this.materialPicker.contains(e.target)) {
        this.showMaterialMenu(false);
      }
    });
    window.addEventListener('keydown', (e) => {
      if (this.materialOpen && e.code === 'Escape') {
        this.showMaterialMenu(false);
        this.material.focus();
      }
    });
  }

  /**
   * Build one row per material. Called once with the registry, so materials
   * added later appear here without touching the markup or this file.
   */
  setMaterials(list, currentId) {
    if (!this.materialMenu) return;
    this.materialMenu.innerHTML = '';
    this._materialButtons.clear();
    for (const m of list) {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'material-option';
      row.setAttribute('role', 'option');
      row.dataset.id = m.id;

      const dot = document.createElement('span');
      dot.className = 'material-swatch';
      dot.style.background = m.tint || '#888';
      row.append(dot, document.createTextNode(m.label));

      row.addEventListener('click', (e) => {
        e.stopPropagation();
        this.showMaterialMenu(false);
        if (this.onMaterial) this.onMaterial(m.id);
      });
      this.materialMenu.append(row);
      this._materialButtons.set(m.id, row);
    }
    const current = list.find((m) => m.id === currentId);
    this.setMaterial(currentId, current ? current.label : '');
  }

  setMaterial(id, label) {
    // The caret is a ::after pseudo-element, so replacing the text leaves it be.
    if (this.material) this.material.textContent = label;
    for (const [key, row] of this._materialButtons) {
      row.setAttribute('aria-selected', key === id ? 'true' : 'false');
    }
  }

  toggleMaterialMenu() {
    this.showMaterialMenu(!this.materialOpen);
  }

  showMaterialMenu(open) {
    if (!this.materialMenu) return;
    this.materialOpen = open;
    this.materialMenu.hidden = !open;
    this.material.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  setHint(text) {
    this.hint.textContent = text;
    this.hint.classList.remove('faded');
    this._hintTimer = 7;
  }

  showGate(text, note, onClick) {
    this.gateNote.textContent = note || '';
    this.gateButton.textContent = text;
    this.gate.classList.add('visible');
    this.gateButton.onclick = async () => {
      this.gateButton.disabled = true;
      const ok = await onClick();
      this.gateButton.disabled = false;
      if (ok) this.hideGate();
      else this.gateNote.textContent = 'Sensors unavailable — using the tilt stick instead.';
    };
  }

  hideGate() {
    this.gate.classList.remove('visible');
  }

  toggleStats(force) {
    this.statsVisible = force === undefined ? !this.statsVisible : force;
    this.stats.classList.toggle('visible', this.statsVisible);
  }

  showStick(visible) {
    this.stick.classList.toggle('visible', visible);
  }

  fail(message) {
    this.fatal.textContent = message;
    this.fatal.classList.add('visible');
  }

  bindStick() {
    const state = { id: null };
    const send = (event) => {
      const rect = this.stick.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const reach = rect.width / 2;
      let dx = (event.clientX - cx) / reach;
      let dy = (event.clientY - cy) / reach;
      const m = Math.hypot(dx, dy);
      if (m > 1) {
        dx /= m;
        dy /= m;
      }
      this.knob.style.transform = `translate(${dx * reach * 0.55}px, ${dy * reach * 0.55}px)`;
      if (this.onStick) this.onStick(dx, dy, true);
    };

    this.stick.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      state.id = e.pointerId;
      this.stick.setPointerCapture(e.pointerId);
      send(e);
    });
    this.stick.addEventListener('pointermove', (e) => {
      if (state.id !== e.pointerId) return;
      e.stopPropagation();
      send(e);
    });
    const release = (e) => {
      if (state.id !== e.pointerId) return;
      state.id = null;
      this.knob.style.transform = 'translate(0px, 0px)';
      if (this.onStick) this.onStick(0, 1, false);
    };
    this.stick.addEventListener('pointerup', release);
    this.stick.addEventListener('pointercancel', release);
  }

  update(dt, info) {
    if (this._hintTimer > 0) {
      this._hintTimer -= dt;
      if (this._hintTimer <= 0) this.hint.classList.add('faded');
    }
    if (!this.statsVisible) return;
    this._statsTimer -= dt;
    if (this._statsTimer > 0) return;
    this._statsTimer = 0.25;

    const rows = [
      ['fps', info.fps.toFixed(0)],
      ['work', info.workMs.toFixed(1) + ' ms'],
      ['material', info.material],
      [info.material === 'Water' ? 'particles' : 'grains', String(info.grains)],
      [info.material === 'Water' ? 'neighbours' : 'contacts', formatCount(info.contacts)],
      ['radius', info.radius.toFixed(2) + ' px'],
      ['depth', Math.round(info.depth) + ' px'],
      ['solve', `${info.substeps}×${info.iterations}`],
      ['quality', info.scale.toFixed(2) + '×'],
      ['gravity', `${info.gx.toFixed(2)}, ${info.gy.toFixed(2)}, ${info.gz.toFixed(2)}`],
      ['source', info.source],
      ['beta/gamma', `${info.beta.toFixed(0)}° / ${info.gamma.toFixed(0)}°`],
      ['screen', info.screenAngle + '°' + (info.flipped ? ' flipped' : '')],
      ['shake', info.shake.toFixed(1)],
      ['viewport', `${Math.round(info.width)}×${Math.round(info.height)} @${info.dpr}x`],
      ['backend', info.backend],
    ];
    if (info.error) rows.push(['note', info.error]);

    this.stats.innerHTML = rows
      .map(([k, v]) => `<span class="k">${k}</span><span class="v">${escapeHtml(v)}</span>`)
      .join('');
  }
}

function formatCount(n) {
  if (n > 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n > 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(Math.round(n));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

// ---- src/main.js ----
// Wiring: viewport -> box size, input -> gravity, frame loop, adaptive quality.


const params = new URLSearchParams(location.search);
const canvas = document.getElementById('stage');
const hud = new Hud(document.getElementById('ui'));

let renderer;
try {
  renderer = new Renderer(canvas, CONFIG.bed.maxGrains, params.has('capture'));
} catch (err) {
  hud.fail(String(err && err.message ? err.message : err));
  throw err;
}

const materials = new MaterialSet();
if (params.has('material')) materials.select(params.get('material'));
let sand = materials.current;
const gravity = new GravityInput();
const poke = new PokeInput(canvas);
const tuner = new Tuner();

const touch = isTouchDevice();
const forcedGrains = intParam('grains');
const forcedRadius = floatParam('r');
if (forcedGrains || params.get('tune') === 'off') tuner.enabled = false;
if (params.has('demo')) gravity.demo = true;
if (params.has('flip')) gravity.flipped = true;
if (params.has('stats')) hud.toggleStats(true);

let viewWidth = 0;
let viewHeight = 0;
let radius = 4;
let lastFrame = performance.now();
let sensorWatchdog = 0;
let stickForced = params.has('stick');
// Set by the , / . keys so a later resize does not undo a manual grain size.
let forcedRadiusOverride = 0;

function intParam(name) {
  const v = parseInt(params.get(name) || '', 10);
  return Number.isFinite(v) && v > 0 ? v : 0;
}

function floatParam(name) {
  const v = parseFloat(params.get(name) || '');
  return Number.isFinite(v) && v > 0 ? v : 0;
}

function measureViewport() {
  const rect = canvas.getBoundingClientRect();
  return {
    width: Math.max(120, rect.width || window.innerWidth),
    height: Math.max(120, rect.height || window.innerHeight),
  };
}

// Both of these are the material's call now: sand wants the finest grain the
// device can afford because every grain is visible, water wants a coarse
// particle because it is drawn as a surface. See materials.js.
function grainRadius(width, height) {
  if (forcedRadiusOverride) return forcedRadiusOverride;
  if (forcedRadius) return forcedRadius;
  return sand.preferredRadius(width, height, tuner.scale);
}

function targetCount() {
  if (forcedGrains) return Math.min(forcedGrains, sand.capacity);
  return sand.targetCount(viewWidth, viewHeight, tuner.scale);
}

/**
 * Re-derive grain size and count after a quality or viewport change.
 * `allowGrowth` is false for tuner-driven changes: the tuner may only coarsen,
 * so a step that would add grains means something is wrong, and adding sand to
 * a bed the user is watching is exactly the surprise we are avoiding.
 */
function applyQuality(allowGrowth = true) {
  radius = grainRadius(viewWidth, viewHeight);
  sand.configure(viewWidth, viewHeight, radius);
  const target = targetCount();
  sand.setCount(allowGrowth ? target : Math.min(target, sand.n));
}

function layout(initial) {
  const { width, height } = measureViewport();
  const changedALot =
    Math.abs(width - viewWidth) > viewWidth * 0.12 ||
    Math.abs(height - viewHeight) > viewHeight * 0.12;

  viewWidth = width;
  viewHeight = height;
  radius = grainRadius(width, height);
  renderer.resize(width, height);
  sand.configure(width, height, radius);

  if (initial) {
    sand.fill(targetCount());
  } else {
    sand.clampToBounds();
    if (changedALot) sand.setCount(targetCount());
  }
}

function reset() {
  sand.fill(targetCount());
}

/**
 * Switch what is in the box. Each material keeps its own state, so coming back
 * to one lands on the pile you left rather than re-running a settle — but a
 * material being seen for the first time has to be sized and filled here,
 * since layout() only ever ran for whichever one was current at load.
 */
function selectMaterial(id) {
  if (id === materials.id) return;
  // Asked before selecting, because reading `current` is what builds it.
  const fresh = materials.isFresh(id);
  if (!materials.select(id)) return;
  sand = materials.current;
  gravity.zBias = sand.zBias;
  radius = grainRadius(viewWidth, viewHeight);
  sand.configure(viewWidth, viewHeight, radius);
  if (fresh || sand.n === 0) sand.fill(targetCount());
  else sand.clampToBounds();
  hud.setMaterial(materials.id, materials.label);
  hud.setHint(HINT);
}

/** Keyboard shortcut: step to the next material in the registry. */
function switchMaterial() {
  selectMaterial(materials.nextId);
}

layout(true);
gravity.zBias = sand.zBias;
hud.setMaterials(MATERIALS, materials.id);

// ---------------------------------------------------------------- input setup

gravity.onShake = (strength) => sand.splash(strength);
hud.onMaterial = selectMaterial;

hud.onStick = (x, y, active) => {
  gravity.stick.x = x;
  gravity.stick.y = y;
  gravity.stick.active = active;
};

if (touch && gravity.supportsSensors && !gravity.demo) {
  if (!GravityInput.secureContext) {
    gravity.lastError = 'Motion sensors need https (or localhost).';
    stickForced = true;
  } else if (gravity.requiresGesture) {
    hud.showGate('Enable tilt', 'iOS needs a tap before it will share motion data.', () =>
      gravity.enableSensors(),
    );
  } else {
    gravity.attach();
  }
}

// Names no material, so the registry can grow without the hint going stale.
const HINT = touch
  ? 'Tilt to pour · touch to push · shake to splash · tap the pill to switch'
  : 'Arrows / WASD to tilt · drag to push · space to splash · M for material · ` for stats';
hud.setHint(HINT);

poke.onFirstTouch = () => {
  // A tap is a gesture, so it is also a chance to ask for sensors on iOS.
  if (touch && !gravity.sensorActive && gravity.requiresGesture && GravityInput.secureContext) {
    gravity.enableSensors();
  }
};

// Movement keys feed the gravity vector; everything else is an action. Note
// WASD is reserved for tilting, so stats sits on backquote rather than D.
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // While the material list is open the keyboard belongs to it — otherwise
  // arrowing through the options also tilts the box, and space splashes it.
  if (hud.materialOpen) return;
  gravity.setKey(e.code, true);
  // Before the switch: the movement keys fall through to `default` and would
  // otherwise never get here.
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  switch (e.code) {
    case 'Space': sand.splash(1.4); break;
    case 'KeyR': reset(); break;
    case 'KeyM': switchMaterial(); break;
    case 'Backquote': hud.toggleStats(); break;
    case 'KeyH': hud.setHint(HINT); break;
    case 'KeyF': gravity.flipped = !gravity.flipped; break;
    case 'KeyJ':
      stickForced = !stickForced;
      hud.showStick(stickForced);
      break;
    case 'BracketLeft':
    case 'BracketRight': {
      tuner.enabled = false;
      const k = e.code === 'BracketRight' ? 1.25 : 0.8;
      sand.setCount(Math.round(sand.n * k));
      break;
    }
    case 'Comma':
    case 'Period': {
      const k = e.code === 'Period' ? 1.15 : 0.87;
      radius = clamp(radius * k, 1.6, 14);
      forcedRadiusOverride = radius;
      sand.configure(viewWidth, viewHeight, radius);
      sand.setCount(targetCount());
      break;
    }
    default: break;
  }
}, { passive: false });

window.addEventListener('keyup', (e) => gravity.setKey(e.code, false));
window.addEventListener('blur', () => gravity.keys.clear());

let resizeTimer = 0;
function scheduleLayout() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => layout(false), 120);
}
window.addEventListener('resize', scheduleLayout);
window.addEventListener('orientationchange', scheduleLayout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleLayout);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) lastFrame = performance.now();
});

// ------------------------------------------------------------------ main loop

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrame) / 1000, 1 / 30);
  lastFrame = now;
  if (dt <= 0) return;

  const t0 = performance.now();

  gravity.update(dt);
  const magnitude = sand.gravityMagnitude;
  poke.apply(sand, dt);
  sand.step(dt, gravity.gx * magnitude, gravity.gy * magnitude, gravity.gz * magnitude);

  // Parallax: shift the projection eye against the tilt, so tipping the device
  // lets you peek around the grains — a cheap but convincing depth cue.
  const P = CONFIG.render.parallax;
  renderer.eyeX = -gravity.gx * P;
  renderer.eyeY = -gravity.gy * P;
  // Speck density is the one part of the look the tuner can thin out; grain
  // size, its usual lever, leaves the total speck count unchanged.
  renderer.quality = tuner.scale;
  renderer.draw(sand);

  const workMs = performance.now() - t0;

  if (tuner.sample(workMs, dt) && !forcedGrains && !forcedRadius) {
    applyQuality(false);
  }

  // If sensors never came alive on a touch device, offer the stick instead.
  if (touch && !gravity.sensorActive && !gravity.demo && sensorWatchdog < 3) {
    sensorWatchdog += dt;
    if (sensorWatchdog >= 3) stickForced = true;
  }
  hud.showStick(stickForced || (!touch && gravity.stick.active));

  hud.update(dt, {
    fps: tuner.fps,
    workMs,
    material: materials.label,
    grains: sand.n,
    contacts: sand.contactCount,
    radius,
    depth: sand.depth,
    substeps: sand.substeps,
    iterations: sand.iterations,
    scale: tuner.scale,
    gx: gravity.gx,
    gy: gravity.gy,
    gz: gravity.gz,
    source: gravity.describe(),
    beta: gravity.beta,
    gamma: gravity.gamma,
    screenAngle: gravity.screenAngle,
    flipped: gravity.flipped,
    shake: gravity.shakeMagnitude,
    width: viewWidth,
    height: viewHeight,
    dpr: renderer.dpr,
    backend: renderer.backend,
    error: gravity.lastError,
  });
}

requestAnimationFrame(frame);

// Handy from a console or a remote debugger: window.SILT.sand.splash(2) etc.
// `sand` is whichever material is current — the name is historical.
window.SILT = {
  get sand() { return sand; },
  get material() { return sand; },
  materials, switchMaterial,
  gravity, poke, tuner, renderer, hud, reset, applyQuality, CONFIG,
};

})();
</script>
