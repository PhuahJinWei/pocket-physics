<title>Silt — tilt sand</title>
<style>
/* Full-bleed dark stage. The canvas is position:fixed so mobile browser chrome
   showing and hiding never triggers a layout fight over 100vh. */

:root {
  --ink: #dceaff;
  --dim: rgba(190, 214, 255, 0.55);
  --panel: rgba(8, 16, 34, 0.78);
  --edge: rgba(120, 170, 255, 0.18);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #03060d;
  color: var(--ink);
  font: 500 13px/1.45 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

/* Sells the "inside a device" look and hides the hard canvas edge. */
#vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(125% 85% at 50% 45%, transparent 62%, rgba(0, 0, 0, 0.38) 100%),
    linear-gradient(to bottom, rgba(80, 140, 255, 0.05), transparent 22%);
  mix-blend-mode: multiply;
}
#vignette::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 1px rgba(150, 200, 255, 0.22);
  mix-blend-mode: screen;
}

#hint {
  position: absolute;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  max-width: min(92vw, 520px);
  padding: 7px 14px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 900ms ease;
}
#hint.faded { opacity: 0; }

#stats {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  left: 12px;
  display: none;
  grid-template-columns: auto auto;
  gap: 1px 12px;
  padding: 10px 12px;
  border: 1px solid var(--edge);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  font-size: 11px;
  line-height: 1.5;
}
#stats.visible { display: grid; }
#stats .k { color: var(--dim); }
#stats .v { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }

#gate {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: rgba(3, 6, 13, 0.72);
  backdrop-filter: blur(3px);
  pointer-events: auto;
}
#gate.visible { display: flex; }

#gate-button {
  padding: 14px 26px;
  border: 1px solid rgba(140, 190, 255, 0.4);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(30, 90, 200, 0.55), rgba(12, 34, 90, 0.55));
  color: #eaf3ff;
  font: inherit;
  font-size: 15px;
  letter-spacing: 0.03em;
  cursor: pointer;
  box-shadow: 0 0 32px rgba(60, 130, 255, 0.25);
}
#gate-button:disabled { opacity: 0.5; }
#gate-note {
  margin: 0;
  max-width: 70vw;
  color: var(--dim);
  font-size: 12px;
  text-align: center;
}

/* Virtual tilt pad, shown when the device has no usable motion sensors. */
#stick {
  position: absolute;
  left: 50%;
  bottom: calc(62px + env(safe-area-inset-bottom));
  width: 108px;
  height: 108px;
  margin-left: -54px;
  display: none;
  border: 1px solid var(--edge);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(20, 40, 80, 0.5), rgba(6, 12, 26, 0.35));
  pointer-events: auto;
  touch-action: none;
}
#stick.visible { display: block; }
#knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42px;
  height: 42px;
  margin: -21px 0 0 -21px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #cfe6ff, #2f6fd0 60%, #16305e);
  box-shadow: 0 0 18px rgba(80, 150, 255, 0.5);
  transition: transform 80ms ease-out;
}

#fatal {
  position: absolute;
  inset: auto 16px 50% 16px;
  display: none;
  padding: 16px;
  border: 1px solid rgba(255, 120, 120, 0.4);
  border-radius: 10px;
  background: rgba(40, 10, 14, 0.85);
  color: #ffd8d8;
  font-size: 13px;
  text-align: center;
}
#fatal.visible { display: block; }

@media (prefers-reduced-motion: reduce) {
  #knob, #hint { transition: none; }
}

</style>
<canvas id="stage"></canvas>

<div id="ui">
  <div id="vignette"></div>
  <div id="hint"></div>
  <div id="stats"></div>

  <div id="gate">
    <button id="gate-button" type="button">Enable tilt</button>
    <p id="gate-note"></p>
  </div>

  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <div id="fatal"></div>
</div>
<script>
(function () {
'use strict';

// ---- src/config.js ----
// Every tunable in one place. Values are in CSS pixels and seconds; the sim is
// resolution independent and the renderer scales by devicePixelRatio.

const CONFIG = {
  bed: {
    // Fraction of the screen height the settled bed should fill (front view).
    // Grain count is derived from this so the look is constant across devices.
    fill: 0.34,
    // Depth of the box behind the glass, in grain diameters. This is the Z the
    // screen is a window into; deeper looks better but costs grains cubically.
    depthLayers: 4.0,
    // 3D random-close-packing density, converts bed volume -> grain count.
    packing: 0.64,
    minGrains: 400,
    maxGrains: 60000,
  },

  grain: {
    // radius = min(viewport) / divisor, clamped. 3D needs chunkier grains than
    // 2D did: count scales with 1/r^3, so halving the radius is 8x the grains.
    divisor: 80,
    minRadius: 3.2,
    maxRadius: 9.5,
    // Spatial-hash cell size as a multiple of grain diameter. Must be >= the
    // shading radius or the 3x3x3 neighbour scan misses contacts.
    cellMul: 1.25,
  },

  sim: {
    // Gravity magnitude = gravityScale * viewport diagonal (px/s^2). A real
    // phone screen is ~50 px/cm, so true gravity would be ~50000 px/s^2 —
    // far below that reads as "falling through honey". This is the knob for
    // how brisk and alive the sand feels.
    gravityScale: 4.5,
    // Total relaxation sweeps per frame, split across substeps: a settled bed
    // spends them all on convergence (which is what lets the deepest, most
    // compressed layers decompress), while a bed in flight spends them on
    // substeps instead. Frame cost stays roughly flat either way.
    solveBudget: 8,
    maxIterations: 8,
    // Also the cap on how fast anything may move: max speed is roughly
    // substepTravel * maxSubsteps * diameter * 60/s. Too low and splashes and
    // free fall visibly hit a terminal-velocity ceiling.
    maxSubsteps: 12,
    // Both are fractions of a grain *diameter* — not of a grid cell. A grain
    // that moves further than about half its own width in one substep ends up
    // deep inside its neighbour, and the solver then flings the pair apart
    // hard enough to boil the whole bed.
    substepTravel: 0.45,
    speedCeiling: 0.5,
    // Ceiling on a single separation correction. Deep overlaps (a splash
    // landing, grains squeezed into a corner) then unwind over a few substeps
    // instead of detonating.
    maxSeparation: 0.45,
    stiffness: 1.0,
    // Coulomb-ish contact friction. muS is the static cone, muK the sliding
    // coefficient; both scale with penetration depth (a pressure proxy).
    // Keep these moderate: piles get their permanence from sleep, not from
    // friction — overdoing friction makes the bed feel like wet clay.
    // Strong enough that the loaded bed floor jams solid instead of creeping
    // sideways under the pile's weight forever. Responsiveness to tilt comes
    // from the wake dynamics, not from weak friction.
    muS: 2.0,
    muK: 0.85,
    // Under-relaxation for the friction correction, since a grain's contacts
    // are resolved one after another rather than simultaneously.
    frictionRelax: 0.75,
    // Floor on the penetration-as-normal-force proxy, as a fraction of a grain
    // diameter, so near-unloaded surface grains get some grip too.
    frictionPressureFloor: 0.05,
    // Dissipation, per second so the substep count cannot change the feel.
    // Granular energy is lost at contacts, so most of the drag is charged per
    // contact — the bulk goes quiet while airborne grains stay lively.
    airDrag: 0.15,
    contactDrag: 0.55,
    maxDragContacts: 12,
    // Rolling resistance: extra per-second drag on grains moving slower than
    // rollingBelow (multiples of the sleep speed). Real grains are angular and
    // stop rolling almost immediately; perfect spheres would trundle around
    // trading momentum forever, each one keeping its neighbours' sleep debt
    // from ever maturing. Leaves anything faster than a crawl untouched.
    rollingDrag: 7.0,
    rollingBelow: 1.6,
    wallFriction: 0.45,
    // Sleep, the hysteretic kind. A grain drifting slower than sleepSpeed (in
    // grain diameters per second) with at least sleepContacts neighbours goes
    // fully dormant: no gravity, no solver corrections, zero motion — which is
    // both what makes a resting bed pixel-still and what holds a pile's shape.
    // It wakes when pushed by more than wakePressure (fraction of a diameter,
    // accumulated over a frame), or when gravity swings by gravityWakeAngle
    // degrees — that global wake is what lets the whole bed slump at once on a
    // hard tilt instead of peeling off layer by layer.
    sleepSpeed: 3.0,
    sleepContacts: 4,
    // A grain must stay slow for this many consecutive substeps before it may
    // sleep. Without the delay, a freshly woken bed re-freezes before gravity
    // has had a single frame to accelerate it — which is exactly the "back
    // grains wait for the front" stickiness, reintroduced through the back door.
    sleepDelay: 20,
    wakePressure: 0.1,
    // Minimum speed (diameters/s) a grain needs before it can wake sleepers at
    // all. Resting grains lean into their support by g*dt^2 every substep, and
    // slow surface trickle re-energises the bed floor in a perpetual simmer —
    // so only ballistic grains (splash landings, a poured stream) transmit
    // wakefulness. Everything slower relies on the tilt/poke/splash wakes.
    wakeSpeed: 25,
    // Overlap (fraction of a diameter) against a sleeper that wakes it outright.
    // Catches grains trapped in pockets that froze too small for them. Must sit
    // well above the bed's equilibrium load-bearing overlap or it wakes the
    // pile floor in a perpetual storm — check the stats panel's awake count
    // holds near zero at rest after touching gravity or stiffness.
    pinchWake: 0.55,
    gravityWakeAngle: 10,
    // Neighbour search radius for shading, as a multiple of grain diameter.
    shadeRadius: 1.15,
    // Divisor for the "how buried am I" term (sum of upward contact dots).
    coverNorm: 2.4,
    // Fraction of a grain's brightness that reaches the grain beneath it.
    lightTransmit: 0.93,
    lightSmoothing: 18,
    splashSpeed: 1.1,
  },

  render: {
    maxDpr: 2,
    // Sprite sizes as multiples of grain diameter.
    beadSize: 1.35,
    glowSize: 3.2,
    glowStrength: 0.1,
    // Perspective: focal length as a multiple of min(viewport w, h). Smaller =
    // more dramatic depth. Parallax shifts the eye against tilt, in px.
    focal: 1.4,
    depthDim: 0.45,
    parallax: 40,
    background: [0.008, 0.016, 0.035],
    // Deep (buried) -> mid -> ice (surface). Fast grains blow out to white.
    deep: [0.035, 0.11, 0.42],
    mid: [0.1, 0.45, 0.96],
    ice: [0.68, 0.9, 1.0],
  },

  input: {
    // Gravity direction smoothing, per second.
    tiltSmoothing: 14,
    keySmoothing: 8,
    // Fixed into-screen gravity bias for keyboard/stick/demo input, so the bed
    // leans against the back wall and the box reads as 3D on desktop too.
    zBias: 0.45,
    // m/s^2 of gravity-excluded acceleration that counts as a shake, and how
    // long after load before shakes are armed (picking the phone up spikes the
    // accelerometer hard enough to read as several shakes otherwise).
    shakeThreshold: 13,
    shakeCooldown: 0.35,
    shakeArmDelay: 1.5,
    // Finger/mouse push.
    pokeRadius: 46,
    pokeStrength: 2600,
    pokeDrag: 0.85,
  },

  tuner: {
    // Target CPU+GPU frame budget. Below lo we add grains, above hi we remove.
    loMs: 9.5,
    hiMs: 14.5,
    sampleFrames: 45,
    cooldown: 2.5,
    step: 0.18,
    minScale: 0.22,
    maxScale: 2.0,
  },
};

// ---- src/grid.js ----
// Uniform 3D spatial hash built with a counting sort. Allocation-free after
// warm-up: build() only touches pre-sized typed arrays.
//
// Layout: cellStart[c]..cellStart[c+1] indexes into `order`, which holds grain
// indices grouped by cell. Cells are x-major, then y, then z slabs — index
// (z * rows + y) * cols + x over the shallow sim box.

class Grid {
  constructor(capacity) {
    this.cols = 0;
    this.rows = 0;
    this.slabs = 0;
    this.cellCount = 0;
    this.cellSize = 1;
    this.cellStart = new Int32Array(1);
    this.cursor = new Int32Array(1);
    this.cellOrder = new Int32Array(1);
    this.order = new Int32Array(capacity);
    this.cellOf = new Int32Array(capacity);
  }

  ensureCapacity(n) {
    if (this.order.length >= n) return;
    this.order = new Int32Array(n);
    this.cellOf = new Int32Array(n);
  }

  configure(width, height, depth, cellSize) {
    this.cellSize = cellSize;
    this.cols = Math.max(1, Math.ceil(width / cellSize));
    this.rows = Math.max(1, Math.ceil(height / cellSize));
    this.slabs = Math.max(1, Math.ceil(depth / cellSize));
    this.cellCount = this.cols * this.rows * this.slabs;
    if (this.cellStart.length < this.cellCount + 1) {
      this.cellStart = new Int32Array(this.cellCount + 1);
      this.cursor = new Int32Array(this.cellCount + 1);
      this.cellOrder = new Int32Array(this.cellCount);
    }
  }

  build(x, y, z, n) {
    const cols = this.cols;
    const rows = this.rows;
    const slabs = this.slabs;
    const layer = cols * rows;
    const cells = this.cellCount;
    const start = this.cellStart;
    const cursor = this.cursor;
    const cellOf = this.cellOf;
    const order = this.order;
    const inv = 1 / this.cellSize;

    start.fill(0, 0, cells + 1);

    for (let i = 0; i < n; i++) {
      let cx = (x[i] * inv) | 0;
      let cy = (y[i] * inv) | 0;
      let cz = (z[i] * inv) | 0;
      if (cx < 0) cx = 0; else if (cx >= cols) cx = cols - 1;
      if (cy < 0) cy = 0; else if (cy >= rows) cy = rows - 1;
      if (cz < 0) cz = 0; else if (cz >= slabs) cz = slabs - 1;
      const c = cz * layer + cy * cols + cx;
      cellOf[i] = c;
      start[c + 1]++;
    }
    for (let c = 0; c < cells; c++) start[c + 1] += start[c];

    cursor.set(start.subarray(0, cells + 1));
    for (let i = 0; i < n; i++) order[cursor[cellOf[i]]++] = i;
  }

  /**
   * Order cells deepest-first along the gravity direction. Resolving contacts
   * from the base of a pile upward lets support propagate in a single sweep,
   * which is what keeps stacks from sinking with only a couple of iterations.
   * The dominant gravity axis becomes the outermost loop.
   */
  orderCellsByGravity(gx, gy, gz) {
    const axes = [
      { len: this.cols, stride: 1, g: gx },
      { len: this.rows, stride: this.cols, g: gy },
      { len: this.slabs, stride: this.cols * this.rows, g: gz },
    ];
    axes.sort((a, b) => Math.abs(b.g) - Math.abs(a.g));
    for (const a of axes) {
      a.start = a.g >= 0 ? a.len - 1 : 0;
      a.step = a.g >= 0 ? -1 : 1;
    }

    const [a0, a1, a2] = axes;
    const out = this.cellOrder;
    let k = 0;
    for (let i0 = 0; i0 < a0.len; i0++) {
      const o0 = (a0.start + i0 * a0.step) * a0.stride;
      for (let i1 = 0; i1 < a1.len; i1++) {
        const o1 = o0 + (a1.start + i1 * a1.step) * a1.stride;
        for (let i2 = 0; i2 < a2.len; i2++) {
          out[k++] = o1 + (a2.start + i2 * a2.step) * a2.stride;
        }
      }
    }
    return out;
  }
}

// ---- src/util.js ----
// Small shared helpers. Kept dependency-free so it can sit at the root of the
// module graph (the bundler relies on that ordering).

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

/** Frame-rate independent exponential approach: rate is "per second". */
function approach(current, target, rate, dt) {
  return current + (target - current) * (1 - Math.exp(-rate * dt));
}

/** Deterministic 32-bit PRNG so a given seed always lays out the same bed. */
function makeRandom(seed) {
  let s = seed >>> 0 || 1;
  return function random() {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

function isTouchDevice() {
  return (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
}

/** iOS (including iPadOS, which reports itself as a Mac with touch). */
function isIOS() {
  const ua = navigator.userAgent;
  return /iPad|iPhone|iPod/.test(ua) ||
    (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
}

// ---- src/sand.js ----
// Granular sand as position-based dynamics in a shallow 3D box, over a uniform
// spatial hash. The screen is the front glass; the box extends a few grain
// diameters in Z behind it.
//
// Per substep: integrate -> rebuild grid -> relax contacts a few times ->
// derive velocity from the position change. Contacts do two jobs at once:
// separation (grains are incompressible) and Coulomb-ish friction (grains have
// shear strength, which is what produces a pile instead of a puddle).
//
// Sleep is hysteretic and does the heavy lifting for both stillness and pile
// permanence. A slow, well-supported grain goes fully dormant: it skips
// integration, receives no corrections, and acts as an immovable obstacle. It
// wakes only when pushed hard enough (an avalanche arriving), when gravity
// swings (the phone tilted), or when poked/splashed. A fully asleep bed costs
// almost nothing and is pixel-still — no simmering, no stick-slip shimmer.
//
// The same neighbour scan also accumulates the shading terms, so the depth
// look costs almost nothing: `contacts` says how packed a grain is, `cover`
// how buried it is along gravity, and `litAbove` lets light seep down through
// the bed one layer per frame.


class Sand {
  constructor(capacity) {
    this.capacity = capacity;
    this.n = 0;

    const f32 = () => new Float32Array(capacity);
    this.x = f32();
    this.y = f32();
    this.z = f32();
    this.px = f32();
    this.py = f32();
    this.pz = f32();
    this.vx = f32();
    this.vy = f32();
    this.vz = f32();
    this.light = f32();
    this.speed01 = f32();
    this.sizeJitter = f32();
    this.hueJitter = f32();
    this.contacts = new Uint8Array(capacity);
    this.cover = f32();
    this.litAbove = f32();
    this.sleep = new Uint8Array(capacity);
    this.wake = new Uint8Array(capacity);
    this.justWoke = new Uint8Array(capacity);
    this.sleepDebt = new Uint8Array(capacity); // consecutive slow frames
    this.pushOn = f32(); // accumulated push against a sleeping grain, per frame
    // Position at the start of the frame, for the sleep decision. Judged on
    // net frame displacement — instantaneous velocity would keep every grain
    // that solver churn jiggles in place awake forever.
    this.fx = f32();
    this.fy = f32();
    this.fz = f32();

    this.grid = new Grid(capacity);
    this.random = makeRandom(0x5117);

    this.radius = 4;
    this.diameter = 8;
    this.cellSize = 10;
    this.depth = 36;
    this.bounds = { x0: 0, y0: 0, x1: 1, y1: 1 };
    this.inner = { x0: 0, y0: 0, z0: 0, x1: 1, y1: 1, z1: 1 };
    this.speedNorm = 400;
    this.gravityMagnitude = 3000;
    this.substeps = 1;
    this.iterations = CONFIG.sim.solveBudget;
    this.solvedPairs = 0;
    this.awakeCount = 0;

    // Gravity direction at the last global wake; swinging past the threshold
    // wakes the whole bed so it slumps as a mass instead of peeling in layers.
    this._refGx = 0;
    this._refGy = 1;
    this._refGz = 0;
    this._refSet = false;
    this._wakeCos = Math.cos((CONFIG.sim.gravityWakeAngle * Math.PI) / 180);
    this._dragTable = null;
  }

  /** Set the box size and grain size; keeps existing grains in place. */
  configure(width, height, radius) {
    this.radius = radius;
    this.diameter = radius * 2;
    this.cellSize = this.diameter * CONFIG.grain.cellMul;
    this.depth = Math.max(
      this.diameter * 2,
      Math.min(CONFIG.bed.depthLayers * this.diameter, Math.min(width, height) * 0.2),
    );
    this.bounds = { x0: 0, y0: 0, x1: width, y1: height };
    this.inner = {
      x0: radius,
      y0: radius,
      z0: radius,
      x1: Math.max(radius, width - radius),
      y1: Math.max(radius, height - radius),
      z1: Math.max(radius, this.depth - radius),
    };
    this.grid.configure(width, height, this.depth, this.cellSize);

    const g = CONFIG.sim.gravityScale * Math.hypot(width, height);
    this.gravityMagnitude = g;
    this.speedNorm = 0.3 * Math.sqrt(2 * g * height);

    // Grain size or box changed under a frozen bed: geometry no longer valid.
    this.wakeAll();
  }

  /** Grain count that fills `CONFIG.bed.fill` of the front view when settled. */
  idealCount(fill = CONFIG.bed.fill) {
    const { x1, y1 } = this.bounds;
    const grainVol = (4 / 3) * Math.PI * this.radius ** 3;
    const volume = x1 * (fill * y1) * this.depth;
    const ideal = (volume * CONFIG.bed.packing) / grainVol;
    const ceiling = Math.min(
      CONFIG.bed.maxGrains,
      this.capacity,
      (x1 * (0.6 * y1) * this.depth * CONFIG.bed.packing) / grainVol,
    );
    return Math.round(clamp(ideal, CONFIG.bed.minGrains, ceiling));
  }

  _spawnAt(i, x, y, z) {
    const rand = this.random;
    this.x[i] = x;
    this.y[i] = y;
    this.z[i] = z;
    this.px[i] = x;
    this.py[i] = y;
    this.pz[i] = z;
    this.vx[i] = 0;
    this.vy[i] = 0;
    this.vz[i] = 0;
    this.light[i] = 0.5;
    this.speed01[i] = 0;
    this.sizeJitter[i] = rand();
    this.hueJitter[i] = rand();
    this.contacts[i] = 0;
    this.cover[i] = 0;
    this.litAbove[i] = 0;
    this.sleep[i] = 0;
    this.wake[i] = 0;
    this.justWoke[i] = 0;
    this.sleepDebt[i] = 0;
    this.pushOn[i] = 0;
  }

  /** Lay out a settled lattice at the bottom, so nothing explodes at t=0. */
  fill(count) {
    const n = Math.min(count, this.capacity);
    this.n = n;
    this.grid.ensureCapacity(n);

    const rand = this.random;
    const d = this.diameter;
    const b = this.inner;
    const perX = Math.max(1, Math.floor((b.x1 - b.x0) / d));
    const perZ = Math.max(1, Math.floor((b.z1 - b.z0) / (d * 0.9)) + 1);
    const perLayer = perX * perZ;
    const rowStep = d * 0.85;

    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / perLayer);
      const rem = i % perLayer;
      const zi = Math.floor(rem / perX);
      const xi = rem % perX;
      const stagger = (row + zi) % 2 ? this.radius : 0;
      const x = clamp(b.x0 + stagger + xi * d + (rand() - 0.5) * this.radius * 0.4, b.x0, b.x1);
      const y = clamp(this.inner.y1 - row * rowStep - (rand() - 0.5) * this.radius * 0.2, b.y0, b.y1);
      const z = clamp(b.z0 + zi * d * 0.9 + (rand() - 0.5) * this.radius * 0.4, b.z0, b.z1);
      this._spawnAt(i, x, y, z);
    }
    this.awakeCount = n;
    this._refSet = false;
  }

  /**
   * Grow/shrink the bed without disturbing the grains that stay. New grains
   * appear in a thin layer just above the current bed surface — NOT at the top
   * of the screen, which reads as the app spontaneously splashing in more sand
   * every time the quality tuner steps.
   */
  setCount(count) {
    const target = Math.min(Math.max(count, 0), this.capacity);
    if (target === this.n) return;
    if (target < this.n) {
      this.n = target;
      this.awakeCount = Math.min(this.awakeCount, target);
      return;
    }

    let bedTop = this.inner.y1;
    for (let i = 0; i < this.n; i++) if (this.y[i] < bedTop) bedTop = this.y[i];

    const rand = this.random;
    const d = this.diameter;
    const b = this.inner;
    const added = target - this.n;
    const perX = Math.max(1, Math.floor((b.x1 - b.x0) / d));
    const perZ = Math.max(1, Math.floor((b.z1 - b.z0) / (d * 0.9)) + 1);
    const perLayer = perX * perZ;

    for (let k = 0; k < added; k++) {
      const i = this.n + k;
      const row = Math.floor(k / perLayer);
      const x = b.x0 + rand() * (b.x1 - b.x0);
      const y = clamp(bedTop - d - row * d * 0.9, b.y0, b.y1);
      const z = b.z0 + rand() * (b.z1 - b.z0);
      this._spawnAt(i, x, y, z);
    }
    this.n = target;
    this.awakeCount += added;
    this.grid.ensureCapacity(target);
  }

  /** Nudge every grain back inside after a viewport change. */
  clampToBounds() {
    const b = this.inner;
    for (let i = 0; i < this.n; i++) {
      this.x[i] = clamp(this.x[i], b.x0, b.x1);
      this.y[i] = clamp(this.y[i], b.y0, b.y1);
      this.z[i] = clamp(this.z[i], b.z0, b.z1);
      this.px[i] = this.x[i];
      this.py[i] = this.y[i];
      this.pz[i] = this.z[i];
    }
    this.wakeAll();
  }

  wakeAll() {
    if (this.n === 0) return;
    this.sleep.fill(0, 0, this.n);
    this.wake.fill(0, 0, this.n);
    // Deliberately NOT setting justWoke: a global wake (tilt, splash, resize)
    // should mobilise the bed with all its energy, not tiptoe out of sleep.
    this.sleepDebt.fill(0, 0, this.n);
    this.awakeCount = this.n;
  }

  /** Shake response: throw the bed into the air. */
  splash(strength) {
    this.wakeAll();
    const rand = this.random;
    const speed = this.speedNorm * CONFIG.sim.splashSpeed * strength;
    for (let i = 0; i < this.n; i++) {
      const a = rand() * Math.PI * 2;
      const m = speed * (0.35 + rand() * 0.65);
      this.vx[i] += Math.cos(a) * m;
      this.vy[i] += Math.sin(a) * m * 0.8 - m * 0.5;
      this.vz[i] += (rand() - 0.5) * m * 0.6;
    }
  }

  /** Push grains away from a screen point (a cylinder through the depth). */
  poke(cx, cy, dx, dy, dt) {
    const r = CONFIG.input.pokeRadius;
    const r2 = r * r;
    const wakeR2 = r2 * 2.25;
    const push = CONFIG.input.pokeStrength * dt;
    const dragScale = CONFIG.input.pokeDrag;
    const { x, y, vx, vy, sleep } = this;
    let woke = 0;
    for (let i = 0; i < this.n; i++) {
      const ox = x[i] - cx;
      const oy = y[i] - cy;
      const d2 = ox * ox + oy * oy;
      if (d2 > wakeR2) continue;
      if (sleep[i]) {
        sleep[i] = 0;
        woke++;
      }
      if (d2 > r2) continue;
      const d = Math.sqrt(d2) || 1e-4;
      const falloff = 1 - d / r;
      const k = (push * falloff) / d;
      vx[i] += ox * k + dx * dragScale * falloff;
      vy[i] += oy * k + dy * dragScale * falloff;
    }
    this.awakeCount += woke;
  }

  step(dtFrame, gx, gy, gz) {
    const n = this.n;
    if (n === 0) return;
    const cfg = CONFIG.sim;

    // Global wake on a real change of gravity direction. Without this, a
    // sleeping pile only mobilises where avalanching grains push on it — the
    // "back grains wait for the front" stickiness. With it, a hard tilt wakes
    // everything and the bed slumps as one mass.
    const gmag = Math.hypot(gx, gy, gz) || 1;
    const gdx = gx / gmag;
    const gdy = gy / gmag;
    const gdz = gz / gmag;
    if (!this._refSet) {
      this._refGx = gdx;
      this._refGy = gdy;
      this._refGz = gdz;
      this._refSet = true;
    } else if (gdx * this._refGx + gdy * this._refGy + gdz * this._refGz < this._wakeCos) {
      this.wakeAll();
      this._refGx = gdx;
      this._refGy = gdy;
      this._refGz = gdz;
    }

    // Fully dormant bed: nothing to do. This is the common case at rest and
    // costs ~zero CPU (and therefore battery).
    if (this.awakeCount === 0) {
      this.substeps = 0;
      this.iterations = 0;
      this.solvedPairs = 0;
      return;
    }

    this.pushOn.fill(0, 0, n);

    // Pick a substep count that keeps the fastest grain's travel well under its
    // own diameter, so no pair is ever discovered already deeply interpenetrated.
    // A settled bed runs at one substep; only a splash pays for more.
    let maxV2 = 0;
    for (let i = 0; i < n; i++) {
      const s = this.vx[i] * this.vx[i] + this.vy[i] * this.vy[i] + this.vz[i] * this.vz[i];
      if (s > maxV2) maxV2 = s;
    }
    const travel = cfg.substepTravel * this.diameter;
    const needed = Math.ceil((Math.sqrt(maxV2) * dtFrame) / travel);
    const substeps = clamp(needed || 1, 1, cfg.maxSubsteps);
    const dt = dtFrame / substeps;
    this.substeps = substeps;

    // Spend a fixed sweep budget: substeps first (they do more for a moving bed
    // than iterations do), whatever is left on iterations.
    const iterations = clamp(Math.round(cfg.solveBudget / substeps), 1, cfg.maxIterations);
    this.iterations = iterations;

    const cellOrder = this.grid.orderCellsByGravity(gx, gy, gz);

    // Frame-start snapshot for the sleep decision.
    this.fx.set(this.x.subarray(0, n));
    this.fy.set(this.y.subarray(0, n));
    this.fz.set(this.z.subarray(0, n));

    this.solvedPairs = 0;
    for (let s = 0; s < substeps; s++) {
      this.integrate(dt, gx, gy, gz);
      this.grid.build(this.x, this.y, this.z, n);
      // Walls before the sweep so it relaxes against legal positions, and again
      // after so nothing is left hanging outside the box. Wake bookkeeping only
      // on the final sweep: approach is measured from the substep's start, so
      // collecting it every iteration would count the same displacement once
      // per sweep and wake sleepers off pure solver noise.
      for (let it = 0; it < iterations; it++) {
        this.applyWalls();
        this.solve(cellOrder, gdx, gdy, gdz, it === iterations - 1);
      }
      this.applyWalls();
      this.deriveVelocity(dt);
    }
    this.sleepPass(dtFrame);
    this.updateShading(dtFrame);
  }

  integrate(dt, gx, gy, gz) {
    const n = this.n;
    const damp = Math.exp(-CONFIG.sim.airDrag * dt);
    const { x, y, z, px, py, pz, vx, vy, vz, sleep, wake } = this;
    const dvx = gx * dt;
    const dvy = gy * dt;
    const dvz = gz * dt;
    const justWoke = this.justWoke;
    for (let i = 0; i < n; i++) {
      if (sleep[i]) {
        if (wake[i]) {
          sleep[i] = 0;
          wake[i] = 0;
          // Woken by pressure or pinch: relax positionally but do not convert
          // the stored compression into a jump (see deriveVelocity).
          justWoke[i] = 1;
        } else {
          // Dormant: hold position exactly. px==x means zero derived velocity.
          px[i] = x[i];
          py[i] = y[i];
          pz[i] = z[i];
          continue;
        }
      }
      const nvx = (vx[i] + dvx) * damp;
      const nvy = (vy[i] + dvy) * damp;
      const nvz = (vz[i] + dvz) * damp;
      vx[i] = nvx;
      vy[i] = nvy;
      vz[i] = nvz;
      px[i] = x[i];
      py[i] = y[i];
      pz[i] = z[i];
      x[i] += nvx * dt;
      y[i] += nvy * dt;
      z[i] += nvz * dt;
    }
  }

  /**
   * One Gauss-Seidel relaxation sweep over the 3x3x3 neighbourhood. Corrections
   * are applied immediately and grains are visited deepest-first along gravity,
   * so support propagates up through a pile in a single sweep.
   *
   * Sleeping grains do not scan and are immovable to those that do: an awake
   * grain takes the full separation against them, and the push it *would* have
   * delivered accumulates in pushOn[] — past the wake threshold, the sleeper
   * joins the avalanche next substep.
   */
  solve(cellOrder, gdx, gdy, gdz, collectWake) {
    const grid = this.grid;
    const cols = grid.cols, rows = grid.rows, slabs = grid.slabs;
    const layer = cols * rows;
    const cells = grid.cellCount;
    const start = grid.cellStart, order = grid.order;
    const { x, y, z, px, py, pz, vx, vy, vz, contacts, cover, light, litAbove, sleep, wake, pushOn } = this;
    const cfg = CONFIG.sim;
    const D = this.diameter;
    const D2 = D * D;
    const DS = D * cfg.shadeRadius;
    const DS2 = DS * DS;
    const half = cfg.stiffness * 0.5;
    const maxSep = cfg.maxSeparation * D;
    const wakeAt = cfg.wakePressure * D;
    const pinchWake = cfg.pinchWake * D;
    const wakeSpeed = cfg.wakeSpeed * D;
    const wakeSpeed2 = wakeSpeed * wakeSpeed;
    const muS = cfg.muS, muK = cfg.muK;
    const pressFloor = cfg.frictionPressureFloor * D;
    // A grain has up to twelve contacts and each one resolves in sequence, so
    // full-strength friction over-corrects and jitters. Under-relax it.
    const relax = cfg.frictionRelax;
    let pairs = 0;
    let woke = 0;

    for (let oc = 0; oc < cells; oc++) {
      const c = cellOrder[oc];
      const s1 = start[c + 1];
      let s = start[c];
      if (s === s1) continue;
      const cz = (c / layer) | 0;
      const rest = c - cz * layer;
      const cy = (rest / cols) | 0;
      const cx = rest - cy * cols;
      const ry0 = cy > 0 ? cy - 1 : 0;
      const ry1 = cy < rows - 1 ? cy + 1 : rows - 1;
      const rx0 = cx > 0 ? cx - 1 : 0;
      const rx1 = cx < cols - 1 ? cx + 1 : cols - 1;
      const rz0 = cz > 0 ? cz - 1 : 0;
      const rz1 = cz < slabs - 1 ? cz + 1 : slabs - 1;

      for (; s < s1; s++) {
        const i = order[s];
        if (sleep[i]) continue;
        let xi = x[i], yi = y[i], zi = z[i];
        const pxi = px[i], pyi = py[i], pzi = pz[i];
        // Only a grain that is genuinely travelling may wake sleepers. A grain
        // merely resting on one still free-falls into it by g*dt^2 every
        // substep before separation undoes it, and that reads as "approach" —
        // without this gate the entire bed floor gets woken by its own weight,
        // frame after frame, forever.
        const canWake = collectWake &&
          vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i] > wakeSpeed2;
        let count = 0;
        let cov = 0;
        let lit = 0;

        for (let rz = rz0; rz <= rz1; rz++) {
          const zbase = rz * layer;
          for (let ry = ry0; ry <= ry1; ry++) {
            const base = zbase + ry * cols;
            for (let rx = rx0; rx <= rx1; rx++) {
              const cc = base + rx;
              const t1 = start[cc + 1];
              for (let t = start[cc]; t < t1; t++) {
                const j = order[t];
                if (j === i) continue;
                const dx = x[j] - xi;
                const dy = y[j] - yi;
                const dz = z[j] - zi;
                const d2 = dx * dx + dy * dy + dz * dz;
                if (d2 >= DS2) continue;
                pairs++;

                let d, nx, ny, nz;
                if (d2 > 1e-8) {
                  d = Math.sqrt(d2);
                  const inv = 1 / d;
                  nx = dx * inv;
                  ny = dy * inv;
                  nz = dz * inv;
                } else {
                  // Coincident grains have no contact normal. Skipping them
                  // (the obvious guard) welds the pair together permanently,
                  // so pick a deterministic direction from the index instead.
                  const a = i * 2.3999632;
                  d = 0;
                  nx = Math.cos(a) * 0.94;
                  ny = Math.sin(a) * 0.94;
                  nz = 0.34;
                }

                // Shading terms, from the scan we are already paying for.
                count++;
                const above = -(nx * gdx + ny * gdy + nz * gdz);
                if (above > 0) {
                  cov += above;
                  const lj = light[j];
                  if (lj > lit) lit = lj;
                }

                if (d2 >= D2) continue;
                const overlap = D - d;
                const sepBase = overlap < maxSep ? overlap : maxSep;

                if (sleep[j]) {
                  // Immovable neighbour: take the whole correction ourselves.
                  const sep = sepBase * cfg.stiffness;
                  xi -= nx * sep;
                  yi -= ny * sep;
                  zi -= nz * sep;
                  if (canWake) {
                    // Wake it only on *approach* — how far we actually moved
                    // into it this substep. Counting the static overlap instead
                    // would wake every load-bearing grain every frame just for
                    // holding the pile up. Signed sum, clamped at zero, so
                    // back-and-forth churn nets out and only a sustained shove
                    // (an avalanche arriving) accumulates.
                    const approach = (xi - pxi) * nx + (yi - pyi) * ny + (zi - pzi) * nz;
                    let p = pushOn[j] + approach;
                    if (p < 0) p = 0;
                    pushOn[j] = p;
                    // Also wake on deep static overlap: a pocket that froze too
                    // small leaves its occupant rattling between immovable
                    // walls forever, visibly sunk into its neighbours.
                    if ((p > wakeAt || overlap > pinchWake) && !wake[j]) {
                      wake[j] = 1;
                      woke++;
                    }
                  }
                } else {
                  const sep = sepBase * half;
                  xi -= nx * sep;
                  yi -= ny * sep;
                  zi -= nz * sep;
                  x[j] += nx * sep;
                  y[j] += ny * sep;
                  z[j] += nz * sep;
                }

                // Friction acts on the tangential part of this substep's
                // relative motion. Inside the static cone it is cancelled
                // outright; beyond it, sliding is limited by muK * pressure.
                let tx = (xi - pxi) - (x[j] - px[j]);
                let ty = (yi - pyi) - (y[j] - py[j]);
                let tz = (zi - pzi) - (z[j] - pz[j]);
                const dn = tx * nx + ty * ny + tz * nz;
                tx -= dn * nx;
                ty -= dn * ny;
                tz -= dn * nz;
                const t2 = tx * tx + ty * ty + tz * tz;
                if (t2 > 1e-10) {
                  const tl = Math.sqrt(t2);
                  // Penetration depth stands in for normal force, with a floor
                  // so lightly loaded surface grains get some grip too.
                  const press = overlap > pressFloor ? overlap : pressFloor;
                  const k = (tl < muS * press
                    ? 0.5
                    : Math.min((muK * press) / tl, 1) * 0.5) * relax;
                  const fx = tx * k;
                  const fy = ty * k;
                  const fz = tz * k;
                  xi -= fx;
                  yi -= fy;
                  zi -= fz;
                  if (!sleep[j]) {
                    x[j] += fx;
                    y[j] += fy;
                    z[j] += fz;
                  }
                }
              }
            }
          }
        }

        x[i] = xi;
        y[i] = yi;
        z[i] = zi;
        contacts[i] = count > 255 ? 255 : count;
        cover[i] = cov;
        litAbove[i] = lit;
      }
    }
    this.solvedPairs += pairs;
    this.awakeCount += woke; // woken grains re-enter the sim next integrate
  }

  /**
   * Box walls (the screen is the z0 glass), as a push-out clamped exactly like
   * a grain-grain contact rather than a hard snap to the boundary.
   *
   * The hard snap is the tempting version and it fails twice over: it drops two
   * stacked grains onto the same wall coordinate (welding them into a permanent
   * 100%-overlap pair), and, run mid-sweep, every neighbour resolved afterwards
   * shoves wall grains back through the wall, leaving a few hundred px/s of
   * residue that never dissipates and simmers the whole bed.
   *
   * Dragging the previous position along makes the wall inelastic: the normal
   * velocity derives to exactly zero. Pulling the tangential delta back toward
   * the previous position is the wall friction.
   */
  applyWalls() {
    const n = this.n;
    const { x, y, z, px, py, pz, sleep } = this;
    const b = this.inner;
    const wf = 1 - CONFIG.sim.wallFriction;
    const maxPush = CONFIG.sim.maxSeparation * this.diameter;

    for (let i = 0; i < n; i++) {
      if (sleep[i]) continue;
      let pen = b.x0 - x[i];
      if (pen > 0) {
        x[i] += pen < maxPush ? pen : maxPush;
        px[i] = x[i];
        y[i] = py[i] + (y[i] - py[i]) * wf;
        z[i] = pz[i] + (z[i] - pz[i]) * wf;
      } else {
        pen = x[i] - b.x1;
        if (pen > 0) {
          x[i] -= pen < maxPush ? pen : maxPush;
          px[i] = x[i];
          y[i] = py[i] + (y[i] - py[i]) * wf;
          z[i] = pz[i] + (z[i] - pz[i]) * wf;
        }
      }

      pen = b.y0 - y[i];
      if (pen > 0) {
        y[i] += pen < maxPush ? pen : maxPush;
        py[i] = y[i];
        x[i] = px[i] + (x[i] - px[i]) * wf;
        z[i] = pz[i] + (z[i] - pz[i]) * wf;
      } else {
        pen = y[i] - b.y1;
        if (pen > 0) {
          y[i] -= pen < maxPush ? pen : maxPush;
          py[i] = y[i];
          x[i] = px[i] + (x[i] - px[i]) * wf;
          z[i] = pz[i] + (z[i] - pz[i]) * wf;
        }
      }

      pen = b.z0 - z[i];
      if (pen > 0) {
        z[i] += pen < maxPush ? pen : maxPush;
        pz[i] = z[i];
        x[i] = px[i] + (x[i] - px[i]) * wf;
        y[i] = py[i] + (y[i] - py[i]) * wf;
      } else {
        pen = z[i] - b.z1;
        if (pen > 0) {
          z[i] -= pen < maxPush ? pen : maxPush;
          pz[i] = z[i];
          x[i] = px[i] + (x[i] - px[i]) * wf;
          y[i] = py[i] + (y[i] - py[i]) * wf;
        }
      }
    }
  }

  deriveVelocity(dt) {
    const n = this.n;
    const cfg = CONFIG.sim;
    const { x, y, z, px, py, pz, vx, vy, vz, contacts, sleep, justWoke } = this;
    const invDt = 1 / dt;
    const ceiling = (cfg.speedCeiling * this.diameter) / dt;
    const ceiling2 = ceiling * ceiling;

    // Contact drag as a small lookup: `contacts` is a tiny integer, so this
    // avoids an exp() per grain per substep.
    const maxC = cfg.maxDragContacts;
    const drag = this._dragTable || (this._dragTable = new Float32Array(maxC + 1));
    for (let c = 0; c <= maxC; c++) drag[c] = Math.exp(-cfg.contactDrag * c * dt);
    const rollBelow = cfg.rollingBelow * cfg.sleepSpeed * this.diameter;
    const rollBelow2 = rollBelow * rollBelow;
    const rollDamp = Math.exp(-cfg.rollingDrag * dt);

    for (let i = 0; i < n; i++) {
      if (sleep[i]) {
        vx[i] = 0;
        vy[i] = 0;
        vz[i] = 0;
        continue;
      }
      const cnt = contacts[i];
      let k = drag[cnt < maxC ? cnt : maxC];
      // A grain woken by pressure/pinch is decompressing: its position change
      // this frame is stored solver penetration unwinding, not real motion.
      // Deriving velocity from it would fire the grain out like a spring and
      // set off a self-sustaining wake storm through the pile.
      if (justWoke[i]) k *= 0.05;
      let sx = (x[i] - px[i]) * invDt * k;
      let sy = (y[i] - py[i]) * invDt * k;
      let sz = (z[i] - pz[i]) * invDt * k;
      const s2 = sx * sx + sy * sy + sz * sz;
      if (s2 > ceiling2) {
        const k2 = ceiling / Math.sqrt(s2);
        sx *= k2;
        sy *= k2;
        sz *= k2;
      } else if (s2 < rollBelow2 && cnt > 0) {
        // Rolling resistance: real grains are angular and stop trundling almost
        // immediately; perfect spheres would trade momentum forever.
        sx *= rollDamp;
        sy *= rollDamp;
        sz *= rollDamp;
      }
      vx[i] = sx;
      vy[i] = sy;
      vz[i] = sz;
    }
  }

  /**
   * The sleep decision, once per frame. Judged on NET frame displacement, not
   * on instantaneous velocity: a grain squeezed between sleeping neighbours is
   * shoved back and forth by the solver every sweep — its derived velocity
   * looks fast forever even though it goes nowhere, so a velocity gate would
   * keep it (and every grain like it) permanently awake. Net displacement
   * cancels the oscillation and measures actual travel.
   */
  sleepPass(dtFrame) {
    const n = this.n;
    const cfg = CONFIG.sim;
    const { x, y, z, fx, fy, fz, px, py, pz, vx, vy, vz, contacts, sleep, sleepDebt, justWoke } = this;
    const sleepDelay = cfg.sleepDelay;
    const sleepContacts = cfg.sleepContacts;
    const enter = cfg.sleepSpeed * this.diameter * dtFrame; // px of net travel
    const enter2 = enter * enter;
    // A wall is worth two grains of support: a lone grain on the floor or a
    // tripod resting against the glass could otherwise never reach the contact
    // quorum and would stay awake (and faintly restless) forever.
    const b = this.inner;
    const eps = 0.05 * this.diameter;
    const wx0 = b.x0 + eps, wx1 = b.x1 - eps;
    const wy0 = b.y0 + eps, wy1 = b.y1 - eps;
    const wz0 = b.z0 + eps, wz1 = b.z1 - eps;

    let awake = 0;
    for (let i = 0; i < n; i++) {
      if (sleep[i]) continue;
      justWoke[i] = 0;
      const dx = x[i] - fx[i];
      const dy = y[i] - fy[i];
      const dz = z[i] - fz[i];
      const d2 = dx * dx + dy * dy + dz * dz;

      if (d2 < enter2) {
        let support = contacts[i];
        if (support < sleepContacts) {
          const xi = x[i], yi = y[i], zi = z[i];
          if (xi <= wx0 || xi >= wx1) support += 2;
          if (yi <= wy0 || yi >= wy1) support += 2;
          if (zi <= wz0 || zi >= wz1) support += 2;
        }
        if (support >= sleepContacts) {
          // Slow and supported — but only dormant after staying that way for a
          // stretch. Sleeping on the first slow frame would re-freeze a freshly
          // woken bed before gravity gets a chance to accelerate it.
          if (++sleepDebt[i] >= sleepDelay) {
            sleep[i] = 1;
            sleepDebt[i] = 0;
            px[i] = x[i];
            py[i] = y[i];
            pz[i] = z[i];
            vx[i] = 0;
            vy[i] = 0;
            vz[i] = 0;
            continue;
          }
          awake++;
          continue;
        }
      }
      // Decay rather than reset: churn spikes a settling grain past the
      // threshold on odd frames, and a hard reset would keep the whole surface
      // layer hovering just short of dormancy forever.
      if (sleepDebt[i] > 0) sleepDebt[i] -= Math.min(2, sleepDebt[i]);
      awake++;
    }
    this.awakeCount = awake;
  }

  updateShading(dt) {
    const n = this.n;
    const cfg = CONFIG.sim;
    const { light, cover, contacts, litAbove, speed01, sleep, vx, vy, vz } = this;
    const invCover = 1 / cfg.coverNorm;
    const invSpeed = 1 / this.speedNorm;
    const blend = 1 - Math.exp(-cfg.lightSmoothing * dt);
    const transmit = cfg.lightTransmit;

    for (let i = 0; i < n; i++) {
      const buried = clamp(cover[i] * invCover, 0, 1);
      const loose = 1 - clamp(contacts[i] / 6, 0, 1);
      // Lit if nothing is above you, or if you are barely touching anything...
      const exposed = Math.max(1 - buried, loose * 0.95);
      // ...otherwise take what filters down from the grain above you.
      const target = Math.max(exposed, litAbove[i] * transmit);
      light[i] += (target - light[i]) * blend;
      speed01[i] = sleep[i]
        ? 0
        : clamp(Math.hypot(vx[i], vy[i], vz[i]) * invSpeed, 0, 1);
    }
  }
}

// ---- src/shaders.js ----
// GLSL ES 1.00 so one shader pair works on both WebGL1 and WebGL2 contexts.
//
// Each grain is a single point sprite with a 3D position: x/y in CSS px on the
// glass, z going into the screen. The vertex shader applies a simple pinhole
// projection around a movable eye point — deeper grains shrink and converge
// toward the eye, which combined with fog and draw order is what makes the box
// read as having real depth. The fragment shader reconstructs a fake sphere
// normal from gl_PointCoord and lights it. Two passes share the program:
// mode 0 draws a wide dim additive halo, mode 1 the alpha-blended bead on top.

const VERTEX_SHADER = `
precision highp float;

attribute vec3 aPos;      // sim position: x,y CSS px, z depth (0 = glass)
attribute vec2 aShade;    // x: surface light 0..1, y: normalised speed 0..1
attribute vec2 aJitter;   // x: size variation, y: tint variation

uniform vec2 uViewport;   // CSS px
uniform float uPointSize; // device px, already scaled by dpr
uniform float uSpeedBoost;
uniform float uFocal;     // focal length in CSS px
uniform vec2 uEye;        // projection centre in CSS px (parallax lives here)
uniform float uDepthRange;

varying float vLight;
varying float vSpeed;
varying float vTint;
varying float vDepth;

void main() {
  float persp = uFocal / (uFocal + aPos.z);
  vec2 projected = uEye + (aPos.xy - uEye) * persp;
  vec2 unit = projected / uViewport;
  gl_Position = vec4(unit.x * 2.0 - 1.0, 1.0 - unit.y * 2.0, 0.0, 1.0);
  float grow = 1.0 + aShade.y * uSpeedBoost;
  gl_PointSize = uPointSize * (0.88 + 0.24 * aJitter.x) * grow * persp;
  vLight = aShade.x;
  vSpeed = aShade.y;
  vTint = aJitter.y;
  vDepth = clamp(aPos.z / uDepthRange, 0.0, 1.0);
}
`;

const FRAGMENT_SHADER = `
precision highp float;

varying float vLight;
varying float vSpeed;
varying float vTint;
varying float vDepth;

uniform vec3 uDeep;
uniform vec3 uMid;
uniform vec3 uIce;
uniform float uMode;      // 0.0 = glow pass, 1.0 = bead pass
uniform float uGlow;
uniform float uDepthDim;  // how much the back of the box falls into shadow

vec3 grainColor() {
  float t = clamp(vLight, 0.0, 1.0);
  vec3 c = mix(uDeep, uMid, smoothstep(0.0, 0.55, t));
  c = mix(c, uIce, smoothstep(0.45, 1.0, t));
  c = mix(c, vec3(1.0), clamp(vSpeed, 0.0, 1.0) * 0.7);
  return c * (0.72 + 0.28 * vTint);
}

void main() {
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(uv, uv);
  if (r2 > 1.0) discard;
  vec3 base = grainColor();
  float dim = 1.0 - uDepthDim * vDepth;

  if (uMode < 0.5) {
    // Soft halo. Premultiplied and additively blended, so bright clusters
    // bloom into each other the way the LCD does on camera.
    float falloff = exp(-r2 * 3.4) - 0.033;
    float amount = uGlow * max(falloff, 0.0)
      * (0.35 + 0.65 * clamp(vLight, 0.0, 1.0)) * dim;
    gl_FragColor = vec4(base * amount, amount);
    return;
  }

  // Bead: hemisphere normal from the sprite coordinate.
  float z = sqrt(max(1.0 - r2, 0.0));
  vec3 n = vec3(uv.x, uv.y, z);
  vec3 lightDir = normalize(vec3(-0.42, -0.6, 0.68));
  float diffuse = max(dot(n, lightDir), 0.0);
  float rim = pow(1.0 - z, 2.5);
  vec3 half3 = normalize(lightDir + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(n, half3), 0.0), 26.0);

  vec3 color = base * (0.34 + 0.82 * diffuse);
  // Keep the highlight off buried grains, or the bulk turns grey and muddy.
  color += vec3(0.72, 0.86, 1.0) * spec * (0.08 + 0.92 * clamp(vLight, 0.0, 1.0));
  color *= 1.0 - 0.28 * rim;
  color *= dim;

  float alpha = smoothstep(1.0, 0.82, r2);
  gl_FragColor = vec4(color, alpha);
}
`;

// ---- src/renderer.js ----
// WebGL point-sprite renderer. One interleaved buffer, two draw calls per
// frame (halo then beads). Prefers a WebGL2 context but the shaders are ES 1.00
// so a WebGL1 fallback is identical in output.
//
// Grains are packed back-to-front (a 32-bucket counting sort on z), so nearer
// beads paint over deeper ones and no depth buffer is needed — point sprites
// with blending and a depth buffer fight over the alpha edges anyway.


const FLOATS_PER_GRAIN = 7; // x, y, z, light, speed, sizeJitter, hueJitter
const STRIDE = FLOATS_PER_GRAIN * 4;
const BUCKETS = 32;

class Renderer {
  /**
   * @param {boolean} preserve Keep the drawing buffer after presentation. Off
   *   by default (it costs a copy on some drivers); on it makes screenshots and
   *   canvas.toDataURL() reliable instead of returning whatever survived the
   *   last buffer swap.
   */
  constructor(canvas, capacity, preserve = false) {
    this.canvas = canvas;
    this.capacity = capacity;
    this.cpu = new Float32Array(capacity * FLOATS_PER_GRAIN);
    this.bucketOf = new Uint8Array(capacity);
    this.drawOrder = new Int32Array(capacity);
    this.bucketStart = new Int32Array(BUCKETS + 1);
    this.width = 1;
    this.height = 1;
    this.dpr = 1;
    // Parallax offset for the projection eye, in CSS px; set from the tilt.
    this.eyeX = 0;
    this.eyeY = 0;
    this.contextLost = false;

    const opts = {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      premultipliedAlpha: true,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: preserve,
    };
    this.gl = canvas.getContext('webgl2', opts);
    this.isWebGL2 = !!this.gl;
    if (!this.gl) this.gl = canvas.getContext('webgl', opts);
    if (!this.gl) throw new Error('WebGL is not available in this browser.');

    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      this.contextLost = true;
    });
    canvas.addEventListener('webglcontextrestored', () => {
      this.initGL();
      this.contextLost = false;
    });

    this.initGL();
  }

  get backend() {
    return this.isWebGL2 ? 'webgl2' : 'webgl1';
  }

  initGL() {
    const gl = this.gl;
    this.program = buildProgram(gl, VERTEX_SHADER, FRAGMENT_SHADER);
    gl.useProgram(this.program);

    this.attrib = {
      pos: gl.getAttribLocation(this.program, 'aPos'),
      shade: gl.getAttribLocation(this.program, 'aShade'),
      jitter: gl.getAttribLocation(this.program, 'aJitter'),
    };
    this.uniform = {
      viewport: gl.getUniformLocation(this.program, 'uViewport'),
      pointSize: gl.getUniformLocation(this.program, 'uPointSize'),
      speedBoost: gl.getUniformLocation(this.program, 'uSpeedBoost'),
      focal: gl.getUniformLocation(this.program, 'uFocal'),
      eye: gl.getUniformLocation(this.program, 'uEye'),
      depthRange: gl.getUniformLocation(this.program, 'uDepthRange'),
      depthDim: gl.getUniformLocation(this.program, 'uDepthDim'),
      deep: gl.getUniformLocation(this.program, 'uDeep'),
      mid: gl.getUniformLocation(this.program, 'uMid'),
      ice: gl.getUniformLocation(this.program, 'uIce'),
      mode: gl.getUniformLocation(this.program, 'uMode'),
      glow: gl.getUniformLocation(this.program, 'uGlow'),
    };

    this.buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.cpu.byteLength, gl.DYNAMIC_DRAW);

    for (const loc of Object.values(this.attrib)) {
      if (loc >= 0) gl.enableVertexAttribArray(loc);
    }
    gl.vertexAttribPointer(this.attrib.pos, 3, gl.FLOAT, false, STRIDE, 0);
    gl.vertexAttribPointer(this.attrib.shade, 2, gl.FLOAT, false, STRIDE, 12);
    gl.vertexAttribPointer(this.attrib.jitter, 2, gl.FLOAT, false, STRIDE, 20);

    const bg = CONFIG.render.background;
    gl.clearColor(bg[0], bg[1], bg[2], 1);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);

    gl.uniform3fv(this.uniform.deep, CONFIG.render.deep);
    gl.uniform3fv(this.uniform.mid, CONFIG.render.mid);
    gl.uniform3fv(this.uniform.ice, CONFIG.render.ice);
  }

  /** Returns true when the backing store changed size. */
  resize(cssWidth, cssHeight) {
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.render.maxDpr);
    const w = Math.max(1, Math.round(cssWidth * dpr));
    const h = Math.max(1, Math.round(cssHeight * dpr));
    this.width = cssWidth;
    this.height = cssHeight;
    this.dpr = dpr;
    if (this.canvas.width === w && this.canvas.height === h) return false;
    this.canvas.width = w;
    this.canvas.height = h;
    this.gl.viewport(0, 0, w, h);
    return true;
  }

  draw(sand) {
    const gl = this.gl;
    if (this.contextLost) return;

    gl.clear(gl.COLOR_BUFFER_BIT);
    const n = sand.n;
    if (n === 0) return;

    // Counting sort by z bucket, deepest first, so the pack order is
    // back-to-front for the bead pass.
    const { bucketOf, drawOrder, bucketStart } = this;
    const zScale = BUCKETS / Math.max(sand.depth, 1e-3);
    const zArr = sand.z;
    bucketStart.fill(0);
    for (let i = 0; i < n; i++) {
      let b = (zArr[i] * zScale) | 0;
      if (b < 0) b = 0; else if (b >= BUCKETS) b = BUCKETS - 1;
      bucketOf[i] = b;
      bucketStart[b + 1]++;
    }
    // Prefix from the deep end: bucket 31 packs first.
    let acc = 0;
    for (let b = BUCKETS - 1; b >= 0; b--) {
      const c = bucketStart[b + 1];
      bucketStart[b + 1] = acc;
      acc += c;
    }
    // bucketStart[b+1] now holds the running start for bucket b; place items.
    for (let i = 0; i < n; i++) drawOrder[bucketStart[bucketOf[i] + 1]++] = i;

    const cpu = this.cpu;
    const { x, y, light, speed01, sizeJitter, hueJitter } = sand;
    for (let k = 0; k < n; k++) {
      const i = drawOrder[k];
      const o = k * FLOATS_PER_GRAIN;
      cpu[o] = x[i];
      cpu[o + 1] = y[i];
      cpu[o + 2] = zArr[i];
      cpu[o + 3] = light[i];
      cpu[o + 4] = speed01[i];
      cpu[o + 5] = sizeJitter[i];
      cpu[o + 6] = hueJitter[i];
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
    const floats = n * FLOATS_PER_GRAIN;
    if (this.isWebGL2) {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, cpu, 0, floats);
    } else {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, cpu.subarray(0, floats));
    }

    const px = sand.diameter * this.dpr;
    gl.uniform2f(this.uniform.viewport, this.width, this.height);
    gl.uniform1f(this.uniform.speedBoost, 0.35);
    gl.uniform1f(this.uniform.focal, CONFIG.render.focal * Math.min(this.width, this.height));
    gl.uniform2f(this.uniform.eye, this.width * 0.5 + this.eyeX, this.height * 0.5 + this.eyeY);
    gl.uniform1f(this.uniform.depthRange, sand.depth);
    gl.uniform1f(this.uniform.depthDim, CONFIG.render.depthDim);

    // Halo pass: additive, premultiplied.
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.uniform1f(this.uniform.mode, 0);
    gl.uniform1f(this.uniform.glow, CONFIG.render.glowStrength);
    gl.uniform1f(this.uniform.pointSize, px * CONFIG.render.glowSize);
    gl.drawArrays(gl.POINTS, 0, n);

    // Bead pass: straight alpha over the halo, back-to-front.
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1f(this.uniform.mode, 1);
    gl.uniform1f(this.uniform.pointSize, px * CONFIG.render.beadSize);
    gl.drawArrays(gl.POINTS, 0, n);
  }
}

function buildProgram(gl, vsSource, fsSource) {
  const vs = compile(gl, gl.VERTEX_SHADER, vsSource);
  const fs = compile(gl, gl.FRAGMENT_SHADER, fsSource);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error('Shader link failed: ' + gl.getProgramInfoLog(program));
  }
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  return program;
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error('Shader compile failed: ' + gl.getShaderInfoLog(shader));
  }
  return shader;
}

// ---- src/gravity.js ----
// Where "down" is — now a 3D vector, since the box has depth.
//
// Phone: derived from deviceorientation's beta/gamma. That is more portable
// than accelerationIncludingGravity, whose sign convention differs between
// iOS and Android. devicemotion is still used, but only for shake detection.
//
// Desktop / no sensors: arrow keys, WASD, or the on-screen stick, with a fixed
// into-screen bias so the bed leans against the back wall and reads as 3D.
//
// Deriving gravity from beta/gamma: the device->earth rotation is
// Rz(alpha)Rx(beta)Ry(gamma), so earth-down expressed in device axes is
//   d = (sin g cos b, -sin b, -cos g cos b)
// Device +y points up the screen while CSS +y points down, and device +z points
// out of the screen while box +z points into it, so in box space
//   gx = sin(gamma) * cos(beta)
//   gy = sin(beta)
//   gz = cos(beta) * cos(gamma)
// Held upright in portrait (beta 90) that is (0,1,0): straight down the screen.
// Flat on a table it is (0,0,1): into the screen, so the sand settles against
// the back wall and spreads out — which is exactly what a real box would do.


const DEG = Math.PI / 180;

class GravityInput {
  constructor() {
    // Smoothed unit-ish vector in box space, consumed by the sim.
    this.gx = 0;
    this.gy = 1;
    this.gz = CONFIG.input.zBias;
    // Raw sensor readings, surfaced in the stats panel for on-device debugging.
    this.beta = 0;
    this.gamma = 0;
    this.screenAngle = 0;
    this.shakeMagnitude = 0;
    this.mode = 'keys';
    this.sensorActive = false;
    this.flipped = false;
    this.lastError = '';

    this.onShake = null;
    this.keys = new Set();
    this.stick = { x: 0, y: 0, active: false };
    this.demo = false;
    this.demoPhase = 0;

    this._age = 0;
    this._shakeCooldown = 0;
    this._hasOrientation = false;
    this._boundOrientation = (e) => this.handleOrientation(e);
    this._boundMotion = (e) => this.handleMotion(e);
  }

  /**
   * iOS needs requestPermission() from inside a user gesture; everyone else can
   * just subscribe. Returns true when sensor events are flowing.
   */
  async enableSensors() {
    const MotionEvent = window.DeviceMotionEvent;
    const OrientationEvent = window.DeviceOrientationEvent;
    if (!OrientationEvent && !MotionEvent) {
      this.lastError = 'No motion sensors on this device.';
      return false;
    }
    try {
      if (OrientationEvent && typeof OrientationEvent.requestPermission === 'function') {
        const state = await OrientationEvent.requestPermission();
        if (state !== 'granted') {
          this.lastError = 'Motion access denied.';
          return false;
        }
      }
      if (MotionEvent && typeof MotionEvent.requestPermission === 'function') {
        await MotionEvent.requestPermission().catch(() => {});
      }
    } catch (err) {
      // Thrown when not called from a gesture, or on a non-secure origin.
      this.lastError = String(err && err.message ? err.message : err);
      return false;
    }
    this.attach();
    return true;
  }

  attach() {
    window.addEventListener('deviceorientation', this._boundOrientation, { passive: true });
    window.addEventListener('devicemotion', this._boundMotion, { passive: true });
  }

  detach() {
    window.removeEventListener('deviceorientation', this._boundOrientation);
    window.removeEventListener('devicemotion', this._boundMotion);
  }

  /** Sensors need a secure context; plain http over LAN silently never fires. */
  static get secureContext() {
    return window.isSecureContext !== false;
  }

  get supportsSensors() {
    return !!(window.DeviceOrientationEvent || window.DeviceMotionEvent);
  }

  get requiresGesture() {
    const E = window.DeviceOrientationEvent;
    return !!(E && typeof E.requestPermission === 'function') || isIOS();
  }

  handleOrientation(event) {
    if (event.beta === null && event.gamma === null) return;
    this.beta = event.beta || 0;
    this.gamma = event.gamma || 0;
    this._hasOrientation = true;
    this.sensorActive = true;
    this.mode = 'tilt';
  }

  handleMotion(event) {
    // Gravity-excluded acceleration is the cleanest shake signal. Some
    // browsers leave it null, in which case fall back to the total vector
    // minus 1g, which is close enough for a threshold test.
    const a = event.acceleration;
    let mag;
    if (a && (a.x !== null || a.y !== null || a.z !== null)) {
      mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    } else {
      const t = event.accelerationIncludingGravity;
      if (!t) return;
      mag = Math.abs(Math.hypot(t.x || 0, t.y || 0, t.z || 0) - 9.81);
    }
    this.shakeMagnitude = mag;

    // If deviceorientation never arrives (rare, but some Android builds only
    // ship devicemotion) treat motion as proof the sensors are alive.
    if (!this._hasOrientation && event.accelerationIncludingGravity) {
      this.sensorActive = true;
      if (this.mode === 'keys') this.mode = 'motion';
    }

    // Picking the phone up and putting it down spikes the accelerometer well
    // past the shake threshold, so shakes stay disarmed for the first moments.
    if (this._age < CONFIG.input.shakeArmDelay) return;

    if (mag > CONFIG.input.shakeThreshold && this._shakeCooldown <= 0) {
      this._shakeCooldown = CONFIG.input.shakeCooldown;
      const strength = clamp(mag / CONFIG.input.shakeThreshold, 1, 3);
      if (this.onShake) this.onShake(strength);
    }
  }

  setKey(code, down) {
    if (down) this.keys.add(code); else this.keys.delete(code);
  }

  /** Screen rotation, normalised to degrees clockwise from natural. */
  readScreenAngle() {
    const so = screen.orientation;
    if (so && typeof so.angle === 'number') return ((so.angle % 360) + 360) % 360;
    if (typeof window.orientation === 'number') {
      return ((window.orientation % 360) + 360) % 360;
    }
    return 0;
  }

  /** Target direction from tilt, keys, stick, or the demo sway. */
  targetVector() {
    const zBias = CONFIG.input.zBias;

    if (this.demo) {
      // Roughly what a hand does: a lazy roll, never fully on its side.
      return normalise(
        Math.sin(this.demoPhase) * 0.6,
        Math.cos(this.demoPhase * 0.63) * 0.35 + 0.65,
        zBias,
        true,
      );
    }

    let kx = 0;
    let ky = 0;
    const k = this.keys;
    if (k.has('ArrowLeft') || k.has('KeyA')) kx -= 1;
    if (k.has('ArrowRight') || k.has('KeyD')) kx += 1;
    if (k.has('ArrowUp') || k.has('KeyW')) ky -= 1;
    if (k.has('ArrowDown') || k.has('KeyS')) ky += 1;
    if (kx || ky) return normalise(kx, ky, zBias, true);

    if (this.stick.active) return normalise(this.stick.x, this.stick.y, zBias, true);

    if (this.sensorActive && this._hasOrientation) {
      const b = this.beta * DEG;
      const g = this.gamma * DEG;
      const cb = Math.cos(b);
      let dx = Math.sin(g) * cb;
      let dy = Math.sin(b);
      const dz = cb * Math.cos(g); // into the screen; unaffected by rotation

      // Rotate device x/y into CSS axes when the screen is not upright.
      const angle = this.screenAngle * DEG;
      if (angle) {
        const c = Math.cos(angle);
        const s = Math.sin(angle);
        const rx = dx * c + dy * s;
        const ry = -dx * s + dy * c;
        dx = rx;
        dy = ry;
      }
      if (this.flipped) {
        dx = -dx;
        dy = -dy;
      }
      return { x: dx, y: dy, z: dz };
    }

    // No input at all: rest against the bottom and back wall.
    return normalise(0, 1, zBias, true);
  }

  update(dt) {
    this._age += dt;
    if (this._shakeCooldown > 0) this._shakeCooldown -= dt;
    this.screenAngle = this.readScreenAngle();
    if (this.demo) this.demoPhase += dt * 0.9;

    const target = this.targetVector();
    const rate = target.keys ? CONFIG.input.keySmoothing : CONFIG.input.tiltSmoothing;
    this.gx = approach(this.gx, target.x, rate, dt);
    this.gy = approach(this.gy, target.y, rate, dt);
    this.gz = approach(this.gz, target.z, rate, dt);
  }

  describe() {
    if (this.demo) return 'demo sway';
    if (this.stick.active) return 'stick';
    if (this.keys.size) return 'keys';
    if (this.sensorActive) return this._hasOrientation ? 'tilt' : 'motion';
    return 'idle';
  }
}

function normalise(x, y, z, keys) {
  const m = Math.hypot(x, y, z) || 1;
  return { x: x / m, y: y / m, z: z / m, keys };
}

// ---- src/poke.js ----
// Multi-touch / mouse pushing. Tracks live pointers in CSS sim coordinates and
// hands the sim one poke per pointer per frame, including the pointer's own
// velocity so dragging sweeps grains along.
//
// Presses are captured on the canvas but moves and releases are tracked on the
// window: a release that lands outside the canvas (or gets swallowed by a system
// gesture on a phone) would otherwise leave a phantom finger shoving the bed
// forever.

class PokeInput {
  constructor(canvas) {
    this.canvas = canvas;
    this.pointers = new Map();
    this.onFirstTouch = null;

    canvas.addEventListener('pointerdown', (e) => this.down(e));
    window.addEventListener('pointermove', (e) => this.move(e));
    window.addEventListener('pointerup', (e) => this.up(e));
    window.addEventListener('pointercancel', (e) => this.up(e));
    // A drag interrupted mid-flight still has to release the pointer.
    window.addEventListener('blur', () => this.pointers.clear());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.pointers.clear();
    });
    // Belt and braces alongside touch-action:none in CSS.
    canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  locate(event) {
    const rect = this.canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  down(event) {
    const p = this.locate(event);
    this.pointers.set(event.pointerId, { x: p.x, y: p.y, dx: 0, dy: 0 });
    if (this.onFirstTouch) this.onFirstTouch();
  }

  move(event) {
    const entry = this.pointers.get(event.pointerId);
    if (!entry) return;
    const p = this.locate(event);
    entry.dx = p.x - entry.x;
    entry.dy = p.y - entry.y;
    entry.x = p.x;
    entry.y = p.y;
  }

  up(event) {
    this.pointers.delete(event.pointerId);
  }

  get active() {
    return this.pointers.size > 0;
  }

  apply(sand, dt) {
    if (this.pointers.size === 0) return;
    const invDt = 1 / Math.max(dt, 1e-3);
    for (const entry of this.pointers.values()) {
      // dx/dy are this frame's displacement; hand the sim a velocity.
      sand.poke(entry.x, entry.y, entry.dx * invDt, entry.dy * invDt, dt);
      // Decay so a held-still finger keeps pushing but stops dragging.
      entry.dx *= 0.6;
      entry.dy *= 0.6;
    }
  }
}

// ---- src/tuner.js ----
// Adaptive quality. Watches a rolling frame time and scales the grain count so
// the same page runs on a five-year-old phone and a desktop GPU without either
// being sandbagged. Steps are small and rate-limited so the bed does not visibly
// pop while it settles on a number.


class Tuner {
  constructor() {
    this.scale = 1;
    this.frameMs = 16.7;
    this.fps = 60;
    this.enabled = true;
    this._accum = 0;
    this._frames = 0;
    this._cooldown = 1;
    this._fpsAccum = 0;
    this._fpsFrames = 0;
  }

  /**
   * Called once per frame with the measured work time and the real delta.
   * `eligible` marks frames where the sim actually did work — idle frames
   * (dormant bed) still feed the fps display but never the quality decision,
   * and they flush the sample window so stale numbers don't linger.
   */
  sample(workMs, dt, eligible = true) {
    this.frameMs += (workMs - this.frameMs) * 0.1;
    this._fpsAccum += dt;
    this._fpsFrames++;
    if (this._fpsAccum >= 0.5) {
      this.fps = this._fpsFrames / this._fpsAccum;
      this._fpsAccum = 0;
      this._fpsFrames = 0;
    }

    if (this._cooldown > 0) this._cooldown -= dt;
    if (!eligible) {
      this._accum = 0;
      this._frames = 0;
      return false;
    }
    this._accum += workMs;
    this._frames++;

    const cfg = CONFIG.tuner;
    if (this._frames < cfg.sampleFrames) return false;
    const avg = this._accum / this._frames;
    this._accum = 0;
    this._frames = 0;
    if (!this.enabled || this._cooldown > 0) return false;

    let next = this.scale;
    if (avg > cfg.hiMs) next = this.scale * (1 - cfg.step);
    else if (avg < cfg.loMs) next = this.scale * (1 + cfg.step);
    next = clamp(next, cfg.minScale, cfg.maxScale);
    if (Math.abs(next - this.scale) < 1e-4) return false;

    this.scale = next;
    this._cooldown = cfg.cooldown;
    return true;
  }
}

// ---- src/hud.js ----
// DOM overlay: the hint line, the stats panel, the tilt-permission prompt, and
// the virtual tilt stick shown when no sensors are available.

class Hud {
  constructor(root) {
    this.root = root;
    this.hint = root.querySelector('#hint');
    this.stats = root.querySelector('#stats');
    this.gate = root.querySelector('#gate');
    this.gateButton = root.querySelector('#gate-button');
    this.gateNote = root.querySelector('#gate-note');
    this.stick = root.querySelector('#stick');
    this.knob = root.querySelector('#knob');
    this.fatal = root.querySelector('#fatal');

    this.statsVisible = false;
    this.onStick = null;
    this._hintTimer = 0;
    this._statsTimer = 0;
    this.bindStick();
  }

  setHint(text) {
    this.hint.textContent = text;
    this.hint.classList.remove('faded');
    this._hintTimer = 7;
  }

  showGate(text, note, onClick) {
    this.gateNote.textContent = note || '';
    this.gateButton.textContent = text;
    this.gate.classList.add('visible');
    this.gateButton.onclick = async () => {
      this.gateButton.disabled = true;
      const ok = await onClick();
      this.gateButton.disabled = false;
      if (ok) this.hideGate();
      else this.gateNote.textContent = 'Sensors unavailable — using the tilt stick instead.';
    };
  }

  hideGate() {
    this.gate.classList.remove('visible');
  }

  toggleStats(force) {
    this.statsVisible = force === undefined ? !this.statsVisible : force;
    this.stats.classList.toggle('visible', this.statsVisible);
  }

  showStick(visible) {
    this.stick.classList.toggle('visible', visible);
  }

  fail(message) {
    this.fatal.textContent = message;
    this.fatal.classList.add('visible');
  }

  bindStick() {
    const state = { id: null };
    const send = (event) => {
      const rect = this.stick.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const reach = rect.width / 2;
      let dx = (event.clientX - cx) / reach;
      let dy = (event.clientY - cy) / reach;
      const m = Math.hypot(dx, dy);
      if (m > 1) {
        dx /= m;
        dy /= m;
      }
      this.knob.style.transform = `translate(${dx * reach * 0.55}px, ${dy * reach * 0.55}px)`;
      if (this.onStick) this.onStick(dx, dy, true);
    };

    this.stick.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      state.id = e.pointerId;
      this.stick.setPointerCapture(e.pointerId);
      send(e);
    });
    this.stick.addEventListener('pointermove', (e) => {
      if (state.id !== e.pointerId) return;
      e.stopPropagation();
      send(e);
    });
    const release = (e) => {
      if (state.id !== e.pointerId) return;
      state.id = null;
      this.knob.style.transform = 'translate(0px, 0px)';
      if (this.onStick) this.onStick(0, 1, false);
    };
    this.stick.addEventListener('pointerup', release);
    this.stick.addEventListener('pointercancel', release);
  }

  update(dt, info) {
    if (this._hintTimer > 0) {
      this._hintTimer -= dt;
      if (this._hintTimer <= 0) this.hint.classList.add('faded');
    }
    if (!this.statsVisible) return;
    this._statsTimer -= dt;
    if (this._statsTimer > 0) return;
    this._statsTimer = 0.25;

    const rows = [
      ['fps', info.fps.toFixed(0)],
      ['work', info.workMs.toFixed(1) + ' ms'],
      ['grains', String(info.grains)],
      ['asleep', String(info.asleep)],
      ['radius', info.radius.toFixed(2) + ' px'],
      ['depth', Math.round(info.depth) + ' px'],
      ['solve', `${info.substeps}×${info.iterations}`],
      ['pairs', formatCount(info.pairs)],
      ['quality', info.scale.toFixed(2) + '×'],
      ['gravity', `${info.gx.toFixed(2)}, ${info.gy.toFixed(2)}, ${info.gz.toFixed(2)}`],
      ['source', info.source],
      ['beta/gamma', `${info.beta.toFixed(0)}° / ${info.gamma.toFixed(0)}°`],
      ['screen', info.screenAngle + '°' + (info.flipped ? ' flipped' : '')],
      ['shake', info.shake.toFixed(1)],
      ['viewport', `${Math.round(info.width)}×${Math.round(info.height)} @${info.dpr}x`],
      ['backend', info.backend],
    ];
    if (info.error) rows.push(['note', info.error]);

    this.stats.innerHTML = rows
      .map(([k, v]) => `<span class="k">${k}</span><span class="v">${escapeHtml(v)}</span>`)
      .join('');
  }
}

function formatCount(n) {
  if (n > 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n > 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(Math.round(n));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

// ---- src/main.js ----
// Wiring: viewport -> box size, input -> gravity, frame loop, adaptive quality.


const params = new URLSearchParams(location.search);
const canvas = document.getElementById('stage');
const hud = new Hud(document.getElementById('ui'));

let renderer;
try {
  renderer = new Renderer(canvas, CONFIG.bed.maxGrains, params.has('capture'));
} catch (err) {
  hud.fail(String(err && err.message ? err.message : err));
  throw err;
}

const sand = new Sand(CONFIG.bed.maxGrains);
const gravity = new GravityInput();
const poke = new PokeInput(canvas);
const tuner = new Tuner();

const touch = isTouchDevice();
const forcedGrains = intParam('grains');
const forcedRadius = floatParam('r');
if (forcedGrains) tuner.enabled = false;
if (params.has('demo')) gravity.demo = true;
if (params.has('flip')) gravity.flipped = true;
if (params.has('stats')) hud.toggleStats(true);

let viewWidth = 0;
let viewHeight = 0;
let radius = 4;
let lastFrame = performance.now();
let sensorWatchdog = 0;
let stickForced = params.has('stick');
// Set by the , / . keys so a later resize does not undo a manual grain size.
let forcedRadiusOverride = 0;

function intParam(name) {
  const v = parseInt(params.get(name) || '', 10);
  return Number.isFinite(v) && v > 0 ? v : 0;
}

function floatParam(name) {
  const v = parseFloat(params.get(name) || '');
  return Number.isFinite(v) && v > 0 ? v : 0;
}

function measureViewport() {
  const rect = canvas.getBoundingClientRect();
  return {
    width: Math.max(120, rect.width || window.innerWidth),
    height: Math.max(120, rect.height || window.innerHeight),
  };
}

function grainRadius(width, height) {
  if (forcedRadiusOverride) return forcedRadiusOverride;
  if (forcedRadius) return forcedRadius;
  const g = CONFIG.grain;
  const base = clamp(Math.min(width, height) / g.divisor, g.minRadius, g.maxRadius);
  // Performance headroom buys *finer* grains, never a deeper bed: count always
  // fills the same volume, so the amount of sand looks constant per device.
  // Count goes with 1/r^3 in a 3D box, hence the cube root.
  return clamp(base / Math.cbrt(tuner.scale), g.minRadius, g.maxRadius);
}

function targetCount() {
  return forcedGrains ? Math.min(forcedGrains, sand.capacity) : sand.idealCount();
}

/** Re-derive grain size and count after a quality or viewport change. */
function applyQuality() {
  radius = grainRadius(viewWidth, viewHeight);
  sand.configure(viewWidth, viewHeight, radius);
  sand.setCount(targetCount());
}

function layout(initial) {
  const { width, height } = measureViewport();
  const changedALot =
    Math.abs(width - viewWidth) > viewWidth * 0.12 ||
    Math.abs(height - viewHeight) > viewHeight * 0.12;

  viewWidth = width;
  viewHeight = height;
  radius = grainRadius(width, height);
  renderer.resize(width, height);
  sand.configure(width, height, radius);

  if (initial) {
    sand.fill(targetCount());
  } else {
    sand.clampToBounds();
    if (changedALot) sand.setCount(targetCount());
  }
}

function reset() {
  sand.fill(targetCount());
}

layout(true);

// ---------------------------------------------------------------- input setup

gravity.onShake = (strength) => sand.splash(strength);

hud.onStick = (x, y, active) => {
  gravity.stick.x = x;
  gravity.stick.y = y;
  gravity.stick.active = active;
};

if (touch && gravity.supportsSensors && !gravity.demo) {
  if (!GravityInput.secureContext) {
    gravity.lastError = 'Motion sensors need https (or localhost).';
    stickForced = true;
