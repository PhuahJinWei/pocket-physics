    gl.vertexAttribPointer(this.attrib.pos, 3, gl.FLOAT, false, STRIDE, 0);
    gl.vertexAttribPointer(this.attrib.shade, 3, gl.FLOAT, false, STRIDE, 12);
    gl.vertexAttribPointer(this.attrib.jitter, 2, gl.FLOAT, false, STRIDE, 24);

    const r = CONFIG.render;
    gl.uniform1f(this.uniform.spread, r.speckSpread);
    gl.uniform1f(this.uniform.vary, r.speckVariation);
    gl.uniform1f(this.uniform.patchScale, r.patchScale);
    gl.uniform1f(this.uniform.patchAmp, r.patchAmp);
    gl.uniform1f(this.uniform.glint, r.glintStrength);
    gl.uniform1f(this.uniform.glintRate, r.glintRate);
    gl.uniform1f(this.uniform.airShrink, r.airShrink);
    gl.uniform3fv(this.uniform.deep, r.deep);
    gl.uniform3fv(this.uniform.mid, r.mid);
    gl.uniform3fv(this.uniform.lit, r.lit);
  }

  /**
   * Box interior: four walls running from the viewport edge (z=0) back to an
   * inset rectangle (z=depth), plus the back plane. Shaded by facing — the
   * floor catches the light, the ceiling is in shadow — and darkened toward the
   * back so each wall carries a recession gradient of its own.
   */
  buildWalls(w, h, depth) {
    const key = `${w}|${h}|${depth}`;
    if (key === this.wallKey) return;
    this.wallKey = key;

    const L = CONFIG.render.wallShade;
    const back = CONFIG.render.wallBackFalloff;
    const d = this.wallData;
    let o = 0;
    // Each quad: front-left, front-right, back-right, back-left (in its plane).
    const quad = (ax, ay, bx, by, shade) => {
      const f = shade;
      const b = shade * back;
      const v = [
        ax, ay, 0, f,
        bx, by, 0, f,
        bx, by, depth, b,
        ax, ay, 0, f,
        bx, by, depth, b,
        ax, ay, depth, b,
      ];
      for (let i = 0; i < v.length; i++) d[o++] = v[i];
    };

    quad(0, 0, w, 0, L.ceiling);   // top
    quad(w, 0, w, h, L.right);     // right
    quad(w, h, 0, h, L.floor);     // bottom
    quad(0, h, 0, 0, L.left);      // left
    // Back plane, flat at z = depth.
    const bp = L.back * back;
    const v = [
      0, 0, depth, bp,
      w, 0, depth, bp,
      w, h, depth, bp,
      0, 0, depth, bp,
      w, h, depth, bp,
      0, h, depth, bp,
    ];
    for (let i = 0; i < v.length; i++) d[o++] = v[i];

    const gl = this.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.wallBuffer);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, d);
  }

  drawWalls(depth, focal, eyeX, eyeY) {
    const gl = this.gl;
    this.buildWalls(this.width, this.height, depth);

    gl.useProgram(this.wallProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.wallBuffer);
    gl.enableVertexAttribArray(this.wallAttrib.pos);
    gl.enableVertexAttribArray(this.wallAttrib.shade);
    gl.vertexAttribPointer(this.wallAttrib.pos, 3, gl.FLOAT, false, 16, 0);
    gl.vertexAttribPointer(this.wallAttrib.shade, 1, gl.FLOAT, false, 16, 12);

    gl.uniform2f(this.wallUniform.viewport, this.width, this.height);
    gl.uniform1f(this.wallUniform.focal, focal);
    gl.uniform2f(this.wallUniform.eye, this.width * 0.5 + eyeX, this.height * 0.5 + eyeY);
    gl.uniform3fv(this.wallUniform.color, CONFIG.render.wallColor);
    gl.drawArrays(gl.TRIANGLES, 0, 30);

    // Hand the pipeline back to the grain program.
    gl.disableVertexAttribArray(this.wallAttrib.shade);
    gl.useProgram(this.program);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
    for (const loc of Object.values(this.attrib)) {
      if (loc >= 0) gl.enableVertexAttribArray(loc);
    }
    gl.vertexAttribPointer(this.attrib.pos, 3, gl.FLOAT, false, STRIDE, 0);
    gl.vertexAttribPointer(this.attrib.shade, 3, gl.FLOAT, false, STRIDE, 12);
    gl.vertexAttribPointer(this.attrib.jitter, 2, gl.FLOAT, false, STRIDE, 24);
  }

  /** Returns true when the backing store changed size. */
  resize(cssWidth, cssHeight) {
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.render.maxDpr);
    const w = Math.max(1, Math.round(cssWidth * dpr));
    const h = Math.max(1, Math.round(cssHeight * dpr));
    this.width = cssWidth;
    this.height = cssHeight;
    this.dpr = dpr;
    if (this.canvas.width === w && this.canvas.height === h) return false;
    this.canvas.width = w;
    this.canvas.height = h;
    this.gl.viewport(0, 0, w, h);
    return true;
  }

  draw(sand) {
    const gl = this.gl;
    if (this.contextLost) return;

    this.ensureGrainStyle(sand.diameter);

    gl.clear(gl.COLOR_BUFFER_BIT);
    const focal = CONFIG.render.focal * Math.min(this.width, this.height);
    // Box first: the sand always lives inside it, so no depth test is needed.
    this.drawWalls(sand.depth, focal, this.eyeX, this.eyeY);

    const n = sand.n;
    if (n === 0) return;

    // Counting sort by z bucket, deepest first, so the pack order is
    // back-to-front for the grain pass.
    const { bucketOf, drawOrder, bucketStart } = this;
    const zScale = BUCKETS / Math.max(sand.depth, 1e-3);
    const zArr = sand.z;
    bucketStart.fill(0);
    for (let i = 0; i < n; i++) {
      let b = (zArr[i] * zScale) | 0;
      if (b < 0) b = 0; else if (b >= BUCKETS) b = BUCKETS - 1;
      bucketOf[i] = b;
      bucketStart[b + 1]++;
    }
    // Prefix from the deep end: bucket 31 packs first.
    let acc = 0;
    for (let b = BUCKETS - 1; b >= 0; b--) {
      const c = bucketStart[b + 1];
      bucketStart[b + 1] = acc;
      acc += c;
    }
    // bucketStart[b+1] now holds the running start for bucket b; place items.
    for (let i = 0; i < n; i++) drawOrder[bucketStart[bucketOf[i] + 1]++] = i;

    const cpu = this.cpu;
    const { x, y, light, speed01, airborne, sizeJitter, hueJitter } = sand;
    for (let k = 0; k < n; k++) {
      const i = drawOrder[k];
      const o = k * FLOATS_PER_GRAIN;
      cpu[o] = x[i];
      cpu[o + 1] = y[i];
      cpu[o + 2] = zArr[i];
      cpu[o + 3] = light[i];
      cpu[o + 4] = speed01[i];
      cpu[o + 5] = airborne[i];
      cpu[o + 6] = sizeJitter[i];
      cpu[o + 7] = hueJitter[i];
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
    const floats = n * FLOATS_PER_GRAIN;
    if (this.isWebGL2) {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, cpu, 0, floats);
    } else {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, cpu.subarray(0, floats));
    }

    const px = sand.diameter * this.dpr;
    gl.uniform2f(this.uniform.viewport, this.width, this.height);
    gl.uniform1f(this.uniform.time, (performance.now() - this.t0) * 0.001);
    gl.uniform1f(this.uniform.speck, this.speckRadius);
    // An isolated grain draws as one speck the size of the grain itself. The
    // sprite is clusterSize x the grain, and the alpha falloff makes the solid
    // core about 1.6x the speck radius, so this lands the visible speck on the
    // true grain diameter whatever the screen.
    gl.uniform1f(this.uniform.airSpeck, 0.5 / (CONFIG.render.clusterSize * 1.6));
    gl.uniform1f(this.uniform.focal, focal);
    gl.uniform2f(this.uniform.eye, this.width * 0.5 + this.eyeX, this.height * 0.5 + this.eyeY);
    gl.uniform1f(this.uniform.depthRange, sand.depth);
    gl.uniform1f(this.uniform.depthDim, CONFIG.render.depthDim);

    // Single grain pass, back-to-front. No additive halo: real sand does not
    // glow, and the crevices between specks are supposed to be dark.
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1f(this.uniform.pointSize, px * CONFIG.render.clusterSize);
    gl.drawArrays(gl.POINTS, 0, n);
  }
}

function buildProgram(gl, vsSource, fsSource) {
  const vs = compile(gl, gl.VERTEX_SHADER, vsSource);
  const fs = compile(gl, gl.FRAGMENT_SHADER, fsSource);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error('Shader link failed: ' + gl.getProgramInfoLog(program));
  }
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  return program;
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error('Shader compile failed: ' + gl.getShaderInfoLog(shader));
  }
  return shader;
}

// ---- src/gravity.js ----
// Where "down" is — a 3D vector, since the box has depth, and one whose
// magnitude matters as much as its direction.
//
// Phone: the accelerometer's whole vector, because a box being carried is a
// non-inertial frame. Its contents feel gravity *plus* a pseudo-force opposing
// however the box is being accelerated, which is precisely what
// accelerationIncludingGravity reads. Orientation alone would give only the
// direction of down, so a flick would rotate gravity smoothly and the sand
// would slide over and stop dead — no slosh. deviceorientation is still read,
// as the fallback and to calibrate the accelerometer's sign (iOS and Android
// disagree about it, and guessing wrong inverts every push).
//
// Desktop / no sensors: arrow keys, WASD, or the on-screen stick, with a fixed
// into-screen bias so the bed leans against the back wall and reads as 3D.
//
// Deriving gravity from beta/gamma: the device->earth rotation is
// Rz(alpha)Rx(beta)Ry(gamma), so earth-down expressed in device axes is
//   d = (sin g cos b, -sin b, -cos g cos b)
// Device +y points up the screen while CSS +y points down, and device +z points
// out of the screen while box +z points into it, so in box space
//   gx = sin(gamma) * cos(beta)
//   gy = sin(beta)
//   gz = cos(beta) * cos(gamma)
// Held upright in portrait (beta 90) that is (0,1,0): straight down the screen.
// Flat on a table it is (0,0,1): into the screen, so the sand settles against
// the back wall and spreads out — which is exactly what a real box would do.


const DEG = Math.PI / 180;

class GravityInput {
  constructor() {
    // Smoothed unit-ish vector in box space, consumed by the sim.
    this.gx = 0;
    this.gy = 1;
    this.gz = CONFIG.input.zBias;
    // Raw sensor readings, surfaced in the stats panel for on-device debugging.
    this.beta = 0;
    this.gamma = 0;
    this.screenAngle = 0;
    this.shakeMagnitude = 0;
    // Raw accelerometer vector (device axes) and how stale it is. This is the
    // *specific force*: gravity plus whatever the hand is doing to the box.
    this.ax = 0; this.ay = 0; this.az = 0;
    this.accelAge = 99;
    // Platform sign for accelerationIncludingGravity, worked out by comparing
    // it against the orientation-derived gravity while the device is still.
    // iOS and Android disagree, and guessing wrong inverts every push.
    this.accelSign = 0;
    this._signVotes = 0;
    this.gForce = 1;
    this.mode = 'keys';
    this.sensorActive = false;
    this.flipped = false;
    this.lastError = '';

    this.onShake = null;
    this.keys = new Set();
    this.stick = { x: 0, y: 0, active: false };
    this.demo = false;
    this.demoPhase = 0;

    this._age = 0;
    this._shakeCooldown = 0;
    this._hasOrientation = false;
    this._boundOrientation = (e) => this.handleOrientation(e);
    this._boundMotion = (e) => this.handleMotion(e);
  }

  /**
   * iOS needs requestPermission() from inside a user gesture; everyone else can
   * just subscribe. Returns true when sensor events are flowing.
   */
  async enableSensors() {
    const MotionEvent = window.DeviceMotionEvent;
    const OrientationEvent = window.DeviceOrientationEvent;
    if (!OrientationEvent && !MotionEvent) {
      this.lastError = 'No motion sensors on this device.';
      return false;
    }
    try {
      if (OrientationEvent && typeof OrientationEvent.requestPermission === 'function') {
        const state = await OrientationEvent.requestPermission();
        if (state !== 'granted') {
          this.lastError = 'Motion access denied.';
          return false;
        }
      }
      if (MotionEvent && typeof MotionEvent.requestPermission === 'function') {
        await MotionEvent.requestPermission().catch(() => {});
      }
    } catch (err) {
      // Thrown when not called from a gesture, or on a non-secure origin.
      this.lastError = String(err && err.message ? err.message : err);
      return false;
    }
    this.attach();
    return true;
  }

  attach() {
    window.addEventListener('deviceorientation', this._boundOrientation, { passive: true });
    window.addEventListener('devicemotion', this._boundMotion, { passive: true });
  }

  detach() {
    window.removeEventListener('deviceorientation', this._boundOrientation);
    window.removeEventListener('devicemotion', this._boundMotion);
  }

  /** Sensors need a secure context; plain http over LAN silently never fires. */
  static get secureContext() {
    return window.isSecureContext !== false;
  }

  get supportsSensors() {
    return !!(window.DeviceOrientationEvent || window.DeviceMotionEvent);
  }

  get requiresGesture() {
    const E = window.DeviceOrientationEvent;
    return !!(E && typeof E.requestPermission === 'function') || isIOS();
  }

  handleOrientation(event) {
    if (event.beta === null && event.gamma === null) return;
    this.beta = event.beta || 0;
    this.gamma = event.gamma || 0;
    this._hasOrientation = true;
    this.sensorActive = true;
    this.mode = 'tilt';
  }

  handleMotion(event) {
    // Gravity-excluded acceleration is the cleanest shake signal. Some
    // browsers leave it null, in which case fall back to the total vector
    // minus 1g, which is close enough for a threshold test.
    const total = event.accelerationIncludingGravity;
    if (total && (total.x !== null || total.y !== null || total.z !== null)) {
      this.ax = total.x || 0;
      this.ay = total.y || 0;
      this.az = total.z || 0;
      this.accelAge = 0;
      this.calibrateAccelSign();
    }

    const a = event.acceleration;
    let mag;
    if (a && (a.x !== null || a.y !== null || a.z !== null)) {
      mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    } else {
      if (!total) return;
      mag = Math.abs(Math.hypot(this.ax, this.ay, this.az) - 9.81);
    }
    this.shakeMagnitude = mag;

    // If deviceorientation never arrives (rare, but some Android builds only
    // ship devicemotion) treat motion as proof the sensors are alive.
    if (!this._hasOrientation && event.accelerationIncludingGravity) {
      this.sensorActive = true;
      if (this.mode === 'keys') this.mode = 'motion';
    }

    // Picking the phone up and putting it down spikes the accelerometer well
    // past the shake threshold, so shakes stay disarmed for the first moments.
    if (this._age < CONFIG.input.shakeArmDelay) return;

    if (mag > CONFIG.input.shakeThreshold && this._shakeCooldown <= 0) {
      this._shakeCooldown = CONFIG.input.shakeCooldown;
      const strength = clamp(mag / CONFIG.input.shakeThreshold, 1, 3);
      if (this.onShake) this.onShake(strength);
    }
  }

  /**
   * Decide which way round accelerationIncludingGravity points on this device,
   * by comparing it with the orientation-derived gravity while the phone is
   * near enough to still that the reading *is* gravity. Needs a few agreeing
   * samples so one noisy frame cannot flip it.
   */
  calibrateAccelSign() {
    if (this.accelSign !== 0 || !this._hasOrientation) return;
    const mag = Math.hypot(this.ax, this.ay, this.az);
    if (mag < 8.6 || mag > 11.0) return; // moving: this is not pure gravity
    const b = this.beta * DEG;
    const g = this.gamma * DEG;
    const cb = Math.cos(b);
    // Earth-down in device axes.
    const dx = Math.sin(g) * cb;
    const dy = -Math.sin(b);
    const dz = -Math.cos(g) * cb;
    const dot = (this.ax * dx + this.ay * dy + this.az * dz) / mag;
    if (Math.abs(dot) < 0.75) return; // too oblique to be sure
    this._signVotes += dot > 0 ? 1 : -1;
    if (this._signVotes >= 4) this.accelSign = 1;
    else if (this._signVotes <= -4) this.accelSign = -1;
  }

  /**
   * Effective gravity in box space, in g units, from the accelerometer.
   *
   * A box being carried is a non-inertial frame: its contents feel gravity plus
   * a pseudo-force opposing however the box is being accelerated — which is
   * exactly what an accelerometer reads. Driving the sim from orientation alone
   * gives only the direction of down, so flicking the device just rotates
   * gravity smoothly and the sand slides over and stops. Feeding the whole
   * vector in is what makes it slosh: the flick throws the sand, and stopping
   * the flick throws it back.
   */
  accelVector() {
    const sign = this.accelSign || -1; // spec convention until proven otherwise
    let dx = sign * this.ax;
    let dy = sign * this.ay;
    let dz = sign * this.az;
    // Device axes -> box axes: screen y runs down, box z runs into the screen.
    let gx = dx / 9.81;
    let gy = -dy / 9.81;
    const gz = -dz / 9.81;

    const angle = this.screenAngle * DEG;
    if (angle) {
      const c = Math.cos(angle);
      const sn = Math.sin(angle);
      const rx = gx * c + gy * sn;
      const ry = -gx * sn + gy * c;
      gx = rx;
      gy = ry;
    }
    if (this.flipped) {
      gx = -gx;
      gy = -gy;
    }

    // A hard shake can read several g; allow it, but not unboundedly.
    const m = Math.hypot(gx, gy, gz);
    const cap = CONFIG.input.maxG;
    if (m > cap) {
      const k = cap / m;
      gx *= k; gy *= k;
      return { x: gx, y: gy, z: gz * k, mag: cap };
    }
    return { x: gx, y: gy, z: gz, mag: m };
  }

  setKey(code, down) {
    if (down) this.keys.add(code); else this.keys.delete(code);
  }

  /** Screen rotation, normalised to degrees clockwise from natural. */
  readScreenAngle() {
    const so = screen.orientation;
    if (so && typeof so.angle === 'number') return ((so.angle % 360) + 360) % 360;
    if (typeof window.orientation === 'number') {
      return ((window.orientation % 360) + 360) % 360;
    }
    return 0;
  }

  /** Target direction from tilt, keys, stick, or the demo sway. */
  targetVector() {
    const zBias = CONFIG.input.zBias;

    if (this.demo) {
      // Roughly what a hand does: a lazy roll, never fully on its side.
      return normalise(
        Math.sin(this.demoPhase) * 0.6,
        Math.cos(this.demoPhase * 0.63) * 0.35 + 0.65,
        zBias,
        true,
      );
    }

    let kx = 0;
    let ky = 0;
    const k = this.keys;
    if (k.has('ArrowLeft') || k.has('KeyA')) kx -= 1;
    if (k.has('ArrowRight') || k.has('KeyD')) kx += 1;
    if (k.has('ArrowUp') || k.has('KeyW')) ky -= 1;
    if (k.has('ArrowDown') || k.has('KeyS')) ky += 1;
    if (kx || ky) return normalise(kx, ky, zBias, true);

    if (this.stick.active) return normalise(this.stick.x, this.stick.y, zBias, true);

    // Live accelerometer: use the whole vector, motion included.
    if (this.sensorActive && this.accelAge < CONFIG.input.accelTimeout) {
      const v = this.accelVector();
      this.gForce = +v.mag.toFixed(2);
      return { x: v.x, y: v.y, z: v.z, motion: true };
    }

    if (this.sensorActive && this._hasOrientation) {
      const b = this.beta * DEG;
      const g = this.gamma * DEG;
      const cb = Math.cos(b);
      let dx = Math.sin(g) * cb;
      let dy = Math.sin(b);
      const dz = cb * Math.cos(g); // into the screen; unaffected by rotation

      // Rotate device x/y into CSS axes when the screen is not upright.
      const angle = this.screenAngle * DEG;
      if (angle) {
        const c = Math.cos(angle);
        const s = Math.sin(angle);
        const rx = dx * c + dy * s;
        const ry = -dx * s + dy * c;
        dx = rx;
        dy = ry;
      }
      if (this.flipped) {
        dx = -dx;
        dy = -dy;
      }
      return { x: dx, y: dy, z: dz };
    }

    // No input at all: rest against the bottom and back wall.
    return normalise(0, 1, zBias, true);
  }

  update(dt) {
    this._age += dt;
    this.accelAge += dt;
    if (this._shakeCooldown > 0) this._shakeCooldown -= dt;
    this.screenAngle = this.readScreenAngle();
    if (this.demo) this.demoPhase += dt * 0.9;

    const target = this.targetVector();
    // Motion needs a light hand: smoothing that hides accelerometer noise also
    // hides the flick that makes the sand slosh.
    const rate = target.keys
      ? CONFIG.input.keySmoothing
      : target.motion ? CONFIG.input.motionSmoothing : CONFIG.input.tiltSmoothing;
    this.gx = approach(this.gx, target.x, rate, dt);
    this.gy = approach(this.gy, target.y, rate, dt);
    this.gz = approach(this.gz, target.z, rate, dt);
  }

  describe() {
    if (this.demo) return 'demo sway';
    if (this.stick.active) return 'stick';
    if (this.keys.size) return 'keys';
    if (this.sensorActive) {
      if (this.accelAge < CONFIG.input.accelTimeout) return 'accel ' + this.gForce.toFixed(1) + 'g';
      return this._hasOrientation ? 'tilt' : 'motion';
    }
    return 'idle';
  }
}

function normalise(x, y, z, keys) {
  const m = Math.hypot(x, y, z) || 1;
  return { x: x / m, y: y / m, z: z / m, keys };
}

// ---- src/poke.js ----
// Multi-touch / mouse pushing. Tracks live pointers in CSS sim coordinates and
// hands the sim one poke per pointer per frame, including the pointer's own
// velocity so dragging sweeps grains along.
//
// Presses are captured on the canvas but moves and releases are tracked on the
// window: a release that lands outside the canvas (or gets swallowed by a system
// gesture on a phone) would otherwise leave a phantom finger shoving the bed
// forever.

class PokeInput {
  constructor(canvas) {
    this.canvas = canvas;
    this.pointers = new Map();
    this.onFirstTouch = null;

    canvas.addEventListener('pointerdown', (e) => this.down(e));
    window.addEventListener('pointermove', (e) => this.move(e));
    window.addEventListener('pointerup', (e) => this.up(e));
    window.addEventListener('pointercancel', (e) => this.up(e));
    // A drag interrupted mid-flight still has to release the pointer.
    window.addEventListener('blur', () => this.pointers.clear());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.pointers.clear();
    });
    // Belt and braces alongside touch-action:none in CSS.
    canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  locate(event) {
    const rect = this.canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  down(event) {
    const p = this.locate(event);
    this.pointers.set(event.pointerId, { x: p.x, y: p.y, dx: 0, dy: 0 });
    if (this.onFirstTouch) this.onFirstTouch();
  }

  move(event) {
    const entry = this.pointers.get(event.pointerId);
    if (!entry) return;
    const p = this.locate(event);
    entry.dx = p.x - entry.x;
    entry.dy = p.y - entry.y;
    entry.x = p.x;
    entry.y = p.y;
  }

  up(event) {
    this.pointers.delete(event.pointerId);
  }

  get active() {
    return this.pointers.size > 0;
  }

  apply(sand, dt) {
    if (this.pointers.size === 0) return;
    const invDt = 1 / Math.max(dt, 1e-3);
    for (const entry of this.pointers.values()) {
      // dx/dy are this frame's displacement; hand the sim a velocity.
      sand.poke(entry.x, entry.y, entry.dx * invDt, entry.dy * invDt, dt);
      // Decay so a held-still finger keeps pushing but stops dragging.
      entry.dx *= 0.6;
      entry.dy *= 0.6;
    }
  }
}

// ---- src/tuner.js ----
// Adaptive quality — a floor, not a target.
//
// Grain size comes from the screen size alone, and that is the look. This only
// steps in when a device demonstrably cannot sustain it, coarsening grains
// until it can. It never refines: the designed look is the ceiling, so the app
// looks the same on every load and on every device that can afford it, and no
// grain is ever spawned into a bed the user is already looking at.


class Tuner {
  constructor() {
    // 1 = the designed grain size. Only ever decreases.
    this.scale = 1;
    this.frameMs = 16.7;
    this.fps = 60;
    this.enabled = CONFIG.tuner.enabled;
    this._accum = 0;
    this._frames = 0;
    this._cooldown = CONFIG.tuner.warmup;
    this._fpsAccum = 0;
    this._fpsFrames = 0;
  }

  /**
   * Called once per frame with the measured work time and the real delta.
   * `eligible` marks frames where the sim actually did work — a dormant bed
   * costs almost nothing, and letting those frames into the average would hide
   * the expensive sloshing frames this is meant to catch.
   *
   * Returns true when the caller should re-apply quality.
   */
  sample(workMs, dt, eligible = true) {
    this.frameMs += (workMs - this.frameMs) * 0.1;
    this._fpsAccum += dt;
    this._fpsFrames++;
    if (this._fpsAccum >= 0.5) {
      this.fps = this._fpsFrames / this._fpsAccum;
      this._fpsAccum = 0;
      this._fpsFrames = 0;
    }

    if (this._cooldown > 0) this._cooldown -= dt;
    if (!eligible) {
      this._accum = 0;
      this._frames = 0;
      return false;
    }
    this._accum += workMs;
    this._frames++;

    const cfg = CONFIG.tuner;
    if (this._frames < cfg.sampleFrames) return false;
    const avg = this._accum / this._frames;
    this._accum = 0;
    this._frames = 0;
    if (!this.enabled || this._cooldown > 0) return false;
    if (avg <= cfg.hiMs) return false;

    const next = clamp(this.scale * (1 - cfg.step), cfg.minScale, 1);
    if (Math.abs(next - this.scale) < 1e-4) return false;

    this.scale = next;
    this._cooldown = cfg.cooldown;
    return true;
  }
}

// ---- src/hud.js ----
// DOM overlay: the hint line, the stats panel, the tilt-permission prompt, and
// the virtual tilt stick shown when no sensors are available.

class Hud {
  constructor(root) {
    this.root = root;
    this.hint = root.querySelector('#hint');
    this.stats = root.querySelector('#stats');
    this.gate = root.querySelector('#gate');
    this.gateButton = root.querySelector('#gate-button');
    this.gateNote = root.querySelector('#gate-note');
    this.stick = root.querySelector('#stick');
    this.knob = root.querySelector('#knob');
    this.fatal = root.querySelector('#fatal');

    this.statsVisible = false;
    this.onStick = null;
    this._hintTimer = 0;
    this._statsTimer = 0;
    this.bindStick();
  }

  setHint(text) {
    this.hint.textContent = text;
    this.hint.classList.remove('faded');
    this._hintTimer = 7;
  }

  showGate(text, note, onClick) {
    this.gateNote.textContent = note || '';
    this.gateButton.textContent = text;
    this.gate.classList.add('visible');
    this.gateButton.onclick = async () => {
      this.gateButton.disabled = true;
      const ok = await onClick();
      this.gateButton.disabled = false;
      if (ok) this.hideGate();
      else this.gateNote.textContent = 'Sensors unavailable — using the tilt stick instead.';
    };
  }

  hideGate() {
    this.gate.classList.remove('visible');
  }

  toggleStats(force) {
    this.statsVisible = force === undefined ? !this.statsVisible : force;
    this.stats.classList.toggle('visible', this.statsVisible);
  }

  showStick(visible) {
    this.stick.classList.toggle('visible', visible);
  }

  fail(message) {
    this.fatal.textContent = message;
    this.fatal.classList.add('visible');
  }

  bindStick() {
    const state = { id: null };
    const send = (event) => {
      const rect = this.stick.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const reach = rect.width / 2;
      let dx = (event.clientX - cx) / reach;
      let dy = (event.clientY - cy) / reach;
      const m = Math.hypot(dx, dy);
      if (m > 1) {
        dx /= m;
        dy /= m;
      }
      this.knob.style.transform = `translate(${dx * reach * 0.55}px, ${dy * reach * 0.55}px)`;
      if (this.onStick) this.onStick(dx, dy, true);
    };

    this.stick.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      state.id = e.pointerId;
      this.stick.setPointerCapture(e.pointerId);
      send(e);
    });
    this.stick.addEventListener('pointermove', (e) => {
      if (state.id !== e.pointerId) return;
      e.stopPropagation();
      send(e);
    });
    const release = (e) => {
      if (state.id !== e.pointerId) return;
      state.id = null;
      this.knob.style.transform = 'translate(0px, 0px)';
      if (this.onStick) this.onStick(0, 1, false);
    };
    this.stick.addEventListener('pointerup', release);
    this.stick.addEventListener('pointercancel', release);
  }

  update(dt, info) {
    if (this._hintTimer > 0) {
      this._hintTimer -= dt;
      if (this._hintTimer <= 0) this.hint.classList.add('faded');
    }
    if (!this.statsVisible) return;
    this._statsTimer -= dt;
    if (this._statsTimer > 0) return;
    this._statsTimer = 0.25;

    const rows = [
      ['fps', info.fps.toFixed(0)],
      ['work', info.workMs.toFixed(1) + ' ms'],
      ['grains', String(info.grains)],
      ['contacts', formatCount(info.contacts)],
      ['radius', info.radius.toFixed(2) + ' px'],
      ['depth', Math.round(info.depth) + ' px'],
      ['solve', `${info.substeps}×${info.iterations}`],
      ['quality', info.scale.toFixed(2) + '×'],
      ['gravity', `${info.gx.toFixed(2)}, ${info.gy.toFixed(2)}, ${info.gz.toFixed(2)}`],
      ['source', info.source],
      ['beta/gamma', `${info.beta.toFixed(0)}° / ${info.gamma.toFixed(0)}°`],
      ['screen', info.screenAngle + '°' + (info.flipped ? ' flipped' : '')],
      ['shake', info.shake.toFixed(1)],
      ['viewport', `${Math.round(info.width)}×${Math.round(info.height)} @${info.dpr}x`],
      ['backend', info.backend],
    ];
    if (info.error) rows.push(['note', info.error]);

    this.stats.innerHTML = rows
      .map(([k, v]) => `<span class="k">${k}</span><span class="v">${escapeHtml(v)}</span>`)
      .join('');
  }
}

function formatCount(n) {
  if (n > 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n > 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(Math.round(n));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

// ---- src/main.js ----
// Wiring: viewport -> box size, input -> gravity, frame loop, adaptive quality.


const params = new URLSearchParams(location.search);
const canvas = document.getElementById('stage');
const hud = new Hud(document.getElementById('ui'));

let renderer;
try {
  renderer = new Renderer(canvas, CONFIG.bed.maxGrains, params.has('capture'));
} catch (err) {
  hud.fail(String(err && err.message ? err.message : err));
  throw err;
}

const sand = new Grains(CONFIG.bed.maxGrains);
const gravity = new GravityInput();
const poke = new PokeInput(canvas);
const tuner = new Tuner();

const touch = isTouchDevice();
const forcedGrains = intParam('grains');
const forcedRadius = floatParam('r');
if (forcedGrains || params.get('tune') === 'off') tuner.enabled = false;
if (params.has('demo')) gravity.demo = true;
if (params.has('flip')) gravity.flipped = true;
if (params.has('stats')) hud.toggleStats(true);

let viewWidth = 0;
let viewHeight = 0;
let radius = 4;
let lastFrame = performance.now();
let sensorWatchdog = 0;
let stickForced = params.has('stick');
// Set by the , / . keys so a later resize does not undo a manual grain size.
let forcedRadiusOverride = 0;

function intParam(name) {
  const v = parseInt(params.get(name) || '', 10);
  return Number.isFinite(v) && v > 0 ? v : 0;
}

function floatParam(name) {
  const v = parseFloat(params.get(name) || '');
  return Number.isFinite(v) && v > 0 ? v : 0;
}

function measureViewport() {
  const rect = canvas.getBoundingClientRect();
  return {
    width: Math.max(120, rect.width || window.innerWidth),
    height: Math.max(120, rect.height || window.innerHeight),
  };
}

function grainRadius(width, height) {
  if (forcedRadiusOverride) return forcedRadiusOverride;
  if (forcedRadius) return forcedRadius;
  const g = CONFIG.grain;
  const base = clamp(Math.min(width, height) / g.divisor, g.minRadius, g.maxRadius);
  // Performance headroom buys *finer* grains, never a deeper bed: count always
  // fills the same volume, so the amount of sand looks constant per device.
  // Count goes with 1/r^3 in a 3D box, hence the cube root.
  return clamp(base / Math.cbrt(tuner.scale), g.minRadius, g.maxRadius);
}

function targetCount() {
  if (forcedGrains) return Math.min(forcedGrains, sand.capacity);
  const ideal = sand.idealCount();
  // On a large screen the wanted grain radius exceeds maxRadius and gets
  // pinned there — and since the tuner coarsens by *growing* grains, pinning
  // leaves it with no lever at all: it drops quality, nothing changes, and the
  // device just runs slow forever. When that happens, trade bed depth instead.
  const g = CONFIG.grain;
  const pinned = Math.min(viewWidth, viewHeight) / g.divisor >= g.maxRadius;
  return pinned ? Math.round(ideal * Math.min(1, tuner.scale)) : ideal;
}

/**
 * Re-derive grain size and count after a quality or viewport change.
 * `allowGrowth` is false for tuner-driven changes: the tuner may only coarsen,
 * so a step that would add grains means something is wrong, and adding sand to
 * a bed the user is watching is exactly the surprise we are avoiding.
 */
function applyQuality(allowGrowth = true) {
  radius = grainRadius(viewWidth, viewHeight);
  sand.configure(viewWidth, viewHeight, radius);
  const target = targetCount();
  sand.setCount(allowGrowth ? target : Math.min(target, sand.n));
}

function layout(initial) {
  const { width, height } = measureViewport();
  const changedALot =
    Math.abs(width - viewWidth) > viewWidth * 0.12 ||
    Math.abs(height - viewHeight) > viewHeight * 0.12;

  viewWidth = width;
  viewHeight = height;
  radius = grainRadius(width, height);
  renderer.resize(width, height);
  sand.configure(width, height, radius);

  if (initial) {
    sand.fill(targetCount());
  } else {
    sand.clampToBounds();
    if (changedALot) sand.setCount(targetCount());
  }
}

function reset() {
  sand.fill(targetCount());
}

layout(true);

// ---------------------------------------------------------------- input setup

gravity.onShake = (strength) => sand.splash(strength);

hud.onStick = (x, y, active) => {
  gravity.stick.x = x;
  gravity.stick.y = y;
  gravity.stick.active = active;
};

if (touch && gravity.supportsSensors && !gravity.demo) {
  if (!GravityInput.secureContext) {
    gravity.lastError = 'Motion sensors need https (or localhost).';
    stickForced = true;
  } else if (gravity.requiresGesture) {
    hud.showGate('Enable tilt', 'iOS needs a tap before it will share motion data.', () =>
      gravity.enableSensors(),
    );
  } else {
    gravity.attach();
  }
}

const HINT = touch
  ? 'Tilt to pour · touch to push · shake to splash'
  : 'Arrows / WASD to tilt · drag to push · space to splash · ` for stats';
hud.setHint(HINT);

poke.onFirstTouch = () => {
  // A tap is a gesture, so it is also a chance to ask for sensors on iOS.
  if (touch && !gravity.sensorActive && gravity.requiresGesture && GravityInput.secureContext) {
    gravity.enableSensors();
  }
};

// Movement keys feed the gravity vector; everything else is an action. Note
// WASD is reserved for tilting, so stats sits on backquote rather than D.
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  gravity.setKey(e.code, true);
  // Before the switch: the movement keys fall through to `default` and would
  // otherwise never get here.
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  switch (e.code) {
    case 'Space': sand.splash(1.4); break;
    case 'KeyR': reset(); break;
    case 'Backquote': hud.toggleStats(); break;
    case 'KeyH': hud.setHint(HINT); break;
    case 'KeyF': gravity.flipped = !gravity.flipped; break;
    case 'KeyJ':
      stickForced = !stickForced;
      hud.showStick(stickForced);
      break;
    case 'BracketLeft':
    case 'BracketRight': {
      tuner.enabled = false;
      const k = e.code === 'BracketRight' ? 1.25 : 0.8;
      sand.setCount(Math.round(sand.n * k));
      break;
    }
    case 'Comma':
    case 'Period': {
      const k = e.code === 'Period' ? 1.15 : 0.87;
      radius = clamp(radius * k, 1.6, 14);
      forcedRadiusOverride = radius;
      sand.configure(viewWidth, viewHeight, radius);
      sand.setCount(targetCount());
      break;
    }
    default: break;
  }
}, { passive: false });

window.addEventListener('keyup', (e) => gravity.setKey(e.code, false));
window.addEventListener('blur', () => gravity.keys.clear());

let resizeTimer = 0;
function scheduleLayout() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => layout(false), 120);
}
window.addEventListener('resize', scheduleLayout);
window.addEventListener('orientationchange', scheduleLayout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleLayout);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) lastFrame = performance.now();
});

// ------------------------------------------------------------------ main loop

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrame) / 1000, 1 / 30);
  lastFrame = now;
  if (dt <= 0) return;

  const t0 = performance.now();

  gravity.update(dt);
  const magnitude = sand.gravityMagnitude;
  poke.apply(sand, dt);
  sand.step(dt, gravity.gx * magnitude, gravity.gy * magnitude, gravity.gz * magnitude);

  // Parallax: shift the projection eye against the tilt, so tipping the device
  // lets you peek around the grains — a cheap but convincing depth cue.
  const P = CONFIG.render.parallax;
  renderer.eyeX = -gravity.gx * P;
  renderer.eyeY = -gravity.gy * P;
  renderer.draw(sand);

  const workMs = performance.now() - t0;

  if (tuner.sample(workMs, dt) && !forcedGrains && !forcedRadius) {
    applyQuality(false);
  }

  // If sensors never came alive on a touch device, offer the stick instead.
  if (touch && !gravity.sensorActive && !gravity.demo && sensorWatchdog < 3) {
    sensorWatchdog += dt;
    if (sensorWatchdog >= 3) stickForced = true;
  }
  hud.showStick(stickForced || (!touch && gravity.stick.active));

  hud.update(dt, {
    fps: tuner.fps,
    workMs,
    grains: sand.n,
    contacts: sand.contactCount,
    radius,
    depth: sand.depth,
    substeps: sand.substeps,
    iterations: sand.iterations,
    scale: tuner.scale,
    gx: gravity.gx,
    gy: gravity.gy,
    gz: gravity.gz,
    source: gravity.describe(),
    beta: gravity.beta,
    gamma: gravity.gamma,
    screenAngle: gravity.screenAngle,
    flipped: gravity.flipped,
    shake: gravity.shakeMagnitude,
    width: viewWidth,
    height: viewHeight,
    dpr: renderer.dpr,
    backend: renderer.backend,
    error: gravity.lastError,
  });
}

requestAnimationFrame(frame);

// Handy from a console or a remote debugger: window.SILT.sand.splash(2) etc.
window.SILT = { sand, gravity, poke, tuner, renderer, hud, reset, applyQuality, CONFIG };

})();
</script>
