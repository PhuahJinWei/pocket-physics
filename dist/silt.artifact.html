<title>Silt — tilt sand</title>
<style>
/* Full-bleed dark stage. The canvas is position:fixed so mobile browser chrome
   showing and hiding never triggers a layout fight over 100vh. */

:root {
  --ink: #e8e0d0;
  --dim: rgba(226, 213, 189, 0.55);
  --panel: rgba(24, 20, 15, 0.78);
  --edge: rgba(214, 190, 150, 0.16);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #050403;
  color: var(--ink);
  font: 500 13px/1.45 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

/* Sells the "inside a device" look and hides the hard canvas edge. */
#vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(125% 85% at 50% 45%, transparent 62%, rgba(0, 0, 0, 0.38) 100%),
    linear-gradient(to bottom, rgba(255, 226, 170, 0.04), transparent 22%);
  mix-blend-mode: multiply;
}
#vignette::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 1px rgba(230, 205, 160, 0.2);
  mix-blend-mode: screen;
}

#hint {
  position: absolute;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  max-width: min(92vw, 520px);
  padding: 7px 14px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 900ms ease;
}
#hint.faded { opacity: 0; }

#stats {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  left: 12px;
  display: none;
  grid-template-columns: auto auto;
  gap: 1px 12px;
  padding: 10px 12px;
  border: 1px solid var(--edge);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  font-size: 11px;
  line-height: 1.5;
}
#stats.visible { display: grid; }
#stats .k { color: var(--dim); }
#stats .v { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }

#gate {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: rgba(5, 4, 3, 0.72);
  backdrop-filter: blur(3px);
  pointer-events: auto;
}
#gate.visible { display: flex; }

#gate-button {
  padding: 14px 26px;
  border: 1px solid rgba(224, 194, 140, 0.4);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(160, 120, 60, 0.55), rgba(80, 58, 28, 0.55));
  color: #f6eedd;
  font: inherit;
  font-size: 15px;
  letter-spacing: 0.03em;
  cursor: pointer;
  box-shadow: 0 0 32px rgba(220, 170, 90, 0.22);
}
#gate-button:disabled { opacity: 0.5; }
#gate-note {
  margin: 0;
  max-width: 70vw;
  color: var(--dim);
  font-size: 12px;
  text-align: center;
}

/* Virtual tilt pad, shown when the device has no usable motion sensors. */
#stick {
  position: absolute;
  left: 50%;
  bottom: calc(62px + env(safe-area-inset-bottom));
  width: 108px;
  height: 108px;
  margin-left: -54px;
  display: none;
  border: 1px solid var(--edge);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(66, 52, 32, 0.5), rgba(20, 16, 10, 0.35));
  pointer-events: auto;
  touch-action: none;
}
#stick.visible { display: block; }
#knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42px;
  height: 42px;
  margin: -21px 0 0 -21px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f2e3c2, #b98a45 60%, #5e421e);
  box-shadow: 0 0 18px rgba(230, 180, 100, 0.45);
  transition: transform 80ms ease-out;
}

#fatal {
  position: absolute;
  inset: auto 16px 50% 16px;
  display: none;
  padding: 16px;
  border: 1px solid rgba(255, 120, 120, 0.4);
  border-radius: 10px;
  background: rgba(40, 10, 14, 0.85);
  color: #ffd8d8;
  font-size: 13px;
  text-align: center;
}
#fatal.visible { display: block; }

@media (prefers-reduced-motion: reduce) {
  #knob, #hint { transition: none; }
}

</style>
<canvas id="stage"></canvas>

<div id="ui">
  <div id="vignette"></div>
  <div id="hint"></div>
  <div id="stats"></div>

  <div id="gate">
    <button id="gate-button" type="button">Enable tilt</button>
    <p id="gate-note"></p>
  </div>

  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <div id="fatal"></div>
</div>
<script>
(function () {
'use strict';

// ---- src/config.js ----
// Every tunable in one place. Values are in CSS pixels and seconds; the sim is
// resolution independent and the renderer scales by devicePixelRatio.

const CONFIG = {
  bed: {
    // Fraction of the screen height the settled bed should fill (front view).
    // Grain count is derived from this so the look is constant across devices.
    // Keep it shallow: pile depth is what the contact solver has to hold up,
    // and a bed much deeper than this starts sinking into itself no matter how
    // many iterations it gets. It also matches the reference hardware, whose
    // bed is only a shallow layer.
    fill: 0.22,
    // Depth of the box behind the glass, in grain diameters. This is the Z the
    // screen is a window into; deeper looks better but costs grains cubically.
    depthLayers: 5.0,
    // 3D random-close-packing density, converts bed volume -> grain count.
    packing: 0.64,
    minGrains: 400,
    maxGrains: 60000,
  },

  grain: {
    // radius = min(viewport) / divisor, clamped. 3D needs chunkier grains than
    // 2D did (count scales steeply with 1/r), but the default should look like
    // sand, not marbles — slow devices are the tuner's problem, not a tax the
    // designed look pays up front.
    divisor: 76,
    minRadius: 2.8,
    maxRadius: 9.5,
    // Radius spread around the mean. Identical spheres crystallise into a
    // regular lattice as they settle — visible as a woven grid across the bed —
    // and real sand never does exactly because its grains all differ.
    polydispersity: 0.18,
  },

  // Velocity-level sequential impulses. See src/grains.js for the reasoning
  // behind the velocity/position split — it is the whole basis of the solver.
  sim: {
    // Gravity magnitude = gravityScale * viewport diagonal (px/s^2). A phone
    // screen is ~50 px/cm, so true gravity would be ~50000 px/s^2; well below
    // that still reads as "falling through honey". This is the main knob for
    // how brisk and alive the sand feels.
    gravityScale: 7.0,
    // The solver runs on a fixed timestep so the feel never depends on frame
    // rate. Keep maxSubsteps tight: catch-up is a feedback loop, because a slow
    // frame hands the next step a bigger dt, which buys *more* substeps and
    // makes it slower again. Capped, a struggling device runs the sim slightly
    // slow-motion instead of spiralling — measured 37fps -> 60fps here.
    // 120Hz x 3 substeps = 25ms of simulated time available per frame, so the
    // sim stays real-time on anything holding 40fps. At 150Hz the budget was
    // 20ms, and a wide window (which maximises grain count AND gravity) dropped
    // below that mid-splash — the sim then runs in slow motion, and a splash
    // that rains out in half a second becomes seconds of drifting mist.
    fixedHz: 120,
    maxSubsteps: 3,
    // Contacts are found this far apart (fraction of a diameter) and the solver
    // then limits approach speed to the remaining gap. Detecting only actual
    // overlap leaves a grain resting exactly on a surface with no contact at
    // all — the floor stops holding the bed up and it sinks straight through.
    contactMargin: 0.05,
    // Extra reach (fraction of a diameter) baked into the contact list so it
    // survives several substeps. Finding pairs costs far more than solving
    // them, so the list is rebuilt at most once a frame — and only when some
    // grain has moved half the skin.
    skin: 0.35,
    // Grid cell size as a multiple of grain diameter; must exceed the largest
    // pair's list radius (1 + polydispersity + skin) so the 3x3x3 scan cannot
    // truncate the speculative band for the biggest grains.
    cellMul: 1.6,
    // Gauss-Seidel sweeps. Velocity iterations buy stacking stiffness (a deep
    // pile needs more); position iterations only clean up leftover overlap.
    velocityIterations: 6,
    // Bottom-up sweeps treating the supported side as ground. One is usually
    // enough and it is what lets a deep bed stand up at all.
    shockIterations: 1,
    // Approach speed (grain diameters per second) above which a contact is an
    // impact rather than a resting stack, and is left to the momentum-
    // conserving solver so it can spray instead of being absorbed.
    shockMaxApproach: 5,
    positionIterations: 3,
    // Fraction of excess penetration removed per position iteration.
    positionBeta: 0.15,
    // Overlap left uncorrected, as a fraction of a diameter. A little slack
    // here is what lets a settled bed stop fidgeting entirely.
    slop: 0.02,
    // Ceiling on one position correction, so a deep overlap unwinds over a few
    // steps instead of teleporting.
    maxCorrection: 0.08,
    // Coulomb friction. Grain-on-grain sets the angle of repose, which lands
    // well above atan(mu) because spheres have to climb out of each other's
    // pockets to move: 0.28 gives ~34°, which is real sand. Only meaningful
    // because friction is warm started — without that the solver never builds
    // enough of it to hold a slope, and the value barely matters.
    friction: 0.28,
    // Wall friction has to stay LOW and is the single most surprising knob in
    // here. The box is only a few grains deep, so roughly half of them touch
    // the glass or the back wall at any moment — at sand-on-sand values the
    // walls grip the entire bed and it rides out a 50° tilt as one rigid slab,
    // no matter what grain friction says.
    wallFriction: 0.12,
    // Bounce on impact, and the approach speed (grain diameters per second)
    // below which a contact counts as resting and does not bounce at all.
    // Sand grains barely bounce individually, but with none whatsoever a slosh
    // hits the far wall and dies instead of washing back.
    restitution: 0.3,
    restitutionCut: 6,
    // Per-second velocity decay. Keep it genuinely small: at 0.4 a slosh had
    // lost a third of its speed within a second, which flattened the rebound.
    // Warm starting is what quiets the bed now, so this does not have to.
    airDrag: 0.1,
    // Hard speed ceiling, in grain diameters travelled per substep.
    maxTravel: 1.0,
    // Neighbour search radius for shading, as a multiple of grain diameter.
    shadeRadius: 1.15,
    // Divisor for the "how buried am I" term (sum of upward contact dots).
    coverNorm: 2.4,
    // Fraction of a grain's brightness that reaches the grain beneath it.
    lightTransmit: 0.93,
    lightSmoothing: 18,
    // A shake is modelled as the box being jerked: a body acceleration added
    // to gravity for a moment, in multiples of gravity, rather than a velocity
    // handed to each grain. See Grains.splash — writing velocities is what
    // turns a splash into a dust cloud, because per-grain velocity is relative
    // velocity, and relative velocity is what pulls a packed bed apart.
    // The floor matters more than it looks: a pulse too weak to lift the bed
    // clear of the ground leaves part of it supported while the rest rises, so
    // the bed shears against itself and goes loose. Measured at strength 1,
    // 2.6g left 5.7% of grains isolated and 3.4g left 0.5%. Once airborne
    // every grain shares the same gravity, so the mass travels rigid — the
    // dispersion only ever happens during a half-hearted launch.
    splashAccel: 3.4,
    // Added per unit of shake strength above 1. Deliberately shallow: a hard
    // shake should hit harder, but the strong end is already well clear of the
    // threshold and a linear scaling just throws sand into the ceiling.
    splashGain: 0.8,
    // Seconds the pulse lasts. Long enough to launch the bed, short enough to
    // read as a jerk rather than a change in gravity.
    splashDuration: 0.09,
    // How far the jerk tips off the gravity axis, so shakes differ and the
    // sand heaves sideways rather than hopping straight up.
    splashLean: 0.45,
  },

  render: {
    maxDpr: 2,
    // Sprite sizes as multiples of grain diameter. The grain sprite draws a
    // cluster of small matte specks rather than one ball, which is what makes
    // the sand look finer than the physics actually is — visual grain size is
    // speckRadius * clusterSize * diameter, not the physics diameter.
    clusterSize: 1.5,
    // Speck size on screen, in CSS px — held constant across devices. The
    // physics grain scales with the viewport (and is clamped), so on a wide
    // screen each sprite is nearly twice the phone's size; a fixed speck count
    // and ratio made the sand coarsest exactly where there was most room to
    // see it. The renderer picks the per-sprite speck count from this and
    // speckCoverage, rebuilding the shader when it changes.
    speckPx: 3.4,
    speckCoverage: 0.72,
    speckSpread: 1.2,
    // Airborne grains barely shrink now: the fragment shader draws them as a
    // single grain-sized speck, so shrinking the sprite on top would make a
    // flying grain smaller than it physically is.
    airShrink: 0.05,
    // Brightness scatter between specks; the grain-to-grain variation that
    // stops a bed reading as one smooth surface.
    speckVariation: 0.3,
    // Spatial patchiness: real sand varies in correlated patches (minerals,
    // moisture), not grain by grain. Scale is the patch size in CSS px.
    patchScale: 52,
    patchAmp: 0.09,
    // Sand glints as facets catch the light. Brief flashes on a few specks at
    // a time — cheap, and it does a lot of the work of selling the material.
    glintStrength: 0.16,
    glintRate: 1.2,
    // Perspective: focal length as a multiple of min(viewport w, h). Smaller =
    // more dramatic depth. Parallax shifts the eye against tilt, in px.
    // Shorter focal = more aggressive convergence toward the back. Parallax is
    // how far the eye slides against the tilt; it is the strongest depth cue
    // available on a phone because it is coupled to the hand.
    focal: 1.0,
    depthDim: 0.55,
    parallax: 65,
    // Box interior. Shaded by facing under the same light as the sand: the
    // floor catches it, the ceiling is in shadow. Back vertices are multiplied
    // by wallBackFalloff so every wall recedes into darkness.
    // Kept deliberately dim. The box only has to be *implied* — measured
    // against a background of 5/255, the old values put the floor at 67 and
    // the right wall at 57, so the empty half of the box read as a lit brown
    // panel competing with the sand. Halved, the walls sit at 2-7x the
    // background: enough to place the corners, not enough to look at.
    wallColor: [0.15, 0.125, 0.095],
    // Right was nearly as bright as the floor, which is what made the far wall
    // pop. Pulled closer to the left face, keeping some asymmetry so the box
    // still reads as lit from one side.
    wallShade: { floor: 1.0, ceiling: 0.42, left: 0.5, right: 0.58, back: 0.55 },
    wallBackFalloff: 0.55,
    background: [0.02, 0.017, 0.014],
    // Dry quartz: crevice-shadow brown for buried grains, tan through the
    // body, pale warm cream where the surface catches the light.
    deep: [0.21, 0.16, 0.115],
    mid: [0.55, 0.44, 0.30],
    lit: [0.91, 0.83, 0.66],
  },

  input: {
    // Gravity direction smoothing, per second. Motion gets a much lighter hand
    // than orientation: smoothing heavy enough to hide accelerometer noise also
    // hides the flick that makes the sand slosh.
    tiltSmoothing: 14,
    motionSmoothing: 45,
    keySmoothing: 8,
    // How long an accelerometer reading stays trusted before falling back to
    // orientation, and the ceiling on how many g a shake may apply.
    accelTimeout: 0.4,
    maxG: 4.0,
    // Fixed into-screen gravity bias for keyboard/stick/demo input, so the bed
    // leans against the back wall and the box reads as 3D on desktop too.
    zBias: 0.45,
    // m/s^2 of gravity-excluded acceleration that counts as a shake, and how
    // long after load before shakes are armed (picking the phone up spikes the
    // accelerometer hard enough to read as several shakes otherwise).
    shakeThreshold: 13,
    shakeCooldown: 0.35,
    shakeArmDelay: 1.5,
    // Finger/mouse push. The radius is a fraction of the shorter screen edge,
    // not a pixel count: fixed at 46px it reached about a hundred grains on a
    // desktop and read as a pinprick.
    pokeRadiusFrac: 0.22,
    pokeRadiusMin: 54,
    // Push strength in gravities. A packed bed absorbs a weak push completely
    // — the solver removes it as fast as it goes in, so velocity never
    // accumulates — and the old fixed 2600 (a fifth of a g on a large screen)
    // moved the sand by a *seventh of one grain* however wide the touch area
    // was. It has to be gravity-relative for the same reason the radius has to
    // be screen-relative: gravityScale follows the screen diagonal, so a fixed
    // number lands differently on every device. Past roughly 5g the travel
    // clamp caps grain speed anyway, so more strength only widens the crater.
    pokeAccel: 4.5,
    pokeDrag: 0.85,
  },

  tuner: {
    // Downscale-only safety net, not an optimiser. Grain size is chosen from
    // the screen alone, and that is the ceiling: the tuner may coarsen grains
    // on a device that cannot keep up, and never refines past the designed
    // look. Refining was the wrong idea twice over — it made the app look
    // different depending on the GPU, and "more detail" means spawning grains,
    // which is visible as sand appearing out of nowhere seconds after load.
    //
    // Consequence: it never adds grains, so it can no longer disturb a settled
    // bed. A device that coarsens stays coarse until reload, which is a fair
    // trade for a look that never changes on its own.
    enabled: true,
    // Only sustained trouble counts — comfortably past a 60fps budget so a
    // stray spike or a background tab never triggers it.
    hiMs: 19,
    sampleFrames: 60,
    cooldown: 2.5,
    // Ignore the first seconds entirely. Every load opens with the bed
    // avalanching into place with nothing asleep yet — the most expensive
    // moment the app ever has, and an atypical one. Judging on it coarsened
    // the look on hardware that then ran the actual scene at a steady 60fps.
    warmup: 4.5,
    step: 0.18,
    // Coarsest allowed, as a fraction of the designed grain count.
    minScale: 0.22,
  },
};

// ---- src/grid.js ----
// Uniform 3D spatial hash, built with a counting sort. Allocation-free after
// warm-up. Purely a lookup structure — it knows nothing about the physics.
//
// Cells are x-major then y then z: index (cz * rows + cy) * cols + cx.

class Grid {
  constructor(capacity) {
    this.cols = 0;
    this.rows = 0;
    this.slabs = 0;
    this.cellCount = 0;
    this.cellSize = 1;
    this.cellStart = new Int32Array(1);
    this.cursor = new Int32Array(1);
    this.order = new Int32Array(capacity);
    this.cellOf = new Int32Array(capacity);
    this.grainOrder = new Int32Array(capacity);
  }

  ensureCapacity(n) {
    if (this.order.length >= n) return;
    this.order = new Int32Array(n);
    this.cellOf = new Int32Array(n);
    this.grainOrder = new Int32Array(n);
  }

  configure(width, height, depth, cellSize) {
    this.cellSize = cellSize;
    this.cols = Math.max(1, Math.ceil(width / cellSize));
    this.rows = Math.max(1, Math.ceil(height / cellSize));
    this.slabs = Math.max(1, Math.ceil(depth / cellSize));
    this.cellCount = this.cols * this.rows * this.slabs;
    if (this.cellStart.length < this.cellCount + 1) {
      this.cellStart = new Int32Array(this.cellCount + 1);
      this.cursor = new Int32Array(this.cellCount + 1);
    }
  }

  build(x, y, z, n) {
    const cols = this.cols;
    const rows = this.rows;
    const slabs = this.slabs;
    const layer = cols * rows;
    const cells = this.cellCount;
    const start = this.cellStart;
    const cursor = this.cursor;
    const cellOf = this.cellOf;
    const order = this.order;
    const inv = 1 / this.cellSize;

    start.fill(0, 0, cells + 1);

    for (let i = 0; i < n; i++) {
      let cx = (x[i] * inv) | 0;
      let cy = (y[i] * inv) | 0;
      let cz = (z[i] * inv) | 0;
      if (cx < 0) cx = 0; else if (cx >= cols) cx = cols - 1;
      if (cy < 0) cy = 0; else if (cy >= rows) cy = rows - 1;
      if (cz < 0) cz = 0; else if (cz >= slabs) cz = slabs - 1;
      const c = cz * layer + cy * cols + cx;
      cellOf[i] = c;
      start[c + 1]++;
    }
    for (let c = 0; c < cells; c++) start[c + 1] += start[c];

    cursor.set(start.subarray(0, cells + 1));
    for (let i = 0; i < n; i++) order[cursor[cellOf[i]]++] = i;
  }

  /**
   * Grain indices ordered deepest-first along a direction. Solving contacts in
   * this order lets a single Gauss-Seidel sweep carry support all the way up
   * through a pile, instead of one layer per iteration.
   */
  orderByGravity(gx, gy, gz, n) {
    const axes = [
      { len: this.cols, stride: 1, g: gx },
      { len: this.rows, stride: this.cols, g: gy },
      { len: this.slabs, stride: this.cols * this.rows, g: gz },
    ];
    axes.sort((a, b) => Math.abs(b.g) - Math.abs(a.g));
    for (const a of axes) {
      a.start = a.g >= 0 ? a.len - 1 : 0;
      a.step = a.g >= 0 ? -1 : 1;
    }

    const [a0, a1, a2] = axes;
    const start = this.cellStart;
    const order = this.order;
    const out = this.grainOrder;
    let k = 0;
    for (let i0 = 0; i0 < a0.len; i0++) {
      const o0 = (a0.start + i0 * a0.step) * a0.stride;
      for (let i1 = 0; i1 < a1.len; i1++) {
        const o1 = o0 + (a1.start + i1 * a1.step) * a1.stride;
        for (let i2 = 0; i2 < a2.len; i2++) {
          const c = o1 + (a2.start + i2 * a2.step) * a2.stride;
          const e = start[c + 1];
          for (let s = start[c]; s < e; s++) out[k++] = order[s];
        }
      }
    }
    return out;
  }
}

// ---- src/util.js ----
// Small shared helpers. Kept dependency-free so it can sit at the root of the
// module graph (the bundler relies on that ordering).

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

/** Frame-rate independent exponential approach: rate is "per second". */
function approach(current, target, rate, dt) {
  return current + (target - current) * (1 - Math.exp(-rate * dt));
}

/** Deterministic 32-bit PRNG so a given seed always lays out the same bed. */
function makeRandom(seed) {
  let s = seed >>> 0 || 1;
  return function random() {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

function isTouchDevice() {
  return (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
}

/** iOS (including iPadOS, which reports itself as a Mac with touch). */
function isIOS() {
  const ua = navigator.userAgent;
  return /iPad|iPhone|iPod/.test(ua) ||
    (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
}

// ---- src/grains.js ----
// Granular solver: velocity-level sequential impulses in a shallow 3D box.
//
// The screen is the front glass; the box extends a few grain diameters in Z.
// Grains are equal-mass spheres with no rotational degree of freedom, so
// friction is pure sliding friction. Radii are **polydisperse** (a spread
// around the mean): identical spheres crystallise into a regular lattice the
// moment they settle — visible as a woven grid across the whole bed — and no
// amount of jitter keeps them from finding it again. Real sand never
// crystallises for exactly this reason.
//
// Each fixed substep:
//   1. gravity and drag into velocity
//   2. find contacts (grain-grain and box walls)
//   3. VELOCITY pass — Gauss-Seidel impulses: non-penetration, then Coulomb
//      friction capped by the normal impulse accumulated so far
//   4. clamp speed, integrate positions
//   5. POSITION pass — push apart whatever is still overlapping
//
// The split between 3 and 5 is the load-bearing design decision. An impulse can
// only ever remove kinetic energy, so contacts cannot manufacture motion; and
// the position pass repairs penetration WITHOUT writing back into velocity, so
// geometry never becomes energy either. Resolving overlap by moving grains and
// then re-deriving velocity from that movement — the obvious approach — pumps
// energy into every contact and boils the bed, which no amount of damping,
// sleeping or clamping can fully hide.
//
// Because nothing injects energy, the bed comes to rest on its own. There is no
// sleep system: every grain integrates every step, so tilt response is
// immediate and flow is continuous.
//
// Contacts are solved deepest-first along gravity, so one sweep propagates
// support from the floor up through the whole pile.


class Grains {
  constructor(capacity) {
    this.capacity = capacity;
    this.n = 0;

    const f32 = () => new Float32Array(capacity);
    this.x = f32();
    this.y = f32();
    this.z = f32();
    this.vx = f32();
    this.vy = f32();
    this.vz = f32();

    // Shading inputs, all harvested from the contact search.
    this.light = f32();
    this.speed01 = f32();
    this.sizeJitter = f32();
    this.hueJitter = f32();
    this.contacts = new Uint8Array(capacity);
    // 1 when a grain is touching nothing at all. The renderer collapses a
    // grain's speck cluster to a single speck when this is high — keyed on
    // isolation rather than speed, because a *speed* threshold fires on any
    // grain that has fallen a few tens of pixels, which turns an entire moving
    // bed into dust specks.
    this.airborne = f32();
    this.cover = f32();
    this.litAbove = f32();

    this.rank = new Int32Array(capacity);
    // Per-grain radius (px). this.radius stays the mean, and most solver
    // scales (skin, slop, travel caps) stay keyed to it.
    this.rad = f32();
    // Positions when the contact list was last rebuilt, for the skin test.
    this.refX = f32();
    this.refY = f32();
    this.refZ = f32();
    this.grid = new Grid(capacity);
    this.random = makeRandom(0x5117);

    // Contact arrays, grown on demand. cj < 0 marks a static wall contact.
    this.contactCapacity = 0;
    this.ci = new Int32Array(0);
    this.cj = new Int32Array(0);
    this.cnx = new Float32Array(0);
    this.cny = new Float32Array(0);
    this.cnz = new Float32Array(0);
    this.cgap = new Float32Array(0);
    this.cjn = new Float32Array(0);
    // Accumulated friction impulse per contact, as a vector.
    this.cfx = new Float32Array(0);
    this.cfy = new Float32Array(0);
    this.cfz = new Float32Array(0);
    // Separation speed each contact should end the step with — restitution,
    // computed from the approach speed before the solve touches anything.
    this.cbounce = new Float32Array(0);
    // Rest distance per contact: rad[i] + rad[j] for the pair it belongs to.
    this.crest = new Float32Array(0);
    this.active = new Int32Array(0);
    this.contactCount = 0;
    this.activeCount = 0;
    this.hashSize = 0;
    this.hashMask = 0;
    this.hKeyI = new Int32Array(0);
    this.hKeyJ = new Int32Array(0);
    this.hJn = new Float32Array(0);
    this.hFx = new Float32Array(0);
    this.hFy = new Float32Array(0);
    this.hFz = new Float32Array(0);
    this.warmHits = 0;

    this.radius = 4;
    this.diameter = 8;
    this.cellSize = 8;
    this.depth = 32;
    this.bounds = { x0: 0, y0: 0, x1: 1, y1: 1 };
    this.inner = { x0: 0, y0: 0, z0: 0, x1: 1, y1: 1, z1: 1 };
    this.gravityMagnitude = 4000;
    this.speedNorm = 600;
    // Unit gravity from the last step, kept so a splash can throw the bed away
    // from whichever wall it is currently resting on.
    this.gdx = 0;
    this.gdy = 1;
    this.gdz = 0;
    // Live shake pulse: an extra body acceleration, and how long it has left.
    this.kickX = 0;
    this.kickY = 0;
    this.kickZ = 0;
    this.kickTime = 0;
    this.substeps = 1;
    this.iterations = CONFIG.sim.velocityIterations;
    this._carry = 0;
  }

  /** Set the box size and grain size; keeps existing grains in place. */
  configure(width, height, radius) {
    if (this.n > 0 && this.radius > 0 && radius !== this.radius) {
      // Quality/layout changed the mean: rescale every grain so each keeps its
      // place in the size distribution.
      const k = radius / this.radius;
      for (let i = 0; i < this.n; i++) this.rad[i] *= k;
    }
    this.radius = radius;
    this.diameter = radius * 2;
    // Must cover the speculative contact radius, or the 3x3x3 scan misses pairs
    // that are about to collide.
    this.cellSize = this.diameter * CONFIG.sim.cellMul;
    this.depth = Math.max(
      this.diameter * 2,
      Math.min(CONFIG.bed.depthLayers * this.diameter, Math.min(width, height) * 0.22),
    );
    this.bounds = { x0: 0, y0: 0, x1: width, y1: height };
    this.inner = {
      x0: radius,
      y0: radius,
      z0: radius,
      x1: Math.max(radius, width - radius),
      y1: Math.max(radius, height - radius),
      z1: Math.max(radius, this.depth - radius),
    };
    this.grid.configure(width, height, this.depth, this.cellSize);

    this.gravityMagnitude = CONFIG.sim.gravityScale * Math.hypot(width, height);
    this.speedNorm = 0.35 * Math.sqrt(2 * this.gravityMagnitude * height);
    // A finger covers a fraction of the screen, not a fixed pixel count: as a
    // constant it ends up a dot on a big display and reaches barely a hundred
    // grains. Scaled, the touch keeps the same footprint everywhere.
    this.pokeRadius = Math.max(
      CONFIG.input.pokeRadiusMin,
      Math.min(width, height) * CONFIG.input.pokeRadiusFrac,
    );
  }

  ensureContactCapacity(need) {
    if (this.contactCapacity >= need) return;
    const cap = Math.max(need, Math.ceil(this.contactCapacity * 1.5) + 1024);
    this.ci = new Int32Array(cap);
    this.cj = new Int32Array(cap);
    this.cnx = new Float32Array(cap);
    this.cny = new Float32Array(cap);
    this.cnz = new Float32Array(cap);
    this.cgap = new Float32Array(cap);
    this.cjn = new Float32Array(cap);
    this.cfx = new Float32Array(cap);
    this.cfy = new Float32Array(cap);
    this.cfz = new Float32Array(cap);
    this.cbounce = new Float32Array(cap);
    this.crest = new Float32Array(cap);
    this.active = new Int32Array(cap);
    this.contactCapacity = cap;
    this.ensureHash(cap);
  }

  /** Grain count that fills `CONFIG.bed.fill` of the front view when settled. */
  idealCount(fill = CONFIG.bed.fill) {
    const { x1, y1 } = this.bounds;
    const v = CONFIG.grain.polydispersity;
    const grainVol = (4 / 3) * Math.PI * this.radius ** 3 * (1 + 3 * v * v);
    const volume = x1 * (fill * y1) * this.depth;
    const ideal = (volume * CONFIG.bed.packing) / grainVol;
    const ceiling = Math.min(
      CONFIG.bed.maxGrains,
      this.capacity,
      (x1 * (0.6 * y1) * this.depth * CONFIG.bed.packing) / grainVol,
    );
    return Math.round(clamp(ideal, CONFIG.bed.minGrains, ceiling));
  }

  _spawnAt(i, x, y, z) {
    const rand = this.random;
    this.x[i] = x;
    this.y[i] = y;
    this.z[i] = z;
    this.vx[i] = 0;
    this.vy[i] = 0;
    this.vz[i] = 0;
    this.light[i] = 0.5;
    this.speed01[i] = 0;
    const v = CONFIG.grain.polydispersity;
    this.rad[i] = this.radius * (1 - v + 2 * v * rand());
    // The renderer reads this as the sprite size ratio (and as the cluster
    // seed — any per-grain float works for hashing).
    this.sizeJitter[i] = this.rad[i] / this.radius;
    this.hueJitter[i] = rand();
    this.contacts[i] = 0;
    this.cover[i] = 0;
    this.litAbove[i] = 0;
    this.airborne[i] = 0;
  }

  /**
   * Lay out the starting bed as a staggered lattice: alternate layers offset by
   * half a pitch in x and z, so each grain sits in a pocket of the layer below.
   *
   * Both properties matter. Nothing may overlap, or the solver is handed a
   * bed's worth of stored energy on frame one and detonates. And the layout has
   * to be near settled *density*, because a naive loose lattice stands several
   * times too tall for its grain count — and a pile that deep outweighs what
   * the solver can support in its iteration budget, so it crushes itself into a
   * thin overlapping slab on the way down.
   */
  fill(count) {
    const n = Math.min(count, this.capacity);
    this.n = n;
    this.grid.ensureCapacity(n);
    this.kickTime = 0; // a fresh bed must not inherit a shake in progress

    const rand = this.random;
    const b = this.inner;
    // Spacing must clear the largest possible pair, not the mean, or the
    // biggest grains spawn overlapped and hand the solver stored energy.
    const d = this.diameter * (1 + CONFIG.grain.polydispersity);
    const pitch = d * 1.05;
    // With a half-pitch offset in both x and z, the nearest grain in the layer
    // below sits at sqrt((p/2)^2 + yp^2 + (p/2)^2); 0.78d keeps that over d.
    const yPitch = d * 0.78;
    const spanX = Math.max(pitch, b.x1 - b.x0);
    const spanZ = Math.max(0, b.z1 - b.z0);
    const perX = Math.max(1, Math.floor(spanX / pitch) + 1);
    const perZ = Math.max(1, Math.floor(spanZ / pitch) + 1);
    const perLayer = perX * perZ;
    const jitter = this.radius * 0.06;

    for (let i = 0; i < n; i++) {
      const layer = Math.floor(i / perLayer);
      const rem = i % perLayer;
      const off = layer % 2 ? pitch * 0.5 : 0;
      const zi = Math.floor(rem / perX);
      const xi = rem % perX;
      this._spawnAt(
        i,
        clamp(b.x0 + off + xi * pitch + (rand() - 0.5) * jitter, b.x0, b.x1),
        clamp(b.y1 - layer * yPitch + (rand() - 0.5) * jitter, b.y0, b.y1),
        clamp(b.z0 + (perZ > 1 ? off : 0) + zi * pitch + (rand() - 0.5) * jitter, b.z0, b.z1),
      );
    }
  }

  /** Grow/shrink the bed. New grains appear just above the current surface. */
  setCount(count) {
    const target = Math.min(Math.max(count, 0), this.capacity);
    if (target === this.n) return;
    if (target < this.n) {
      this.n = target;
      return;
    }

    let bedTop = this.inner.y1;
    for (let i = 0; i < this.n; i++) if (this.y[i] < bedTop) bedTop = this.y[i];

    const rand = this.random;
    const b = this.inner;
    const pitch = this.diameter * (1 + CONFIG.grain.polydispersity) * 1.1;
    const perX = Math.max(1, Math.floor((b.x1 - b.x0) / pitch) + 1);
    const perZ = Math.max(1, Math.floor((b.z1 - b.z0) / pitch) + 1);
    const perLayer = perX * perZ;
    for (let k = 0, i = this.n; i < target; k++, i++) {
      const row = Math.floor(k / perLayer);
      const rem = k % perLayer;
      this._spawnAt(
        i,
        clamp(b.x0 + (rem % perX) * pitch, b.x0, b.x1),
        clamp(bedTop - pitch * (1 + row), b.y0, b.y1),
        clamp(b.z0 + Math.floor(rem / perX) * pitch, b.z0, b.z1),
      );
    }
    this.n = target;
    this.grid.ensureCapacity(target);
  }

  /** Nudge every grain back inside after a viewport change. */
  clampToBounds() {
    const b = this.inner;
    for (let i = 0; i < this.n; i++) {
      this.x[i] = clamp(this.x[i], b.x0, b.x1);
      this.y[i] = clamp(this.y[i], b.y0, b.y1);
      this.z[i] = clamp(this.z[i], b.z0, b.z1);
    }
  }

  /**
   * Shake response: jerk the box, and let the sand work out the rest.
   *
   * The obvious implementation — hand every grain a velocity — cannot help
   * making a dust cloud, whatever distribution it draws from. Any per-grain
   * velocity is *relative* velocity between neighbours, so the bed aerates
   * everywhere at once: measured over a splash, mean contacts per grain fell
   * from 7.6 to about 4, i.e. the whole mass went loose and grainy rather than
   * moving as sand. Randomising the direction is the worst case (the solver
   * may only remove energy, so most of the kick is annihilated in two frames
   * and all that is left is the boil), but even a perfectly coherent throw
   * decompacts the bed if it is written into velocities.
   *
   * A hand shaking a box never does that. It accelerates the container, and
   * the sand feels a pseudo-force — a *body* force, identical for every grain,
   * which produces no relative velocity at the contacts at all. The bed stays
   * packed while it is driven, leaves the floor as one mass, and only opens up
   * where real sand opens up: at the free surface, and on landing.
   *
   * So this records a short acceleration pulse and lets `step` add it to
   * gravity. No velocities are touched.
   */
  splash(strength) {
    const rand = this.random;
    const cfg = CONFIG.sim;

    // Drive against gravity, not up the screen: on a tilted phone the sand
    // rests on a wall, and that wall is what throws it.
    let ux = -this.gdx;
    let uy = -this.gdy;
    let uz = -this.gdz;
    // Lean off-axis so repeated shakes differ and the bed heaves sideways
    // rather than hopping straight up.
    const lean = (rand() - 0.5) * 2 * cfg.splashLean;
    const tx = -uy * lean;
    const ty = ux * lean;
    ux += tx;
    uy += ty;
    const inv = 1 / (Math.hypot(ux, uy, uz) || 1);
    ux *= inv; uy *= inv; uz *= inv;

    const a =
      this.gravityMagnitude * (cfg.splashAccel + cfg.splashGain * Math.max(0, strength - 1));
    this.kickX = ux * a;
    this.kickY = uy * a;
    this.kickZ = uz * a;
    this.kickTime = cfg.splashDuration;
  }

  /** Push grains away from a screen point (a cylinder through the depth). */
  poke(cx, cy, dragX, dragY, dt) {
    const r = this.pokeRadius;
    const r2 = r * r;
    const push = this.gravityMagnitude * CONFIG.input.pokeAccel * dt;
    const dragScale = CONFIG.input.pokeDrag;
    const { x, y, vx, vy } = this;
    for (let i = 0; i < this.n; i++) {
      const ox = x[i] - cx;
      const oy = y[i] - cy;
      const d2 = ox * ox + oy * oy;
      if (d2 > r2) continue;
      const d = Math.sqrt(d2) || 1e-4;
      const falloff = 1 - d / r;
      const k = (push * falloff) / d;
      vx[i] += ox * k + dragX * dragScale * falloff;
      vy[i] += oy * k + dragY * dragScale * falloff;
    }
  }

  // ------------------------------------------------------------------ stepping

  step(dtFrame, gx, gy, gz) {
    const n = this.n;
    if (n === 0) return;
    const cfg = CONFIG.sim;

    // Fixed timestep with a carry, so the feel never depends on frame rate.
    const h = 1 / cfg.fixedHz;
    this._carry += dtFrame;
    let steps = Math.floor(this._carry / h);
    if (steps > cfg.maxSubsteps) steps = cfg.maxSubsteps;
    if (steps < 1) {
      // Very high refresh rate: keep accumulating rather than stepping tiny.
      if (this._carry < h) return;
      steps = 1;
    }
    this._carry -= steps * h;
    if (this._carry > h * cfg.maxSubsteps) this._carry = 0; // shed a long stall
    this.substeps = steps;
    this.iterations = cfg.velocityIterations;

    const gmag = Math.hypot(gx, gy, gz) || 1;
    const gdx = gx / gmag;
    const gdy = gy / gmag;
    const gdz = gz / gmag;
    this.gdx = gdx;
    this.gdy = gdy;
    this.gdz = gdz;

    for (let s = 0; s < steps; s++) {
      // A live shake pulse rides on top of gravity as a pseudo-force. Note the
      // ordering direction above stays the *true* gravity: the pulse comes
      // from the floor, so contacts should still be solved bottom-up, and the
      // shading must not flip over for the tenth of a second it lasts.
      let ax = gx;
      let ay = gy;
      let az = gz;
      if (this.kickTime > 0) {
        ax += this.kickX;
        ay += this.kickY;
        az += this.kickZ;
        this.kickTime -= h;
      }
      this.applyGravity(h, ax, ay, az);
      if (s === 0 || this.listStale()) this.findContacts(gdx, gdy, gdz);
      else this.refreshGaps();
      this.solveVelocity(h);
      this.shockPass(h);
      this.integrate(h);
      this.solvePosition();
    }
    this.updateShading(dtFrame);
  }

  applyGravity(h, gx, gy, gz) {
    const n = this.n;
    const { vx, vy, vz } = this;
    const damp = Math.exp(-CONFIG.sim.airDrag * h);
    const dvx = gx * h;
    const dvy = gy * h;
    const dvz = gz * h;
    for (let i = 0; i < n; i++) {
      vx[i] = (vx[i] + dvx) * damp;
      vy[i] = (vy[i] + dvy) * damp;
      vz[i] = (vz[i] + dvz) * damp;
    }
  }

  /**
   * Impulse memory for warm starting, as an open-addressed hash keyed by the
   * contact pair. Rebuilding the contact list shuffles indices, so carrying
   * impulses forward needs identity, not position in an array.
   */
  ensureHash(cap) {
    let size = 1024;
    while (size < cap * 2) size <<= 1;
    if (this.hashSize >= size) return;
    this.hashSize = size;
    this.hashMask = size - 1;
    this.hKeyI = new Int32Array(size);
    this.hKeyJ = new Int32Array(size);
    this.hJn = new Float32Array(size);
    this.hFx = new Float32Array(size);
    this.hFy = new Float32Array(size);
    this.hFz = new Float32Array(size);
    this.hKeyI.fill(-1);
  }

  /** Slot for this pair: either its existing entry or the first free one. */
  hashSlot(i, j) {
    const mask = this.hashMask;
    const keyI = this.hKeyI;
    const keyJ = this.hKeyJ;
    let h = (Math.imul(i, 73856093) ^ Math.imul(j + 8, 19349663)) & mask;
    for (let probe = 0; probe < 24; probe++) {
      const k = keyI[h];
      if (k === -1 || (k === i && keyJ[h] === j)) return h;
      h = (h + 1) & mask;
    }
    return -1; // crowded: this contact just starts cold, which is harmless
  }

  /** Park the current frame's impulses before the contact list is rebuilt. */
  stashImpulses() {
    const cnt = this.contactCount;
    if (cnt === 0) return;
    const { ci, cj, cjn, cfx, cfy, cfz, hKeyI, hKeyJ, hJn, hFx, hFy, hFz } = this;
    hKeyI.fill(-1);
    for (let c = 0; c < cnt; c++) {
      const jn = cjn[c];
      if (jn <= 0) continue; // nothing worth remembering
      const i = ci[c];
      const j = cj[c];
      const slot = this.hashSlot(i, j);
      if (slot < 0) continue;
      hKeyI[slot] = i;
      hKeyJ[slot] = j;
      hJn[slot] = jn;
      hFx[slot] = cfx[c];
      hFy[slot] = cfy[c];
      hFz[slot] = cfz[c];
    }
  }

  /** Give each contact in the fresh list whatever it was carrying before. */
  restoreImpulses() {
    const cnt = this.contactCount;
    const { ci, cj, cjn, cfx, cfy, cfz, hKeyI, hKeyJ, hJn, hFx, hFy, hFz } = this;
    let hits = 0;
    for (let c = 0; c < cnt; c++) {
      const i = ci[c];
      const j = cj[c];
      const slot = this.hashSlot(i, j);
      if (slot >= 0 && hKeyI[slot] === i && hKeyJ[slot] === j) {
        cjn[c] = hJn[slot];
        cfx[c] = hFx[slot];
        cfy[c] = hFy[slot];
        cfz[c] = hFz[slot];
        hits++;
      } else {
        cjn[c] = 0;
        cfx[c] = 0;
        cfy[c] = 0;
        cfz[c] = 0;
      }
    }
    this.warmHits = hits;
  }

  /**
   * Collect contacts, deepest-first along gravity, and harvest the shading
   * terms from the same neighbour scan (they are free here: the distances are
   * already computed).
   */
  findContacts(gdx, gdy, gdz) {
    const n = this.n;
    const grid = this.grid;
    grid.build(this.x, this.y, this.z, n);
    const order = grid.orderByGravity(gdx, gdy, gdz, n);
    const rank = this.rank;
    for (let k = 0; k < n; k++) rank[order[k]] = k;

    this.stashImpulses();
    this.ensureContactCapacity(n * 10);

    const { x, y, z, rad, contacts, cover, light, litAbove } = this;
    const { ci, cj, cnx, cny, cnz, cgap, crest } = this;
    const cols = grid.cols, rows = grid.rows, slabs = grid.slabs;
    const layer = cols * rows;
    const start = grid.cellStart;
    const cellOrder = grid.order;
    const cellOf = grid.cellOf;
    const D = this.diameter;
    const skinD = CONFIG.sim.skin * D;
    // The list is built with a skin so it outlives several substeps; whether a
    // pair is actually active is decided per substep in refreshGaps(). Scan
    // radius covers the largest possible pair plus skin, and the shading reach.
    const RS = Math.max(D * (1 + CONFIG.grain.polydispersity) + skinD, D * CONFIG.sim.shadeRadius);
    const RS2 = RS * RS;
    const DS2 = (D * CONFIG.sim.shadeRadius) ** 2;
    const B = this.bounds;
    const cap = this.contactCapacity;

    contacts.fill(0, 0, n);
    cover.fill(0, 0, n);
    litAbove.fill(0, 0, n);

    let c = 0;
    for (let k = 0; k < n; k++) {
      const i = order[k];
      const xi = x[i], yi = y[i], zi = z[i];
      const ri = rad[i];

      // Walls first: they are the ultimate support, so solving them ahead of
      // this grain's neighbours is what a deepest-first sweep wants. Gaps are
      // measured against the outer box minus this grain's own radius.
      // Speculative: a grain resting exactly ON a wall has zero penetration, so
      // a strict "is it past the plane" test finds nothing and the floor
      // silently stops supporting the bed. Catch them a margin early instead
      // and let the solver limit approach speed to the remaining gap.
      if (c + 6 <= cap) {
        let gap = xi - B.x0 - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -1; cnx[c] = -1; cny[c] = 0; cnz[c] = 0; cgap[c] = gap; crest[c] = ri; c++; }
        gap = B.x1 - xi - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -2; cnx[c] = 1; cny[c] = 0; cnz[c] = 0; cgap[c] = gap; crest[c] = ri; c++; }
        gap = yi - B.y0 - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -3; cnx[c] = 0; cny[c] = -1; cnz[c] = 0; cgap[c] = gap; crest[c] = ri; c++; }
        gap = B.y1 - yi - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -4; cnx[c] = 0; cny[c] = 1; cnz[c] = 0; cgap[c] = gap; crest[c] = ri; c++; }
        gap = zi - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -5; cnx[c] = 0; cny[c] = 0; cnz[c] = -1; cgap[c] = gap; crest[c] = ri; c++; }
        gap = this.depth - zi - ri;
        if (gap < skinD) { ci[c] = i; cj[c] = -6; cnx[c] = 0; cny[c] = 0; cnz[c] = 1; cgap[c] = gap; crest[c] = ri; c++; }
      }

      const cell = cellOf[i];
      const cz = (cell / layer) | 0;
      const rest = cell - cz * layer;
      const cy = (rest / cols) | 0;
      const cx = rest - cy * cols;
      const x0 = cx > 0 ? cx - 1 : 0, x1 = cx < cols - 1 ? cx + 1 : cols - 1;
      const y0 = cy > 0 ? cy - 1 : 0, y1 = cy < rows - 1 ? cy + 1 : rows - 1;
      const z0 = cz > 0 ? cz - 1 : 0, z1 = cz < slabs - 1 ? cz + 1 : slabs - 1;

      for (let rz = z0; rz <= z1; rz++) {
        const zb = rz * layer;
        for (let ry = y0; ry <= y1; ry++) {
          const yb = zb + ry * cols;
          for (let rx = x0; rx <= x1; rx++) {
            const cc = yb + rx;
            const e = start[cc + 1];
            for (let s = start[cc]; s < e; s++) {
              const j = cellOrder[s];
              // Each pair once, owned by whichever grain is deeper.
              if (rank[j] <= k) continue;
              const dx = x[j] - xi;
              const dy = y[j] - yi;
              const dz = z[j] - zi;
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 >= RS2) continue;

              const dist = Math.sqrt(d2);
              let nx, ny, nz;
              if (dist > 1e-6) {
                const inv = 1 / dist;
                nx = dx * inv; ny = dy * inv; nz = dz * inv;
              } else {
                // Exactly coincident: pick a deterministic direction rather
                // than skipping, which would weld the pair together forever.
                const a = i * 2.3999632;
                nx = Math.cos(a) * 0.94; ny = Math.sin(a) * 0.94; nz = 0.34;
              }

              // Shading: neighbour count, how much of the load sits on the
              // anti-gravity side, and the brightest neighbour up there.
              if (d2 < DS2) {
                contacts[i]++;
                contacts[j]++;
                const w = nx * gdx + ny * gdy + nz * gdz;
                if (w < 0) {
                  cover[i] -= w;
                  const lj = light[j];
                  if (lj > litAbove[i]) litAbove[i] = lj;
                } else {
                  cover[j] += w;
                  const li = light[i];
                  if (li > litAbove[j]) litAbove[j] = li;
                }
              }

              const sumR = ri + rad[j];
              if (dist >= sumR + skinD || c >= cap) continue;
              ci[c] = i;
              cj[c] = j;
              cnx[c] = nx; cny[c] = ny; cnz[c] = nz;
              cgap[c] = dist - sumR;
              crest[c] = sumR;
              c++;
            }
          }
        }
      }
    }
    this.contactCount = c;
    this.restoreImpulses();
    this.refX.set(this.x.subarray(0, n));
    this.refY.set(this.y.subarray(0, n));
    this.refZ.set(this.z.subarray(0, n));
    this.refreshGaps();
  }

  /**
   * Has anything moved far enough that the list might have missed a new pair?
   * The list is built with a skin, so it stays valid until some grain has
   * travelled half of it.
   */
  listStale() {
    const n = this.n;
    const { x, y, z, refX, refY, refZ } = this;
    const limit = CONFIG.sim.skin * this.diameter * 0.5;
    const limit2 = limit * limit;
    for (let i = 0; i < n; i++) {
      const dx = x[i] - refX[i], dy = y[i] - refY[i], dz = z[i] - refZ[i];
      if (dx * dx + dy * dy + dz * dz > limit2) return true;
    }
    return false;
  }

  /**
   * Re-measure every listed pair against current positions and collect the ones
   * close enough to matter. The list itself is built at most once per frame —
   * finding pairs costs far more than solving them, so re-using it across
   * substeps is the difference between a bed that runs and one that does not.
   */
  refreshGaps() {
    const cnt = this.contactCount;
    const { ci, cj, cnx, cny, cnz, cgap, crest, cjn, cfx, cfy, cfz, active, x, y, z, rad } = this;
    const B = this.bounds;
    const depth = this.depth;
    const margin = CONFIG.sim.contactMargin * this.diameter;
    let a = 0;
    for (let c = 0; c < cnt; c++) {
      const i = ci[c];
      const j = cj[c];
      if (j >= 0) {
        const dx = x[j] - x[i], dy = y[j] - y[i], dz = z[j] - z[i];
        const d2 = dx * dx + dy * dy + dz * dz;
        const rc = crest[c] + margin;
        if (d2 >= rc * rc) { cjn[c] = 0; cfx[c] = 0; cfy[c] = 0; cfz[c] = 0; continue; }
        const dist = Math.sqrt(d2);
        if (dist > 1e-6) {
          const inv = 1 / dist;
          cnx[c] = dx * inv; cny[c] = dy * inv; cnz[c] = dz * inv;
        }
        cgap[c] = dist - crest[c];
      } else {
        const nx = cnx[c], ny = cny[c], nz = cnz[c];
        const ri = rad[i];
        let gap;
        if (nx < 0) gap = x[i] - B.x0 - ri;
        else if (nx > 0) gap = B.x1 - x[i] - ri;
        else if (ny < 0) gap = y[i] - B.y0 - ri;
        else if (ny > 0) gap = B.y1 - y[i] - ri;
        else if (nz < 0) gap = z[i] - ri;
        else gap = depth - z[i] - ri;
        if (gap >= margin) { cjn[c] = 0; cfx[c] = 0; cfy[c] = 0; cfz[c] = 0; continue; }
        cgap[c] = gap;
      }
      active[a++] = c;
    }
    this.activeCount = a;
  }

  /**
   * Velocity pass: Gauss-Seidel impulses. Non-penetration first, then Coulomb
   * friction capped by mu times the normal impulse on that contact.
   *
   * Both are **warm started** — each contact begins the step by re-applying the
   * impulse it settled on last time, and iterates from there. This is what makes
   * a deep bed genuinely quiet. Starting every step from zero, the solver has to
   * rediscover the entire weight of the pile within its iteration budget, always
   * falls a little short, and the bed sinks a fraction, gets pushed back out,
   * and sinks again — a permanent low simmer no amount of damping removes.
   * Beginning from the previous answer means it starts converged and stays there.
   *
   * Friction accumulates as a vector and is clamped as a whole (rather than
   * clamping each increment), which is what gives true static friction: inside
   * the cone, sliding is cancelled outright instead of merely slowed.
   */
  solveVelocity(h) {
    const cnt = this.activeCount;
    if (cnt === 0) return;
    const { ci, cj, cnx, cny, cnz, cgap, cjn, cfx, cfy, cfz, cbounce, active, vx, vy, vz } = this;
    const invH = 1 / h;
    const iters = CONFIG.sim.velocityIterations;
    const mu = CONFIG.sim.friction;
    const muWall = CONFIG.sim.wallFriction;

    // Restitution, measured from the approach speed *before* the solve runs.
    // Only genuine impacts bounce: below the threshold a contact is resting,
    // and letting those bounce would make the whole bed buzz. Without any of
    // this, sand slammed into a wall absorbs every bit of its momentum and
    // stops dead, which is what kills the slosh-back.
    const rest = CONFIG.sim.restitution;
    const restCut = CONFIG.sim.restitutionCut * this.diameter;
    for (let a = 0; a < cnt; a++) {
      const c = active[a];
      const i = ci[c];
      const j = cj[c];
      const nx = cnx[c], ny = cny[c], nz = cnz[c];
      const vn = j >= 0
        ? (vx[j] - vx[i]) * nx + (vy[j] - vy[i]) * ny + (vz[j] - vz[i]) * nz
        : -(vx[i] * nx + vy[i] * ny + vz[i] * nz);
      cbounce[c] = vn < -restCut ? -rest * vn : 0;
    }

    // Warm start: re-apply what each contact was already carrying.
    for (let a = 0; a < cnt; a++) {
      const c = active[a];
      const i = ci[c];
      const j = cj[c];
      const jn = cjn[c];
      const px = -cnx[c] * jn + cfx[c];
      const py = -cny[c] * jn + cfy[c];
      const pz = -cnz[c] * jn + cfz[c];
      vx[i] += px; vy[i] += py; vz[i] += pz;
      if (j >= 0) { vx[j] -= px; vy[j] -= py; vz[j] -= pz; }
    }

    for (let it = 0; it < iters; it++) {
      for (let a = 0; a < cnt; a++) {
        const c = active[a];
        const i = ci[c];
        const j = cj[c];
        const nx = cnx[c], ny = cny[c], nz = cnz[c];
        // Still apart: allow approach fast enough to just close the gap this
        // step, no faster. Already touching: separate at the bounce speed
        // (zero for a resting contact).
        const gap = cgap[c];
        const target = gap > 0 ? -gap * invH : cbounce[c];

        if (j >= 0) {
          // Two unit masses: 1/mi + 1/mj = 2, so the impulse is halved.
          let rx = vx[j] - vx[i], ry = vy[j] - vy[i], rz = vz[j] - vz[i];
          const vn = rx * nx + ry * ny + rz * nz;
          let dj = (target - vn) * 0.5;
          const total = cjn[c] + dj > 0 ? cjn[c] + dj : 0;
          dj = total - cjn[c];
          cjn[c] = total;
          if (dj !== 0) {
            vx[i] -= dj * nx; vy[i] -= dj * ny; vz[i] -= dj * nz;
            vx[j] += dj * nx; vy[j] += dj * ny; vz[j] += dj * nz;
          }

          rx = vx[j] - vx[i]; ry = vy[j] - vy[i]; rz = vz[j] - vz[i];
          const vn2 = rx * nx + ry * ny + rz * nz;
          // Impulse that would cancel all remaining sliding, added to what this
          // contact already holds, then clamped as a whole.
          let fx = cfx[c] + (rx - vn2 * nx) * 0.5;
          let fy = cfy[c] + (ry - vn2 * ny) * 0.5;
          let fz = cfz[c] + (rz - vn2 * nz) * 0.5;
          const cap = mu * cjn[c];
          const m2 = fx * fx + fy * fy + fz * fz;
          if (m2 > cap * cap) {
            const k = cap / Math.sqrt(m2);
            fx *= k; fy *= k; fz *= k;
          }
          const dfx = fx - cfx[c], dfy = fy - cfy[c], dfz = fz - cfz[c];
          cfx[c] = fx; cfy[c] = fy; cfz[c] = fz;
          vx[i] += dfx; vy[i] += dfy; vz[i] += dfz;
          vx[j] -= dfx; vy[j] -= dfy; vz[j] -= dfz;
        } else {
          // Static wall: infinite mass, zero velocity.
          const vn = -(vx[i] * nx + vy[i] * ny + vz[i] * nz);
          let dj = target - vn;
          const total = cjn[c] + dj > 0 ? cjn[c] + dj : 0;
          dj = total - cjn[c];
          cjn[c] = total;
          if (dj !== 0) {
            vx[i] -= dj * nx; vy[i] -= dj * ny; vz[i] -= dj * nz;
          }

          const rx = -vx[i], ry = -vy[i], rz = -vz[i];
          const vn2 = rx * nx + ry * ny + rz * nz;
          let fx = cfx[c] + (rx - vn2 * nx);
          let fy = cfy[c] + (ry - vn2 * ny);
          let fz = cfz[c] + (rz - vn2 * nz);
          const cap = muWall * cjn[c];
          const m2 = fx * fx + fy * fy + fz * fz;
          if (m2 > cap * cap) {
            const k = cap / Math.sqrt(m2);
            fx *= k; fy *= k; fz *= k;
          }
          const dfx = fx - cfx[c], dfy = fy - cfy[c], dfz = fz - cfz[c];
          cfx[c] = fx; cfy[c] = fy; cfz[c] = fz;
          vx[i] += dfx; vy[i] += dfy; vz[i] += dfz;
        }
      }
    }
  }

  /**
   * Shock propagation: one bottom-up sweep in which the deeper grain of each
   * pair is treated as immovable, so the whole impulse lands on the shallower
   * one.
   *
   * This is what makes deep piles stand up. Between two equal masses an impulse
   * only averages their velocities, so support crawls up a stack geometrically
   * — a thirty-layer bed needs far more iterations than is affordable, and
   * without this it slowly crushes itself into an overlapping slab. Treating
   * the supported side as ground (the floor does not recoil) carries support
   * from the box floor to the surface in a single pass. It deliberately breaks
   * momentum conservation, which is exactly what resting on solid ground does.
   */
  shockPass(h) {
    const cnt = this.activeCount;
    if (cnt === 0) return;
    const { ci, cj, cnx, cny, cnz, cgap, active, vx, vy, vz } = this;
    const invH = 1 / h;
    const passes = CONFIG.sim.shockIterations;
    // Only quasi-static contacts get the ground treatment. Treating the
    // supported grain as immovable is what holds a pile up, but it also dumps
    // the incoming momentum of a fast impact into "ground" instead of passing
    // it along the contact chain — so sand slamming into a wall is swallowed
    // rather than spraying back. Above this approach speed the symmetric,
    // momentum-conserving solve is left to handle it alone.
    const gate = -CONFIG.sim.shockMaxApproach * this.diameter;

    for (let p = 0; p < passes; p++) {
      for (let a = 0; a < cnt; a++) {
        const c = active[a];
        const i = ci[c];
        const j = cj[c];
        const nx = cnx[c], ny = cny[c], nz = cnz[c];
        const gap = cgap[c];
        const target = gap > 0 ? -gap * invH : 0;
        if (j >= 0) {
          // ci is the deeper grain: it is the one already held up.
          const vn = (vx[j] - vx[i]) * nx + (vy[j] - vy[i]) * ny + (vz[j] - vz[i]) * nz;
          const dj = target - vn;
          if (dj > 0 && vn > gate) {
            vx[j] += dj * nx; vy[j] += dj * ny; vz[j] += dj * nz;
          }
        } else {
          const vn = -(vx[i] * nx + vy[i] * ny + vz[i] * nz);
          const dj = target - vn;
          if (dj > 0 && vn > gate) {
            vx[i] -= dj * nx; vy[i] -= dj * ny; vz[i] -= dj * nz;
          }
        }
      }
    }
  }

  integrate(h) {
    const n = this.n;
    const { x, y, z, vx, vy, vz } = this;
    // Nothing may cross more than about its own width per substep, or contacts
    // are found only once grains are already deep inside each other.
    const maxV = (CONFIG.sim.maxTravel * this.diameter) / h;
    const maxV2 = maxV * maxV;
    for (let i = 0; i < n; i++) {
      let ux = vx[i], uy = vy[i], uz = vz[i];
      const s2 = ux * ux + uy * uy + uz * uz;
      if (s2 > maxV2) {
        const k = maxV / Math.sqrt(s2);
        ux *= k; uy *= k; uz *= k;
        vx[i] = ux; vy[i] = uy; vz[i] = uz;
      }
      x[i] += ux * h;
      y[i] += uy * h;
      z[i] += uz * h;
    }
  }

  /**
   * Position pass: push overlapping pairs apart, and put wall violators back
   * inside. Velocities are deliberately left alone — turning this correction
   * into velocity is exactly how a solver starts manufacturing energy.
   *
   * `slop` leaves a sliver of overlap uncorrected so a resting bed has nothing
   * left to fidget about.
   */
  solvePosition() {
    const cnt = this.activeCount;
    const { ci, cj, cnx, cny, cnz, crest, active, x, y, z, rad } = this;
    const iters = CONFIG.sim.positionIterations;
    const beta = CONFIG.sim.positionBeta;
    const D = this.diameter;
    const slop = CONFIG.sim.slop * D;
    const maxFix = CONFIG.sim.maxCorrection * D;
    const B = this.bounds;
    const depth = this.depth;

    for (let it = 0; it < iters; it++) {
      for (let a = 0; a < cnt; a++) {
        const c = active[a];
        const i = ci[c];
        const j = cj[c];
        if (j >= 0) {
          const rest = crest[c];
          const dx = x[j] - x[i], dy = y[j] - y[i], dz = z[j] - z[i];
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 >= rest * rest || d2 < 1e-12) continue;
          const dist = Math.sqrt(d2);
          let push = (rest - dist - slop) * beta * 0.5;
          if (push <= 0) continue;
          if (push > maxFix) push = maxFix;
          const inv = 1 / dist;
          const nx = dx * inv, ny = dy * inv, nz = dz * inv;
          x[i] -= nx * push; y[i] -= ny * push; z[i] -= nz * push;
          x[j] += nx * push; y[j] += ny * push; z[j] += nz * push;
        } else {
          const nx = cnx[c], ny = cny[c], nz = cnz[c];
          const ri = rad[i];
          // Distance past the plane this normal points at (negative = still
          // inside, which is the common speculative case and does nothing).
          let pen;
          if (nx < 0) pen = B.x0 + ri - x[i];
          else if (nx > 0) pen = x[i] - (B.x1 - ri);
          else if (ny < 0) pen = B.y0 + ri - y[i];
          else if (ny > 0) pen = y[i] - (B.y1 - ri);
          else if (nz < 0) pen = ri - z[i];
          else pen = z[i] - (depth - ri);
          let push = (pen - slop) * beta;
          if (push <= 0) continue;
          if (push > maxFix) push = maxFix;
          x[i] -= nx * push; y[i] -= ny * push; z[i] -= nz * push;
        }
      }
    }

    // Final hard clamp: whatever the solver did, nothing leaves the box.
    const n = this.n;
    for (let i = 0; i < n; i++) {
      const ri = rad[i];
      if (x[i] < B.x0 + ri) x[i] = B.x0 + ri; else if (x[i] > B.x1 - ri) x[i] = B.x1 - ri;
      if (y[i] < B.y0 + ri) y[i] = B.y0 + ri; else if (y[i] > B.y1 - ri) y[i] = B.y1 - ri;
      if (z[i] < ri) z[i] = ri; else if (z[i] > depth - ri) z[i] = depth - ri;
    }
  }

  updateShading(dt) {
    const n = this.n;
    const cfg = CONFIG.sim;
    const { light, cover, contacts, litAbove, speed01, airborne, vx, vy, vz } = this;
    const invCover = 1 / cfg.coverNorm;
    const invSpeed = 1 / this.speedNorm;
    const blend = 1 - Math.exp(-cfg.lightSmoothing * dt);
    const transmit = cfg.lightTransmit;

    for (let i = 0; i < n; i++) {
      const buried = clamp(cover[i] * invCover, 0, 1);
      const loose = 1 - clamp(contacts[i] / 6, 0, 1);
      // Lit if nothing is above you, or if you are barely touching anything...
      const exposed = Math.max(1 - buried, loose * 0.95);
      // ...otherwise take what filters down from the grain above you.
      const target = Math.max(exposed, litAbove[i] * transmit);
      light[i] += (target - light[i]) * blend;
      speed01[i] = clamp(Math.hypot(vx[i], vy[i], vz[i]) * invSpeed, 0, 1);
      // Touching nothing means genuinely in flight. Smoothed so a grain
      // entering or leaving the mass fades rather than pops.
      const air = contacts[i] === 0 ? 1 : 0;
      airborne[i] += (air - airborne[i]) * blend;
    }
  }
}

// ---- src/shaders.js ----
// GLSL ES 1.00 so one shader pair works on both WebGL1 and WebGL2 contexts.
//
// Each physics grain is one point sprite, and the sprite draws a small *cluster*
// of matte specks rather than a single lit ball — visual grain size is decoupled
// from physics grain size, so the sand renders several times finer than the
// solver's grains for free.
//
// The look aims at real dry quartz sand, and almost all of it is micro-relief:
// every speck gets a lit side and a shadowed side from one global light, and
// the webbing between specks falls into crevice shadow. Thousands of tiny
// highlights and shadows all agreeing about the light direction is what reads
// as "sand"; per-speck random brightness alone reads as static. On top of that
// sits the bed-level light field computed in the sim (vLight: open surface vs
// buried), which gives the pile its solid, three-dimensional mass.

const VERTEX_SHADER = `
precision highp float;

attribute vec3 aPos;      // sim position: x,y CSS px, z depth (0 = glass)
attribute vec3 aShade;    // x: surface light, y: normalised speed, z: airborne
attribute vec2 aJitter;   // x: cluster seed, y: tint variation

uniform vec2 uViewport;   // CSS px
uniform float uPointSize; // device px, already scaled by dpr
uniform float uAirShrink;
uniform float uFocal;     // focal length in CSS px
uniform vec2 uEye;        // projection centre in CSS px (parallax lives here)
uniform float uDepthRange;
uniform float uPatchScale;

varying float vLight;
varying float vSpeed;
varying float vAir;
varying float vTint;
varying float vDepth;
varying float vSeed;
varying float vPatch;

float phash(vec2 c) {
  return fract(sin(dot(c, vec2(127.1, 311.7))) * 43758.5453);
}

void main() {
  float persp = uFocal / (uFocal + aPos.z);
  vec2 projected = uEye + (aPos.xy - uEye) * persp;
  vec2 unit = projected / uViewport;
  gl_Position = vec4(unit.x * 2.0 - 1.0, 1.0 - unit.y * 2.0, 0.0, 1.0);
  // Airborne grains keep their sprite: the fragment shader draws them as one
  // grain-sized speck instead of a cluster, so the size must stay honest.
  float shrink = 1.0 - uAirShrink * aShade.z;
  // aJitter.x is the grain's physical radius ratio, so the sprite matches the
  // polydisperse physics exactly.
  gl_PointSize = uPointSize * aJitter.x * shrink * persp;
  vLight = aShade.x;
  vSpeed = aShade.y;
  vAir = aShade.z;
  vTint = aJitter.y;
  vDepth = clamp(aPos.z / uDepthRange, 0.0, 1.0);
  vSeed = aJitter.x;

  // Slow spatial variation — real sand varies in patches (minerals, moisture),
  // not grain-by-grain. Value noise over world position, bilinearly smoothed
  // so a grain drifting across a patch boundary fades rather than pops.
  vec2 p = aPos.xy / uPatchScale;
  vec2 i = floor(p);
  vec2 f = p - i;
  f = f * f * (3.0 - 2.0 * f);
  float n = mix(
    mix(phash(i), phash(i + vec2(1.0, 0.0)), f.x),
    mix(phash(i + vec2(0.0, 1.0)), phash(i + vec2(1.0, 1.0)), f.x),
    f.y);
  vPatch = n;
}
`;

/**
 * The speck count has to be a compile-time constant: GLSL ES 1.00 only allows
 * loops with constant bounds.
 */
function buildFragmentShader(speckCount) {
  return `
precision highp float;

#define SPECKS ${Math.max(1, Math.round(speckCount))}

varying float vLight;
varying float vSpeed;
varying float vAir;
varying float vTint;
varying float vDepth;
varying float vSeed;
varying float vPatch;

uniform vec3 uDeep;
uniform vec3 uMid;
uniform vec3 uLit;
uniform float uDepthDim;  // how much the back of the box falls into shadow
uniform float uSpread;    // how far specks scatter across the sprite
uniform float uSpeck;     // speck radius in the packed bed, sprite units
uniform float uAirSpeck;  // speck radius for an isolated grain, sprite units
uniform float uVary;      // matte brightness spread between specks
uniform float uPatchAmp;  // strength of the spatial patchiness
uniform float uGlint;     // sparkle strength
uniform float uGlintRate;
uniform float uTime;

// Hashes (Dave Hoskins). Stable per sprite, so the cluster travels rigidly
// with its grain the way a real clump does.
float hash11(float p) {
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}

vec2 hash21(float p) {
  vec3 p3 = fract(vec3(p) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}

vec3 grainColor() {
  float t = clamp(vLight, 0.0, 1.0);
  vec3 c = mix(uDeep, uMid, smoothstep(0.0, 0.55, t));
  c = mix(c, uLit, smoothstep(0.45, 1.0, t));
  // Airborne dust catches the light and pales, but never glows.
  c = mix(c, vec3(0.97, 0.94, 0.86), clamp(vSpeed, 0.0, 1.0) * 0.35);
  c *= 0.94 + 0.12 * vTint;
  c *= 1.0 - uPatchAmp + uPatchAmp * 2.0 * vPatch;
  return c;
}

void main() {
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(uv, uv);
  if (r2 > 1.0) discard;

  // A packed grain spreads its specks across the sprite; a grain touching
  // nothing draws as a single speck instead — otherwise every airborne grain
  // reads as a little flower of specks stuck together, which the cluster trick
  // hides inside the bed but not in flight.
  //
  // Keyed on isolation, not speed: a speed threshold fires on any grain that
  // has fallen a few tens of pixels, so a whole bed in motion collapses and
  // reads as drifting dust rather than sand.
  //
  // The lone speck grows to the grain's *actual* size (uAirSpeck). Collapsing
  // to the fine bed-speck size instead leaves a flying grain drawn several
  // times smaller than it physically is — thousands of those is exactly what a
  // dust cloud looks like, even when the simulation is behaving perfectly.
  float spread = uSpread * (1.0 - 0.85 * vAir);
  float speck = mix(uSpeck, uAirSpeck, vAir);

  // Nearest speck in the cluster.
  float best = 10.0;
  float bestId = 0.0;
  vec2 bestC = vec2(0.0);
  for (int k = 0; k < SPECKS; k++) {
    float fk = float(k);
    vec2 c = (hash21(vSeed * 17.0 + fk * 3.71) - 0.5) * spread;
    float d = length(uv - c);
    if (d < best) {
      best = d;
      bestId = fk;
      bestC = c;
    }
  }

  // Coverage runs a little past the specks so neighbours web together into a
  // porous but connected mass; what shows through the gaps is the grain drawn
  // behind, which is deeper and darker — free crevices.
  float alpha = smoothstep(speck * 2.1, speck * 1.1, best)
    * smoothstep(1.0, 0.8, r2);
  if (alpha < 0.02) discard;

  vec3 color = grainColor();

  // Micro-relief: a gentle fake normal per speck, all lit by the same global
  // light. Lit crest up-left, shade down-right, crevice shadow in the webbing.
  vec2 local = (uv - bestC) / max(speck, 1e-3);
  float lz = sqrt(max(1.0 - min(dot(local, local), 1.0) * 0.75, 0.0));
  vec3 nrm = normalize(vec3(local.x, local.y, lz * 1.35));
  vec3 lightDir = normalize(vec3(-0.33, -0.62, 0.71));
  float diffuse = max(dot(nrm, lightDir), 0.0);
  float crevice = smoothstep(speck * 2.0, speck * 0.5, best);
  color *= (0.52 + 0.62 * diffuse) * (0.55 + 0.45 * crevice);

  // A touch of per-speck scatter on top — grains are not all one mineral.
  color *= 1.0 - uVary * 0.5 + uVary * hash11(vSeed * 5.3 + bestId * 2.17);
  color *= 1.0 - uDepthDim * vDepth;

  // Sparkle: dry sand glints as facets catch the sun — but only the odd
  // facet. Most specks never glint at all; letting every speck flash on a
  // cycle made the whole bed shimmer like glitter.
  float facet = step(0.85, hash11(vSeed * 31.7 + bestId * 7.77));
  float phase = hash11(vSeed * 9.1 + bestId * 4.3);
  float tw = sin(uTime * uGlintRate + phase * 6.2831853);
  color += vec3(1.0, 0.97, 0.9) * pow(max(tw, 0.0), 64.0) * uGlint * facet
    * (0.3 + 0.7 * clamp(vLight, 0.0, 1.0)) * diffuse;

  gl_FragColor = vec4(color, alpha);
}
`;
}

// The box itself: interior walls and back plane, drawn before the sand in the
// same pinhole projection.
//
// Without them the container is invisible and the eye has to infer a box from
// loose grains alone — which is why the depth read as flat no matter how many
// layers were behind the glass. Four trapezoids converging on an inset back
// rectangle give the eye a reference frame, and because the front rectangle sits
// exactly on the viewport edge (persp is 1 at z=0, parallax included), only the
// back moves: tilting shears the walls, which is the strongest depth cue here.

const WALL_VERTEX_SHADER = `
precision highp float;

attribute vec3 aPos;
attribute float aShade;

uniform vec2 uViewport;
uniform float uFocal;
uniform vec2 uEye;

varying float vShade;

void main() {
  float persp = uFocal / (uFocal + aPos.z);
  vec2 p = uEye + (aPos.xy - uEye) * persp;
  vec2 unit = p / uViewport;
  gl_Position = vec4(unit.x * 2.0 - 1.0, 1.0 - unit.y * 2.0, 0.0, 1.0);
  vShade = aShade;
}
`;

const WALL_FRAGMENT_SHADER = `
precision mediump float;
varying float vShade;
uniform vec3 uWallColor;
void main() {
  gl_FragColor = vec4(uWallColor * vShade, 1.0);
}
`;

// ---- src/renderer.js ----
// WebGL point-sprite renderer: one interleaved buffer, one draw call for the
// sand plus a tiny one for the box. Prefers a WebGL2 context but the shaders
// are ES 1.00 so a WebGL1 fallback is identical in output.
//
// Grains are packed back-to-front (a 32-bucket counting sort on z), so nearer
// grains paint over deeper ones and no depth buffer is needed — point sprites
// with blending and a depth buffer fight over the alpha edges anyway.


const FLOATS_PER_GRAIN = 8; // x,y,z | light, speed, airborne | sizeJitter, hueJitter
const STRIDE = FLOATS_PER_GRAIN * 4;
const BUCKETS = 32;

class Renderer {
  /**
   * @param {boolean} preserve Keep the drawing buffer after presentation. Off
   *   by default (it costs a copy on some drivers); on it makes screenshots and
   *   canvas.toDataURL() reliable instead of returning whatever survived the
   *   last buffer swap.
   */
  constructor(canvas, capacity, preserve = false) {
    this.canvas = canvas;
    this.capacity = capacity;
    this.cpu = new Float32Array(capacity * FLOATS_PER_GRAIN);
    this.bucketOf = new Uint8Array(capacity);
    this.drawOrder = new Int32Array(capacity);
    this.bucketStart = new Int32Array(BUCKETS + 1);
    this.width = 1;
    this.height = 1;
    this.dpr = 1;
    // Parallax offset for the projection eye, in CSS px; set from the tilt.
    this.eyeX = 0;
    this.eyeY = 0;
    this.t0 = performance.now();
    // 5 quads (four interior walls + back plane), 6 vertices each, xyz + shade.
    this.wallData = new Float32Array(5 * 6 * 4);
    this.wallKey = '';
    // Speck styling, derived from the on-screen sprite size (see
    // ensureGrainStyle). The program is rebuilt when the count changes.
    this.speckCount = 0;
    this.speckRadius = 0.28;
    this._styleKey = '';
    this.contextLost = false;

    const opts = {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      premultipliedAlpha: true,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: preserve,
    };
    this.gl = canvas.getContext('webgl2', opts);
    this.isWebGL2 = !!this.gl;
    if (!this.gl) this.gl = canvas.getContext('webgl', opts);
    if (!this.gl) throw new Error('WebGL is not available in this browser.');

    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      this.contextLost = true;
    });
    canvas.addEventListener('webglcontextrestored', () => {
      this.initGL();
      this.contextLost = false;
    });

    this.initGL();
  }

  get backend() {
    return this.isWebGL2 ? 'webgl2' : 'webgl1';
  }

  initGL() {
    const gl = this.gl;

    this.buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.cpu.byteLength, gl.DYNAMIC_DRAW);

    // Wall program: its own tiny pipeline, sharing the projection maths.
    this.wallProgram = buildProgram(gl, WALL_VERTEX_SHADER, WALL_FRAGMENT_SHADER);
    this.wallAttrib = {
      pos: gl.getAttribLocation(this.wallProgram, 'aPos'),
      shade: gl.getAttribLocation(this.wallProgram, 'aShade'),
    };
    this.wallUniform = {
      viewport: gl.getUniformLocation(this.wallProgram, 'uViewport'),
      focal: gl.getUniformLocation(this.wallProgram, 'uFocal'),
      eye: gl.getUniformLocation(this.wallProgram, 'uEye'),
      color: gl.getUniformLocation(this.wallProgram, 'uWallColor'),
    };
    this.wallBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.wallBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.wallData.byteLength, gl.DYNAMIC_DRAW);
    this.wallKey = '';

    const bg = CONFIG.render.background;
    gl.clearColor(bg[0], bg[1], bg[2], 1);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);

    // Grain program is built lazily by ensureGrainStyle on the first draw,
    // because the speck count depends on the sprite's on-screen size.
    this.program = null;
    this.speckCount = 0;
    this._styleKey = '';
  }

  /**
   * Keep the *on-screen* speck size constant. The physics grain radius scales
   * with the short edge of the viewport (and is clamped), so on a wide screen
   * each grain sprite can be twice the phone's size — with a fixed speck count
   * and ratio the sand turned coarse exactly where there was most room to see
   * it. Instead the speck radius targets `speckPx` CSS pixels and the count
   * grows to keep the same covered fraction, so a big sprite gets many small
   * specks rather than a few big ones. The count is a compile-time constant in
   * ES 1.00, so changing it means relinking the grain program — rare (layout
   * and tuner changes only) and cheap.
   */
  ensureGrainStyle(diameter) {
    const r = CONFIG.render;
    const clusterPx = Math.max(diameter * r.clusterSize, 4);
    const key = clusterPx.toFixed(2);
    if (key === this._styleKey && this.program) return;
    this._styleKey = key;

    // uSpeck is in sprite units: a speck's on-screen diameter is
    // uSpeck * clusterPx.
    this.speckRadius = Math.min(0.42, Math.max(0.12, r.speckPx / clusterPx));
    const count = Math.round(Math.min(40, Math.max(6,
      r.speckCoverage / (this.speckRadius * this.speckRadius))));
    if (count !== this.speckCount || !this.program) {
      this.speckCount = count;
      this.setupGrainProgram();
    }
  }

  setupGrainProgram() {
    const gl = this.gl;
    if (this.program) gl.deleteProgram(this.program);
    this.program = buildProgram(gl, VERTEX_SHADER, buildFragmentShader(this.speckCount));
    gl.useProgram(this.program);

    this.attrib = {
      pos: gl.getAttribLocation(this.program, 'aPos'),
      shade: gl.getAttribLocation(this.program, 'aShade'),
      jitter: gl.getAttribLocation(this.program, 'aJitter'),
    };
    this.uniform = {
      viewport: gl.getUniformLocation(this.program, 'uViewport'),
      pointSize: gl.getUniformLocation(this.program, 'uPointSize'),
      airShrink: gl.getUniformLocation(this.program, 'uAirShrink'),
      focal: gl.getUniformLocation(this.program, 'uFocal'),
      eye: gl.getUniformLocation(this.program, 'uEye'),
      depthRange: gl.getUniformLocation(this.program, 'uDepthRange'),
      depthDim: gl.getUniformLocation(this.program, 'uDepthDim'),
      deep: gl.getUniformLocation(this.program, 'uDeep'),
      mid: gl.getUniformLocation(this.program, 'uMid'),
      lit: gl.getUniformLocation(this.program, 'uLit'),
      patchScale: gl.getUniformLocation(this.program, 'uPatchScale'),
      patchAmp: gl.getUniformLocation(this.program, 'uPatchAmp'),
      spread: gl.getUniformLocation(this.program, 'uSpread'),
      speck: gl.getUniformLocation(this.program, 'uSpeck'),
      airSpeck: gl.getUniformLocation(this.program, 'uAirSpeck'),
      vary: gl.getUniformLocation(this.program, 'uVary'),
      glint: gl.getUniformLocation(this.program, 'uGlint'),
      glintRate: gl.getUniformLocation(this.program, 'uGlintRate'),
      time: gl.getUniformLocation(this.program, 'uTime'),
    };

    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
    for (const loc of Object.values(this.attrib)) {
      if (loc >= 0) gl.enableVertexAttribArray(loc);
    }
