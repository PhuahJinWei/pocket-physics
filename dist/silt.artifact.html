   * the cone, sliding is cancelled outright instead of merely slowed.
   */
  solveVelocity(h) {
    const cnt = this.activeCount;
    if (cnt === 0) return;
    const { ci, cj, cnx, cny, cnz, cgap, cjn, cfx, cfy, cfz, cbounce, active, vx, vy, vz } = this;
    const invH = 1 / h;
    const iters = CONFIG.sim.velocityIterations;
    const mu = CONFIG.sim.friction;
    const muWall = CONFIG.sim.wallFriction;

    // Restitution, measured from the approach speed *before* the solve runs.
    // Only genuine impacts bounce: below the threshold a contact is resting,
    // and letting those bounce would make the whole bed buzz. Without any of
    // this, sand slammed into a wall absorbs every bit of its momentum and
    // stops dead, which is what kills the slosh-back.
    const rest = CONFIG.sim.restitution;
    const restCut = CONFIG.sim.restitutionCut * this.diameter;
    for (let a = 0; a < cnt; a++) {
      const c = active[a];
      const i = ci[c];
      const j = cj[c];
      const nx = cnx[c], ny = cny[c], nz = cnz[c];
      const vn = j >= 0
        ? (vx[j] - vx[i]) * nx + (vy[j] - vy[i]) * ny + (vz[j] - vz[i]) * nz
        : -(vx[i] * nx + vy[i] * ny + vz[i] * nz);
      cbounce[c] = vn < -restCut ? -rest * vn : 0;
    }

    // Warm start: re-apply what each contact was already carrying.
    for (let a = 0; a < cnt; a++) {
      const c = active[a];
      const i = ci[c];
      const j = cj[c];
      const jn = cjn[c];
      const px = -cnx[c] * jn + cfx[c];
      const py = -cny[c] * jn + cfy[c];
      const pz = -cnz[c] * jn + cfz[c];
      vx[i] += px; vy[i] += py; vz[i] += pz;
      if (j >= 0) { vx[j] -= px; vy[j] -= py; vz[j] -= pz; }
    }

    for (let it = 0; it < iters; it++) {
      for (let a = 0; a < cnt; a++) {
        const c = active[a];
        const i = ci[c];
        const j = cj[c];
        const nx = cnx[c], ny = cny[c], nz = cnz[c];
        // Still apart: allow approach fast enough to just close the gap this
        // step, no faster. Already touching: separate at the bounce speed
        // (zero for a resting contact).
        const gap = cgap[c];
        const target = gap > 0 ? -gap * invH : cbounce[c];

        if (j >= 0) {
          // Two unit masses: 1/mi + 1/mj = 2, so the impulse is halved.
          let rx = vx[j] - vx[i], ry = vy[j] - vy[i], rz = vz[j] - vz[i];
          const vn = rx * nx + ry * ny + rz * nz;
          let dj = (target - vn) * 0.5;
          const total = cjn[c] + dj > 0 ? cjn[c] + dj : 0;
          dj = total - cjn[c];
          cjn[c] = total;
          if (dj !== 0) {
            vx[i] -= dj * nx; vy[i] -= dj * ny; vz[i] -= dj * nz;
            vx[j] += dj * nx; vy[j] += dj * ny; vz[j] += dj * nz;
          }

          rx = vx[j] - vx[i]; ry = vy[j] - vy[i]; rz = vz[j] - vz[i];
          const vn2 = rx * nx + ry * ny + rz * nz;
          // Impulse that would cancel all remaining sliding, added to what this
          // contact already holds, then clamped as a whole.
          let fx = cfx[c] + (rx - vn2 * nx) * 0.5;
          let fy = cfy[c] + (ry - vn2 * ny) * 0.5;
          let fz = cfz[c] + (rz - vn2 * nz) * 0.5;
          const cap = mu * cjn[c];
          const m2 = fx * fx + fy * fy + fz * fz;
          if (m2 > cap * cap) {
            const k = cap / Math.sqrt(m2);
            fx *= k; fy *= k; fz *= k;
          }
          const dfx = fx - cfx[c], dfy = fy - cfy[c], dfz = fz - cfz[c];
          cfx[c] = fx; cfy[c] = fy; cfz[c] = fz;
          vx[i] += dfx; vy[i] += dfy; vz[i] += dfz;
          vx[j] -= dfx; vy[j] -= dfy; vz[j] -= dfz;
        } else {
          // Static wall: infinite mass, zero velocity.
          const vn = -(vx[i] * nx + vy[i] * ny + vz[i] * nz);
          let dj = target - vn;
          const total = cjn[c] + dj > 0 ? cjn[c] + dj : 0;
          dj = total - cjn[c];
          cjn[c] = total;
          if (dj !== 0) {
            vx[i] -= dj * nx; vy[i] -= dj * ny; vz[i] -= dj * nz;
          }

          const rx = -vx[i], ry = -vy[i], rz = -vz[i];
          const vn2 = rx * nx + ry * ny + rz * nz;
          let fx = cfx[c] + (rx - vn2 * nx);
          let fy = cfy[c] + (ry - vn2 * ny);
          let fz = cfz[c] + (rz - vn2 * nz);
          const cap = muWall * cjn[c];
          const m2 = fx * fx + fy * fy + fz * fz;
          if (m2 > cap * cap) {
            const k = cap / Math.sqrt(m2);
            fx *= k; fy *= k; fz *= k;
          }
          const dfx = fx - cfx[c], dfy = fy - cfy[c], dfz = fz - cfz[c];
          cfx[c] = fx; cfy[c] = fy; cfz[c] = fz;
          vx[i] += dfx; vy[i] += dfy; vz[i] += dfz;
        }
      }
    }
  }

  /**
   * Shock propagation: one bottom-up sweep in which the deeper grain of each
   * pair is treated as immovable, so the whole impulse lands on the shallower
   * one.
   *
   * This is what makes deep piles stand up. Between two equal masses an impulse
   * only averages their velocities, so support crawls up a stack geometrically
   * — a thirty-layer bed needs far more iterations than is affordable, and
   * without this it slowly crushes itself into an overlapping slab. Treating
   * the supported side as ground (the floor does not recoil) carries support
   * from the box floor to the surface in a single pass. It deliberately breaks
   * momentum conservation, which is exactly what resting on solid ground does.
   */
  shockPass(h) {
    const cnt = this.activeCount;
    if (cnt === 0) return;
    const { ci, cj, cnx, cny, cnz, cgap, active, vx, vy, vz } = this;
    const invH = 1 / h;
    const passes = CONFIG.sim.shockIterations;
    // Only quasi-static contacts get the ground treatment. Treating the
    // supported grain as immovable is what holds a pile up, but it also dumps
    // the incoming momentum of a fast impact into "ground" instead of passing
    // it along the contact chain — so sand slamming into a wall is swallowed
    // rather than spraying back. Above this approach speed the symmetric,
    // momentum-conserving solve is left to handle it alone.
    const gate = -CONFIG.sim.shockMaxApproach * this.diameter;

    for (let p = 0; p < passes; p++) {
      for (let a = 0; a < cnt; a++) {
        const c = active[a];
        const i = ci[c];
        const j = cj[c];
        const nx = cnx[c], ny = cny[c], nz = cnz[c];
        const gap = cgap[c];
        const target = gap > 0 ? -gap * invH : 0;
        if (j >= 0) {
          // ci is the deeper grain: it is the one already held up.
          const vn = (vx[j] - vx[i]) * nx + (vy[j] - vy[i]) * ny + (vz[j] - vz[i]) * nz;
          const dj = target - vn;
          if (dj > 0 && vn > gate) {
            vx[j] += dj * nx; vy[j] += dj * ny; vz[j] += dj * nz;
          }
        } else {
          const vn = -(vx[i] * nx + vy[i] * ny + vz[i] * nz);
          const dj = target - vn;
          if (dj > 0 && vn > gate) {
            vx[i] -= dj * nx; vy[i] -= dj * ny; vz[i] -= dj * nz;
          }
        }
      }
    }
  }

  integrate(h) {
    const n = this.n;
    const { x, y, z, vx, vy, vz } = this;
    // Nothing may cross more than about its own width per substep, or contacts
    // are found only once grains are already deep inside each other.
    const maxV = (CONFIG.sim.maxTravel * this.diameter) / h;
    const maxV2 = maxV * maxV;
    for (let i = 0; i < n; i++) {
      let ux = vx[i], uy = vy[i], uz = vz[i];
      const s2 = ux * ux + uy * uy + uz * uz;
      if (s2 > maxV2) {
        const k = maxV / Math.sqrt(s2);
        ux *= k; uy *= k; uz *= k;
        vx[i] = ux; vy[i] = uy; vz[i] = uz;
      }
      x[i] += ux * h;
      y[i] += uy * h;
      z[i] += uz * h;
    }
  }

  /**
   * Position pass: push overlapping pairs apart, and put wall violators back
   * inside. Velocities are deliberately left alone — turning this correction
   * into velocity is exactly how a solver starts manufacturing energy.
   *
   * `slop` leaves a sliver of overlap uncorrected so a resting bed has nothing
   * left to fidget about.
   */
  solvePosition() {
    const cnt = this.activeCount;
    const { ci, cj, cnx, cny, cnz, crest, active, x, y, z, rad } = this;
    const iters = CONFIG.sim.positionIterations;
    const beta = CONFIG.sim.positionBeta;
    const D = this.diameter;
    const slop = CONFIG.sim.slop * D;
    const maxFix = CONFIG.sim.maxCorrection * D;
    const B = this.bounds;
    const depth = this.depth;

    for (let it = 0; it < iters; it++) {
      for (let a = 0; a < cnt; a++) {
        const c = active[a];
        const i = ci[c];
        const j = cj[c];
        if (j >= 0) {
          const rest = crest[c];
          const dx = x[j] - x[i], dy = y[j] - y[i], dz = z[j] - z[i];
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 >= rest * rest || d2 < 1e-12) continue;
          const dist = Math.sqrt(d2);
          let push = (rest - dist - slop) * beta * 0.5;
          if (push <= 0) continue;
          if (push > maxFix) push = maxFix;
          const inv = 1 / dist;
          const nx = dx * inv, ny = dy * inv, nz = dz * inv;
          x[i] -= nx * push; y[i] -= ny * push; z[i] -= nz * push;
          x[j] += nx * push; y[j] += ny * push; z[j] += nz * push;
        } else {
          const nx = cnx[c], ny = cny[c], nz = cnz[c];
          const ri = rad[i];
          // Distance past the plane this normal points at (negative = still
          // inside, which is the common speculative case and does nothing).
          let pen;
          if (nx < 0) pen = B.x0 + ri - x[i];
          else if (nx > 0) pen = x[i] - (B.x1 - ri);
          else if (ny < 0) pen = B.y0 + ri - y[i];
          else if (ny > 0) pen = y[i] - (B.y1 - ri);
          else if (nz < 0) pen = ri - z[i];
          else pen = z[i] - (depth - ri);
          let push = (pen - slop) * beta;
          if (push <= 0) continue;
          if (push > maxFix) push = maxFix;
          x[i] -= nx * push; y[i] -= ny * push; z[i] -= nz * push;
        }
      }
    }

    // Final hard clamp: whatever the solver did, nothing leaves the box.
    const n = this.n;
    for (let i = 0; i < n; i++) {
      const ri = rad[i];
      if (x[i] < B.x0 + ri) x[i] = B.x0 + ri; else if (x[i] > B.x1 - ri) x[i] = B.x1 - ri;
      if (y[i] < B.y0 + ri) y[i] = B.y0 + ri; else if (y[i] > B.y1 - ri) y[i] = B.y1 - ri;
      if (z[i] < ri) z[i] = ri; else if (z[i] > depth - ri) z[i] = depth - ri;
    }
  }

  updateShading(dt) {
    const n = this.n;
    const cfg = CONFIG.sim;
    const { light, cover, contacts, litAbove, speed01, airborne, loose, vx, vy, vz } = this;
    const invCover = 1 / cfg.coverNorm;
    const invSpeed = 1 / this.speedNorm;
    const blend = 1 - Math.exp(-cfg.lightSmoothing * dt);
    const transmit = cfg.lightTransmit;

    for (let i = 0; i < n; i++) {
      const buried = clamp(cover[i] * invCover, 0, 1);
      const looseNow = 1 - clamp(contacts[i] / 6, 0, 1);
      // How UNSUPPORTED a grain is, for the renderer — a different question
      // from how lit it is, and it saturates much sooner. Three contacts
      // already means "part of a connected mass", and the renderer only needs
      // to tell a mass from a grain flying on its own. Measured against six
      // (full 3D coordination) a jammed single layer reads as half loose,
      // because a sheet one grain thick genuinely has fewer neighbours than a
      // deep bed — and the renderer then drew it small and tore it into holes,
      // which is exactly what a phone laid face-up showed.
      const packNow = 1 - clamp(contacts[i] / 3, 0, 1);
      // Lit if nothing is above you, or if you are barely touching anything...
      const exposed = Math.max(1 - buried, looseNow * 0.95);
      // ...otherwise take what filters down from the grain above you.
      const target = Math.max(exposed, litAbove[i] * transmit);
      light[i] += (target - light[i]) * blend;
      speed01[i] = clamp(Math.hypot(vx[i], vy[i], vz[i]) * invSpeed, 0, 1);
      // In flight: touching nothing AND actually moving. Touching nothing is
      // not enough on its own — `contacts` counts grain-grain pairs only, so a
      // grain lying by itself on the floor of a bare patch, held up by the
      // wall, counts as touching nothing while being completely at rest. The
      // renderer draws sand in flight as spray (half size, dimmed, specks
      // spread wide), and applying that to a grain that is simply lying there
      // is what left bare patches as clean empty holes with nothing scattered
      // in them.
      //
      // Speed is safe as a SECOND condition even though it is useless as a
      // first one: it can only ever remove grains from the set, and the case
      // being removed is exactly a resting one. The band is low because
      // speed01 saturates fast — a grain that has fallen two pixels is already
      // past it — so anything genuinely in flight still reads as 1.
      const moving = clamp((speed01[i] - cfg.flightSpeed) / cfg.flightSpeedBand, 0, 1);
      const air = contacts[i] === 0 ? moving : 0;
      airborne[i] += (air - airborne[i]) * blend;
      loose[i] += (packNow - loose[i]) * blend;
    }
  }
}

// ---- src/fluid.js ----
// Water: Position Based Fluids (Macklin & Müller, 2013).
//
// Why not reuse the granular solver with friction turned off: a Coulomb contact
// solver with mu = 0 is not a liquid, it is a frictionless granular gas. It
// resists penetration but nothing else, so it stays compressible, bounces, and
// never develops the pressure gradient that makes water level itself out. A
// fluid needs a *density* constraint instead of a non-penetration one — every
// particle wants the same number of neighbours around it, which is what makes
// it flow, fill corners, and hold a flat surface.
//
// PBF solves that constraint the same way the sand solves contacts: predict,
// project, then read the velocity back out of the position change. So the
// expensive parts of the project carry straight over — the spatial hash, the
// fixed timestep, the tilt input, the shake pulse. What is different is the
// constraint itself and everything downstream of it.
//
// The one piece of real subtlety here is the boundary correction. This box is
// only a few particles deep, so most of the water is within a smoothing radius
// of the front or back glass. A particle there sees fewer neighbours than one
// in open fluid, reads as under-dense, and gets sucked into the wall — the
// whole body would creep into the glass and stick. `wallDensity` below adds
// back exactly the mass the missing half-space would have contributed.


// Poly6 is used for density and Spiky for its gradient (Poly6's gradient
// vanishes at r=0, so particles on top of each other would never separate).
// Both are written normalised to W(0) = 1, which drops h^9-sized constants out
// of the arithmetic; the only thing that has to survive is their *ratio*, and
// that is this number. See CONFIG.fluid for the derivation.
const GRAD_K = 2880 / 315;

// Scratch for the coincident-particle fallback. Module level so the inner
// loops stay allocation-free.
const SEP = new Float64Array(3);

/**
 * A separation direction for a pair that has collapsed onto the same point,
 * where the geometry offers none. Derived from the two indices, so it is the
 * same every frame (a random one would jitter the pair in place), and negated
 * for the partner so both halves of the pair push the same way apart.
 */
function scatterDir(i, j) {
  const lo = i < j ? i : j;
  const hi = i < j ? j : i;
  let h = (Math.imul(lo, 73856093) ^ Math.imul(hi, 19349663)) >>> 0;
  h = (h ^ (h >>> 13)) >>> 0;
  const uz = ((h & 2047) / 2047) * 2 - 1;
  const phi = (((h >>> 11) & 2047) / 2047) * 6.283185307179586;
  const s = Math.sqrt(Math.max(0, 1 - uz * uz));
  const sign = i < j ? 1 : -1;
  SEP[0] = s * Math.cos(phi) * sign;
  SEP[1] = s * Math.sin(phi) * sign;
  SEP[2] = uz * sign;
}

class Fluid {
  /**
   * @param {number} capacity
   * @param {object} def Which liquid this is. `tuning` is the solver's half
   *   (CONFIG.fluid and friends) and `look` the renderer's (CONFIG.water and
   *   friends); everything that separates honey from water lives in those two
   *   objects, so a new liquid is a config entry rather than a subclass.
   */
  constructor(capacity, def = {}) {
    this.kind = def.kind || 'water';
    this.label = def.label || 'Water';
    this.tuning = def.tuning || CONFIG.fluid;
    this.look = def.look || CONFIG.water;
    // Which pass in the renderer draws this. Every liquid takes the same one.
    this.render = 'fluid';
    // No into-screen lean. Sand uses one to pile against the back wall, but a
    // liquid answers a tilted gravity with a tilted surface: measured, the
    // sand's 0.45 put the back of the water 22px higher than the front, which
    // perspective then widened into a visible shelf. Water fills the box on its
    // own, so it does not need the cue.
    this.zBias = 0;
    this.capacity = capacity;
    this.n = 0;

    const f32 = () => new Float32Array(capacity);
    // Committed state.
    this.x = f32();
    this.y = f32();
    this.z = f32();
    this.vx = f32();
    this.vy = f32();
    this.vz = f32();
    // Predicted positions the constraint is solved against.
    this.px = f32();
    this.py = f32();
    this.pz = f32();
    // Per-iteration scratch.
    this.lambda = f32();
    this.dx = f32();
    this.dy = f32();
    this.dz = f32();
    this.density = f32();
    // Velocity smoothing target (XSPH) — written in one pass, applied in the
    // next, so particles all see the same velocity field.
    this.ax = f32();
    this.ay = f32();
    this.az = f32();
    // Wall-term gradient, carried from solveDensity to applyCorrection.
    this.wgx = f32();
    this.wgy = f32();
    this.wgz = f32();
    // Shading channel: normalised speed, which the renderer turns into foam.
    this.speed01 = f32();

    this.grid = new Grid(capacity);
    this.random = makeRandom(0x51F7);

    // Flat neighbour list, rebuilt once per substep and reused by every solver
    // iteration. Gathering is the expensive half, and it does not change while
    // the positions are only being nudged.
    this.maxNeighbours = this.tuning.maxNeighbours;
    this.nbr = new Int32Array(0);
    this.nbrCount = new Int32Array(capacity);

    this.radius = 8;
    this.diameter = 16;
    this.spacing = 16;
    this.smoothing = 32;
    this.restDensity = 1;
    this.depth = 32;
    this.bounds = { x0: 0, y0: 0, x1: 1, y1: 1 };
    this.inner = { x0: 0, y0: 0, z0: 0, x1: 1, y1: 1, z1: 1 };
    this.gravityMagnitude = 4000;
    this.speedNorm = 600;
    this.pokeRadius = 60;
    // Unit gravity from the last step, so a splash throws away from whichever
    // wall the water is currently lying against.
    this.gdx = 0;
    this.gdy = 1;
    this.gdz = 0;

    // Shake pulse, identical in shape to the sand's: an acceleration added to
    // gravity for a moment rather than a velocity handed to each particle.
    this.kickX = 0;
    this.kickY = 0;
    this.kickZ = 0;
    this.kickTime = 0;

    this.substeps = 1;
    this.iterations = this.tuning.solverIterations;
    this.contactCount = 0;
    this._carry = 0;
  }

  /**
   * Water picks a coarser particle than sand on purpose. Sand needs many
   * particles because every one of them is visible; water is drawn as a
   * surface, so its particles are hidden and can be several times larger for
   * the same amount of stuff in the box.
   */
  preferredRadius(width, height, qualityScale = 1) {
    const f = CONFIG.fluid;
    const base = clamp(Math.min(width, height) / f.divisor, f.minRadius, f.maxRadius);
    return clamp(base / Math.cbrt(qualityScale), f.minRadius, f.maxRadius);
  }

  configure(width, height, radius) {
    this.radius = radius;
    this.diameter = radius * 2;
    // Rest spacing is one diameter: the particle count and the fill volume are
    // derived from the same number in idealCount, so the body settles at the
    // fill level asked for instead of drifting to whatever the solver likes.
    this.spacing = this.diameter;
    this.smoothing = this.spacing * this.tuning.smoothingRatio;

    this.depth = Math.max(
      this.diameter * 2,
      Math.min(this.tuning.depthLayers * this.diameter, Math.min(width, height) * 0.22),
    );
    this.bounds = { x0: 0, y0: 0, x1: width, y1: height };
    this.inner = {
      x0: radius,
      y0: radius,
      z0: radius,
      x1: Math.max(radius, width - radius),
      y1: Math.max(radius, height - radius),
      z1: Math.max(radius, this.depth - radius),
    };
    // One cell per smoothing radius, so the 3x3x3 scan is exactly the kernel
    // support and nothing inside it is missed.
    this.grid.configure(width, height, this.depth, this.smoothing);

    this.restDensity = latticeDensity(this.spacing, this.smoothing);
    this.gravityMagnitude = CONFIG.sim.gravityScale * Math.hypot(width, height);
    this.speedNorm = 0.35 * Math.sqrt(2 * this.gravityMagnitude * height);
    this.pokeRadius = Math.max(
      CONFIG.input.pokeRadiusMin,
      Math.min(width, height) * CONFIG.input.pokeRadiusFrac,
    );
  }

  /** Same pinned-radius problem the sand has; same lever. */
  targetCount(width, height, qualityScale = 1) {
    const ideal = this.idealCount();
    const f = CONFIG.fluid;
    const pinned = Math.min(width, height) / f.divisor >= f.maxRadius;
    return pinned ? Math.round(ideal * Math.min(1, qualityScale)) : ideal;
  }

  /** Particle count that fills `this.tuning.fill` of the front view. */
  idealCount(fill = this.tuning.fill) {
    const { x1, y1 } = this.bounds;
    const volume = x1 * (fill * y1) * this.depth;
    const ideal = volume / (this.spacing * this.spacing * this.spacing);
    return Math.round(clamp(ideal, this.tuning.minParticles, Math.min(this.tuning.maxParticles, this.capacity)));
  }

  ensureNeighbourCapacity(n) {
    const need = n * this.maxNeighbours;
    if (this.nbr.length >= need) return;
    this.nbr = new Int32Array(need);
  }

  fill(count) {
    const n = Math.min(count, this.capacity);
    this.n = n;
    this.grid.ensureCapacity(n);
    this.ensureNeighbourCapacity(n);
    this.kickTime = 0;

    const rand = this.random;
    const b = this.inner;
    // Start on a lattice at rest spacing, jittered a little. Starting at rest
    // spacing matters: dropping water in over-packed hands the solver a large
    // density error on frame one and it answers with an explosion.
    const pitch = this.spacing;
    const perX = Math.max(1, Math.floor((b.x1 - b.x0) / pitch));
    const perZ = Math.max(1, Math.floor((b.z1 - b.z0) / pitch) + 1);
    const perLayer = perX * perZ;
    const rows = Math.ceil(n / perLayer);
    const surface = b.y1 - rows * pitch;

    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / perLayer);
      const rem = i % perLayer;
      const j = rem % perX;
      const k = Math.floor(rem / perX);
      this.x[i] = clamp(b.x0 + (j + 0.5) * pitch + (rand() - 0.5) * pitch * 0.2, b.x0, b.x1);
      this.y[i] = clamp(surface + row * pitch + (rand() - 0.5) * pitch * 0.2, b.y0, b.y1);
      this.z[i] = clamp(b.z0 + k * pitch + (rand() - 0.5) * pitch * 0.2, b.z0, b.z1);
      this.vx[i] = 0;
      this.vy[i] = 0;
      this.vz[i] = 0;
      this.speed01[i] = 0;
    }
  }

  setCount(count) {
    const target = Math.min(Math.max(count, 0), this.capacity);
    if (target === this.n) return;
    if (target < this.n) {
      this.n = target;
      return;
    }
    // Growing: refill rather than sprinkling particles into a settled body,
    // where they would land inside their neighbours and blow the density
    // constraint apart.
    this.fill(target);
  }

  clampToBounds() {
    const b = this.inner;
    for (let i = 0; i < this.n; i++) {
      this.x[i] = clamp(this.x[i], b.x0, b.x1);
      this.y[i] = clamp(this.y[i], b.y0, b.y1);
      this.z[i] = clamp(this.z[i], b.z0, b.z1);
    }
  }

  /** Shake: jerk the container, exactly as the sand does. See Grains.splash. */
  splash(strength) {
    const rand = this.random;
    const cfg = CONFIG.sim;
    const g = this.gravityMagnitude || 1;
    let ux = -this.gdx;
    let uy = -this.gdy;
    let uz = -this.gdz;
    const lean = (rand() - 0.5) * 2 * cfg.splashLean;
    const tx = -uy * lean;
    const ty = ux * lean;
    ux += tx;
    uy += ty;
    const inv = 1 / (Math.hypot(ux, uy, uz) || 1);
    ux *= inv; uy *= inv; uz *= inv;
    const a = g * (cfg.splashAccel + cfg.splashGain * Math.max(0, strength - 1));
    this.kickX = ux * a;
    this.kickY = uy * a;
    this.kickZ = uz * a;
    this.kickTime = cfg.splashDuration;
  }

  poke(cx, cy, dragX, dragY, dt) {
    const r = this.pokeRadius;
    const r2 = r * r;
    const push = this.gravityMagnitude * CONFIG.input.pokeAccel * dt;
    const dragScale = CONFIG.input.pokeDrag;
    const { x, y, vx, vy } = this;
    for (let i = 0; i < this.n; i++) {
      const ox = x[i] - cx;
      const oy = y[i] - cy;
      const d2 = ox * ox + oy * oy;
      if (d2 > r2) continue;
      const d = Math.sqrt(d2) || 1e-4;
      const falloff = 1 - d / r;
      const k = (push * falloff) / d;
      vx[i] += ox * k + dragX * dragScale * falloff;
      vy[i] += oy * k + dragY * dragScale * falloff;
    }
  }

  // ------------------------------------------------------------------ stepping

  step(dtFrame, gx, gy, gz) {
    const n = this.n;
    if (n === 0) return;
    const cfg = CONFIG.fluid;

    const h = 1 / cfg.fixedHz;
    this._carry += dtFrame;
    let steps = Math.floor(this._carry / h);
    if (steps > cfg.maxSubsteps) steps = cfg.maxSubsteps;
    if (steps < 1) {
      if (this._carry < h) return;
      steps = 1;
    }
    this._carry -= steps * h;
    if (this._carry > h * cfg.maxSubsteps) this._carry = 0;
    this.substeps = steps;
    this.iterations = cfg.solverIterations;

    const gmag = Math.hypot(gx, gy, gz) || 1;
    this.gdx = gx / gmag;
    this.gdy = gy / gmag;
    this.gdz = gz / gmag;

    for (let s = 0; s < steps; s++) {
      let ax = gx;
      let ay = gy;
      let az = gz;
      if (this.kickTime > 0) {
        ax += this.kickX;
        ay += this.kickY;
        az += this.kickZ;
        this.kickTime -= h;
      }
      this.predict(h, ax, ay, az);
      this.grid.build(this.px, this.py, this.pz, n);
      this.gatherNeighbours();
      for (let it = 0; it < this.iterations; it++) {
        this.solveDensity();
        this.applyCorrection();
      }
      this.commit(h);
      // After commit, so the separation shows up in the next frame's velocity
      // rather than being read back as a spurious impulse this one.
      this.separate();
      this.viscosity();
      this.adhesion(h);
    }
    this.updateShading(dtFrame);
  }

  predict(h, gx, gy, gz) {
    const n = this.n;
    const { x, y, z, px, py, pz, vx, vy, vz } = this;
    const damp = Math.exp(-this.tuning.drag * h);
    for (let i = 0; i < n; i++) {
      const nvx = (vx[i] + gx * h) * damp;
      const nvy = (vy[i] + gy * h) * damp;
      const nvz = (vz[i] + gz * h) * damp;
      vx[i] = nvx; vy[i] = nvy; vz[i] = nvz;
      px[i] = x[i] + nvx * h;
      py[i] = y[i] + nvy * h;
      pz[i] = z[i] + nvz * h;
    }
    this.project(px, py, pz, n);
  }

  /** Keep predicted positions inside the glass. */
  project(px, py, pz, n) {
    const b = this.inner;
    for (let i = 0; i < n; i++) {
      if (px[i] < b.x0) px[i] = b.x0; else if (px[i] > b.x1) px[i] = b.x1;
      if (py[i] < b.y0) py[i] = b.y0; else if (py[i] > b.y1) py[i] = b.y1;
      if (pz[i] < b.z0) pz[i] = b.z0; else if (pz[i] > b.z1) pz[i] = b.z1;
    }
  }

  gatherNeighbours() {
    const n = this.n;
    const grid = this.grid;
    const { px, py, pz, nbr, nbrCount } = this;
    const cap = this.maxNeighbours;
    const hh = this.smoothing;
    const h2 = hh * hh;
    const cols = grid.cols;
    const rows = grid.rows;
    const slabs = grid.slabs;
    const layer = cols * rows;
    const start = grid.cellStart;
    const order = grid.order;
    const inv = 1 / grid.cellSize;
    let total = 0;

    for (let i = 0; i < n; i++) {
      const xi = px[i], yi = py[i], zi = pz[i];
      let cx = (xi * inv) | 0, cy = (yi * inv) | 0, cz = (zi * inv) | 0;
      if (cx < 0) cx = 0; else if (cx >= cols) cx = cols - 1;
      if (cy < 0) cy = 0; else if (cy >= rows) cy = rows - 1;
      if (cz < 0) cz = 0; else if (cz >= slabs) cz = slabs - 1;

      let count = 0;
      const base = i * cap;
      const z0 = cz > 0 ? cz - 1 : 0, z1 = cz < slabs - 1 ? cz + 1 : slabs - 1;
      const y0 = cy > 0 ? cy - 1 : 0, y1 = cy < rows - 1 ? cy + 1 : rows - 1;
      const x0 = cx > 0 ? cx - 1 : 0, x1 = cx < cols - 1 ? cx + 1 : cols - 1;
      for (let bz = z0; bz <= z1; bz++) {
        for (let by = y0; by <= y1; by++) {
          const rowBase = bz * layer + by * cols;
          const from = start[rowBase + x0];
          const to = start[rowBase + x1 + 1];
          for (let s = from; s < to; s++) {
            const j = order[s];
            if (j === i) continue;
            const dx = xi - px[j], dy = yi - py[j], dz = zi - pz[j];
            if (dx * dx + dy * dy + dz * dz >= h2) continue;
            if (count >= cap) break;
            nbr[base + count++] = j;
          }
          if (count >= cap) break;
        }
        if (count >= cap) break;
      }
      nbrCount[i] = count;
      total += count;
    }
    this.contactCount = total >> 1;
  }

  /**
   * Density, then the Lagrange multiplier that will correct it. Both loops run
   * over the whole fluid before anything moves (Jacobi, not Gauss-Seidel) —
   * with a shared constraint like density, solving in place makes the result
   * depend on particle ordering and the surface ends up visibly striped.
   */
  solveDensity() {
    const n = this.n;
    const { px, py, pz, nbr, nbrCount, lambda, density, wgx, wgy, wgz } = this;
    const cap = this.maxNeighbours;
    const hh = this.smoothing;
    const inv = 1 / hh;
    const gradK = GRAD_K * inv;
    const rho0 = this.restDensity;
    const eps = this.tuning.relaxation;
    const wallScale = this.tuning.wallDensity;

    for (let i = 0; i < n; i++) {
      const xi = px[i], yi = py[i], zi = pz[i];
      let rho = 1; // self contribution: W(0) = 1
      // Gradient with respect to this particle, and the sum of squared
      // gradients with respect to every neighbour.
      let gx = 0, gy = 0, gz = 0, sumSq = 0;
      const base = i * cap;
      const count = nbrCount[i];
      for (let k = 0; k < count; k++) {
        const j = nbr[base + k];
        const dx = xi - px[j], dy = yi - py[j], dz = zi - pz[j];
        const r = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (r <= 1e-6 || r >= hh) continue;
        const q = r * inv;
        const w = 1 - q * q;
        rho += w * w * w;
        // Spiky falls off with distance, so its gradient points *toward* the
        // neighbour: dW/dr is negative. Dropping that minus sign inverts the
        // whole solver — over-dense particles pull together instead of pushing
        // apart, and the fluid collapses to a point.
        const gm = -(gradK * (1 - q) * (1 - q)) / r;
        const cx = dx * gm, cy = dy * gm, cz = dz * gm;
        gx += cx; gy += cy; gz += cz;
        sumSq += cx * cx + cy * cy + cz * cz;
      }

      // The glass cuts the kernel short. Add back what the fluid on the other
      // side would have contributed, or every particle near a wall reads as
      // under-dense and the body creeps into the glass and sticks there.
      //
      // Combined as a union, not a sum. Where two walls meet, the regions they
      // cut off overlap, and adding the terms counts that corner twice — in a
      // box only a few particles deep almost every particle touches a glass
      // *and* a side or the floor, so the double count is the common case, not
      // the exception. Summed, it drove bulk density to 1.5x rest, a pressure
      // the solver can never relieve by moving anything, and the fluid extruded
      // itself up the walls in permanent standing columns.
      //
      // And the term enters the *gradient*, not just the density. This is the
      // difference between a wall the water rests against and a wall it welds
      // to. Density alone raises C for a particle pinned on the glass, but
      // every correction then acts along neighbour directions — pushes into
      // the wall are clamped away, and nothing ever pushes it off, because
      // nothing says C would drop if it moved. Measured on a live standing
      // column: 58 particles all at exactly the wall x, static for minutes,
      // and removing the wall term collapsed it in two seconds. With the
      // gradient in place, an over-dense wall particle is pushed back into
      // the fluid, which is the lateral escape hydrostatics needs.
      // z runs from 0 (front glass) to depth (back glass). `bounds` has no z
      // fields — an earlier version read `bounds.z0` here, and the resulting
      // NaN was silently swallowed by wallDensity's final clamp, which meant
      // the front glass had no density term at all.
      const fx0 = wallDensity(xi - this.bounds.x0, hh);
      const fx1 = wallDensity(this.bounds.x1 - xi, hh);
      const fy0 = wallDensity(yi - this.bounds.y0, hh);
      const fy1 = wallDensity(this.bounds.y1 - yi, hh);
      const fz0 = wallDensity(zi, hh);
      const fz1 = wallDensity(this.depth - zi, hh);
      const missing =
        (1 - fx0) * (1 - fx1) * (1 - fy0) * (1 - fy1) * (1 - fz0) * (1 - fz1);
      rho += rho0 * (1 - missing) * wallScale;

      // d(union)/dp = f'_k * PROD_{m!=k}(1-f_m); the product for wall k is
      // missing/(1-f_k), safe because f never reaches 1 (it tops out at 0.5).
      // A near wall's density falls as the particle leaves it and the far
      // wall's rises, hence the signs.
      const wk = rho0 * wallScale;
      const gwx =
        (-wallDensityGrad(xi - this.bounds.x0, hh) * missing) / (1 - fx0) +
        (wallDensityGrad(this.bounds.x1 - xi, hh) * missing) / (1 - fx1);
      const gwy =
        (-wallDensityGrad(yi - this.bounds.y0, hh) * missing) / (1 - fy0) +
        (wallDensityGrad(this.bounds.y1 - yi, hh) * missing) / (1 - fy1);
      const gwz =
        (-wallDensityGrad(zi, hh) * missing) / (1 - fz0) +
        (wallDensityGrad(this.depth - zi, hh) * missing) / (1 - fz1);
      wgx[i] = gwx * wk;
      wgy[i] = gwy * wk;
      wgz[i] = gwz * wk;
      gx += wgx[i];
      gy += wgy[i];
      gz += wgz[i];

      density[i] = rho;
      const c = rho / rho0 - 1;
      if (c <= 0) {
        // Free surface: let it expand. Clamping here is what stops the surface
        // being pulled flat and lets waves and spray exist at all.
        lambda[i] = 0;
        continue;
      }
      sumSq += gx * gx + gy * gy + gz * gz;
      lambda[i] = -c / (sumSq / (rho0 * rho0) + eps);
    }
  }

  applyCorrection() {
    const n = this.n;
    const { px, py, pz, nbr, nbrCount, lambda, dx, dy, dz, wgx, wgy, wgz } = this;
    const cap = this.maxNeighbours;
    const hh = this.smoothing;
    const inv = 1 / hh;
    const gradK = GRAD_K * inv;
    const rho0 = this.restDensity;
    const k = this.tuning.surfacePressure;
    const dq = this.tuning.surfaceDistance;
    const wq = Math.pow(1 - dq * dq, 3);

    for (let i = 0; i < n; i++) {
      const xi = px[i], yi = py[i], zi = pz[i];
      const li = lambda[i];
      let ax = 0, ay = 0, az = 0;
      const base = i * cap;
      const count = nbrCount[i];
      for (let m = 0; m < count; m++) {
        const j = nbr[base + m];
        const ox = xi - px[j], oy = yi - py[j], oz = zi - pz[j];
        const r = Math.sqrt(ox * ox + oy * oy + oz * oz);
        if (r <= 1e-6 || r >= hh) continue;
        const q = r * inv;
        const w = 1 - q * q;
        // Artificial pressure. Without it particles clump into strands and
        // beads under the free surface (tensile instability) instead of
        // holding a sheet; with it they keep a small standoff and the surface
        // behaves as if it had surface tension.
        const s = -k * Math.pow((w * w * w) / wq, 4);
        const gm = -(gradK * (1 - q) * (1 - q)) / r; // see solveDensity

        const c = (li + lambda[j] + s) * gm;
        ax += ox * c; ay += oy * c; az += oz * c;
      }
      // The wall's own share of the constraint gradient. No partner lambda —
      // the wall is static and simply absorbs the momentum.
      ax += li * wgx[i];
      ay += li * wgy[i];
      az += li * wgz[i];
      const s = 1 / rho0;
      dx[i] = ax * s; dy[i] = ay * s; dz[i] = az * s;
    }

    const maxMove = this.spacing * this.tuning.maxCorrection;
    for (let i = 0; i < n; i++) {
      let mx = dx[i], my = dy[i], mz = dz[i];
      const m = Math.hypot(mx, my, mz);
      if (m > maxMove) {
        const t = maxMove / m;
        mx *= t; my *= t; mz *= t;
      }
      px[i] += mx; py[i] += my; pz[i] += mz;
    }
    this.project(px, py, pz, n);
  }

  /**
   * A hard floor on how close two particles may sit.
   *
   * The density constraint does not provide one, and cannot. A handful of
   * particles driven together by a splash forms a group that is *locally*
   * packed but *globally* under-dense — it has lost the neighbours that used
   * to surround it — so C comes out negative, lambda is clamped to zero at the
   * free surface, and no correction is ever generated. The group is welded
   * into a bead that survives forever, and because several particles are then
   * stacked on one point the thickness field spikes and draws it as a dark
   * blob. Left alone they accumulate: every splash makes a few more.
   *
   * So this is separate from the fluid pressure on purpose. It is unconditional
   * — it does not care what the density says — and it only ever acts on pairs
   * far closer than rest spacing, which normal compression never reaches.
   */
  separate() {
    const n = this.n;
    const { x, y, z, nbr, nbrCount, dx, dy, dz } = this;
    const cap = this.maxNeighbours;
    const minDist = this.spacing * this.tuning.minSeparation;
    const stiffness = this.tuning.separationStiffness;

    for (let i = 0; i < n; i++) {
      const xi = x[i], yi = y[i], zi = z[i];
      let ax = 0, ay = 0, az = 0;
      const base = i * cap;
      const count = nbrCount[i];
      for (let k = 0; k < count; k++) {
        const j = nbr[base + k];
        let ox = xi - x[j], oy = yi - y[j], oz = zi - z[j];
        const r = Math.sqrt(ox * ox + oy * oy + oz * oz);
        if (r >= minDist) continue;
        if (r > 1e-4) {
          const inv = 1 / r;
          ox *= inv; oy *= inv; oz *= inv;
        } else {
          // Exactly coincident, which the wall clamp produces readily: every
          // particle pushed past a wall lands on precisely the same plane.
          // There is no direction to separate along, so take a fixed one.
          scatterDir(i, j);
          ox = SEP[0]; oy = SEP[1]; oz = SEP[2];
        }
        // Each side of the pair sees this and takes half, so the neighbour's
        // own pass supplies the opposite push.
        const push = (minDist - r) * 0.5 * stiffness;
        ax += ox * push; ay += oy * push; az += oz * push;
      }
      dx[i] = ax; dy[i] = ay; dz[i] = az;
    }

    for (let i = 0; i < n; i++) {
      x[i] += dx[i]; y[i] += dy[i]; z[i] += dz[i];
    }
    this.project(x, y, z, n);
  }

  /** Read the velocity back out of the position change, PBD style. */
  commit(h) {
    const n = this.n;
    const { x, y, z, px, py, pz, vx, vy, vz } = this;
    const invH = 1 / h;
    const maxV = (this.spacing * this.tuning.maxTravel) / h;
    for (let i = 0; i < n; i++) {
      let ux = (px[i] - x[i]) * invH;
      let uy = (py[i] - y[i]) * invH;
      let uz = (pz[i] - z[i]) * invH;
      const m = Math.hypot(ux, uy, uz);
      if (m > maxV) {
        const t = maxV / m;
        ux *= t; uy *= t; uz *= t;
      }
      vx[i] = ux; vy[i] = uy; vz[i] = uz;
      x[i] = px[i]; y[i] = py[i]; z[i] = pz[i];
    }
  }

  /**
   * XSPH: nudge each particle toward the average velocity of its neighbours.
   * This is the whole of the fluid's viscosity — without it PBF is glassy and
   * every splash shatters instead of pouring.
   */
  viscosity() {
    const n = this.n;
    const { x, y, z, vx, vy, vz, ax, ay, az, nbr, nbrCount } = this;
    const cap = this.maxNeighbours;
    const hh = this.smoothing;
    const inv = 1 / hh;
    const c = this.tuning.viscosity;
    if (c <= 0) return;

    for (let i = 0; i < n; i++) {
      const xi = x[i], yi = y[i], zi = z[i];
      let sx = 0, sy = 0, sz = 0, wsum = 0;
      const base = i * cap;
      const count = nbrCount[i];
      for (let k = 0; k < count; k++) {
        const j = nbr[base + k];
        const dx = xi - x[j], dy = yi - y[j], dz = zi - z[j];
        const r2 = dx * dx + dy * dy + dz * dz;
        if (r2 >= hh * hh) continue;
        const q = Math.sqrt(r2) * inv;
        const w = 1 - q * q;
        const ww = w * w * w;
        sx += (vx[j] - vx[i]) * ww;
        sy += (vy[j] - vy[i]) * ww;
        sz += (vz[j] - vz[i]) * ww;
        wsum += ww;
      }
      if (wsum > 1e-6) {
        const s = c / wsum;
        ax[i] = vx[i] + sx * s;
        ay[i] = vy[i] + sy * s;
        az[i] = vz[i] + sz * s;
      } else {
        ax[i] = vx[i]; ay[i] = vy[i]; az[i] = vz[i];
      }
    }
    for (let i = 0; i < n; i++) {
      vx[i] = ax[i]; vy[i] = ay[i]; vz[i] = az[i];
    }
  }

  /**
   * Wall adhesion: a liquid that wets the glass drags against it. Water barely
   * does at this scale, honey emphatically does — it is what leaves a coating
   * behind on a wall the body has flowed away from, and without it a thick
   * liquid is only a slow one.
   *
   * Modelled as tangential drag in a thin band along each wall, which is what
   * the no-slip boundary of a viscous liquid amounts to: the layer touching the
   * glass is held, and XSPH then carries that shear back into the body a
   * particle at a time. Applying it as a *velocity* damping rather than an
   * attraction is deliberate — an attractive force toward the wall would pull
   * the body flat against the glass and stick it there permanently, whereas
   * drag can only ever remove motion, so it can never manufacture a film that
   * was not already flowing.
   *
   * The front and back glass get their own strength, and it is the one that
   * matters. This box is only a few particles deep, so the glass is nearly all
   * of the wetted area: the liquid is a slab between two plates, and no-slip at
   * both plates is what makes a thick one crawl. Leaving the glass out — on the
   * reasoning that it would freeze everything — is what left honey behaving
   * exactly like water. Measured, the two were indistinguishable: a tilt drew
   * the same centre-of-mass curve to within a couple of pixels.
   *
   * That is also *why* it has to be a boundary effect rather than a bulk one.
   * XSPH only ever equalises neighbouring velocities, so a body sliding as a
   * plug has no shear for it to resist and viscosity does nothing. Bulk drag is
   * no better: gravity re-accelerates every substep, so drag only sets a
   * terminal velocity and, cranked hard enough to be slow, it deadens the shake
   * response too. Holding the liquid at the walls is what creates the shear
   * profile in the first place; XSPH then carries it into the body, and the
   * result slows down for the reason a real liquid does.
   *
   * The grip is deliberately NOT gated on speed. It once was, to keep a shaken
   * body falling at gravity: because a body in flight is unavoidably touching
   * both panes, no-slip decelerates a ballistic arc to about 40% of g. Fading
   * the grip out above a threshold does fix that, but the two regimes are only
   * about 1.5x apart in speed — a gripped tilt settles near 350 px/s, a shake
   * averages 540 — so no threshold separates them, and every setting that made
   * the fall look right also switched the grip off during ordinary tilting and
   * left the liquid behaving like water. Thickness is the whole point of a
   * thick liquid, so it wins: honey falls slowly, on purpose.
   */
  adhesion(h) {
    const lateral = this.tuning.adhesion;
    const glass = this.tuning.adhesionGlass;
    if (!lateral && !glass) return;
    const n = this.n;
    const { x, y, z, vx, vy, vz } = this;
    const b = this.inner;
    const band = this.spacing * this.tuning.adhesionBand;
    if (band <= 0) return;
    // Per-substep decay, so the amount of grip does not depend on timestep.
    const keepLat = Math.exp(-lateral * h);
    const keepGlass = Math.exp(-glass * h);
    // The gap between the plates is often thinner than the band, so grip from
    // the glass never reaches zero anywhere — which is the point.
    const zBand = Math.min(band, (b.z1 - b.z0) * 0.5);

    for (let i = 0; i < n; i++) {
      let f = 1;
      if (lateral) {
        const dx = Math.min(x[i] - b.x0, b.x1 - x[i]);
        const dy = Math.min(y[i] - b.y0, b.y1 - y[i]);
        const d = dx < dy ? dx : dy;
        if (d < band) f *= 1 - (1 - keepLat) * (1 - d / band);
      }
      if (glass && zBand > 0) {
        const dz = Math.min(z[i] - b.z0, b.z1 - z[i]);
        if (dz < zBand) f *= 1 - (1 - keepGlass) * (1 - dz / zBand);
      }
      if (f < 1) { vx[i] *= f; vy[i] *= f; vz[i] *= f; }
    }
  }

  updateShading(dt) {
    const n = this.n;
    const { vx, vy, vz, speed01 } = this;
    const invSpeed = 1 / this.speedNorm;
    const blend = 1 - Math.exp(-this.tuning.foamSmoothing * dt);
    for (let i = 0; i < n; i++) {
      const s = clamp(Math.hypot(vx[i], vy[i], vz[i]) * invSpeed, 0, 1);
      speed01[i] += (s - speed01[i]) * blend;
    }
  }
}

/**
 * Density of a particle sitting in an infinite lattice at `spacing`, measured
 * with the same kernel the solver uses. Deriving rest density this way rather
 * than picking a number means the fluid settles at exactly the spacing that
 * idealCount assumed, so the body fills the fraction of the box that was asked
 * for instead of swelling or collapsing to find its own level.
 */
function latticeDensity(spacing, smoothing) {
  const reach = Math.ceil(smoothing / spacing);
  let rho = 0;
  for (let a = -reach; a <= reach; a++) {
    for (let b = -reach; b <= reach; b++) {
      for (let c = -reach; c <= reach; c++) {
        const r = Math.sqrt(a * a + b * b + c * c) * spacing;
        if (r >= smoothing) continue;
        const w = 1 - (r / smoothing) ** 2;
        rho += w * w * w;
      }
    }
  }
  return rho;
}

/**
 * Fraction of a Poly6 kernel's mass lying beyond a flat wall at distance `d`.
 *
 * Exact, not fitted: the kernel integral over the cap past the plane works out
 * to 0.5 - (315/256) * P(s) with s = d/h. Multiplying this by the rest density
 * gives back exactly the contribution of the fluid that would have been there
 * if the wall were not.
 */
function wallDensity(d, smoothing) {
  const s = d / smoothing;
  if (s >= 1) return 0;
  if (s <= 0) return 0.5;
  const s2 = s * s;
  const s3 = s2 * s;
  const s5 = s3 * s2;
  const s7 = s5 * s2;
  const s9 = s7 * s2;
  const p = s - (4 / 3) * s3 + (6 / 5) * s5 - (4 / 7) * s7 + s9 / 9;
  const f = 0.5 - (315 / 256) * p;
  return f > 0 ? f : 0;
}

/**
 * Magnitude of d(wallDensity)/d(distance): how fast the missing-half-space
 * fraction shrinks as the particle backs away from the wall. P'(s) collapses
 * to (1-s^2)^4, so this is exact, not fitted, like wallDensity itself.
 */
function wallDensityGrad(d, smoothing) {
  const s = d / smoothing;
  // Written so NaN also lands in the zero branch: wallDensity happens to
  // swallow bad input via its final clamp, and this must fail the same way
  // rather than poison the whole solve.
  if (!(s >= 0 && s < 1)) return 0;
  const w = 1 - s * s;
  const w2 = w * w;
  return ((315 / 256) * w2 * w2) / smoothing;
}

// ---- src/materials.js ----
// What can go in the box.
//
// A material owns its own solver *and* its own idea of how big a particle
// should be and how many of them belong in the box, because those answers are
// not shared: sand wants the finest grain the device can afford since every
// grain is visible, while water wants a coarse particle because it is drawn as
// a surface and its particles never are. Pushing both decisions behind the
// interface is what keeps main.js from growing a branch per material.
//
// A material does not have to mean a solver. Sand and water are genuinely
// different ones; honey is the fluid solver with a dozen constants changed, and
// the renderer draws it with water's two passes and honey's palette. So the
// renderer switches on `render` — which *pass* to run — rather than on `kind`,
// and a new liquid costs it nothing at all.
//
// The contract, in full:
//
//   kind, label                       identity, for the UI and the stats panel
//   render                            which renderer pass draws this
//   capacity, n                       allocated / live particle count
//   radius, diameter, depth           geometry, in sim pixels
//   bounds, inner                     box, and the box inset by radius
//   gravityMagnitude                  px/s^2, so callers can scale forces
//   substeps, iterations, contactCount  read by the stats panel only
//   x, y, z                           positions, read by the renderer
//
//   preferredRadius(w, h, qualityScale)   particle size this material wants
//   targetCount(w, h, qualityScale)       how many of them belong in the box
//   configure(w, h, radius)               box or particle size changed
//   fill(count)                           (re)build from scratch
//   setCount(count)                       grow or shrink in place
//   clampToBounds()                       after a viewport change
//   step(dt, gx, gy, gz)                  advance
//   poke(cx, cy, dragX, dragY, dt)        finger
//   splash(strength)                      shake
//
// Anything beyond that is the material's own business, and the renderer reads
// it only through the branch for that kind.


/**
 * The registry. Adding a material here is the whole job: the picker builds
 * itself from this list, so a new entry appears in the UI with its swatch and
 * needs no markup, no styling and no wiring.
 *
 * `tint` is only for the swatch dot in the menu — it is not used to render
 * anything in the box.
 */
const MATERIALS = [
  {
    id: 'sand',
    label: 'Sand',
    tint: '#c8a97a',
    create: () => new Grains(CONFIG.bed.maxGrains),
  },
  {
    id: 'water',
    label: 'Water',
    tint: '#4e9fc4',
    create: () => new Fluid(CONFIG.fluid.maxParticles, {
      kind: 'water',
      label: 'Water',
      tuning: CONFIG.fluid,
      look: CONFIG.water,
    }),
  },
  {
    // Same solver and the same two render passes as water: a liquid is a
    // liquid, and what separates them is a dozen numbers. See CONFIG.honey.
    id: 'honey',
    label: 'Honey',
    tint: '#d99321',
    create: () => new Fluid(CONFIG.honey.maxParticles, {
      kind: 'honey',
      label: 'Honey',
      tuning: CONFIG.honey,
      look: CONFIG.honeyLook,
    }),
  },
];

/**
 * Holds one instance per material, built on first use. Keeping them alive
 * costs a few megabytes and means switching back is instant and lands on the
 * state you left, rather than re-running a settle every time.
 */
class MaterialSet {
  constructor() {
    this.instances = new Map();
    this.index = 0;
  }

  get current() {
    const def = MATERIALS[this.index];
    let inst = this.instances.get(def.id);
    if (!inst) {
      inst = def.create();
      this.instances.set(def.id, inst);
    }
    return inst;
  }

  get label() {
    return MATERIALS[this.index].label;
  }

  get id() {
    return MATERIALS[this.index].id;
  }

  /** Which material `next()` would move to, without moving to it. */
  get nextId() {
    return MATERIALS[(this.index + 1) % MATERIALS.length].id;
  }

  /** True if the instance had not been built yet, i.e. it needs filling. */
  isFresh(id) {
    return !this.instances.has(id);
  }

  select(id) {
    const i = MATERIALS.findIndex((m) => m.id === id);
    if (i < 0) return false;
    this.index = i;
    return true;
  }

  next() {
    this.index = (this.index + 1) % MATERIALS.length;
    return this.current;
  }
}

// ---- src/shaders.js ----
// GLSL ES 1.00 so one shader pair works on both WebGL1 and WebGL2 contexts.
//
// Sand is drawn as a MASS, not as grains. The physics grain is 10-16 px across
// — far too big to be a grain of sand, and any renderer that gives it a shape of
// its own ends up drawing gravel, popcorn or beads. So the grains are never
// drawn directly:
//
//   1. Field pass — every grain splats a soft blob into an offscreen buffer,
//      summed. That gives a smooth coverage field (how much sand is in front of
//      each pixel), plus the sim's bed-level light and speed carried along as
//      weighted averages.
//   2. Composite — the level set of that field is the silhouette, its gradient
//      shades the surface, and the light channel colours it. Nothing here knows
//      what a grain is; the pile is one continuous matte body, which is what
//      sand looks like at arm's length.
//   3. Speck pass — the *grain* of the sand comes from tiny independent specks,
//      a few per physics grain, drawn as their own points on top. They are real
//      particles that ride the sim, so texture moves exactly with the sand.
//
// The reason the split works: nothing in (1) or (2) has structure at the physics
// grain scale, and the specks in (3) are far too small and sparse to reveal
// which grain they belong to. The eye is left with two honest scales — the
// mass and the speck — with nothing lumpy in between.

// -------------------------------------------------------------- field pass

const SAND_FIELD_VERTEX = `
precision highp float;

attribute vec3 aPos;      // sim position: x,y CSS px, z depth (0 = glass)
attribute vec3 aShade;    // x: surface light, y: normalised speed, z: looseness
attribute vec2 aJitter;   // x: radius / mean radius, y: airborne (touching nothing)

uniform vec2 uViewport;   // CSS px
uniform float uFocal;     // focal length in CSS px
uniform vec2 uEye;        // projection centre in CSS px (parallax lives here)
uniform float uPointSize; // blob diameter for a mean grain, in field px
uniform float uDepthRange;
uniform float uLooseShrink;
uniform float uBlob;      // blob radius as a multiple of the grain radius
uniform float uThreshold; // worst-case coverage the composite calls "sand"
uniform float uBulkSize;  // where a packed grain's level set lands, in radii
uniform float uAloneSize; // ... a grain resting by itself
uniform float uSoloSize;  // ... and one in flight
uniform float uAirPow;    // profile exponent for a lone grain (mass uses 2)
uniform float uAirLight;  // ceiling on the light ramp for sand in flight

varying float vLight;
varying float vSpeed;
varying float vDepth;
varying float vWeight;
varying float vAir;

void main() {
  float persp = uFocal / (uFocal + aPos.z);
  vec2 p = uEye + (aPos.xy - uEye) * persp;
  vec2 unit = p / uViewport;
  gl_Position = vec4(unit.x * 2.0 - 1.0, 1.0 - unit.y * 2.0, 0.0, 1.0);
  // A loosely held grain draws a *narrower* blob than a packed one. Blobs wide
  // enough to smooth the packed surface otherwise bridge the gap to a grain
  // that is barely attached and draw it as a drip hanging off the mass; a
  // narrow blob can only reach as far as it is wide.
  float loose = aShade.z;
  float air = aJitter.y;
  float shrink = 1.0 - uLooseShrink * loose;
  gl_PointSize = uPointSize * aJitter.x * persp * shrink;

  float depth = clamp(aPos.z / uDepthRange, 0.0, 1.0);
  vDepth = depth;
  // A grain in the air is fully exposed, but that is not the same as being the
  // sunlit crest of a pile — the top of the ramp is a pale cream earned by a
  // whole surface catching the light. Capped here, before it is summed, so
  // the composite never has to know what is flying.
  float lit = aShade.x;
  vLight = mix(lit, min(lit, uAirLight), air);
  vSpeed = aShade.y;

  // Every grain's blob peak is SOLVED, so that alone it draws at a chosen
  // size. Handing grains a fixed peak and letting a threshold decide the size
  // is the same statement backwards, and it hides a trap: the size you get
  // then depends on how many other grains happen to overlap. A deep bed sums
  // twenty-odd blobs, so almost any peak looks right there — and a peak tuned
  // that way left a *single* grain unable to clear the threshold at all. It
  // never showed until the bed stopped being deep. Lay the phone flat and the
  // whole thing collapses into a sheet one grain thick across the entire
  // screen, where nothing overlaps enough, and the sand tears into holes.
  //
  // The size a grain draws at depends on how packed it is, and separately on
  // whether it is in flight. Three cases, and each earns its place:
  //
  //   packed, at rest -> uBulkSize, a little OUTSIDE its own radius.
  //              Deliberate: a physics grain stands in for a clump of real
  //              sand, and that sand fills its neighbourhood rather than an
  //              inscribed sphere, so a jammed monolayer reads as continuous.
  //   alone, at rest  -> uAloneSize, its own true size. A grain lying by
  //              itself in a bare patch is not spray — it is a grain of sand
  //              lying there, and it should look like one. Shrinking it is
  //              what left bare patches as clean empty holes with nothing
  //              scattered in them, which is not how sand ever looks.
  //   in flight       -> uSoloSize, well inside it, where the SPECKS take
  //              over. Drawn generously instead, sparse grains merge into
  //              rounded lobes and a splash turns to batter.
  //
  // One global threshold cannot do this — generous enough to close a monolayer
  // is generous enough to melt a splash — which is why it is per grain.
  //
  // Depth deliberately does not enter. Sand is opaque however deep it sits;
  // what changes with distance is colour, and that is the composite's job.
  //
  // Sand in flight also gets a gentler blob profile (uAirPow, against 2 for
  // the mass) so its coverage ramps over more pixels and the composite's soft
  // band lands as a porous puff rather than a hard-rimmed pea. The peak is
  // solved against whichever profile the grain is using.
  float target = mix(uBulkSize, uAloneSize, loose);
  target = mix(target, uSoloSize, air);
  float rn = min(target / (uBlob * shrink), 0.95);
  float e = 1.0 - rn * rn;
  float prof = mix(e * e, pow(e, uAirPow), air);
  vWeight = uThreshold / max(prof, 1e-3);
  vAir = air;
}
`;

const SAND_FIELD_FRAGMENT = `
precision mediump float;

varying float vLight;
varying float vSpeed;
varying float vDepth;
varying float vWeight;
varying float vAir;

// Declared in both stages, and the two default to different precisions —
// GLSL treats that as two different uniforms and refuses to link.
uniform highp float uAirPow;

void main() {
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(uv, uv);
  if (r2 > 1.0) discard;
  // Squared falloff: overlapping blobs merge without a seam, and the sum
  // still keeps an edge instead of fogging outward. A lone grain in the air
  // gets a gentler falloff instead (see the vertex shader). vWeight is the
  // peak the vertex shader solved for — gain and depth are already folded in.
  float w = 1.0 - r2;
  float p = mix(w * w, pow(w, uAirPow), vAir);
  float t = p * vWeight;
  // R: coverage. G, B, A: coverage weighted by light, speed and depth, so the
  // composite can divide them back out as per-pixel averages.
  gl_FragColor = vec4(t, t * vLight, t * vSpeed, t * vDepth);
}
`;

// ---------------------------------------------------------------- composite

const SAND_COMPOSITE_VERTEX = `
precision highp float;
attribute vec2 aCorner;
varying vec2 vUV;
void main() {
  vUV = aCorner * 0.5 + 0.5;
  gl_Position = vec4(aCorner, 0.0, 1.0);
}
`;

const SAND_COMPOSITE_FRAGMENT = `
precision mediump float;

varying vec2 vUV;

uniform sampler2D uField;
uniform vec2 uTexel;
uniform float uDpr;
uniform vec3 uDeep;
uniform vec3 uMid;
uniform vec3 uLit;
uniform float uSurface;    // coverage at which sand starts
uniform float uSoft;       // width of the anti-aliased edge
uniform float uDither;     // how far the threshold wanders, grain to grain
uniform float uDitherPx;   // size of one such grain on screen (CSS px)
uniform float uRelief;     // how strongly the coverage gradient tilts the normal
uniform float uForm;       // how much that shading is allowed to do
uniform float uFormRadius; // and how far apart it samples, in field texels
uniform float uEdgeRadius; // silhouette low-pass radius, in field texels
uniform float uEdgeSmooth; // how much of it the mask takes
uniform float uPale;       // fast sand pales toward dust
uniform float uPatchScale;
uniform float uPatchAmp;
uniform vec3 uFog;         // what the back of the box fades toward
uniform float uDepthDim;   // and how far it gets
uniform float uFogStart;   // depth (0..1) at which the fade begins

float phash(vec2 c) {
  return fract(sin(dot(c, vec2(127.1, 311.7))) * 43758.5453);
}

// Slow spatial variation — real sand varies in patches (minerals, moisture),
// not grain by grain. Value noise, bilinearly smoothed.
float patch(vec2 p) {
  vec2 i = floor(p);
  vec2 f = p - i;
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(phash(i), phash(i + vec2(1.0, 0.0)), f.x),
    mix(phash(i + vec2(0.0, 1.0)), phash(i + vec2(1.0, 1.0)), f.x),
    f.y);
}

void main() {
  vec4 f = texture2D(uField, vUV);
  float w = f.r;
  float soft = uSoft;

  // Most of the screen is empty box; leave before doing any noise for it. The
  // margin covers the low-pass below, which can lift a pixel above threshold
  // that the raw field left under it.
  if (w < uSurface - uDither * 0.5 - soft - 0.03) discard;
  vec2 css = gl_FragCoord.xy / uDpr;

  // ---- silhouette
  //
  // The level set of the coverage field is the outline, and taken raw it
  // undulates at PHYSICS-GRAIN scale — it is the contour of a sum of blobs,
  // each 15-20 px across, so the edge carries lumps at exactly the size the
  // whole field render exists to hide. Fine dither cannot disguise them: it
  // works at 3 px and the lumps are five times that.
  //
  // So the mask comes from a WIDER average of the field. That is a low-pass
  // in image space: it removes structure at the blob scale and keeps the
  // shape of the pile, and the fine dither goes back on top so the edge is
  // still fuzz rather than a smooth contour. Sand has no outline; what it has
  // is a boundary that is uncertain at grain scale, which is a different
  // thing from one that is bumpy at clod scale.
  vec2 er = uTexel * uEdgeRadius;
  float ws = (
      texture2D(uField, vUV + vec2( er.x, 0.0)).r
    + texture2D(uField, vUV + vec2(-er.x, 0.0)).r
    + texture2D(uField, vUV + vec2(0.0,  er.y)).r
    + texture2D(uField, vUV + vec2(0.0, -er.y)).r) * 0.25;
  float wMask = mix(w, ws, uEdgeSmooth);

  float wander = patch(css / uDitherPx) - 0.5;
  float thr = uSurface + wander * uDither;
  float mask = smoothstep(thr - soft, thr + soft, wMask);
  if (mask <= 0.004) discard;

  float light = f.g / max(w, 1e-4);
  float speed = f.b / max(w, 1e-4);
  float depth = f.a / max(w, 1e-4);

  // ---- form
  //
  // Shading from the coverage gradient, sampled WIDE — several grains apart
  // rather than one texel. That distinction is the whole trick. One texel
  // apart the gradient is the noise of individual blobs, and lighting it
  // embosses every grain back into the mass as a soft bump; several grains
  // apart the blob noise averages out and what is left is the shape of the
  // pile itself — the slope of a free surface, the shoulder of a heap, the
  // hollow a finger left. That is the shading the mass was missing, and its
  // absence is why a bed with perfectly good grain texture still read as a
  // painted slab: real sand is lit by its own form first and its grain
  // second.
  //
  // It darkens as well as brightens, which the narrow version could not
  // afford: a one-texel gradient only exists within a few pixels of the
  // silhouette, so darkening it drew a dark rim that read as an outline. A
  // wide gradient spans a whole face, so shading it reads as shade.
  vec2 fr = uTexel * uFormRadius;
  float fl = texture2D(uField, vUV - vec2(fr.x, 0.0)).r;
  float fR = texture2D(uField, vUV + vec2(fr.x, 0.0)).r;
  float fd = texture2D(uField, vUV - vec2(0.0, fr.y)).r;
  float fu = texture2D(uField, vUV + vec2(0.0, fr.y)).r;
  // +y is up the screen here.
  vec3 nrm = normalize(vec3((fl - fR) * uRelief, (fd - fu) * uRelief, 1.0));
  vec3 lightDir = normalize(vec3(-0.35, 0.62, 0.70));
  // Normalised so a face square to the viewer is unshaded.
  float diffuse = max(dot(nrm, lightDir), 0.0) / lightDir.z;
  float form = mix(1.0, diffuse, uForm);

  vec3 c = mix(uDeep, uMid, smoothstep(0.0, 0.55, light));
  c = mix(c, uLit, smoothstep(0.45, 1.0, light));
  // Airborne dust catches the light and pales, but never glows.
  c = mix(c, vec3(0.97, 0.94, 0.86), clamp(speed, 0.0, 1.0) * uPale);
  // Patchiness stays screen-anchored on purpose, unlike the grain relief that
  // used to sit here. This one is only a slow brightness wash, and reads as
  // light and shade inside the box — which genuinely does not travel with the
  // sand. Fine relief is a different claim: it purports to BE the grains, so
  // it has to move with them, and it now lives on the specks instead.
  c *= 1.0 - uPatchAmp + uPatchAmp * 2.0 * patch(css / uPatchScale);
  c *= form;

  // Depth is a colour, never a coverage. The back of the box falls into
  // shadow, so sand there fades toward the box's own darkness — which reads as
  // *far*. Dimming its light instead read as *buried*: it slid the colour down
  // the ramp into crevice brown, and the band of sand visible only at the
  // back came out as a dark smear.
  //
  // The fog starts partway back rather than at the glass. The depth here is
  // an average along the view ray, so even the front face of the bed reads
  // as mid-depth once the grains behind it are summed in — fogging from zero
  // greyed the whole mass by a fifth (measured: 23% saturation against the
  // 35-45% of real dry sand). Only what is genuinely toward the back should
  // pay.
  float far = smoothstep(uFogStart, 1.0, clamp(depth, 0.0, 1.0));
  c = mix(c, uFog, uDepthDim * far);

  gl_FragColor = vec4(c, mask);
}
`;

// --------------------------------------------------------------- speck pass

const SPECK_VERTEX = `
precision highp float;

attribute vec3 aPos;      // speck position, CSS px + depth
attribute vec4 aData;     // x: light, y: tone, z: size ratio, w: phase
attribute vec2 aMotion;   // x: normalised speed, y: airborne

uniform vec2 uViewport;
uniform float uFocal;
uniform vec2 uEye;
uniform float uPointSize; // speck diameter in device px
uniform float uDepthRange;
uniform float uAirLight;

varying float vLight;
varying float vTone;
varying float vPhase;
varying float vSpeed;
varying float vDepth;
varying float vAir;

void main() {
  float persp = uFocal / (uFocal + aPos.z);
  vec2 p = uEye + (aPos.xy - uEye) * persp;
  vec2 unit = p / uViewport;
  gl_Position = vec4(unit.x * 2.0 - 1.0, 1.0 - unit.y * 2.0, 0.0, 1.0);
  gl_PointSize = uPointSize * aData.z * persp;
  float depth = clamp(aPos.z / uDepthRange, 0.0, 1.0);
  // Sand in the air is not the sunlit crest of a pile — see the field pass,
  // which caps the ramp the same way. Without it a flying grain's specks come
  // out as the palest cream in the palette and read as sparks.
  float lit = aData.x;
  vLight = mix(lit, min(lit, uAirLight), aMotion.y);
  vTone = aData.y;
  vPhase = aData.w;
  vSpeed = aMotion.x;
  vAir = aMotion.y;
  vDepth = depth;
}
`;

const SPECK_FRAGMENT = `
precision mediump float;

varying float vLight;
varying float vTone;
varying float vPhase;
varying float vSpeed;
varying float vDepth;
varying float vAir;

uniform vec3 uDeep;
uniform vec3 uMid;
uniform vec3 uLit;
uniform float uAlpha;
uniform float uDepthFade;
uniform vec3 uFog;
uniform float uDepthDim;
uniform float uFogStart;
uniform float uSpeckRelief; // strength of the per-speck lit/shadow side
uniform float uSpeckRound;  // how domed each speck is (higher = flatter)
uniform float uGlint;
uniform float uGlintRate;
uniform float uTime;
uniform sampler2D uField;
uniform vec2 uInvCanvas;  // 1 / canvas size in device px
uniform float uSurface;

void main() {
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(uv, uv);
  if (r2 > 1.0) discard;
  // A speck belongs to the mass it sits on: past the silhouette it fades, so
  // grains at the surface fringe it with texture rather than hovering beside
  // it as loose dots.
  //
  // Sand in flight is exempt. Its grain has no mass to belong to, and the
  // whole point of it is that the specks — not the field — are what draw it:
  // a physics grain is 20 px across, and filling that with one smooth blob
  // gives a bead, while scattering it with specks gives the porous clump that
  // flying sand actually is.
  float cover = texture2D(uField, gl_FragCoord.xy * uInvCanvas).r;
  float onSand = max(smoothstep(uSurface * 0.55, uSurface * 1.3, cover), vAir);
  float a = smoothstep(1.0, 0.55, r2) * uAlpha * (1.0 - uDepthFade * vDepth) * onSand;
  if (a < 0.01) discard;

  vec3 c = mix(uDeep, uMid, smoothstep(0.0, 0.55, vLight));
  c = mix(c, uLit, smoothstep(0.45, 1.0, vLight));
  c *= vTone;

  // Micro-relief: every speck is a little rounded grain with a lit crest and a
  // shadowed far side, all agreeing about one global light. This is the thing
  // that reads as sand rather than as felt or as static — thousands of tiny
  // highlights and shadows pointing the same way — and putting it HERE rather
  // than in the composite is what makes it honest: a speck is a particle that
  // rides the simulation, so its relief travels with the sand. The same relief
  // painted as screen-space noise stands still while the sand pours through
  // it, which is a tell you cannot unsee once you have looked for it.
  //
  // gl_PointCoord's y runs down the sprite, so the light vector is negated in
  // y against the composite's: crest up-left either way.
  vec3 lightDir = normalize(vec3(-0.33, -0.62, 0.71));
  vec3 nrm = normalize(vec3(uv, sqrt(max(1.0 - min(r2, 1.0), 0.0)) + uSpeckRound));
  // Normalised against a speck facing straight out, so relief REDISTRIBUTES
  // light rather than adding it: the crest brightens by as much as the far
  // side darkens, and the bed's overall tone is untouched. Scaling raw
  // diffuse instead lifts every speck centre by a fifth, which came out as
  // glitter lying on top of the sand rather than as the sand's own surface.
  float shade = max(dot(nrm, lightDir), 0.0) / lightDir.z;
  c *= mix(1.0, shade, uSpeckRelief);

  // Only the bright quartz specks ever glint (tone above 1), briefly and out
  // of phase with each other, and more readily while the sand is moving and
  // the facets are tumbling.
  float bright = step(1.12, vTone);
  float tw = sin(uTime * uGlintRate + vPhase * 6.2831853);
  c += vec3(1.0, 0.97, 0.9) * pow(max(tw, 0.0), 48.0) * uGlint * bright
    * (0.35 + 0.65 * clamp(vLight, 0.0, 1.0)) * (0.5 + vSpeed);

  // Same fog as the mass, so a speck at the back sits *in* the sand behind
  // it rather than on top of it.
  c = mix(c, uFog, uDepthDim * smoothstep(uFogStart, 1.0, vDepth));

  gl_FragColor = vec4(c, a);
}
`;

// ---------------------------------------------------------------- the box
//
// Interior walls and back plane, drawn before the sand in the same pinhole
// projection. Without them the container is invisible and the eye has to infer
// a box from the sand alone — which is why the depth read as flat no matter how
// many layers were behind the glass. Because the front rectangle sits exactly
// on the viewport edge (persp is 1 at z=0, parallax included), only the back
// moves: tilting shears the walls, which is the strongest depth cue here.

const WALL_VERTEX_SHADER = `
precision highp float;

attribute vec3 aPos;
attribute float aShade;

uniform vec2 uViewport;
uniform float uFocal;
uniform vec2 uEye;

varying float vShade;

void main() {
  float persp = uFocal / (uFocal + aPos.z);
  vec2 p = uEye + (aPos.xy - uEye) * persp;
  vec2 unit = p / uViewport;
  gl_Position = vec4(unit.x * 2.0 - 1.0, 1.0 - unit.y * 2.0, 0.0, 1.0);
  vShade = aShade;
}
`;

const WALL_FRAGMENT_SHADER = `
precision mediump float;
varying float vShade;
uniform vec3 uWallColor;
void main() {
  gl_FragColor = vec4(uWallColor * vShade, 1.0);
}
`;

// ---- src/water-shaders.js ----
// Water is drawn in two passes, because drawing the particles directly cannot
// work: a liquid has no visible particles, only a surface. Sprites blended one
// on top of another read as a heap of blue beads no matter how they are shaded.
//
// Pass one throws every particle into an offscreen buffer as a soft blob, added
// together, which gives a smooth scalar field — how much water is in front of
// each pixel. Pass two never sees a particle at all: it reads that field, takes
// its level set as the surface, its gradient as a normal, and its magnitude as
// the distance light had to travel through water. That is where the colour,
// the highlights and the edges come from.
//
// The field is deliberately a plain RGBA8 texture at half resolution. Half res
// is not only cheaper, it is a free blur — it smooths the blobs into a surface,
// which is exactly the step a full screen-space fluid renderer spends a
// separate bilateral filter on.

const WATER_FIELD_VERTEX = `
precision highp float;

attribute vec3 aPos;
attribute float aSpeed;
// 1 for a real particle; for a wall image, how solid the water it mirrors is.
attribute float aWeight;

uniform vec2 uViewport;
uniform float uFocal;
uniform vec2 uEye;
uniform float uPointSize;
uniform float uDepthRange;

varying float vSpeed;
varying float vFade;
varying float vWeight;

void main() {
  float persp = uFocal / (uFocal + aPos.z);
  vec2 p = uEye + (aPos.xy - uEye) * persp;
  vec2 unit = p / uViewport;
  gl_Position = vec4(unit.x * 2.0 - 1.0, 1.0 - unit.y * 2.0, 0.0, 1.0);
  gl_PointSize = uPointSize * persp;
  vSpeed = aSpeed;
  vWeight = aWeight;
  // Deeper water contributes a little less, so the body carries a front-to-back
  // gradient instead of reading as one flat slab of colour.
  vFade = 1.0 - 0.35 * clamp(aPos.z / max(uDepthRange, 1.0), 0.0, 1.0);
}
`;

const WATER_FIELD_FRAGMENT = `
precision mediump float;

varying float vSpeed;
varying float vFade;
varying float vWeight;

uniform float uGain;

void main() {
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(uv, uv);
  if (r2 > 1.0) discard;
  // Squared falloff: smooth enough that overlapping blobs merge without a seam,
  // tight enough that the body keeps an edge instead of fogging outward.
  float w = 1.0 - r2;
  w = w * w;
  float t = w * uGain * vFade * vWeight;
  // R: thickness. G: thickness weighted by speed, so the composite can divide
  // the two back out and know how agitated the water at this pixel is.
  gl_FragColor = vec4(t, t * vSpeed, 0.0, 1.0);
}
`;

const WATER_COMPOSITE_VERTEX = `
precision highp float;
attribute vec2 aCorner;
varying vec2 vUV;
void main() {
  vUV = aCorner * 0.5 + 0.5;
  gl_Position = vec4(aCorner, 0.0, 1.0);
}
`;

const WATER_COMPOSITE_FRAGMENT = `
precision mediump float;

varying vec2 vUV;

uniform sampler2D uField;
uniform vec2 uTexel;
uniform vec3 uShallow;
uniform vec3 uDeep;
uniform vec3 uFoamColor;
uniform float uSurface;
uniform float uSoft;
uniform float uAbsorb;
uniform float uRelief;
uniform float uSpecular;
uniform float uSpecPower;
uniform float uFresnel;
uniform float uFoamAmount;
uniform float uFoamBias;
uniform float uAlphaMin;
uniform float uOpacify;
uniform float uCalmRipple;
uniform float uRippleGain;

void main() {
  vec4 c = texture2D(uField, vUV);
  float t = c.x;
  // The level set of the thickness field is the water's silhouette. Everything
  // below the threshold is air, and the soft band across it is the anti-aliased
  // edge — a hard cutoff crawls with visible stair-steps as the body moves.
  float mask = smoothstep(uSurface, uSurface + uSoft, t);
  if (mask <= 0.004) discard;

  float agitation = c.y / max(c.x, 1e-4);

  // Normal from the gradient of thickness. At the waterline thickness ramps up
  // from nothing, so the normal tips over and catches the light there — which
  // is exactly where a real surface shows its edge.
  float l = texture2D(uField, vUV - vec2(uTexel.x, 0.0)).x;
  float r = texture2D(uField, vUV + vec2(uTexel.x, 0.0)).x;
  float d = texture2D(uField, vUV - vec2(0.0, uTexel.y)).x;
  float u = texture2D(uField, vUV + vec2(0.0, uTexel.y)).x;

  // Calm water is glass. The particle lattice leaves a permanent fine ripple
  // in the thickness field, and at full strength the normal shades it like
  // wrinkled plastic — so agitation (speed, carried per-pixel in G) decides
  // how much of the gradient the interior normal is allowed to see.
  //
  // The silhouette band is exempt. Measured, its gradients are the *same
  // size* as the lattice noise (both p90 = 0.07/texel in the half-res field),
  // so no magnitude test can tell them apart — but they live at opposite ends
  // of the thickness ramp. Thin pixels are the waterline and the rim; keeping
  // them at full relief is what preserves the specular band along the surface
  // of a resting body, which gating by agitation alone wiped out.
  float edgeBand = 1.0 - smoothstep(uSurface * 1.6, uSurface * 4.5, t);
  float ripple = clamp(uCalmRipple + agitation * uRippleGain, 0.0, 1.0);
  float relief = uRelief * max(ripple, edgeBand);
  vec3 nrm = normalize(vec3((l - r) * relief, (d - u) * relief, 1.0));

  // Beer-Lambert: colour is how much water the light had to cross, so thin
  // edges stay pale and the body deepens toward the middle. This single term
  // does most of the work of making it read as a volume rather than a shape.
  float travel = 1.0 - exp(-uAbsorb * t);
  vec3 color = mix(uShallow, uDeep, travel);

  // +y is up the screen in this pass, unlike gl_PointCoord in the grain
  // shader where it points down. Getting that backwards lights the water from
  // underneath and puts a bright rim along the floor instead of the surface.
  vec3 lightDir = normalize(vec3(-0.35, 0.62, 0.70));
  vec3 view = vec3(0.0, 0.0, 1.0);
  vec3 half3 = normalize(lightDir + view);
  // Highlight tightness is a material property, not a constant. Water is a
  // rippled mirror and scatters a lot of small hard glints; a thick syrup is a
  // smooth one and carries a single broad sheen instead. Sharing one exponent
  // is a good part of why two liquids read as the same liquid recoloured.
  float spec = pow(max(dot(nrm, half3), 0.0), uSpecPower) * uSpecular;
  // Grazing angles reflect more than head-on ones; on a body this shallow the
  // rim is the only place that happens, and it is what stops the edge looking
  // like cut paper.
  float fresnel = pow(1.0 - clamp(nrm.z, 0.0, 1.0), 3.0) * uFresnel;

  color += spec + fresnel;

  // Foam where the water is both moving and thin — the crest of a wave and the
  // spray off a splash, not the calm mass underneath it.
  float foam = clamp((agitation - uFoamBias) * uFoamAmount, 0.0, 1.0)
    * smoothstep(1.0, 0.35, t);
  color = mix(color, uFoamColor, foam);

  // Water is transparent; gel is not. Coverage follows thickness by the same
  // Beer-Lambert law as the colour: a thin crest lets the box show through,
  // the deep body blocks it. Glints and foam stay opaque regardless — a
  // reflection does not care what is behind the surface.
  float body = 1.0 - exp(-uOpacify * t);
