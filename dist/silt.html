<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03060d">
<meta name="description" content="Tilt-driven glowing sand: thousands of simulated grains that pour, pile and splash as you tip your phone.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Silt — tilt sand</title>
<style>
/* Full-bleed dark stage. The canvas is position:fixed so mobile browser chrome
   showing and hiding never triggers a layout fight over 100vh. */

:root {
  --ink: #dceaff;
  --dim: rgba(190, 214, 255, 0.55);
  --panel: rgba(8, 16, 34, 0.78);
  --edge: rgba(120, 170, 255, 0.18);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #03060d;
  color: var(--ink);
  font: 500 13px/1.45 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

/* Sells the "inside a device" look and hides the hard canvas edge. */
#vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(125% 85% at 50% 45%, transparent 62%, rgba(0, 0, 0, 0.38) 100%),
    linear-gradient(to bottom, rgba(80, 140, 255, 0.05), transparent 22%);
  mix-blend-mode: multiply;
}
#vignette::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 1px rgba(150, 200, 255, 0.22);
  mix-blend-mode: screen;
}

#hint {
  position: absolute;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  max-width: min(92vw, 520px);
  padding: 7px 14px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 900ms ease;
}
#hint.faded { opacity: 0; }

#stats {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top));
  left: 12px;
  display: none;
  grid-template-columns: auto auto;
  gap: 1px 12px;
  padding: 10px 12px;
  border: 1px solid var(--edge);
  border-radius: 10px;
  background: var(--panel);
  backdrop-filter: blur(8px);
  font-size: 11px;
  line-height: 1.5;
}
#stats.visible { display: grid; }
#stats .k { color: var(--dim); }
#stats .v { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }

#gate {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background: rgba(3, 6, 13, 0.72);
  backdrop-filter: blur(3px);
  pointer-events: auto;
}
#gate.visible { display: flex; }

#gate-button {
  padding: 14px 26px;
  border: 1px solid rgba(140, 190, 255, 0.4);
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(30, 90, 200, 0.55), rgba(12, 34, 90, 0.55));
  color: #eaf3ff;
  font: inherit;
  font-size: 15px;
  letter-spacing: 0.03em;
  cursor: pointer;
  box-shadow: 0 0 32px rgba(60, 130, 255, 0.25);
}
#gate-button:disabled { opacity: 0.5; }
#gate-note {
  margin: 0;
  max-width: 70vw;
  color: var(--dim);
  font-size: 12px;
  text-align: center;
}

/* Virtual tilt pad, shown when the device has no usable motion sensors. */
#stick {
  position: absolute;
  left: 50%;
  bottom: calc(62px + env(safe-area-inset-bottom));
  width: 108px;
  height: 108px;
  margin-left: -54px;
  display: none;
  border: 1px solid var(--edge);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(20, 40, 80, 0.5), rgba(6, 12, 26, 0.35));
  pointer-events: auto;
  touch-action: none;
}
#stick.visible { display: block; }
#knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42px;
  height: 42px;
  margin: -21px 0 0 -21px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #cfe6ff, #2f6fd0 60%, #16305e);
  box-shadow: 0 0 18px rgba(80, 150, 255, 0.5);
  transition: transform 80ms ease-out;
}

#fatal {
  position: absolute;
  inset: auto 16px 50% 16px;
  display: none;
  padding: 16px;
  border: 1px solid rgba(255, 120, 120, 0.4);
  border-radius: 10px;
  background: rgba(40, 10, 14, 0.85);
  color: #ffd8d8;
  font-size: 13px;
  text-align: center;
}
#fatal.visible { display: block; }

@media (prefers-reduced-motion: reduce) {
  #knob, #hint { transition: none; }
}

</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="ui">
  <div id="vignette"></div>
  <div id="hint"></div>
  <div id="stats"></div>

  <div id="gate">
    <button id="gate-button" type="button">Enable tilt</button>
    <p id="gate-note"></p>
  </div>

  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <div id="fatal"></div>
</div>
<script>
(function () {
'use strict';

// ---- src/config.js ----
// Every tunable in one place. Values are in CSS pixels and seconds; the sim is
// resolution independent and the renderer scales by devicePixelRatio.

const CONFIG = {
  bed: {
    // Fraction of the screen height the settled bed should fill (front view).
    // Grain count is derived from this so the look is constant across devices.
    // Keep it shallow: pile depth is what the contact solver has to hold up,
    // and a bed much deeper than this starts sinking into itself no matter how
    // many iterations it gets. It also matches the reference hardware, whose
    // bed is only a shallow layer.
    fill: 0.22,
    // Depth of the box behind the glass, in grain diameters. This is the Z the
    // screen is a window into; deeper looks better but costs grains cubically.
    depthLayers: 3.5,
    // 3D random-close-packing density, converts bed volume -> grain count.
    packing: 0.64,
    minGrains: 400,
    maxGrains: 60000,
  },

  grain: {
    // radius = min(viewport) / divisor, clamped. 3D needs chunkier grains than
    // 2D did (count scales steeply with 1/r), but the default should look like
    // sand, not marbles — slow devices are the tuner's problem, not a tax the
    // designed look pays up front.
    divisor: 76,
    minRadius: 2.8,
    maxRadius: 9.5,
  },

  // Velocity-level sequential impulses. See src/grains.js for the reasoning
  // behind the velocity/position split — it is the whole basis of the solver.
  sim: {
    // Gravity magnitude = gravityScale * viewport diagonal (px/s^2). A phone
    // screen is ~50 px/cm, so true gravity would be ~50000 px/s^2; well below
    // that still reads as "falling through honey". This is the main knob for
    // how brisk and alive the sand feels.
    gravityScale: 7.0,
    // The solver runs on a fixed timestep so the feel never depends on frame
    // rate. maxSubsteps bounds catch-up work after a stall.
    fixedHz: 150,
    maxSubsteps: 4,
    // Contacts are found this far apart (fraction of a diameter) and the solver
    // then limits approach speed to the remaining gap. Detecting only actual
    // overlap leaves a grain resting exactly on a surface with no contact at
    // all — the floor stops holding the bed up and it sinks straight through.
    contactMargin: 0.05,
    // Extra reach (fraction of a diameter) baked into the contact list so it
    // survives several substeps. Finding pairs costs far more than solving
    // them, so the list is rebuilt at most once a frame — and only when some
    // grain has moved half the skin.
    skin: 0.35,
    // Grid cell size as a multiple of grain diameter; must exceed the list
    // radius (1 + skin) so the 3x3x3 scan cannot miss a pair.
    cellMul: 1.4,
    // Gauss-Seidel sweeps. Velocity iterations buy stacking stiffness (a deep
    // pile needs more); position iterations only clean up leftover overlap.
    velocityIterations: 6,
    // Bottom-up sweeps treating the supported side as ground. One is usually
    // enough and it is what lets a deep bed stand up at all.
    shockIterations: 1,
    positionIterations: 3,
    // Fraction of excess penetration removed per position iteration.
    positionBeta: 0.15,
    // Overlap left uncorrected, as a fraction of a diameter. A little slack
    // here is what lets a settled bed stop fidgeting entirely.
    slop: 0.02,
    // Ceiling on one position correction, so a deep overlap unwinds over a few
    // steps instead of teleporting.
    maxCorrection: 0.08,
    // Coulomb friction. Grain-on-grain sets the angle of repose, which lands
    // well above atan(mu) because spheres have to climb out of each other's
    // pockets to move: 0.28 gives ~34°, which is real sand. Only meaningful
    // because friction is warm started — without that the solver never builds
    // enough of it to hold a slope, and the value barely matters.
    friction: 0.28,
    // Wall friction has to stay LOW and is the single most surprising knob in
    // here. The box is only a few grains deep, so roughly half of them touch
    // the glass or the back wall at any moment — at sand-on-sand values the
    // walls grip the entire bed and it rides out a 50° tilt as one rigid slab,
    // no matter what grain friction says.
    wallFriction: 0.12,
    // Gentle per-second velocity decay; sand is not springy, but this is only
    // a whisper — the contacts do the real dissipating.
    airDrag: 0.4,
    // Hard speed ceiling, in grain diameters travelled per substep.
    maxTravel: 1.0,
    // Neighbour search radius for shading, as a multiple of grain diameter.
    shadeRadius: 1.15,
    // Divisor for the "how buried am I" term (sum of upward contact dots).
    coverNorm: 2.4,
    // Fraction of a grain's brightness that reaches the grain beneath it.
    lightTransmit: 0.93,
    lightSmoothing: 18,
    splashSpeed: 1.0,
  },

  render: {
    maxDpr: 2,
    // Sprite sizes as multiples of grain diameter.
    beadSize: 1.15,
    glowSize: 3.2,
    glowStrength: 0.1,
    // Perspective: focal length as a multiple of min(viewport w, h). Smaller =
    // more dramatic depth. Parallax shifts the eye against tilt, in px.
    focal: 1.4,
    depthDim: 0.45,
    parallax: 40,
    background: [0.008, 0.016, 0.035],
    // Deep (buried) -> mid -> ice (surface). Fast grains blow out to white.
    deep: [0.035, 0.11, 0.42],
    mid: [0.1, 0.45, 0.96],
    ice: [0.68, 0.9, 1.0],
  },

  input: {
    // Gravity direction smoothing, per second.
    tiltSmoothing: 14,
    keySmoothing: 8,
    // Fixed into-screen gravity bias for keyboard/stick/demo input, so the bed
    // leans against the back wall and the box reads as 3D on desktop too.
    zBias: 0.45,
    // m/s^2 of gravity-excluded acceleration that counts as a shake, and how
    // long after load before shakes are armed (picking the phone up spikes the
    // accelerometer hard enough to read as several shakes otherwise).
    shakeThreshold: 13,
    shakeCooldown: 0.35,
    shakeArmDelay: 1.5,
    // Finger/mouse push.
    pokeRadius: 46,
    pokeStrength: 2600,
    pokeDrag: 0.85,
  },

  tuner: {
    // Downscale-only safety net, not an optimiser. Grain size is chosen from
    // the screen alone, and that is the ceiling: the tuner may coarsen grains
    // on a device that cannot keep up, and never refines past the designed
    // look. Refining was the wrong idea twice over — it made the app look
    // different depending on the GPU, and "more detail" means spawning grains,
    // which is visible as sand appearing out of nowhere seconds after load.
    //
    // Consequence: it never adds grains, so it can no longer disturb a settled
    // bed. A device that coarsens stays coarse until reload, which is a fair
    // trade for a look that never changes on its own.
    enabled: true,
    // Only sustained trouble counts — comfortably past a 60fps budget so a
    // stray spike or a background tab never triggers it.
    hiMs: 19,
    sampleFrames: 60,
    cooldown: 2.5,
    // Ignore the first seconds entirely. Every load opens with the bed
    // avalanching into place with nothing asleep yet — the most expensive
    // moment the app ever has, and an atypical one. Judging on it coarsened
    // the look on hardware that then ran the actual scene at a steady 60fps.
    warmup: 4.5,
    step: 0.18,
    // Coarsest allowed, as a fraction of the designed grain count.
    minScale: 0.22,
  },
};

// ---- src/grid.js ----
// Uniform 3D spatial hash, built with a counting sort. Allocation-free after
// warm-up. Purely a lookup structure — it knows nothing about the physics.
//
// Cells are x-major then y then z: index (cz * rows + cy) * cols + cx.

class Grid {
  constructor(capacity) {
    this.cols = 0;
    this.rows = 0;
    this.slabs = 0;
    this.cellCount = 0;
    this.cellSize = 1;
    this.cellStart = new Int32Array(1);
    this.cursor = new Int32Array(1);
    this.order = new Int32Array(capacity);
    this.cellOf = new Int32Array(capacity);
    this.grainOrder = new Int32Array(capacity);
  }

  ensureCapacity(n) {
    if (this.order.length >= n) return;
    this.order = new Int32Array(n);
    this.cellOf = new Int32Array(n);
    this.grainOrder = new Int32Array(n);
  }

  configure(width, height, depth, cellSize) {
    this.cellSize = cellSize;
    this.cols = Math.max(1, Math.ceil(width / cellSize));
    this.rows = Math.max(1, Math.ceil(height / cellSize));
    this.slabs = Math.max(1, Math.ceil(depth / cellSize));
    this.cellCount = this.cols * this.rows * this.slabs;
    if (this.cellStart.length < this.cellCount + 1) {
      this.cellStart = new Int32Array(this.cellCount + 1);
      this.cursor = new Int32Array(this.cellCount + 1);
    }
  }

  build(x, y, z, n) {
    const cols = this.cols;
    const rows = this.rows;
    const slabs = this.slabs;
    const layer = cols * rows;
    const cells = this.cellCount;
    const start = this.cellStart;
    const cursor = this.cursor;
    const cellOf = this.cellOf;
    const order = this.order;
    const inv = 1 / this.cellSize;

    start.fill(0, 0, cells + 1);

    for (let i = 0; i < n; i++) {
      let cx = (x[i] * inv) | 0;
      let cy = (y[i] * inv) | 0;
      let cz = (z[i] * inv) | 0;
      if (cx < 0) cx = 0; else if (cx >= cols) cx = cols - 1;
      if (cy < 0) cy = 0; else if (cy >= rows) cy = rows - 1;
      if (cz < 0) cz = 0; else if (cz >= slabs) cz = slabs - 1;
      const c = cz * layer + cy * cols + cx;
      cellOf[i] = c;
      start[c + 1]++;
    }
    for (let c = 0; c < cells; c++) start[c + 1] += start[c];

    cursor.set(start.subarray(0, cells + 1));
    for (let i = 0; i < n; i++) order[cursor[cellOf[i]]++] = i;
  }

  /**
   * Grain indices ordered deepest-first along a direction. Solving contacts in
   * this order lets a single Gauss-Seidel sweep carry support all the way up
   * through a pile, instead of one layer per iteration.
   */
  orderByGravity(gx, gy, gz, n) {
    const axes = [
      { len: this.cols, stride: 1, g: gx },
      { len: this.rows, stride: this.cols, g: gy },
      { len: this.slabs, stride: this.cols * this.rows, g: gz },
    ];
    axes.sort((a, b) => Math.abs(b.g) - Math.abs(a.g));
    for (const a of axes) {
      a.start = a.g >= 0 ? a.len - 1 : 0;
      a.step = a.g >= 0 ? -1 : 1;
    }

    const [a0, a1, a2] = axes;
    const start = this.cellStart;
    const order = this.order;
    const out = this.grainOrder;
    let k = 0;
    for (let i0 = 0; i0 < a0.len; i0++) {
      const o0 = (a0.start + i0 * a0.step) * a0.stride;
      for (let i1 = 0; i1 < a1.len; i1++) {
        const o1 = o0 + (a1.start + i1 * a1.step) * a1.stride;
        for (let i2 = 0; i2 < a2.len; i2++) {
          const c = o1 + (a2.start + i2 * a2.step) * a2.stride;
          const e = start[c + 1];
          for (let s = start[c]; s < e; s++) out[k++] = order[s];
        }
      }
    }
    return out;
  }
}

// ---- src/util.js ----
// Small shared helpers. Kept dependency-free so it can sit at the root of the
// module graph (the bundler relies on that ordering).

function clamp(v, lo, hi) {
  return v < lo ? lo : v > hi ? hi : v;
}

/** Frame-rate independent exponential approach: rate is "per second". */
function approach(current, target, rate, dt) {
  return current + (target - current) * (1 - Math.exp(-rate * dt));
}

/** Deterministic 32-bit PRNG so a given seed always lays out the same bed. */
function makeRandom(seed) {
  let s = seed >>> 0 || 1;
  return function random() {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

function isTouchDevice() {
  return (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
}

/** iOS (including iPadOS, which reports itself as a Mac with touch). */
function isIOS() {
  const ua = navigator.userAgent;
  return /iPad|iPhone|iPod/.test(ua) ||
    (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
}

// ---- src/grains.js ----
// Granular solver: velocity-level sequential impulses in a shallow 3D box.
//
// The screen is the front glass; the box extends a few grain diameters in Z.
// Grains are equal-mass spheres with no rotational degree of freedom, so
// friction is pure sliding friction and a pile's angle of repose comes out at
// roughly atan(mu) — real physics rather than a stiction trick.
//
// Each fixed substep:
//   1. gravity and drag into velocity
//   2. find contacts (grain-grain and box walls)
//   3. VELOCITY pass — Gauss-Seidel impulses: non-penetration, then Coulomb
//      friction capped by the normal impulse accumulated so far
//   4. clamp speed, integrate positions
//   5. POSITION pass — push apart whatever is still overlapping
//
// The split between 3 and 5 is the load-bearing design decision. An impulse can
// only ever remove kinetic energy, so contacts cannot manufacture motion; and
// the position pass repairs penetration WITHOUT writing back into velocity, so
// geometry never becomes energy either. Resolving overlap by moving grains and
// then re-deriving velocity from that movement — the obvious approach — pumps
// energy into every contact and boils the bed, which no amount of damping,
// sleeping or clamping can fully hide.
//
// Because nothing injects energy, the bed comes to rest on its own. There is no
// sleep system: every grain integrates every step, so tilt response is
// immediate and flow is continuous.
//
// Contacts are solved deepest-first along gravity, so one sweep propagates
// support from the floor up through the whole pile.


class Grains {
  constructor(capacity) {
    this.capacity = capacity;
    this.n = 0;

    const f32 = () => new Float32Array(capacity);
    this.x = f32();
    this.y = f32();
    this.z = f32();
    this.vx = f32();
    this.vy = f32();
    this.vz = f32();

    // Shading inputs, all harvested from the contact search.
    this.light = f32();
    this.speed01 = f32();
    this.sizeJitter = f32();
    this.hueJitter = f32();
    this.contacts = new Uint8Array(capacity);
    this.cover = f32();
    this.litAbove = f32();

    this.rank = new Int32Array(capacity);
    // Positions when the contact list was last rebuilt, for the skin test.
    this.refX = f32();
    this.refY = f32();
    this.refZ = f32();
    this.grid = new Grid(capacity);
    this.random = makeRandom(0x5117);

    // Contact arrays, grown on demand. cj < 0 marks a static wall contact.
    this.contactCapacity = 0;
    this.ci = new Int32Array(0);
    this.cj = new Int32Array(0);
    this.cnx = new Float32Array(0);
    this.cny = new Float32Array(0);
    this.cnz = new Float32Array(0);
    this.cgap = new Float32Array(0);
    this.cjn = new Float32Array(0);
    // Accumulated friction impulse per contact, as a vector.
    this.cfx = new Float32Array(0);
    this.cfy = new Float32Array(0);
    this.cfz = new Float32Array(0);
    this.active = new Int32Array(0);
    this.contactCount = 0;
    this.activeCount = 0;
    this.hashSize = 0;
    this.hashMask = 0;
    this.hKeyI = new Int32Array(0);
    this.hKeyJ = new Int32Array(0);
    this.hJn = new Float32Array(0);
    this.hFx = new Float32Array(0);
    this.hFy = new Float32Array(0);
    this.hFz = new Float32Array(0);
    this.warmHits = 0;

    this.radius = 4;
    this.diameter = 8;
    this.cellSize = 8;
    this.depth = 32;
    this.bounds = { x0: 0, y0: 0, x1: 1, y1: 1 };
    this.inner = { x0: 0, y0: 0, z0: 0, x1: 1, y1: 1, z1: 1 };
    this.gravityMagnitude = 4000;
    this.speedNorm = 600;
    this.substeps = 1;
    this.iterations = CONFIG.sim.velocityIterations;
    this._carry = 0;
  }

  /** Set the box size and grain size; keeps existing grains in place. */
  configure(width, height, radius) {
    this.radius = radius;
    this.diameter = radius * 2;
    // Must cover the speculative contact radius, or the 3x3x3 scan misses pairs
    // that are about to collide.
    this.cellSize = this.diameter * CONFIG.sim.cellMul;
    this.depth = Math.max(
      this.diameter * 2,
      Math.min(CONFIG.bed.depthLayers * this.diameter, Math.min(width, height) * 0.22),
    );
    this.bounds = { x0: 0, y0: 0, x1: width, y1: height };
    this.inner = {
      x0: radius,
      y0: radius,
      z0: radius,
      x1: Math.max(radius, width - radius),
      y1: Math.max(radius, height - radius),
      z1: Math.max(radius, this.depth - radius),
    };
    this.grid.configure(width, height, this.depth, this.cellSize);

    this.gravityMagnitude = CONFIG.sim.gravityScale * Math.hypot(width, height);
    this.speedNorm = 0.35 * Math.sqrt(2 * this.gravityMagnitude * height);
  }

  ensureContactCapacity(need) {
    if (this.contactCapacity >= need) return;
    const cap = Math.max(need, Math.ceil(this.contactCapacity * 1.5) + 1024);
    this.ci = new Int32Array(cap);
    this.cj = new Int32Array(cap);
    this.cnx = new Float32Array(cap);
    this.cny = new Float32Array(cap);
    this.cnz = new Float32Array(cap);
    this.cgap = new Float32Array(cap);
    this.cjn = new Float32Array(cap);
    this.cfx = new Float32Array(cap);
    this.cfy = new Float32Array(cap);
    this.cfz = new Float32Array(cap);
    this.active = new Int32Array(cap);
    this.contactCapacity = cap;
    this.ensureHash(cap);
  }

  /** Grain count that fills `CONFIG.bed.fill` of the front view when settled. */
  idealCount(fill = CONFIG.bed.fill) {
    const { x1, y1 } = this.bounds;
    const grainVol = (4 / 3) * Math.PI * this.radius ** 3;
    const volume = x1 * (fill * y1) * this.depth;
    const ideal = (volume * CONFIG.bed.packing) / grainVol;
    const ceiling = Math.min(
      CONFIG.bed.maxGrains,
      this.capacity,
      (x1 * (0.6 * y1) * this.depth * CONFIG.bed.packing) / grainVol,
    );
    return Math.round(clamp(ideal, CONFIG.bed.minGrains, ceiling));
  }

  _spawnAt(i, x, y, z) {
    const rand = this.random;
    this.x[i] = x;
    this.y[i] = y;
    this.z[i] = z;
    this.vx[i] = 0;
    this.vy[i] = 0;
    this.vz[i] = 0;
    this.light[i] = 0.5;
    this.speed01[i] = 0;
    this.sizeJitter[i] = rand();
    this.hueJitter[i] = rand();
    this.contacts[i] = 0;
    this.cover[i] = 0;
    this.litAbove[i] = 0;
  }

  /**
   * Lay out the starting bed as a staggered lattice: alternate layers offset by
   * half a pitch in x and z, so each grain sits in a pocket of the layer below.
   *
   * Both properties matter. Nothing may overlap, or the solver is handed a
   * bed's worth of stored energy on frame one and detonates. And the layout has
   * to be near settled *density*, because a naive loose lattice stands several
   * times too tall for its grain count — and a pile that deep outweighs what
   * the solver can support in its iteration budget, so it crushes itself into a
   * thin overlapping slab on the way down.
   */
  fill(count) {
    const n = Math.min(count, this.capacity);
    this.n = n;
    this.grid.ensureCapacity(n);

    const rand = this.random;
    const b = this.inner;
    const d = this.diameter;
    const pitch = d * 1.04;
    // With a half-pitch offset in both x and z, the nearest grain in the layer
    // below sits at sqrt((p/2)^2 + yp^2 + (p/2)^2); 0.75d keeps that over d.
    const yPitch = d * 0.75;
    const spanX = Math.max(pitch, b.x1 - b.x0);
    const spanZ = Math.max(0, b.z1 - b.z0);
    const perX = Math.max(1, Math.floor(spanX / pitch) + 1);
    const perZ = Math.max(1, Math.floor(spanZ / pitch) + 1);
    const perLayer = perX * perZ;
    const jitter = this.radius * 0.06;

    for (let i = 0; i < n; i++) {
      const layer = Math.floor(i / perLayer);
      const rem = i % perLayer;
      const off = layer % 2 ? pitch * 0.5 : 0;
      const zi = Math.floor(rem / perX);
      const xi = rem % perX;
      this._spawnAt(
        i,
        clamp(b.x0 + off + xi * pitch + (rand() - 0.5) * jitter, b.x0, b.x1),
        clamp(b.y1 - layer * yPitch + (rand() - 0.5) * jitter, b.y0, b.y1),
        clamp(b.z0 + (perZ > 1 ? off : 0) + zi * pitch + (rand() - 0.5) * jitter, b.z0, b.z1),
      );
    }
  }

  /** Grow/shrink the bed. New grains appear just above the current surface. */
  setCount(count) {
    const target = Math.min(Math.max(count, 0), this.capacity);
    if (target === this.n) return;
    if (target < this.n) {
      this.n = target;
      return;
    }

    let bedTop = this.inner.y1;
    for (let i = 0; i < this.n; i++) if (this.y[i] < bedTop) bedTop = this.y[i];

    const rand = this.random;
    const b = this.inner;
    const pitch = this.diameter * 1.1;
    const perX = Math.max(1, Math.floor((b.x1 - b.x0) / pitch) + 1);
    const perZ = Math.max(1, Math.floor((b.z1 - b.z0) / pitch) + 1);
    const perLayer = perX * perZ;
    for (let k = 0, i = this.n; i < target; k++, i++) {
      const row = Math.floor(k / perLayer);
      const rem = k % perLayer;
      this._spawnAt(
        i,
        clamp(b.x0 + (rem % perX) * pitch, b.x0, b.x1),
        clamp(bedTop - pitch * (1 + row), b.y0, b.y1),
        clamp(b.z0 + Math.floor(rem / perX) * pitch, b.z0, b.z1),
      );
    }
    this.n = target;
    this.grid.ensureCapacity(target);
  }

  /** Nudge every grain back inside after a viewport change. */
  clampToBounds() {
    const b = this.inner;
    for (let i = 0; i < this.n; i++) {
      this.x[i] = clamp(this.x[i], b.x0, b.x1);
      this.y[i] = clamp(this.y[i], b.y0, b.y1);
      this.z[i] = clamp(this.z[i], b.z0, b.z1);
    }
  }

  /** Shake response: throw the bed into the air. */
  splash(strength) {
    const rand = this.random;
    const speed = this.speedNorm * CONFIG.sim.splashSpeed * strength;
    for (let i = 0; i < this.n; i++) {
      const a = rand() * Math.PI * 2;
      const m = speed * (0.35 + rand() * 0.65);
      this.vx[i] += Math.cos(a) * m;
      this.vy[i] += Math.sin(a) * m * 0.7 - m * 0.55;
      this.vz[i] += (rand() - 0.5) * m * 0.5;
    }
  }

  /** Push grains away from a screen point (a cylinder through the depth). */
  poke(cx, cy, dragX, dragY, dt) {
    const r = CONFIG.input.pokeRadius;
    const r2 = r * r;
    const push = CONFIG.input.pokeStrength * dt;
    const dragScale = CONFIG.input.pokeDrag;
    const { x, y, vx, vy } = this;
    for (let i = 0; i < this.n; i++) {
      const ox = x[i] - cx;
      const oy = y[i] - cy;
      const d2 = ox * ox + oy * oy;
      if (d2 > r2) continue;
      const d = Math.sqrt(d2) || 1e-4;
      const falloff = 1 - d / r;
      const k = (push * falloff) / d;
      vx[i] += ox * k + dragX * dragScale * falloff;
      vy[i] += oy * k + dragY * dragScale * falloff;
    }
  }

  // ------------------------------------------------------------------ stepping

  step(dtFrame, gx, gy, gz) {
    const n = this.n;
    if (n === 0) return;
    const cfg = CONFIG.sim;

    // Fixed timestep with a carry, so the feel never depends on frame rate.
    const h = 1 / cfg.fixedHz;
    this._carry += dtFrame;
    let steps = Math.floor(this._carry / h);
    if (steps > cfg.maxSubsteps) steps = cfg.maxSubsteps;
    if (steps < 1) {
      // Very high refresh rate: keep accumulating rather than stepping tiny.
      if (this._carry < h) return;
      steps = 1;
    }
    this._carry -= steps * h;
    if (this._carry > h * cfg.maxSubsteps) this._carry = 0; // shed a long stall
    this.substeps = steps;
    this.iterations = cfg.velocityIterations;

    const gmag = Math.hypot(gx, gy, gz) || 1;
    const gdx = gx / gmag;
    const gdy = gy / gmag;
    const gdz = gz / gmag;

    for (let s = 0; s < steps; s++) {
      this.applyGravity(h, gx, gy, gz);
      if (s === 0 || this.listStale()) this.findContacts(gdx, gdy, gdz);
      else this.refreshGaps();
      this.solveVelocity(h);
      this.shockPass(h);
      this.integrate(h);
      this.solvePosition();
    }
    this.updateShading(dtFrame);
  }

  applyGravity(h, gx, gy, gz) {
    const n = this.n;
    const { vx, vy, vz } = this;
    const damp = Math.exp(-CONFIG.sim.airDrag * h);
    const dvx = gx * h;
    const dvy = gy * h;
    const dvz = gz * h;
    for (let i = 0; i < n; i++) {
      vx[i] = (vx[i] + dvx) * damp;
      vy[i] = (vy[i] + dvy) * damp;
      vz[i] = (vz[i] + dvz) * damp;
    }
  }

  /**
   * Impulse memory for warm starting, as an open-addressed hash keyed by the
   * contact pair. Rebuilding the contact list shuffles indices, so carrying
   * impulses forward needs identity, not position in an array.
   */
  ensureHash(cap) {
    let size = 1024;
    while (size < cap * 2) size <<= 1;
    if (this.hashSize >= size) return;
    this.hashSize = size;
    this.hashMask = size - 1;
    this.hKeyI = new Int32Array(size);
    this.hKeyJ = new Int32Array(size);
    this.hJn = new Float32Array(size);
    this.hFx = new Float32Array(size);
    this.hFy = new Float32Array(size);
    this.hFz = new Float32Array(size);
    this.hKeyI.fill(-1);
  }

  /** Slot for this pair: either its existing entry or the first free one. */
  hashSlot(i, j) {
    const mask = this.hashMask;
    const keyI = this.hKeyI;
    const keyJ = this.hKeyJ;
    let h = (Math.imul(i, 73856093) ^ Math.imul(j + 8, 19349663)) & mask;
    for (let probe = 0; probe < 24; probe++) {
      const k = keyI[h];
      if (k === -1 || (k === i && keyJ[h] === j)) return h;
      h = (h + 1) & mask;
    }
    return -1; // crowded: this contact just starts cold, which is harmless
  }

  /** Park the current frame's impulses before the contact list is rebuilt. */
  stashImpulses() {
    const cnt = this.contactCount;
    if (cnt === 0) return;
    const { ci, cj, cjn, cfx, cfy, cfz, hKeyI, hKeyJ, hJn, hFx, hFy, hFz } = this;
    hKeyI.fill(-1);
    for (let c = 0; c < cnt; c++) {
      const jn = cjn[c];
      if (jn <= 0) continue; // nothing worth remembering
      const i = ci[c];
      const j = cj[c];
      const slot = this.hashSlot(i, j);
      if (slot < 0) continue;
      hKeyI[slot] = i;
      hKeyJ[slot] = j;
      hJn[slot] = jn;
      hFx[slot] = cfx[c];
      hFy[slot] = cfy[c];
      hFz[slot] = cfz[c];
    }
  }

  /** Give each contact in the fresh list whatever it was carrying before. */
  restoreImpulses() {
    const cnt = this.contactCount;
    const { ci, cj, cjn, cfx, cfy, cfz, hKeyI, hKeyJ, hJn, hFx, hFy, hFz } = this;
    let hits = 0;
    for (let c = 0; c < cnt; c++) {
      const i = ci[c];
      const j = cj[c];
      const slot = this.hashSlot(i, j);
      if (slot >= 0 && hKeyI[slot] === i && hKeyJ[slot] === j) {
        cjn[c] = hJn[slot];
        cfx[c] = hFx[slot];
        cfy[c] = hFy[slot];
        cfz[c] = hFz[slot];
        hits++;
      } else {
        cjn[c] = 0;
        cfx[c] = 0;
        cfy[c] = 0;
        cfz[c] = 0;
      }
    }
    this.warmHits = hits;
  }

  /**
   * Collect contacts, deepest-first along gravity, and harvest the shading
   * terms from the same neighbour scan (they are free here: the distances are
   * already computed).
   */
  findContacts(gdx, gdy, gdz) {
    const n = this.n;
    const grid = this.grid;
    grid.build(this.x, this.y, this.z, n);
    const order = grid.orderByGravity(gdx, gdy, gdz, n);
    const rank = this.rank;
    for (let k = 0; k < n; k++) rank[order[k]] = k;

    this.stashImpulses();
    this.ensureContactCapacity(n * 10);

    const { x, y, z, contacts, cover, light, litAbove } = this;
    const { ci, cj, cnx, cny, cnz, cgap } = this;
    const cols = grid.cols, rows = grid.rows, slabs = grid.slabs;
    const layer = cols * rows;
    const start = grid.cellStart;
    const cellOrder = grid.order;
    const cellOf = grid.cellOf;
    const D = this.diameter;
    const margin = CONFIG.sim.contactMargin * D;
    // Built with a skin so the list outlives several substeps; whether a listed
    // pair is actually active is decided per substep in refreshGaps().
    const RC = D + CONFIG.sim.skin * D;
    // Scan radius covers both the speculative contacts and the shading reach.
    const RS = Math.max(RC, D * CONFIG.sim.shadeRadius);
    const RS2 = RS * RS;
    const DS2 = (D * CONFIG.sim.shadeRadius) ** 2;
    const b = this.inner;
    const cap = this.contactCapacity;

    contacts.fill(0, 0, n);
    cover.fill(0, 0, n);
    litAbove.fill(0, 0, n);

    let c = 0;
    for (let k = 0; k < n; k++) {
      const i = order[k];
      const xi = x[i], yi = y[i], zi = z[i];

      // Walls first: they are the ultimate support, so solving them ahead of
      // this grain's neighbours is what a deepest-first sweep wants.
      const skin = CONFIG.sim.skin * D;
      // Speculative: a grain resting exactly ON a wall has zero penetration, so
      // a strict "is it past the plane" test finds nothing and the floor
      // silently stops supporting the bed. Catch them a margin early instead
      // and let the solver limit approach speed to the remaining gap.
      if (c + 6 <= cap) {
        let gap = xi - b.x0;
        if (gap < skin) { ci[c] = i; cj[c] = -1; cnx[c] = -1; cny[c] = 0; cnz[c] = 0; cgap[c] = gap; c++; }
        gap = b.x1 - xi;
        if (gap < skin) { ci[c] = i; cj[c] = -2; cnx[c] = 1; cny[c] = 0; cnz[c] = 0; cgap[c] = gap; c++; }
        gap = yi - b.y0;
        if (gap < skin) { ci[c] = i; cj[c] = -3; cnx[c] = 0; cny[c] = -1; cnz[c] = 0; cgap[c] = gap; c++; }
        gap = b.y1 - yi;
        if (gap < skin) { ci[c] = i; cj[c] = -4; cnx[c] = 0; cny[c] = 1; cnz[c] = 0; cgap[c] = gap; c++; }
        gap = zi - b.z0;
        if (gap < skin) { ci[c] = i; cj[c] = -5; cnx[c] = 0; cny[c] = 0; cnz[c] = -1; cgap[c] = gap; c++; }
        gap = b.z1 - zi;
        if (gap < skin) { ci[c] = i; cj[c] = -6; cnx[c] = 0; cny[c] = 0; cnz[c] = 1; cgap[c] = gap; c++; }
      }

      const cell = cellOf[i];
      const cz = (cell / layer) | 0;
      const rest = cell - cz * layer;
      const cy = (rest / cols) | 0;
      const cx = rest - cy * cols;
      const x0 = cx > 0 ? cx - 1 : 0, x1 = cx < cols - 1 ? cx + 1 : cols - 1;
      const y0 = cy > 0 ? cy - 1 : 0, y1 = cy < rows - 1 ? cy + 1 : rows - 1;
      const z0 = cz > 0 ? cz - 1 : 0, z1 = cz < slabs - 1 ? cz + 1 : slabs - 1;

      for (let rz = z0; rz <= z1; rz++) {
        const zb = rz * layer;
        for (let ry = y0; ry <= y1; ry++) {
          const yb = zb + ry * cols;
          for (let rx = x0; rx <= x1; rx++) {
            const cc = yb + rx;
            const e = start[cc + 1];
            for (let s = start[cc]; s < e; s++) {
              const j = cellOrder[s];
              // Each pair once, owned by whichever grain is deeper.
              if (rank[j] <= k) continue;
              const dx = x[j] - xi;
              const dy = y[j] - yi;
              const dz = z[j] - zi;
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 >= RS2) continue;

              const dist = Math.sqrt(d2);
              let nx, ny, nz;
              if (dist > 1e-6) {
                const inv = 1 / dist;
                nx = dx * inv; ny = dy * inv; nz = dz * inv;
              } else {
                // Exactly coincident: pick a deterministic direction rather
                // than skipping, which would weld the pair together forever.
                const a = i * 2.3999632;
                nx = Math.cos(a) * 0.94; ny = Math.sin(a) * 0.94; nz = 0.34;
              }

              // Shading: neighbour count, how much of the load sits on the
              // anti-gravity side, and the brightest neighbour up there.
              if (d2 < DS2) {
                contacts[i]++;
                contacts[j]++;
                const w = nx * gdx + ny * gdy + nz * gdz;
                if (w < 0) {
                  cover[i] -= w;
                  const lj = light[j];
                  if (lj > litAbove[i]) litAbove[i] = lj;
                } else {
                  cover[j] += w;
                  const li = light[i];
                  if (li > litAbove[j]) litAbove[j] = li;
                }
              }

              if (dist >= RC || c >= cap) continue;
              ci[c] = i;
              cj[c] = j;
              cnx[c] = nx; cny[c] = ny; cnz[c] = nz;
              cgap[c] = dist - D;
              c++;
            }
          }
        }
      }
    }
    this.contactCount = c;
    this.restoreImpulses();
    this.refX.set(this.x.subarray(0, n));
    this.refY.set(this.y.subarray(0, n));
    this.refZ.set(this.z.subarray(0, n));
    this.refreshGaps();
  }

  /**
   * Has anything moved far enough that the list might have missed a new pair?
   * The list is built with a skin, so it stays valid until some grain has
   * travelled half of it.
   */
  listStale() {
    const n = this.n;
    const { x, y, z, refX, refY, refZ } = this;
    const limit = CONFIG.sim.skin * this.diameter * 0.5;
    const limit2 = limit * limit;
    for (let i = 0; i < n; i++) {
      const dx = x[i] - refX[i], dy = y[i] - refY[i], dz = z[i] - refZ[i];
      if (dx * dx + dy * dy + dz * dz > limit2) return true;
    }
    return false;
  }

  /**
   * Re-measure every listed pair against current positions and collect the ones
   * close enough to matter. The list itself is built at most once per frame —
   * finding pairs costs far more than solving them, so re-using it across
   * substeps is the difference between a bed that runs and one that does not.
   */
  refreshGaps() {
    const cnt = this.contactCount;
    const { ci, cj, cnx, cny, cnz, cgap, cjn, cfx, cfy, cfz, active, x, y, z } = this;
    const b = this.inner;
    const D = this.diameter;
    const margin = CONFIG.sim.contactMargin * D;
    let a = 0;
    for (let c = 0; c < cnt; c++) {
      const i = ci[c];
      const j = cj[c];
      if (j >= 0) {
        const dx = x[j] - x[i], dy = y[j] - y[i], dz = z[j] - z[i];
        const d2 = dx * dx + dy * dy + dz * dz;
        const rc = D + margin;
        if (d2 >= rc * rc) { cjn[c] = 0; cfx[c] = 0; cfy[c] = 0; cfz[c] = 0; continue; }
        const dist = Math.sqrt(d2);
        if (dist > 1e-6) {
          const inv = 1 / dist;
          cnx[c] = dx * inv; cny[c] = dy * inv; cnz[c] = dz * inv;
        }
        cgap[c] = dist - D;
      } else {
        const nx = cnx[c], ny = cny[c], nz = cnz[c];
        let gap;
        if (nx < 0) gap = x[i] - b.x0;
        else if (nx > 0) gap = b.x1 - x[i];
        else if (ny < 0) gap = y[i] - b.y0;
        else if (ny > 0) gap = b.y1 - y[i];
        else if (nz < 0) gap = z[i] - b.z0;
        else gap = b.z1 - z[i];
        if (gap >= margin) { cjn[c] = 0; cfx[c] = 0; cfy[c] = 0; cfz[c] = 0; continue; }
        cgap[c] = gap;
      }
      active[a++] = c;
    }
    this.activeCount = a;
  }

  /**
   * Velocity pass: Gauss-Seidel impulses. Non-penetration first, then Coulomb
   * friction capped by mu times the normal impulse on that contact.
   *
   * Both are **warm started** — each contact begins the step by re-applying the
   * impulse it settled on last time, and iterates from there. This is what makes
   * a deep bed genuinely quiet. Starting every step from zero, the solver has to
   * rediscover the entire weight of the pile within its iteration budget, always
   * falls a little short, and the bed sinks a fraction, gets pushed back out,
   * and sinks again — a permanent low simmer no amount of damping removes.
   * Beginning from the previous answer means it starts converged and stays there.
   *
   * Friction accumulates as a vector and is clamped as a whole (rather than
   * clamping each increment), which is what gives true static friction: inside
   * the cone, sliding is cancelled outright instead of merely slowed.
   */
  solveVelocity(h) {
    const cnt = this.activeCount;
    if (cnt === 0) return;
    const { ci, cj, cnx, cny, cnz, cgap, cjn, cfx, cfy, cfz, active, vx, vy, vz } = this;
    const invH = 1 / h;
    const iters = CONFIG.sim.velocityIterations;
    const mu = CONFIG.sim.friction;
    const muWall = CONFIG.sim.wallFriction;

    // Warm start: re-apply what each contact was already carrying.
    for (let a = 0; a < cnt; a++) {
      const c = active[a];
      const i = ci[c];
      const j = cj[c];
      const jn = cjn[c];
      const px = -cnx[c] * jn + cfx[c];
      const py = -cny[c] * jn + cfy[c];
      const pz = -cnz[c] * jn + cfz[c];
      vx[i] += px; vy[i] += py; vz[i] += pz;
      if (j >= 0) { vx[j] -= px; vy[j] -= py; vz[j] -= pz; }
    }

    for (let it = 0; it < iters; it++) {
      for (let a = 0; a < cnt; a++) {
        const c = active[a];
        const i = ci[c];
        const j = cj[c];
        const nx = cnx[c], ny = cny[c], nz = cnz[c];
        // Still apart: allow approach fast enough to just close the gap this
        // step, no faster. Already overlapping: allow no approach at all.
        const gap = cgap[c];
        const target = gap > 0 ? -gap * invH : 0;

        if (j >= 0) {
          // Two unit masses: 1/mi + 1/mj = 2, so the impulse is halved.
          let rx = vx[j] - vx[i], ry = vy[j] - vy[i], rz = vz[j] - vz[i];
          const vn = rx * nx + ry * ny + rz * nz;
          let dj = (target - vn) * 0.5;
          const total = cjn[c] + dj > 0 ? cjn[c] + dj : 0;
          dj = total - cjn[c];
          cjn[c] = total;
          if (dj !== 0) {
            vx[i] -= dj * nx; vy[i] -= dj * ny; vz[i] -= dj * nz;
            vx[j] += dj * nx; vy[j] += dj * ny; vz[j] += dj * nz;
          }

          rx = vx[j] - vx[i]; ry = vy[j] - vy[i]; rz = vz[j] - vz[i];
          const vn2 = rx * nx + ry * ny + rz * nz;
          // Impulse that would cancel all remaining sliding, added to what this
          // contact already holds, then clamped as a whole.
          let fx = cfx[c] + (rx - vn2 * nx) * 0.5;
          let fy = cfy[c] + (ry - vn2 * ny) * 0.5;
          let fz = cfz[c] + (rz - vn2 * nz) * 0.5;
          const cap = mu * cjn[c];
          const m2 = fx * fx + fy * fy + fz * fz;
          if (m2 > cap * cap) {
            const k = cap / Math.sqrt(m2);
            fx *= k; fy *= k; fz *= k;
          }
          const dfx = fx - cfx[c], dfy = fy - cfy[c], dfz = fz - cfz[c];
          cfx[c] = fx; cfy[c] = fy; cfz[c] = fz;
          vx[i] += dfx; vy[i] += dfy; vz[i] += dfz;
          vx[j] -= dfx; vy[j] -= dfy; vz[j] -= dfz;
        } else {
          // Static wall: infinite mass, zero velocity.
          const vn = -(vx[i] * nx + vy[i] * ny + vz[i] * nz);
          let dj = target - vn;
          const total = cjn[c] + dj > 0 ? cjn[c] + dj : 0;
          dj = total - cjn[c];
          cjn[c] = total;
          if (dj !== 0) {
            vx[i] -= dj * nx; vy[i] -= dj * ny; vz[i] -= dj * nz;
          }

          const rx = -vx[i], ry = -vy[i], rz = -vz[i];
          const vn2 = rx * nx + ry * ny + rz * nz;
          let fx = cfx[c] + (rx - vn2 * nx);
          let fy = cfy[c] + (ry - vn2 * ny);
          let fz = cfz[c] + (rz - vn2 * nz);
          const cap = muWall * cjn[c];
          const m2 = fx * fx + fy * fy + fz * fz;
          if (m2 > cap * cap) {
            const k = cap / Math.sqrt(m2);
            fx *= k; fy *= k; fz *= k;
          }
          const dfx = fx - cfx[c], dfy = fy - cfy[c], dfz = fz - cfz[c];
          cfx[c] = fx; cfy[c] = fy; cfz[c] = fz;
          vx[i] += dfx; vy[i] += dfy; vz[i] += dfz;
        }
      }
    }
  }

  /**
   * Shock propagation: one bottom-up sweep in which the deeper grain of each
   * pair is treated as immovable, so the whole impulse lands on the shallower
   * one.
   *
   * This is what makes deep piles stand up. Between two equal masses an impulse
   * only averages their velocities, so support crawls up a stack geometrically
   * — a thirty-layer bed needs far more iterations than is affordable, and
   * without this it slowly crushes itself into an overlapping slab. Treating
   * the supported side as ground (the floor does not recoil) carries support
   * from the box floor to the surface in a single pass. It deliberately breaks
   * momentum conservation, which is exactly what resting on solid ground does.
   */
  shockPass(h) {
    const cnt = this.activeCount;
    if (cnt === 0) return;
    const { ci, cj, cnx, cny, cnz, cgap, active, vx, vy, vz } = this;
    const invH = 1 / h;
    const passes = CONFIG.sim.shockIterations;

    for (let p = 0; p < passes; p++) {
      for (let a = 0; a < cnt; a++) {
        const c = active[a];
        const i = ci[c];
        const j = cj[c];
        const nx = cnx[c], ny = cny[c], nz = cnz[c];
        const gap = cgap[c];
        const target = gap > 0 ? -gap * invH : 0;
        if (j >= 0) {
          // ci is the deeper grain: it is the one already held up.
          const vn = (vx[j] - vx[i]) * nx + (vy[j] - vy[i]) * ny + (vz[j] - vz[i]) * nz;
          const dj = target - vn;
          if (dj > 0) {
            vx[j] += dj * nx; vy[j] += dj * ny; vz[j] += dj * nz;
          }
        } else {
          const vn = -(vx[i] * nx + vy[i] * ny + vz[i] * nz);
          const dj = target - vn;
          if (dj > 0) {
            vx[i] -= dj * nx; vy[i] -= dj * ny; vz[i] -= dj * nz;
          }
        }
      }
    }
  }

  integrate(h) {
    const n = this.n;
    const { x, y, z, vx, vy, vz } = this;
    // Nothing may cross more than about its own width per substep, or contacts
    // are found only once grains are already deep inside each other.
    const maxV = (CONFIG.sim.maxTravel * this.diameter) / h;
    const maxV2 = maxV * maxV;
    for (let i = 0; i < n; i++) {
      let ux = vx[i], uy = vy[i], uz = vz[i];
      const s2 = ux * ux + uy * uy + uz * uz;
      if (s2 > maxV2) {
        const k = maxV / Math.sqrt(s2);
        ux *= k; uy *= k; uz *= k;
        vx[i] = ux; vy[i] = uy; vz[i] = uz;
      }
      x[i] += ux * h;
      y[i] += uy * h;
      z[i] += uz * h;
    }
  }

  /**
   * Position pass: push overlapping pairs apart, and put wall violators back
   * inside. Velocities are deliberately left alone — turning this correction
   * into velocity is exactly how a solver starts manufacturing energy.
   *
   * `slop` leaves a sliver of overlap uncorrected so a resting bed has nothing
   * left to fidget about.
   */
  solvePosition() {
    const cnt = this.activeCount;
    const { ci, cj, cnx, cny, cnz, active, x, y, z } = this;
    const iters = CONFIG.sim.positionIterations;
    const beta = CONFIG.sim.positionBeta;
    const D = this.diameter;
    const slop = CONFIG.sim.slop * D;
    const maxFix = CONFIG.sim.maxCorrection * D;
    const b = this.inner;

    for (let it = 0; it < iters; it++) {
      for (let a = 0; a < cnt; a++) {
        const c = active[a];
        const i = ci[c];
        const j = cj[c];
        if (j >= 0) {
          const dx = x[j] - x[i], dy = y[j] - y[i], dz = z[j] - z[i];
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 >= D * D || d2 < 1e-12) continue;
          const dist = Math.sqrt(d2);
          let push = (D - dist - slop) * beta * 0.5;
          if (push <= 0) continue;
          if (push > maxFix) push = maxFix;
          const inv = 1 / dist;
          const nx = dx * inv, ny = dy * inv, nz = dz * inv;
          x[i] -= nx * push; y[i] -= ny * push; z[i] -= nz * push;
          x[j] += nx * push; y[j] += ny * push; z[j] += nz * push;
        } else {
          const nx = cnx[c], ny = cny[c], nz = cnz[c];
          // Distance past the plane this normal points at (negative = still
          // inside, which is the common speculative case and does nothing).
          let pen;
          if (nx < 0) pen = b.x0 - x[i];
          else if (nx > 0) pen = x[i] - b.x1;
          else if (ny < 0) pen = b.y0 - y[i];
          else if (ny > 0) pen = y[i] - b.y1;
          else if (nz < 0) pen = b.z0 - z[i];
          else pen = z[i] - b.z1;
          let push = (pen - slop) * beta;
          if (push <= 0) continue;
          if (push > maxFix) push = maxFix;
          x[i] -= nx * push; y[i] -= ny * push; z[i] -= nz * push;
        }
      }
    }

    // Final hard clamp: whatever the solver did, nothing leaves the box.
    const n = this.n;
    for (let i = 0; i < n; i++) {
      if (x[i] < b.x0) x[i] = b.x0; else if (x[i] > b.x1) x[i] = b.x1;
      if (y[i] < b.y0) y[i] = b.y0; else if (y[i] > b.y1) y[i] = b.y1;
      if (z[i] < b.z0) z[i] = b.z0; else if (z[i] > b.z1) z[i] = b.z1;
    }
  }

  updateShading(dt) {
    const n = this.n;
    const cfg = CONFIG.sim;
    const { light, cover, contacts, litAbove, speed01, vx, vy, vz } = this;
    const invCover = 1 / cfg.coverNorm;
    const invSpeed = 1 / this.speedNorm;
    const blend = 1 - Math.exp(-cfg.lightSmoothing * dt);
    const transmit = cfg.lightTransmit;

    for (let i = 0; i < n; i++) {
      const buried = clamp(cover[i] * invCover, 0, 1);
      const loose = 1 - clamp(contacts[i] / 6, 0, 1);
      // Lit if nothing is above you, or if you are barely touching anything...
      const exposed = Math.max(1 - buried, loose * 0.95);
      // ...otherwise take what filters down from the grain above you.
      const target = Math.max(exposed, litAbove[i] * transmit);
      light[i] += (target - light[i]) * blend;
      speed01[i] = clamp(Math.hypot(vx[i], vy[i], vz[i]) * invSpeed, 0, 1);
    }
  }
}

// ---- src/shaders.js ----
// GLSL ES 1.00 so one shader pair works on both WebGL1 and WebGL2 contexts.
//
// Each grain is a single point sprite with a 3D position: x/y in CSS px on the
// glass, z going into the screen. The vertex shader applies a simple pinhole
// projection around a movable eye point — deeper grains shrink and converge
// toward the eye, which combined with fog and draw order is what makes the box
// read as having real depth. The fragment shader reconstructs a fake sphere
// normal from gl_PointCoord and lights it. Two passes share the program:
// mode 0 draws a wide dim additive halo, mode 1 the alpha-blended bead on top.

const VERTEX_SHADER = `
precision highp float;

attribute vec3 aPos;      // sim position: x,y CSS px, z depth (0 = glass)
attribute vec2 aShade;    // x: surface light 0..1, y: normalised speed 0..1
attribute vec2 aJitter;   // x: size variation, y: tint variation

uniform vec2 uViewport;   // CSS px
uniform float uPointSize; // device px, already scaled by dpr
uniform float uSpeedBoost;
uniform float uFocal;     // focal length in CSS px
uniform vec2 uEye;        // projection centre in CSS px (parallax lives here)
uniform float uDepthRange;

varying float vLight;
varying float vSpeed;
varying float vTint;
varying float vDepth;

void main() {
  float persp = uFocal / (uFocal + aPos.z);
  vec2 projected = uEye + (aPos.xy - uEye) * persp;
  vec2 unit = projected / uViewport;
  gl_Position = vec4(unit.x * 2.0 - 1.0, 1.0 - unit.y * 2.0, 0.0, 1.0);
  float grow = 1.0 + aShade.y * uSpeedBoost;
  gl_PointSize = uPointSize * (0.88 + 0.24 * aJitter.x) * grow * persp;
  vLight = aShade.x;
  vSpeed = aShade.y;
  vTint = aJitter.y;
  vDepth = clamp(aPos.z / uDepthRange, 0.0, 1.0);
}
`;

const FRAGMENT_SHADER = `
precision highp float;

varying float vLight;
varying float vSpeed;
varying float vTint;
varying float vDepth;

uniform vec3 uDeep;
uniform vec3 uMid;
uniform vec3 uIce;
uniform float uMode;      // 0.0 = glow pass, 1.0 = bead pass
uniform float uGlow;
uniform float uDepthDim;  // how much the back of the box falls into shadow

vec3 grainColor() {
  float t = clamp(vLight, 0.0, 1.0);
  vec3 c = mix(uDeep, uMid, smoothstep(0.0, 0.55, t));
  c = mix(c, uIce, smoothstep(0.45, 1.0, t));
  c = mix(c, vec3(1.0), clamp(vSpeed, 0.0, 1.0) * 0.7);
  return c * (0.72 + 0.28 * vTint);
}

void main() {
  vec2 uv = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(uv, uv);
  if (r2 > 1.0) discard;
  vec3 base = grainColor();
  float dim = 1.0 - uDepthDim * vDepth;

  if (uMode < 0.5) {
    // Soft halo. Premultiplied and additively blended, so bright clusters
    // bloom into each other the way the LCD does on camera.
    float falloff = exp(-r2 * 3.4) - 0.033;
    float amount = uGlow * max(falloff, 0.0)
      * (0.35 + 0.65 * clamp(vLight, 0.0, 1.0)) * dim;
    gl_FragColor = vec4(base * amount, amount);
    return;
  }

  // Bead: hemisphere normal from the sprite coordinate.
  float z = sqrt(max(1.0 - r2, 0.0));
  vec3 n = vec3(uv.x, uv.y, z);
  vec3 lightDir = normalize(vec3(-0.42, -0.6, 0.68));
  float diffuse = max(dot(n, lightDir), 0.0);
  float rim = pow(1.0 - z, 2.5);
  vec3 half3 = normalize(lightDir + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(n, half3), 0.0), 26.0);

  vec3 color = base * (0.34 + 0.82 * diffuse);
  // Keep the highlight off buried grains, or the bulk turns grey and muddy.
  color += vec3(0.72, 0.86, 1.0) * spec * (0.08 + 0.92 * clamp(vLight, 0.0, 1.0));
  color *= 1.0 - 0.28 * rim;
  color *= dim;

  float alpha = smoothstep(1.0, 0.82, r2);
  gl_FragColor = vec4(color, alpha);
}
`;

// ---- src/renderer.js ----
// WebGL point-sprite renderer. One interleaved buffer, two draw calls per
// frame (halo then beads). Prefers a WebGL2 context but the shaders are ES 1.00
// so a WebGL1 fallback is identical in output.
//
// Grains are packed back-to-front (a 32-bucket counting sort on z), so nearer
// beads paint over deeper ones and no depth buffer is needed — point sprites
// with blending and a depth buffer fight over the alpha edges anyway.


const FLOATS_PER_GRAIN = 7; // x, y, z, light, speed, sizeJitter, hueJitter
const STRIDE = FLOATS_PER_GRAIN * 4;
const BUCKETS = 32;

class Renderer {
  /**
   * @param {boolean} preserve Keep the drawing buffer after presentation. Off
   *   by default (it costs a copy on some drivers); on it makes screenshots and
   *   canvas.toDataURL() reliable instead of returning whatever survived the
   *   last buffer swap.
   */
  constructor(canvas, capacity, preserve = false) {
    this.canvas = canvas;
    this.capacity = capacity;
    this.cpu = new Float32Array(capacity * FLOATS_PER_GRAIN);
    this.bucketOf = new Uint8Array(capacity);
    this.drawOrder = new Int32Array(capacity);
    this.bucketStart = new Int32Array(BUCKETS + 1);
    this.width = 1;
    this.height = 1;
    this.dpr = 1;
    // Parallax offset for the projection eye, in CSS px; set from the tilt.
    this.eyeX = 0;
    this.eyeY = 0;
    this.contextLost = false;

    const opts = {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      premultipliedAlpha: true,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: preserve,
    };
    this.gl = canvas.getContext('webgl2', opts);
    this.isWebGL2 = !!this.gl;
    if (!this.gl) this.gl = canvas.getContext('webgl', opts);
    if (!this.gl) throw new Error('WebGL is not available in this browser.');

    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      this.contextLost = true;
    });
    canvas.addEventListener('webglcontextrestored', () => {
      this.initGL();
      this.contextLost = false;
    });

    this.initGL();
  }

  get backend() {
    return this.isWebGL2 ? 'webgl2' : 'webgl1';
  }

  initGL() {
    const gl = this.gl;
    this.program = buildProgram(gl, VERTEX_SHADER, FRAGMENT_SHADER);
    gl.useProgram(this.program);

    this.attrib = {
      pos: gl.getAttribLocation(this.program, 'aPos'),
      shade: gl.getAttribLocation(this.program, 'aShade'),
      jitter: gl.getAttribLocation(this.program, 'aJitter'),
    };
    this.uniform = {
      viewport: gl.getUniformLocation(this.program, 'uViewport'),
      pointSize: gl.getUniformLocation(this.program, 'uPointSize'),
      speedBoost: gl.getUniformLocation(this.program, 'uSpeedBoost'),
      focal: gl.getUniformLocation(this.program, 'uFocal'),
      eye: gl.getUniformLocation(this.program, 'uEye'),
      depthRange: gl.getUniformLocation(this.program, 'uDepthRange'),
      depthDim: gl.getUniformLocation(this.program, 'uDepthDim'),
      deep: gl.getUniformLocation(this.program, 'uDeep'),
      mid: gl.getUniformLocation(this.program, 'uMid'),
      ice: gl.getUniformLocation(this.program, 'uIce'),
      mode: gl.getUniformLocation(this.program, 'uMode'),
      glow: gl.getUniformLocation(this.program, 'uGlow'),
    };

    this.buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
    gl.bufferData(gl.ARRAY_BUFFER, this.cpu.byteLength, gl.DYNAMIC_DRAW);

    for (const loc of Object.values(this.attrib)) {
      if (loc >= 0) gl.enableVertexAttribArray(loc);
    }
    gl.vertexAttribPointer(this.attrib.pos, 3, gl.FLOAT, false, STRIDE, 0);
    gl.vertexAttribPointer(this.attrib.shade, 2, gl.FLOAT, false, STRIDE, 12);
    gl.vertexAttribPointer(this.attrib.jitter, 2, gl.FLOAT, false, STRIDE, 20);

    const bg = CONFIG.render.background;
    gl.clearColor(bg[0], bg[1], bg[2], 1);
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);

    gl.uniform3fv(this.uniform.deep, CONFIG.render.deep);
    gl.uniform3fv(this.uniform.mid, CONFIG.render.mid);
    gl.uniform3fv(this.uniform.ice, CONFIG.render.ice);
  }

  /** Returns true when the backing store changed size. */
  resize(cssWidth, cssHeight) {
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.render.maxDpr);
    const w = Math.max(1, Math.round(cssWidth * dpr));
    const h = Math.max(1, Math.round(cssHeight * dpr));
    this.width = cssWidth;
    this.height = cssHeight;
    this.dpr = dpr;
    if (this.canvas.width === w && this.canvas.height === h) return false;
    this.canvas.width = w;
    this.canvas.height = h;
    this.gl.viewport(0, 0, w, h);
    return true;
  }

  draw(sand) {
    const gl = this.gl;
    if (this.contextLost) return;

    gl.clear(gl.COLOR_BUFFER_BIT);
    const n = sand.n;
    if (n === 0) return;

    // Counting sort by z bucket, deepest first, so the pack order is
    // back-to-front for the bead pass.
    const { bucketOf, drawOrder, bucketStart } = this;
    const zScale = BUCKETS / Math.max(sand.depth, 1e-3);
    const zArr = sand.z;
    bucketStart.fill(0);
    for (let i = 0; i < n; i++) {
      let b = (zArr[i] * zScale) | 0;
      if (b < 0) b = 0; else if (b >= BUCKETS) b = BUCKETS - 1;
      bucketOf[i] = b;
      bucketStart[b + 1]++;
    }
    // Prefix from the deep end: bucket 31 packs first.
    let acc = 0;
    for (let b = BUCKETS - 1; b >= 0; b--) {
      const c = bucketStart[b + 1];
      bucketStart[b + 1] = acc;
      acc += c;
    }
    // bucketStart[b+1] now holds the running start for bucket b; place items.
    for (let i = 0; i < n; i++) drawOrder[bucketStart[bucketOf[i] + 1]++] = i;

    const cpu = this.cpu;
    const { x, y, light, speed01, sizeJitter, hueJitter } = sand;
    for (let k = 0; k < n; k++) {
      const i = drawOrder[k];
      const o = k * FLOATS_PER_GRAIN;
      cpu[o] = x[i];
      cpu[o + 1] = y[i];
      cpu[o + 2] = zArr[i];
      cpu[o + 3] = light[i];
      cpu[o + 4] = speed01[i];
      cpu[o + 5] = sizeJitter[i];
      cpu[o + 6] = hueJitter[i];
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, this.buffer);
    const floats = n * FLOATS_PER_GRAIN;
    if (this.isWebGL2) {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, cpu, 0, floats);
    } else {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, cpu.subarray(0, floats));
    }

    const px = sand.diameter * this.dpr;
    gl.uniform2f(this.uniform.viewport, this.width, this.height);
    gl.uniform1f(this.uniform.speedBoost, 0.35);
    gl.uniform1f(this.uniform.focal, CONFIG.render.focal * Math.min(this.width, this.height));
    gl.uniform2f(this.uniform.eye, this.width * 0.5 + this.eyeX, this.height * 0.5 + this.eyeY);
    gl.uniform1f(this.uniform.depthRange, sand.depth);
    gl.uniform1f(this.uniform.depthDim, CONFIG.render.depthDim);

    // Halo pass: additive, premultiplied.
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.uniform1f(this.uniform.mode, 0);
    gl.uniform1f(this.uniform.glow, CONFIG.render.glowStrength);
    gl.uniform1f(this.uniform.pointSize, px * CONFIG.render.glowSize);
    gl.drawArrays(gl.POINTS, 0, n);

    // Bead pass: straight alpha over the halo, back-to-front.
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1f(this.uniform.mode, 1);
    gl.uniform1f(this.uniform.pointSize, px * CONFIG.render.beadSize);
    gl.drawArrays(gl.POINTS, 0, n);
  }
}

function buildProgram(gl, vsSource, fsSource) {
  const vs = compile(gl, gl.VERTEX_SHADER, vsSource);
  const fs = compile(gl, gl.FRAGMENT_SHADER, fsSource);
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error('Shader link failed: ' + gl.getProgramInfoLog(program));
  }
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  return program;
}

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error('Shader compile failed: ' + gl.getShaderInfoLog(shader));
  }
  return shader;
}

// ---- src/gravity.js ----
// Where "down" is — now a 3D vector, since the box has depth.
//
// Phone: derived from deviceorientation's beta/gamma. That is more portable
// than accelerationIncludingGravity, whose sign convention differs between
// iOS and Android. devicemotion is still used, but only for shake detection.
//
// Desktop / no sensors: arrow keys, WASD, or the on-screen stick, with a fixed
// into-screen bias so the bed leans against the back wall and reads as 3D.
//
// Deriving gravity from beta/gamma: the device->earth rotation is
// Rz(alpha)Rx(beta)Ry(gamma), so earth-down expressed in device axes is
//   d = (sin g cos b, -sin b, -cos g cos b)
// Device +y points up the screen while CSS +y points down, and device +z points
// out of the screen while box +z points into it, so in box space
//   gx = sin(gamma) * cos(beta)
//   gy = sin(beta)
//   gz = cos(beta) * cos(gamma)
// Held upright in portrait (beta 90) that is (0,1,0): straight down the screen.
// Flat on a table it is (0,0,1): into the screen, so the sand settles against
// the back wall and spreads out — which is exactly what a real box would do.


const DEG = Math.PI / 180;

class GravityInput {
  constructor() {
    // Smoothed unit-ish vector in box space, consumed by the sim.
    this.gx = 0;
    this.gy = 1;
    this.gz = CONFIG.input.zBias;
    // Raw sensor readings, surfaced in the stats panel for on-device debugging.
    this.beta = 0;
    this.gamma = 0;
    this.screenAngle = 0;
    this.shakeMagnitude = 0;
    this.mode = 'keys';
    this.sensorActive = false;
    this.flipped = false;
    this.lastError = '';

    this.onShake = null;
    this.keys = new Set();
    this.stick = { x: 0, y: 0, active: false };
    this.demo = false;
    this.demoPhase = 0;

    this._age = 0;
    this._shakeCooldown = 0;
    this._hasOrientation = false;
    this._boundOrientation = (e) => this.handleOrientation(e);
    this._boundMotion = (e) => this.handleMotion(e);
  }

  /**
   * iOS needs requestPermission() from inside a user gesture; everyone else can
   * just subscribe. Returns true when sensor events are flowing.
   */
  async enableSensors() {
    const MotionEvent = window.DeviceMotionEvent;
    const OrientationEvent = window.DeviceOrientationEvent;
    if (!OrientationEvent && !MotionEvent) {
      this.lastError = 'No motion sensors on this device.';
      return false;
    }
    try {
      if (OrientationEvent && typeof OrientationEvent.requestPermission === 'function') {
        const state = await OrientationEvent.requestPermission();
        if (state !== 'granted') {
          this.lastError = 'Motion access denied.';
          return false;
        }
      }
      if (MotionEvent && typeof MotionEvent.requestPermission === 'function') {
        await MotionEvent.requestPermission().catch(() => {});
      }
    } catch (err) {
      // Thrown when not called from a gesture, or on a non-secure origin.
      this.lastError = String(err && err.message ? err.message : err);
      return false;
    }
    this.attach();
    return true;
  }

  attach() {
    window.addEventListener('deviceorientation', this._boundOrientation, { passive: true });
    window.addEventListener('devicemotion', this._boundMotion, { passive: true });
  }

  detach() {
    window.removeEventListener('deviceorientation', this._boundOrientation);
    window.removeEventListener('devicemotion', this._boundMotion);
  }

  /** Sensors need a secure context; plain http over LAN silently never fires. */
  static get secureContext() {
    return window.isSecureContext !== false;
  }

  get supportsSensors() {
    return !!(window.DeviceOrientationEvent || window.DeviceMotionEvent);
  }

  get requiresGesture() {
    const E = window.DeviceOrientationEvent;
    return !!(E && typeof E.requestPermission === 'function') || isIOS();
  }

  handleOrientation(event) {
    if (event.beta === null && event.gamma === null) return;
    this.beta = event.beta || 0;
    this.gamma = event.gamma || 0;
    this._hasOrientation = true;
    this.sensorActive = true;
    this.mode = 'tilt';
  }

  handleMotion(event) {
    // Gravity-excluded acceleration is the cleanest shake signal. Some
    // browsers leave it null, in which case fall back to the total vector
    // minus 1g, which is close enough for a threshold test.
    const a = event.acceleration;
    let mag;
    if (a && (a.x !== null || a.y !== null || a.z !== null)) {
      mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
    } else {
      const t = event.accelerationIncludingGravity;
      if (!t) return;
      mag = Math.abs(Math.hypot(t.x || 0, t.y || 0, t.z || 0) - 9.81);
    }
    this.shakeMagnitude = mag;

    // If deviceorientation never arrives (rare, but some Android builds only
    // ship devicemotion) treat motion as proof the sensors are alive.
    if (!this._hasOrientation && event.accelerationIncludingGravity) {
      this.sensorActive = true;
      if (this.mode === 'keys') this.mode = 'motion';
    }

    // Picking the phone up and putting it down spikes the accelerometer well
    // past the shake threshold, so shakes stay disarmed for the first moments.
    if (this._age < CONFIG.input.shakeArmDelay) return;

    if (mag > CONFIG.input.shakeThreshold && this._shakeCooldown <= 0) {
      this._shakeCooldown = CONFIG.input.shakeCooldown;
      const strength = clamp(mag / CONFIG.input.shakeThreshold, 1, 3);
      if (this.onShake) this.onShake(strength);
    }
  }

  setKey(code, down) {
    if (down) this.keys.add(code); else this.keys.delete(code);
  }

  /** Screen rotation, normalised to degrees clockwise from natural. */
  readScreenAngle() {
    const so = screen.orientation;
    if (so && typeof so.angle === 'number') return ((so.angle % 360) + 360) % 360;
    if (typeof window.orientation === 'number') {
      return ((window.orientation % 360) + 360) % 360;
    }
    return 0;
  }

  /** Target direction from tilt, keys, stick, or the demo sway. */
  targetVector() {
    const zBias = CONFIG.input.zBias;

    if (this.demo) {
      // Roughly what a hand does: a lazy roll, never fully on its side.
      return normalise(
        Math.sin(this.demoPhase) * 0.6,
        Math.cos(this.demoPhase * 0.63) * 0.35 + 0.65,
        zBias,
        true,
      );
    }

    let kx = 0;
    let ky = 0;
    const k = this.keys;
    if (k.has('ArrowLeft') || k.has('KeyA')) kx -= 1;
    if (k.has('ArrowRight') || k.has('KeyD')) kx += 1;
    if (k.has('ArrowUp') || k.has('KeyW')) ky -= 1;
    if (k.has('ArrowDown') || k.has('KeyS')) ky += 1;
    if (kx || ky) return normalise(kx, ky, zBias, true);

    if (this.stick.active) return normalise(this.stick.x, this.stick.y, zBias, true);

    if (this.sensorActive && this._hasOrientation) {
      const b = this.beta * DEG;
      const g = this.gamma * DEG;
      const cb = Math.cos(b);
      let dx = Math.sin(g) * cb;
      let dy = Math.sin(b);
      const dz = cb * Math.cos(g); // into the screen; unaffected by rotation

      // Rotate device x/y into CSS axes when the screen is not upright.
      const angle = this.screenAngle * DEG;
      if (angle) {
        const c = Math.cos(angle);
        const s = Math.sin(angle);
        const rx = dx * c + dy * s;
        const ry = -dx * s + dy * c;
        dx = rx;
        dy = ry;
      }
      if (this.flipped) {
        dx = -dx;
        dy = -dy;
      }
      return { x: dx, y: dy, z: dz };
    }

    // No input at all: rest against the bottom and back wall.
    return normalise(0, 1, zBias, true);
  }

  update(dt) {
    this._age += dt;
    if (this._shakeCooldown > 0) this._shakeCooldown -= dt;
    this.screenAngle = this.readScreenAngle();
    if (this.demo) this.demoPhase += dt * 0.9;

    const target = this.targetVector();
    const rate = target.keys ? CONFIG.input.keySmoothing : CONFIG.input.tiltSmoothing;
    this.gx = approach(this.gx, target.x, rate, dt);
    this.gy = approach(this.gy, target.y, rate, dt);
    this.gz = approach(this.gz, target.z, rate, dt);
  }

  describe() {
    if (this.demo) return 'demo sway';
    if (this.stick.active) return 'stick';
    if (this.keys.size) return 'keys';
    if (this.sensorActive) return this._hasOrientation ? 'tilt' : 'motion';
    return 'idle';
  }
}

function normalise(x, y, z, keys) {
  const m = Math.hypot(x, y, z) || 1;
  return { x: x / m, y: y / m, z: z / m, keys };
}

// ---- src/poke.js ----
// Multi-touch / mouse pushing. Tracks live pointers in CSS sim coordinates and
// hands the sim one poke per pointer per frame, including the pointer's own
// velocity so dragging sweeps grains along.
//
// Presses are captured on the canvas but moves and releases are tracked on the
// window: a release that lands outside the canvas (or gets swallowed by a system
// gesture on a phone) would otherwise leave a phantom finger shoving the bed
// forever.

class PokeInput {
  constructor(canvas) {
    this.canvas = canvas;
    this.pointers = new Map();
    this.onFirstTouch = null;

    canvas.addEventListener('pointerdown', (e) => this.down(e));
    window.addEventListener('pointermove', (e) => this.move(e));
    window.addEventListener('pointerup', (e) => this.up(e));
    window.addEventListener('pointercancel', (e) => this.up(e));
    // A drag interrupted mid-flight still has to release the pointer.
    window.addEventListener('blur', () => this.pointers.clear());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.pointers.clear();
    });
    // Belt and braces alongside touch-action:none in CSS.
    canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  locate(event) {
    const rect = this.canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  down(event) {
    const p = this.locate(event);
    this.pointers.set(event.pointerId, { x: p.x, y: p.y, dx: 0, dy: 0 });
    if (this.onFirstTouch) this.onFirstTouch();
  }

  move(event) {
    const entry = this.pointers.get(event.pointerId);
    if (!entry) return;
    const p = this.locate(event);
    entry.dx = p.x - entry.x;
    entry.dy = p.y - entry.y;
    entry.x = p.x;
    entry.y = p.y;
  }

  up(event) {
    this.pointers.delete(event.pointerId);
  }

  get active() {
    return this.pointers.size > 0;
  }

  apply(sand, dt) {
    if (this.pointers.size === 0) return;
    const invDt = 1 / Math.max(dt, 1e-3);
    for (const entry of this.pointers.values()) {
      // dx/dy are this frame's displacement; hand the sim a velocity.
      sand.poke(entry.x, entry.y, entry.dx * invDt, entry.dy * invDt, dt);
      // Decay so a held-still finger keeps pushing but stops dragging.
      entry.dx *= 0.6;
      entry.dy *= 0.6;
    }
  }
}

// ---- src/tuner.js ----
// Adaptive quality — a floor, not a target.
//
// Grain size comes from the screen size alone, and that is the look. This only
// steps in when a device demonstrably cannot sustain it, coarsening grains
// until it can. It never refines: the designed look is the ceiling, so the app
// looks the same on every load and on every device that can afford it, and no
// grain is ever spawned into a bed the user is already looking at.


class Tuner {
  constructor() {
    // 1 = the designed grain size. Only ever decreases.
    this.scale = 1;
    this.frameMs = 16.7;
    this.fps = 60;
    this.enabled = CONFIG.tuner.enabled;
    this._accum = 0;
    this._frames = 0;
    this._cooldown = CONFIG.tuner.warmup;
    this._fpsAccum = 0;
    this._fpsFrames = 0;
  }

  /**
   * Called once per frame with the measured work time and the real delta.
   * `eligible` marks frames where the sim actually did work — a dormant bed
   * costs almost nothing, and letting those frames into the average would hide
   * the expensive sloshing frames this is meant to catch.
   *
   * Returns true when the caller should re-apply quality.
   */
  sample(workMs, dt, eligible = true) {
    this.frameMs += (workMs - this.frameMs) * 0.1;
    this._fpsAccum += dt;
    this._fpsFrames++;
    if (this._fpsAccum >= 0.5) {
      this.fps = this._fpsFrames / this._fpsAccum;
      this._fpsAccum = 0;
      this._fpsFrames = 0;
    }

    if (this._cooldown > 0) this._cooldown -= dt;
    if (!eligible) {
      this._accum = 0;
      this._frames = 0;
      return false;
    }
    this._accum += workMs;
    this._frames++;

    const cfg = CONFIG.tuner;
    if (this._frames < cfg.sampleFrames) return false;
    const avg = this._accum / this._frames;
    this._accum = 0;
    this._frames = 0;
    if (!this.enabled || this._cooldown > 0) return false;
    if (avg <= cfg.hiMs) return false;

    const next = clamp(this.scale * (1 - cfg.step), cfg.minScale, 1);
    if (Math.abs(next - this.scale) < 1e-4) return false;

    this.scale = next;
    this._cooldown = cfg.cooldown;
    return true;
  }
}

// ---- src/hud.js ----
// DOM overlay: the hint line, the stats panel, the tilt-permission prompt, and
// the virtual tilt stick shown when no sensors are available.

class Hud {
  constructor(root) {
    this.root = root;
    this.hint = root.querySelector('#hint');
    this.stats = root.querySelector('#stats');
    this.gate = root.querySelector('#gate');
    this.gateButton = root.querySelector('#gate-button');
    this.gateNote = root.querySelector('#gate-note');
    this.stick = root.querySelector('#stick');
    this.knob = root.querySelector('#knob');
    this.fatal = root.querySelector('#fatal');

    this.statsVisible = false;
    this.onStick = null;
    this._hintTimer = 0;
    this._statsTimer = 0;
    this.bindStick();
  }

  setHint(text) {
    this.hint.textContent = text;
    this.hint.classList.remove('faded');
    this._hintTimer = 7;
  }

  showGate(text, note, onClick) {
    this.gateNote.textContent = note || '';
    this.gateButton.textContent = text;
    this.gate.classList.add('visible');
    this.gateButton.onclick = async () => {
      this.gateButton.disabled = true;
      const ok = await onClick();
      this.gateButton.disabled = false;
      if (ok) this.hideGate();
      else this.gateNote.textContent = 'Sensors unavailable — using the tilt stick instead.';
    };
  }

  hideGate() {
    this.gate.classList.remove('visible');
  }

  toggleStats(force) {
    this.statsVisible = force === undefined ? !this.statsVisible : force;
    this.stats.classList.toggle('visible', this.statsVisible);
  }

  showStick(visible) {
    this.stick.classList.toggle('visible', visible);
  }

  fail(message) {
    this.fatal.textContent = message;
    this.fatal.classList.add('visible');
  }

  bindStick() {
    const state = { id: null };
    const send = (event) => {
      const rect = this.stick.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const reach = rect.width / 2;
      let dx = (event.clientX - cx) / reach;
      let dy = (event.clientY - cy) / reach;
      const m = Math.hypot(dx, dy);
      if (m > 1) {
        dx /= m;
        dy /= m;
      }
      this.knob.style.transform = `translate(${dx * reach * 0.55}px, ${dy * reach * 0.55}px)`;
      if (this.onStick) this.onStick(dx, dy, true);
    };

    this.stick.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      state.id = e.pointerId;
      this.stick.setPointerCapture(e.pointerId);
      send(e);
    });
    this.stick.addEventListener('pointermove', (e) => {
      if (state.id !== e.pointerId) return;
      e.stopPropagation();
      send(e);
    });
    const release = (e) => {
      if (state.id !== e.pointerId) return;
      state.id = null;
      this.knob.style.transform = 'translate(0px, 0px)';
      if (this.onStick) this.onStick(0, 1, false);
    };
    this.stick.addEventListener('pointerup', release);
    this.stick.addEventListener('pointercancel', release);
  }

  update(dt, info) {
    if (this._hintTimer > 0) {
      this._hintTimer -= dt;
      if (this._hintTimer <= 0) this.hint.classList.add('faded');
    }
    if (!this.statsVisible) return;
    this._statsTimer -= dt;
    if (this._statsTimer > 0) return;
    this._statsTimer = 0.25;

    const rows = [
      ['fps', info.fps.toFixed(0)],
      ['work', info.workMs.toFixed(1) + ' ms'],
      ['grains', String(info.grains)],
      ['contacts', formatCount(info.contacts)],
      ['radius', info.radius.toFixed(2) + ' px'],
      ['depth', Math.round(info.depth) + ' px'],
      ['solve', `${info.substeps}×${info.iterations}`],
      ['quality', info.scale.toFixed(2) + '×'],
      ['gravity', `${info.gx.toFixed(2)}, ${info.gy.toFixed(2)}, ${info.gz.toFixed(2)}`],
      ['source', info.source],
      ['beta/gamma', `${info.beta.toFixed(0)}° / ${info.gamma.toFixed(0)}°`],
      ['screen', info.screenAngle + '°' + (info.flipped ? ' flipped' : '')],
      ['shake', info.shake.toFixed(1)],
      ['viewport', `${Math.round(info.width)}×${Math.round(info.height)} @${info.dpr}x`],
      ['backend', info.backend],
    ];
    if (info.error) rows.push(['note', info.error]);

    this.stats.innerHTML = rows
      .map(([k, v]) => `<span class="k">${k}</span><span class="v">${escapeHtml(v)}</span>`)
      .join('');
  }
}

function formatCount(n) {
  if (n > 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n > 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(Math.round(n));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

// ---- src/main.js ----
// Wiring: viewport -> box size, input -> gravity, frame loop, adaptive quality.


const params = new URLSearchParams(location.search);
const canvas = document.getElementById('stage');
const hud = new Hud(document.getElementById('ui'));

let renderer;
try {
  renderer = new Renderer(canvas, CONFIG.bed.maxGrains, params.has('capture'));
} catch (err) {
